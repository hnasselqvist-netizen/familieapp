          // retning alene kan ikke skille dem. byggFordelingFraPost
          // respekterer plasseringType eksplisitt naar den er satt.
          plasseringType: treff.rule.targetType==="sparing" ? "sparing" : undefined,
        };
        const naa = new Date().toISOString();
        nyeHendelser.push({
          id: hendelseId, status:"ferdig", paaVentAarsak:null,
          transaksjonId: nyId, receiptId:null,
          fordelinger: [byggFordelingFraPost(post, t.belop, [{person:"Felles",prosent:100}], t.retning)],
          dato: t.dato, regelId: treff.rule.id,
          opprettet: naa, oppdatert: naa,
        });
      }
      const status = lk
        ? (lk.flerbruk ? "krever_vurdering" : null)
        : (match ? "foresoatt_match" : "ny");
      return {
        ...t, id:nyId, status, hendelseId,
        matchetMot:  (!erAutomatiskPlassert && match) ? match.id : null,
        matchetNavn: null,
        laeringsKey:laeringsKey(t.tekst),
        importkilde: kilde,
        importertDato:new Date().toISOString().slice(0,10),
      };
    });
    setTransaksjoner(prev=>[...(prev||[]),...nyeTrans]);
    if(nyeHendelser.length>0) setHendelser(prev=>[...(prev||[]), ...nyeHendelser]);
    setPreview(null);
    setVisImport(false);
    setSeksjon("vurdering");
  };

  // ── Behandlings-logikk ───────────────────────────────────────────
  const alle = transaksjoner||[];
  // ── Regel-CRUD — kun Bankimport oppretter/oppdaterer regler ──────
  // v-etterbehandling etappe 1: selve regellogikken er lofted til den
  // delte, rene funksjonen oppdaterReglerVedLaering. Denne er na en
  // tynn orkestreringswrapper — samme kallesignatur som for, saa
  // lagreBehandling (eneste kaller) trenger ingen endring.
  const opprettEllerOppdaterRegel = (transaksjon, post, multiUse) => {
    setRules(prev => oppdaterReglerVedLaering(prev, transaksjon, post, multiUse));
  };

  const merkRegelFlerbruk = (normalizedPattern) => {
    setRules(prev=>(prev||[]).map(r=>r.normalizedPattern!==normalizedPattern?r:{
      ...r, multiUse:true, mode:"review", updatedAt:new Date().toISOString(),
    }));
  };

  const merkFlerbruk = (normalizedPattern) => {
    merkRegelFlerbruk(normalizedPattern);
    setTransaksjoner(prev=>prev.map(t=>{
      if(normaliserTransaksjonstekst(t.tekst)!==normalizedPattern) return t;
      const lk = {...(t.laertKobling||{}), flerbruk:true};
      return {...t, laertKobling:lk, status:"krever_vurdering"};
    }));
  };

  // Effektiv plasseringsstatus for en transaksjon (v-post-rename).
  // Sjekker hendelse forst (ny modell). Faller tilbake til de gamle
  // feltene direkte paa transaksjonen for data som ikke er migrert
  // ennaa (migrering skjer forst i etappe 5) — begge maater fungerer
  // side om side inntil da, uten at brukeren merker noen forskjell.
  // v-post-rename: forenklet etter at migreringen er bekreftet
  // fullfort. Hendelsesmodellen er na den ENESTE kilden til plassering/
  // paa-vent. Den gjenvaerende "ingen hendelse"-grenen reflekterer KUN
  // det "propagert treff" (etappe 2) fortsatt, bevisst, setter direkte
  // paa transaksjonen — ikke lenger noen fallback for gammelt,
  // ikke-migrert data (uklarStatus/fordelinger-feltet/laert_match/
  // behandlet-status er fjernet herfra, siden ingen transaksjon lenger
  // har dem satt).
  const loesEffektivStatus = (t) => {
    const h = finnHendelseForTransaksjon(hendelser, t.id);
    if(h) {
      const regel = h.regelId ? (rules||[]).find(r=>r.id===h.regelId) : null;
      return {
        harHendelse: true,
        erPlassert: h.status==="ferdig",
        erPaaVent: h.status==="pa_vent",
        paaVentAarsak: h.paaVentAarsak||null,
        fordelinger: h.fordelinger||[],
        visningNavn: (h.fordelinger||[]).length>0
          ? (h.fordelinger.length>1
              ? h.fordelinger[0].plasseringNavn+" (+"+(h.fordelinger.length-1)+" til)"
              : h.fordelinger[0].plasseringNavn)
          : null,
        erFlerbruk: !!(regel&&regel.multiUse),
        harLaertRegel: !!h.regelId,
      };
    }
    return {
      harHendelse: false,
      erPlassert: t.status==="matchet",
      erPaaVent: false,
      paaVentAarsak: null,
      fordelinger: [],
      visningNavn: t.matchetNavn||null,
      erFlerbruk: !!(t.laertKobling&&t.laertKobling.flerbruk),
      harLaertRegel: !!t.laertKobling,
    };
  };

  // ── v-post-rename: presis tilstandsbeskrivelse, read-only ──
  // Gjenbruker loesEffektivStatus for harHendelse/fordelinger/paaVent-
  // data, men stoler IKKE paa dens erPlassert-flagg for aa avgjore
  // "er dette faktisk ferdig" — det flagget setter bevisst true ogsaa
  // for legacy status:"matchet" UTEN hendelse (kun for visning i
  // arbeidskoen, se kommentaren der). Her skal nettopp DEN tilstanden
  // vises tydelig som ØKONOMISK UFERDIG, saa den avledes eksplisitt
  // fra harHendelse alene.
  const TYPE_LABEL_AT = {budget:"Kostnad", income:"Inntekt", sparing:"Sparing"};
  const fordelingTekst = (f) => {
    const grupper2 = f.plasseringType==="income" ? incomeGroups
      : f.plasseringType==="sparing" ? sparingGroups : budgetGroups;
    let gruppeLabel = null;
    (grupper2||[]).forEach(g=>{
      if((g.items||[]).some(it=>budsjettpostMatcherId(it, f.plasseringId))) gruppeLabel = g.label;
    });
    const typeLabel = TYPE_LABEL_AT[f.plasseringType]||"Kostnad";
    return typeLabel+" → "+(gruppeLabel?gruppeLabel+" / ":"")+f.plasseringNavn;
  };

  const beskrivTilstand = (t) => {
    const s = loesEffektivStatus(t);
    if(t.status==="ignorert") return {kategori:"ignorert", tekst:"Ignorert", detaljer:[]};
    if(t.behandlingstype==="intern_overforing") return {kategori:"intern", tekst:"Intern overføring", detaljer:[]};
    if(s.harHendelse && s.erPlassert) {
      return {kategori:"ferdig", tekst:"Ferdig", detaljer:(s.fordelinger||[]).map(fordelingTekst)};
    }
    if(s.harHendelse && s.erPaaVent) {
      return {kategori:"pa_vent", tekst:"På vent – "+(UKLAR_AARSAK_LABEL[s.paaVentAarsak]||"venter"), detaljer:[]};
    }
    if(!s.harHendelse && t.status==="matchet") {
      return {kategori:"matchet_uten_hendelse", tekst:"Matchet uten ferdig hendelse – ingen økonomisk effekt", detaljer:[]};
    }
    if(t.status==="foresoatt_match") {
      return {kategori:"forslag", tekst:"Forslag – ikke ferdig økonomisk effekt", detaljer:[]};
    }
    if(t.status==="krever_vurdering") {
      return {kategori:"krever_vurdering", tekst:"Krever vurdering", detaljer:[]};
    }
    return {kategori:"uferdig", tekst:"Uferdig – ikke behandlet", detaljer:[]};
  };

  const grupper = {
    // "vurdering" viser na KUN transaksjoner som aldri er sett — de med
    // en uklarStatus er en bevisst brukerbeslutning (satt paa vent),
    // ikke det samme som "ny og uvurdert". Se 4B.
    vurdering: alle.filter(t=>{
      if(t.status==="ignorert" || t.behandlingstype==="intern_overforing") return false;
      const s = loesEffektivStatus(t);
      return !s.harHendelse && !s.erPlassert;
    }),
    forslag:   alle.filter(t=>t.status==="foresoatt_match"),
    // "Paa vent" (4B) — en aktiv, bevisst beslutning brukeren har tatt,
    // ikke arkivering. En ren hendelsestilstand (status:"pa_vent").
    paavent:   alle.filter(t=>{
      const s = loesEffektivStatus(t);
      return s.harHendelse && s.erPaaVent;
    }),
  };

  const kontoFilter = (liste) => valgtKonto==="alle" ? liste
    : liste.filter(t=>normaliserKonto(t)===valgtKonto);

  // ── v-post-rename: maaneder avledet fra faktiske datoer ────
  // Ingen hardkoding av aar — bygges direkte fra transaksjonenes egne
  // datoer, saa den fungerer likt uansett hvilket aar dataene gjelder.
  const MAANED_NAVN = ["januar","februar","mars","april","mai","juni","juli","august","september","oktober","november","desember"];
  const atMaanedNokler = [...new Set((transaksjoner||[]).filter(t=>t.dato).map(t=>{
    const d = new Date(t.dato);
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
  }))].sort().reverse();
  const atMaanedAlternativer = [
    {id:"alle", label:"Alle måneder"},
    ...atMaanedNokler.map(nokkel=>{
      const [aar,mnd] = nokkel.split("-");
      return {id:nokkel, label:MAANED_NAVN[parseInt(mnd,10)-1]+" "+aar};
    }),
  ];

  const alleTransaksjonerFiltrert = (transaksjoner||[])
    .filter(t => atMaaned==="alle" || (t.dato && (()=>{
      const d = new Date(t.dato);
      return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")===atMaaned;
    })()))
    .filter(t => atKonto==="alle" || normaliserKonto(t)===atKonto)
    .filter(t => !atSok.trim() || (t.tekst||"").toLowerCase().includes(atSok.trim().toLowerCase()))
    .slice() // aldri mutere transaksjoner-arrayet
    .sort((a,b)=> new Date(b.dato||0) - new Date(a.dato||0));

  // 4A: kun aktive arbeidsfaner igjen — ingen tellere fra ferdige
  // kategorier skal konkurrere om oppmerksomheten i arbeidsflaten.
  const SEKSJONER = [
    {id:"vurdering", label:"Krever vurdering", n:grupper.vurdering.length, farge:grupper.vurdering.length>0?P.clay:P.stone},
    {id:"forslag",   label:"Forslag til match", n:grupper.forslag.length,   farge:grupper.forslag.length>0?"#9A7A00":P.stone},
    {id:"paavent",   label:"På vent",           n:grupper.paavent.length,   farge:grupper.paavent.length>0?"#9A7A00":P.stone},
  ];

  // ── Behandlingstyper ────────────────────────────────────────────
  // v-post-rename: typevalget (Fast/Variabel/Sparing/Engang/Intern overforing)
  // er fjernet som forste beslutning. BEHANDLING-arrayet, BEHANDLING_STATUS
  // og BEHANDLING_BADGE_COL er derfor fjernet — ikke lappet videre, siden
  // de kun eksisterte for aa style typevalget. Se leveransenotatet for
  // hvilke deler av gammel behandlingstype-logikk som fortsatt lever
  // midlertidig (intern_overforing/kvittering sine LESBARE visninger,
  // og motorene bak dem, urort).

  // 4B: navngitte arsaker for "paa vent" — gjenbruker eksisterende
  // uklarStatus-felt, kun to nye verdier lagt til (maa_avklares, annet).
  // UKLAR_AARSAK_LABEL er na en global, delt konstant (se toppen av filen).

  // ── Lagre hele beslutningen paa en gang. Oppretter/oppdaterer en
  //    HENDELSE i stedet for aa skrive plassering/paa-vent direkte paa
  //    transaksjonen (v-post-rename). Transaksjonen far kun sin
  //    hendelseId satt — den forblir en ren observasjon.
  //    Laering skjer via regelmotoren — ikke direkte pa transaksjonen. ──
  const lagreBehandling = (tranId, utkast) => {
    const t = alle.find(x=>x.id===tranId);
    if(!t) return;
    const {type, fordelinger, laer, uklarValg} = utkast;

    const eksisterendeHendelse = finnHendelseForTransaksjon(hendelser, tranId);
    const hendelseId = eksisterendeHendelse ? eksisterendeHendelse.id : uid();
    const naa = new Date().toISOString();

    if(type==="uklar") {
      // Sett paa vent — en hendelsestilstand, ikke en observasjonsegenskap.
      setHendelser(prev=>{
        const uten = (prev||[]).filter(h=>h.id!==hendelseId);
        return [...uten, {
          id: hendelseId, status:"pa_vent", paaVentAarsak: uklarValg||null,
          transaksjonId: tranId,
          receiptId: eksisterendeHendelse ? (eksisterendeHendelse.receiptId||null) : null,
          fordelinger: [], dato: t.dato, regelId: null,
          opprettet: eksisterendeHendelse ? eksisterendeHendelse.opprettet : naa,
          oppdatert: naa,
        }];
      });
      setTransaksjoner(prev=>prev.map(x=>x.id!==tranId?x:{...x, hendelseId}));
      setApenId(null);
      return;
    }

    if(fordelinger && fordelinger.length>0) {
      // Plassering valgt — na med stotte for en eller flere fordelinger.
      // Én fordeling er strukturelt identisk med det som tidligere het
      // "post" — ingen egen kodevei for det enkle tilfellet, samme
      // prinsipp som kvitteringssplitten allerede bruker.
      const forste = fordelinger[0];
      let regelId = null;
      if(laer) {
        // Laering: opprett/oppdater regel i regelmotoren, mot forste
        // fordeling. Automatisk gjenbruk mot andre like observasjoner
        // (under) skjer kun ved ÉN fordeling — en splittet fordeling er
        // for spesifikk til aa anta at samme prosentvise oppdeling
        // gjelder en annen observasjon med et annet belop.
        const normPattern2 = normaliserTransaksjonstekst(t.tekst);
        const eksisterendeRegel = (rules||[]).find(r=>r.targetId===forste.post.id && regelMatcherTekst(r, normPattern2));
        regelId = eksisterendeRegel ? eksisterendeRegel.id : null;
        opprettEllerOppdaterRegel(t, forste.post, false);
      }
      const fordelingerBygget = fordelinger.map(f=>byggFordelingFraPost(f.post, f.belop, f.eiere, t.retning));

      setHendelser(prev=>{
        const uten = (prev||[]).filter(h=>h.id!==hendelseId);
        return [...uten, {
          id: hendelseId, status:"ferdig", paaVentAarsak:null,
          transaksjonId: tranId,
          receiptId: eksisterendeHendelse ? (eksisterendeHendelse.receiptId||null) : null,
          fordelinger: fordelingerBygget, dato: t.dato, regelId,
          opprettet: eksisterendeHendelse ? eksisterendeHendelse.opprettet : naa,
          oppdatert: naa,
        }];
      });

      // v-post-rename: propagering til andre like observasjoner
      // (kun ved én fordeling) er FORTSATT bevisst holdt utenfor
      // hendelsesmodellen — ingen hendelse opprettes automatisk for
      // dem, ingen Actual, akkurat som for. Det ENESTE som er endret
      // er selve status-verdien: "matchet" (som stille fremstod som
      // ferdig ferdig behandlet i eksisterende arbeidskoeer og paa
      // Gangen sin "trenger vurdering"-teller) er byttet til
      // "foresoatt_match" — en EKSISTERENDE, allerede riktig haandtert
      // forslagsstatus (se grupper.forslag over, og beskrivTilstand).
      // matchetMot/matchetNavn/laertKobling bevares fullstendig
      // uendret — de brukes fortsatt som FORSLAG ved fullforing
      // (se VisRad sin utkastFordelinger-init) — kun representasjonen
      // av "er dette ferdig" er rettet, per Observation -> Event ->
      // Effect-prinsippet. Ingen historiske "matchet"-transaksjoner
      // roeres av denne endringen; kun FREMTIDIGE propageringer far
      // na riktig status fra start.
      const normPattern = normaliserTransaksjonstekst(t.tekst);
      setTransaksjoner(prev=>prev.map(x=>{
        if(x.id===tranId) return {...x, hendelseId};
        if(laer && fordelinger.length===1 && x.id!==tranId &&
           !finnHendelseForTransaksjon(hendelser,x.id) &&
           normaliserTransaksjonstekst(x.tekst)===normPattern) {
          return {...x, status:"foresoatt_match",
            matchetMot:forste.post.id, matchetNavn:forste.post.name,
            laertKobling:{budgetItemId:forste.post.id,navn:forste.post.name,gruppe:forste.post.gruppe,flerbruk:false}};
        }
        return x;
      }));
      setApenId(null);
      return;
    }

    // Verken paa vent eller fordeling valgt — skjer normalt ikke fra ny
    // UI (fordeling velges for Lagre aktiveres), men beholdt defensivt,
    // uendret fra tidligere.
    setTransaksjoner(prev=>prev.map(x=>x.id!==tranId?x:{...x, status:"foresoatt_match"}));
    setApenId(null);
  };

  // v-post-rename: lagrer en ny, selvstendig okonomihendelse
  // uten bank. Skriver KUN til hendelser — aldri til transaksjoner
  // (later aldri som en banktransaksjon finnes), og aldri til rules
  // (ingen laering fra manuelle registreringer, som instruert).
  const lagreManuellRegistrering = () => {
    const belopTall = parseFloat(manuellBelop);
    // v-post-rename: fortegnet paa belopet beskriver na
    // EFFEKTEN paa valgt post (positivt = oker, negativt = reduserer),
    // ikke retningen paa en bankobservasjon — det finnes ingen
    // bankretning aa tolke i denne flyten. Derfor er BADE positive og
    // negative tall gyldige; kun 0 og ugyldig/tomt input avvises.
    // isNaN skiller "" (tomt felt, ugyldig) fra ekte negative tall,
    // som en enkel !belopTall-sjekk ville feilaktig fanget begge
    // likt siden 0 OGSAA er falsy.
    if(!manuellPostId || !manuellDato || isNaN(belopTall) || belopTall===0) return;
    // v-post-rename: tre likeverdige typer na. Sparing bruker
    // samme retning:"ut" som kostnad (etablert konvensjon, se
    // byggAlleSparingPoster), men MA faa plasseringType:"sparing"
    // eksplisitt — ellers ville byggFordelingFraPost sin fallback
    // (post.retning==="inn"?"income":"budget") feilaktig gitt
    // "budget", siden den ikke kan skille sparing fra kostnad kun paa
    // retning. byggFordelingFraPost/byggManuellHendelse selv er
    // UENDRET — dette er kun riktig inndata til dem.
    const kildeGrupper = manuellType==="inntekt" ? incomeGroups
      : manuellType==="sparing" ? sparingGroups
      : budgetGroups;
    let post = null;
    (kildeGrupper||[]).forEach(g=>{
      const item = (g.items||[]).find(it=>it.id===manuellPostId);
      if(item) post = {
        id:item.id, name:item.name,
        retning: manuellType==="inntekt" ? "inn" : "ut",
        plasseringType: manuellType==="sparing" ? "sparing" : undefined,
      };
    });
    if(!post) return;
    const nyHendelse = byggManuellHendelse(manuellDato, post, belopTall, manuellKommentar.trim()||null, manuellEiere);
    setHendelser(prev=>[...(prev||[]), nyHendelse]);
    setVisManuellRegistrering(false);
    setManuellBelop("");
    setManuellPostId("");
    setManuellPostNavn("");
    setManuellPostSok("");
    setManuellKommentar("");
    setManuellEiere([{person:"Felles",prosent:100}]);
  };

  const VisRad = ({t}) => {
    const apen = apenId===t.id;
    const nk   = normaliserKonto(t);

    // ── Lokal utkast-state: hele beslutningen samles her for LAGRE ──
    // utkastType er na binaert i praksis: "uklar" (paa vent) eller alt
    // annet (velg plassering, standardvisningen) — typevalget mellom
    // fast/variabel/sparing/engang/intern_overforing er fjernet (v-post-rename).
    // v-post-rename: initialiseres na fra hendelsen (nar den finnes),
    // med fallback til gamle felt for ikke-migrert data.
    const effektivStatus = loesEffektivStatus(t);
    const [utkastType,setUtkastType]     = useState(effektivStatus.erPaaVent ? "uklar" : null);
    // v-post-rename: utkastPost (én plassering) erstattet med
    // utkastFordelinger — en liste, siden splitt na er en naturlig del
    // av samme beslutning. Én linje er det vanlige, uendrede tilfellet.
    // v-post-rename: naar denne raden representerer en tidligere
    // propagert match UTEN hendelse (status:"matchet", ingen reell
    // hendelse), forhaandsvelg den gamle matchede posten som et
    // FORSLAG — fra laertKobling.budgetItemId forst, deretter
    // matchetMot, resolvet mot dagens aktive post via
    // finnAktivPostFraGammelId (legacyIds-bevisst). Kan ikke posten
    // resolves, gjettes IKKE noe — forblir tom, vanlig postvalg.
    // Beloepet settes med SAMME mekanisme (beregnRestPaaSisteLinje)
    // som leggTilFordeling allerede bruker, for konsistent resultat.
    // Den nye hendelsen er sannheten — gamle felt er kun et forslag.
    const [utkastFordelinger,setUtkastFordelinger] = useState(() => {
      if(!effektivStatus.harHendelse && (t.status==="matchet" || t.status==="foresoatt_match")) {
        const gammelId = (t.laertKobling && t.laertKobling.budgetItemId) || t.matchetMot;
        const gammelPost = finnAktivPostFraGammelId(gammelId);
        if(gammelPost) {
          return beregnRestPaaSisteLinje(
            [{id:uid(), post:gammelPost, belop:0, eiere:jevnFordelEiere([gammelPost.eier||"Felles"])}],
            t.belop||0, "belop"
          );
        }
      }
      return [];
    }); // [{id,post,belop,eiere}]
    const [visLeggTilFordeling,setVisLeggTilFordeling] = useState(false);
    const [utkastLaer,setUtkastLaer]     = useState(false);
    const [utkastUklar,setUtkastUklar]   = useState(effektivStatus.paaVentAarsak);
    // v-post-rename: intern overforing er tilbake som en sekundaer handling
    // (ikke en plassering, ikke en behandlingstype — se leveransenotatet).
    const [utkastMotpart,setUtkastMotpart] = useState(null);
    const eksisterendeReceipt = findReceipt(t.id, receipts);
    const [kvitteringLagret,setKvitteringLagret] = useState(!!eksisterendeReceipt);
    // Kvittering koblet via den nye matchingen (Sprint 16) — separat
    // fra eksisterendeReceipt over, som er den eldre, direkte
    // opplastingskoblingen (receipt.transactionId).
    // v-post-rename: kvittering koblet utelukkende via hendelse.
    const koblettViaHendelse = finnHendelseForTransaksjon(hendelser, t.id);
    const koblettMatchetReceipt = koblettViaHendelse && koblettViaHendelse.receiptId
      ? (receipts||[]).find(r=>r.id===koblettViaHendelse.receiptId) : null;
    // Er denne transaksjonen faktisk FERDIG lukket via en kvittering?
    // Styrer hvilket av de to panelene (lesbart/redigerbart) som vises.
    const erLukketViaKvittering = !!(koblettViaHendelse && koblettViaHendelse.status==="ferdig" && koblettViaHendelse.receiptId);

    const [kvitteringLaster,setKvitteringLaster] = useState(false);
    const leggTilKvittering = (e) => {
      const file = e.target.files&&e.target.files[0]; if(!file) return;
      const eksisterende = (receipts||[]).find(r=>r.transactionId===t.id);
      const receiptId = eksisterende ? eksisterende.id : uid();
      setKvitteringLaster(true);
      const reader = new FileReader();
      reader.onload = (ev) => {
        const naa = new Date().toISOString();
        setReceipts(prev=>{
          const funnet = (prev||[]).find(r=>r.id===receiptId);
          if(funnet) {
            return (prev||[]).map(r=>r.id!==receiptId?r:{
              ...r, imageUrl:ev.target.result, ocrStatus:"uploaded", updatedAt:naa,
            });
          }
          const nyReceipt = {
            id: receiptId, transactionId: t.id, imageUrl: ev.target.result,
            ocrStatus: "uploaded", ocrText: "", merchant: "", purchaseDate: t.dato||"",
            total: t.belop||0, createdAt: naa, updatedAt: naa,
          };
          return [...(prev||[]), nyReceipt];
        });
        setKvitteringLagret(true);
        setKvitteringLaster(false);
      };
      reader.readAsDataURL(file);
    };
    const [sokTekst,setSokTekst]         = useState("");

    // Nullstill utkast naar raden lukkes
    const lukkOgNullstill = () => {
      setApenId(null);
      setUtkastType(effektivStatus.erPaaVent ? "uklar" : null);
      setUtkastFordelinger([]);
      setVisLeggTilFordeling(false);
      setUtkastLaer(false);
      setUtkastUklar(effektivStatus.paaVentAarsak);
      setUtkastMotpart(null);
      setSokTekst("");
    };

    // v-post-rename: kandidater/sok ekskluderer poster som allerede
    // inngar i en fordeling denne observasjonen har fatt, saa brukeren
    // ikke ved et uhell velger samme plassering to ganger.
    const alleredeValgtePostIder = new Set(utkastFordelinger.map(f=>f.post.id));
    const kandidater = (utkastType!=="uklar" && utkastType!=="intern_overforing")
      ? finnKandidater(t).filter(k=>!alleredeValgtePostIder.has(k.id)) : [];
    // Kandidater for intern overforing — gjenbruker etappe 3-motoren
    // uendret. Kun beregnet naar relevant.
    const overforingKandidater = utkastType==="intern_overforing"
      ? finnInterneOverforingsKandidater(t, alle) : [];
    const overforingSokTreff = utkastType==="intern_overforing" && sokTekst.trim().length>0
      ? alle.filter(o=>o.id!==t.id && !o.motpartTransaksjonId &&
          (o.tekst||"").toLowerCase().includes(sokTekst.trim().toLowerCase()))
      : [];
    // Ikke lenger begrenset til postens egen retning — en refusjon (inn)
    // skal kunne sokes opp mot en kostnadspost. Selve teksttreffet under
    // holder vanlige sok relevante uansett.
    const alleForRetning = allePoster;
    const sokTreff = sokTekst.trim().length>0
      ? alleForRetning.filter(p=>p.name.toLowerCase().includes(sokTekst.trim().toLowerCase()) && !alleredeValgtePostIder.has(p.id))
      : [];

    // Vis plasserings-plukkeren naar ingen fordeling er valgt ennaa,
    // ELLER naar brukeren aktivt legger til enda en (splitt).
    const visPlasseringPicker = utkastType!=="uklar" && utkastType!=="intern_overforing"
      && (utkastFordelinger.length===0 || visLeggTilFordeling);

    const fordeltSum = utkastFordelinger.reduce((s,f)=>s+(f.belop||0),0);

    const erFlerbruk = effektivStatus.erFlerbruk;
    const harLagretBehandling = effektivStatus.erPlassert || effektivStatus.erPaaVent || !!t.behandlingstype;

    const rowBg = t.status==="krever_vurdering" ? "#FFF8F0"
                : t.status==="foresoatt_match"   ? "#FFFBE0"
                : P.linen;
    const rowBd = t.status==="krever_vurdering" ? "#E8C4A0"
                : t.status==="foresoatt_match"   ? "#D4C060"
                : P.border;

    const kanLagre = utkastType==="uklar" || (utkastType==="intern_overforing" && !!utkastMotpart) || utkastFordelinger.length>0;

    // §3: fins det en aktiv regel for SAMME plassering som ikke allerede
    // matcher denne teksten? Da tilbys "bruk og utvid" i stedet for en ny.
    // Kun relevant ved én fordeling — en splittet fordeling har ingen
    // naturlig enkelt-regel aa utvide mot.
    const naertregelForSammeTarget = utkastFordelinger.length===1
      ? (rules||[]).find(r=>r.active!==false && r.targetId===utkastFordelinger[0].post.id &&
          !regelMatcherTekst(r, normaliserTransaksjonstekst(t.tekst)))
      : null;
    const utvidetMonster = naertregelForSammeTarget
      ? fellesPrefiks((naertregelForSammeTarget.normalizedPattern||naertregelForSammeTarget.pattern||"").toLowerCase(),
          normaliserTransaksjonstekst(t.tekst))
      : "";
    const utvidBrukAntall = (naertregelForSammeTarget && utvidetMonster)
      ? (alle||[]).filter(x=>normaliserTransaksjonstekst(x.tekst).includes(utvidetMonster)).length
      : 0;
    const brukOgUtvidRegel = () => {
      if(!naertregelForSammeTarget || !utvidetMonster) return;
      setRules(prev=>(prev||[]).map(r=>r.id!==naertregelForSammeTarget.id?r:{
        ...r, pattern:utvidetMonster, normalizedPattern:utvidetMonster,
        matchType:"starter_med", updatedAt:new Date().toISOString(),
      }));
    };

    // ── Fordeling-redigering (v-post-rename) ──────────────────────
    const leggTilFordeling = (post) => {
      const nye = [...utkastFordelinger, {
        id: uid(), post, belop: 0,
        eiere: jevnFordelEiere([post.eier||"Felles"]),
      }];
      setUtkastFordelinger(beregnRestPaaSisteLinje(nye, t.belop||0, "belop"));
      setVisLeggTilFordeling(false);
      setSokTekst("");
    };
    // Kun linjer FOR den siste er redigerbare — siste linje er alltid
    // restbelopet, aldri brukerredigert direkte (§1 i oppdraget).
    const oppdaterFordelingBelop = (idx, nyttBelop) => {
      const nye = utkastFordelinger.map((f,i)=>i!==idx?f:{...f,belop:nyttBelop});
      setUtkastFordelinger(beregnRestPaaSisteLinje(nye, t.belop||0, "belop"));
    };
    const fjernFordeling = (idx) => {
      const nye = utkastFordelinger.filter((_,i)=>i!==idx);
      setUtkastFordelinger(nye.length>0 ? beregnRestPaaSisteLinje(nye, t.belop||0, "belop") : nye);
    };

    return (
      <div style={{marginBottom:5}}>
        {/* Rad-header */}
        <div onClick={()=>apen?lukkOgNullstill():setApenId(t.id)}
          style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",
            borderRadius:apen?"9px 9px 0 0":9,cursor:"pointer",
            background:rowBg, border:"1px solid "+rowBd}}>
          <span style={{fontSize:12,fontWeight:700,flexShrink:0,width:14,
            color:t.retning==="inn"?P.olive:P.clay}}>
            {t.retning==="inn"?"+":"-"}
          </span>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:13,fontWeight:600,color:P.ink,
              overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
              {t.tekst||"(ukjent)"}
              {(effektivStatus.erPlassert || effektivStatus.erPaaVent) && (
                <span style={{marginLeft:5,fontSize:9,borderRadius:4,padding:"1px 5px",
                  background:(effektivStatus.erPaaVent?"#9A7A00":P.olive)+"22",
                  color:effektivStatus.erPaaVent?"#9A7A00":P.olive,fontWeight:600}}>
                  {effektivStatus.erPaaVent ? "⏸️ På vent" : "✓ Plassert"}
                </span>
              )}
              {erFlerbruk && (
                <span style={{marginLeft:5,fontSize:9,color:"#9A7A00",
                  background:"#FFFBE0",borderRadius:4,padding:"1px 5px"}}>flerbruk</span>
              )}
              {eksisterendeReceipt && (
                <span style={{marginLeft:5,fontSize:9,color:P.olive,
                  background:"#F0FFF4",borderRadius:4,padding:"1px 5px"}}>🧾 Kvittering lagt til</span>
              )}
              {!eksisterendeReceipt && koblettMatchetReceipt && (
                <span style={{marginLeft:5,fontSize:9,color:P.olive,
                  background:"#F0FFF4",borderRadius:4,padding:"1px 5px"}}>🧾 Kvittering</span>
              )}
            </div>
            <div style={{fontSize:10,color:P.dust,marginTop:1,
              overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
              {fmtD(t.dato)}{nk?" · "+nk:""}
              {effektivStatus.visningNavn?" · →"+effektivStatus.visningNavn:""}
              {effektivStatus.erPaaVent?" · "+(UKLAR_AARSAK_LABEL[effektivStatus.paaVentAarsak]||"venter"):""}
            </div>
          </div>
          <span style={{fontSize:13,fontWeight:700,flexShrink:0,
            color:t.retning==="inn"?P.olive:P.clay}}>{fmtB(t.belop)}</span>
          <span style={{color:P.dust,fontSize:10}}>{apen?"▴":"▾"}</span>
        </div>

        {/* Detaljpanel — hele beslutningen i ett skjermbilde, MED MINDRE
            transaksjonen allerede er lukket via en kvittering (etappe 1).
            Da vises en enkel, skrivebeskyttet oppsummering med sporbarhet
            til kvitteringen, i stedet for aa be brukeren behandle paa nytt. */}
        {apen && erLukketViaKvittering && (
          <div style={{border:"1px solid "+P.border,borderTop:"none",
            borderRadius:"0 0 9px 9px",padding:"14px",background:P.sand}}>
            <div style={{fontSize:12,color:P.stone,marginBottom:10,lineHeight:1.6}}>
              Dette kjøpet er ferdig behandlet via en kvittering — ingen ny behandling er nødvendig.
            </div>
            {koblettMatchetReceipt ? (
              <div style={{padding:"10px 12px",background:P.linen,border:"1px solid "+P.border,borderRadius:9}}>
                <div style={{fontSize:12,fontWeight:600,color:P.ink,marginBottom:2}}>
                  {koblettMatchetReceipt.merchant||"(ukjent leverandør)"}
                </div>
                <div style={{fontSize:11,color:P.dust,marginBottom:8}}>
                  {(koblettMatchetReceipt.splits||[]).length} splitt{(koblettMatchetReceipt.splits||[]).length!==1?"er":""} · {fmtB(koblettMatchetReceipt.total||0)}
                </div>
                {(koblettMatchetReceipt.splits||[]).map((sp,i)=>{
                  const eiereTekst = (sp.eiere||[]).length>1
                    ? sp.eiere.map(e=>e.person+" "+e.prosent+"%").join(" / ")
                    : (sp.eiere&&sp.eiere[0]?sp.eiere[0].person:"");
                  return (
                    <div key={i} style={{padding:"4px 0",borderTop:i>0?"1px solid "+P.border:"none"}}>
                      <div style={{display:"flex",justifyContent:"space-between",fontSize:11.5,color:P.stone}}>
                        <span>{sp.targetName}</span>
                        <span style={{fontWeight:500,color:P.ink}}>{fmtB(sp.amount||0)}</span>
                      </div>
                      {eiereTekst && <div style={{fontSize:10,color:P.dust}}>{eiereTekst}</div>}
                    </div>
                  );
                })}
                {koblettMatchetReceipt.driveWebViewLink && (
                  <a href={koblettMatchetReceipt.driveWebViewLink} target="_blank" rel="noopener noreferrer"
                    style={{display:"block",marginTop:8,fontSize:11,color:P.hazel,textDecoration:"none"}}>
                    📎 Åpne kvittering
                  </a>
                )}
              </div>
            ) : (
              <div style={{fontSize:12,color:P.dust}}>Fant ikke den koblede kvitteringen.</div>
            )}
          </div>
        )}
        {apen && t.behandlingstype==="intern_overforing" && (
          <div style={{border:"1px solid "+P.border,borderTop:"none",
            borderRadius:"0 0 9px 9px",padding:"14px",background:P.sand}}>
            <div style={{fontSize:12,color:P.stone,marginBottom:10,lineHeight:1.6}}>
              Dette er en intern overføring mellom familiens egne kontoer — påvirker ikke resultat, kostnad eller inntekt.
            </div>
            {(() => {
              const motpart = t.motpartTransaksjonId ? alle.find(x=>x.id===t.motpartTransaksjonId) : null;
              return motpart ? (
                <div style={{padding:"10px 12px",background:P.linen,border:"1px solid "+P.border,borderRadius:9}}>
                  <div style={{fontSize:10,color:P.dust,marginBottom:3}}>Motpart</div>
                  <div style={{fontSize:12,fontWeight:600,color:P.ink}}>
                    {motpart.tekst} · {fmt(motpart.belop||0)}
                  </div>
                  <div style={{fontSize:10,color:P.dust,marginTop:1}}>
                    {fmtD(motpart.dato)} · {normaliserKonto(motpart)}
                  </div>
                </div>
              ) : (
                <div style={{fontSize:12,color:P.dust}}>Fant ikke motpart-hendelsen.</div>
              );
            })()}
          </div>
        )}
        {apen && !erLukketViaKvittering && t.behandlingstype!=="intern_overforing" && (
          <div style={{border:"1px solid "+P.border,borderTop:"none",
            borderRadius:"0 0 9px 9px",padding:"12px 14px",background:P.sand}}>

            {/* Observasjonens egen identitet — erstatter den tidligere
                "Velg plassering"-teksten (v-post-rename). Brukeren vet
                allerede hvilken oppgave som skal utfores; det som mangler
                er A HUSKE HVA DETTE FAKTISK VAR. Belopet er mest fremtredende. */}
            <div style={{marginBottom:12,paddingBottom:10,borderBottom:"1px solid "+P.border}}>
              <div style={{fontSize:20,fontWeight:700,color:t.retning==="inn"?P.olive:P.ink}}>
                {t.retning==="inn"?"+":""}{fmtB(t.belop)} kr
              </div>
              <div style={{fontSize:13,color:P.stone,marginTop:2,
                overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                {t.tekst||"(ukjent)"}
              </div>
              <div style={{fontSize:11,color:P.dust,marginTop:1}}>
                {fmtD(t.dato)}{nk?" · "+nk:""}
              </div>
            </div>

            {/* Plassering — den eneste forste beslutningen (v-post-rename).
                Splitt er IKKE en egen modus: samme plukker som velger den
                forste plasseringen brukes ogsaa til aa legge til flere —
                "1. Velg plassering"-teksten er fjernet, observasjonen selv
                (se hodet ovenfor) gjor allerede klart hva oppgaven er. */}
            {utkastType!=="uklar" && utkastType!=="intern_overforing" && (
              <div style={{marginBottom:12}}>

                {/* Allerede valgte fordelinger — én linje er det vanlige,
                    uendrede tilfellet. Flere linjer er splitt, uttrykt i
                    nokyaktig samme flyt. */}
                {utkastFordelinger.map((f,idx) => {
                  const flereLinjer = utkastFordelinger.length>1;
                  const erSiste = idx===utkastFordelinger.length-1 && flereLinjer;
                  return (
                    <div key={f.id} style={{padding:"8px 10px",background:"#F0FFF4",
                      border:"1px solid "+P.oliveL,borderRadius:7,marginBottom:6}}>
                      <div style={{display:"flex",alignItems:"center",gap:8}}>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:12,fontWeight:600,color:P.olive,
                            overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                            {f.post.name}
                          </div>
                          <div style={{fontSize:10,color:P.dust}}>{f.post.gruppe}</div>
                        </div>
                        {flereLinjer && (
                          <BelopFelt verdi={f.belop} redigerbar={!erSiste}
                            onSave={(v)=>oppdaterFordelingBelop(idx, v)}
                            style={{width:72,fontSize:12,textAlign:"right",padding:"5px 6px",
                              borderRadius:6,border:"1px solid "+P.border,boxSizing:"border-box"}}/>
                        )}
                        <button onClick={()=>fjernFordeling(idx)}
                          style={{background:"none",border:"none",cursor:"pointer",color:P.dust,fontSize:11}}>
                          {flereLinjer ? "✕" : "Endre"}
                        </button>
                      </div>
                      {/* Ansvarsfordeling — delt komponent, brukt identisk
                          av kvitteringens splitter (§5 i oppdraget). */}
                      <AnsvarChips eiere={f.eiere}
                        onChange={(nyeEiere)=>setUtkastFordelinger(prev=>
                          prev.map((x,i)=>i!==idx?x:{...x,eiere:nyeEiere}))}/>
                    </div>
                  );
                })}

                {/* Kjorende sum, kun synlig ved splitt */}
                {utkastFordelinger.length>1 && (
                  <div style={{fontSize:10.5,color:Math.round(fordeltSum*100)===Math.round((t.belop||0)*100)?P.dust:"#9A7A00",
                    marginBottom:6}}>
                    Fordelt: {fmt(fordeltSum)} av {fmt(t.belop||0)}
                  </div>
                )}

                {visPlasseringPicker && (
                  <>
                    {kandidater.length>0 && (
                      <div style={{marginBottom:8}}>
                        {kandidater.slice(0,5).map(k=>(
                          <div key={k.id} onClick={()=>leggTilFordeling(k)}
                            style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",
                              padding:"6px 8px",borderRadius:7,marginBottom:4,
                              background:P.hazelXL,border:"1px solid "+P.hazelL}}>
                            <div style={{flex:1}}>
                              <div style={{fontSize:12,fontWeight:500,color:P.ink}}>{k.name}</div>
                              <div style={{fontSize:10,color:P.dust}}>
                                {k.gruppe}
                                {k._tekstMatch&&k._belopMatch?" · tekst+belop":k._tekstMatch?" · tekst":" · belop"}
                              </div>
                            </div>
                            <span style={{fontSize:10,color:P.hazel,fontWeight:600}}>Velg</span>
                          </div>
                        ))}
                      </div>
                    )}

                    <div>
                      <input value={sokTekst} onChange={e=>setSokTekst(e.target.value)}
                        placeholder="Sok blant budsjett-/inntekts-/spareposter…"
                        autoComplete="off"
                        style={{width:"100%",boxSizing:"border-box",fontSize:12,
                          background:P.mist,padding:"7px 10px",borderRadius:7,marginBottom:6}}/>
                      {sokTreff.length>0 && (
                        <div style={{maxHeight:160,overflowY:"auto"}}>
                          {sokTreff.slice(0,20).map(p=>(
                            <div key={p.id} onClick={()=>leggTilFordeling(p)}
                              style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",
                                padding:"5px 8px",borderRadius:6,marginBottom:2,
                                background:P.linen,border:"1px solid "+P.border}}>
                              <div style={{flex:1}}>
                                <div style={{fontSize:11.5,color:P.ink}}>{p.name}</div>
                                <div style={{fontSize:9.5,color:P.dust}}>{p.gruppe}</div>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                      {sokTekst.trim().length>0 && sokTreff.length===0 && (
                        <div style={{fontSize:11,color:P.dust,padding:"6px 0"}}>Ingen treff.</div>
                      )}
                    </div>
                    {utkastFordelinger.length>0 && (
                      <button onClick={()=>{setVisLeggTilFordeling(false);setSokTekst("");}}
                        style={{marginTop:6,background:"none",border:"none",cursor:"pointer",
                          color:P.dust,fontSize:11,padding:0}}>
                        Avbryt
                      </button>
                    )}
                  </>
                )}

                {/* "Del opp i flere" — splitt er bare et mer presist svar,
                    naadd via samme plukker som over, ikke en egen modus. */}
                {!visPlasseringPicker && utkastFordelinger.length>0 && (
                  <button onClick={()=>setVisLeggTilFordeling(true)}
                    style={{width:"100%",padding:"6px 8px",background:"none",
                      border:"1px dashed "+P.border,borderRadius:7,fontSize:11,
                      cursor:"pointer",color:P.stone,marginBottom:8}}>
                    ✂️ Del opp i flere plasseringer
                  </button>
                )}

                {/* Laering — universelt tilgjengelig naar minst én
                    plassering er valgt. */}
                {utkastFordelinger.length>0 && !visPlasseringPicker && (
                  <div style={{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",
                    background:P.mist,borderRadius:8,border:"1px solid "+P.border,cursor:"pointer"}}
                    onClick={()=>setUtkastLaer(v=>!v)}>
                    <div style={{width:20,height:20,borderRadius:5,flexShrink:0,
                      background:utkastLaer?P.hazel:"transparent",
                      border:"1.5px solid "+(utkastLaer?P.hazel:P.hazelL),
                      display:"flex",alignItems:"center",justifyContent:"center"}}>
                      {utkastLaer&&<Em e="✓" s={{fontSize:11,color:"white"}}/>}
                    </div>
                    <div>
                      <div style={{fontSize:12,fontWeight:500,color:P.ink}}>Lær denne koblingen</div>
                      <div style={{fontSize:10,color:P.dust}}>Fremtidige hendelser fra samme mønster kobles automatisk.</div>
                    </div>
                  </div>
                )}

                {/* §3: naerregel for samme plassering funnet — tilby aa
                    utvide den fremfor aa lage en ny, direkte her. */}
                {utkastLaer && naertregelForSammeTarget && utvidetMonster && (
                  <div style={{marginTop:6,padding:"8px 10px",background:"#FFFBE0",
                    border:"1px solid #D4C060",borderRadius:8}}>
                    <div style={{fontSize:11,color:"#9A7A00",marginBottom:6}}>
                      Fins allerede en regel for <b>{naertregelForSammeTarget.targetName}</b>: «{naertregelForSammeTarget.pattern}».
                      Utvidet til «{utvidetMonster}» vil også treffe {utvidBrukAntall} observasjon{utvidBrukAntall!==1?"er":""}.
                    </div>
                    <button onClick={brukOgUtvidRegel}
                      style={{padding:"5px 10px",borderRadius:7,fontSize:11,fontWeight:600,cursor:"pointer",
                        background:"#9A7A00",color:"white",border:"none"}}>
                      Bruk og utvid eksisterende regel
                    </button>
                  </div>
                )}

                {/* Sekundære veier — ikke typer blant flere, men egne,
                    lavterskel alternativ til aa velge plassering na.
                    Samme visuelle vekt, stablet sammen, tydelig underordnet
                    selve plasseringssoket over (4. Visuell prioritering). */}
                {utkastFordelinger.length===0 && (
                  <div style={{display:"flex",flexDirection:"column",gap:6,marginTop:8}}>
                    <button onClick={()=>setUtkastType("uklar")}
                      style={{width:"100%",padding:"7px 8px",background:"none",
                        border:"1px dashed "+P.border,borderRadius:7,fontSize:11,
                        cursor:"pointer",color:P.stone}}>
                      ⏸️ Sett denne på vent i stedet
                    </button>
                    <button onClick={()=>setUtkastType("intern_overforing")}
                      style={{width:"100%",padding:"7px 8px",background:"none",
                        border:"1px dashed "+P.border,borderRadius:7,fontSize:11,
                        cursor:"pointer",color:P.stone}}>
                      ↔️ Registrer som intern overføring
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* Intern overforing — en alternativ arbeidsflyt, ikke en
                plassering og ikke en behandlingstype (v-post-rename).
                Gjenbruker etappe 3-motoren (finnInterneOverforingsKandidater,
                bekreftInternOverforing) helt uendret — kun UI-inngangen er
                flyttet hit, sammen med "Sett paa vent". */}
            {utkastType==="intern_overforing" && (
              <div style={{marginBottom:12}}>
                <button onClick={()=>{setUtkastType(null);setUtkastMotpart(null);setSokTekst("");}}
                  style={{marginBottom:8,background:"none",border:"none",cursor:"pointer",
                    color:P.hazel,fontSize:11,padding:0}}>
                  ← Tilbake til plassering
                </button>
                <div style={{fontSize:11,fontWeight:600,color:P.dust,
                  textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:6}}>
                  Bekreft denne interne overføringen
                </div>
                <div style={{fontSize:11,color:P.stone,marginBottom:8,lineHeight:1.5}}>
                  Velg transaksjonen på den andre kontoen som representerer samme overføring.
                </div>

                {overforingKandidater.length>0 && !utkastMotpart && (
                  <div style={{marginBottom:8}}>
                    {overforingKandidater.slice(0,5).map(k=>(
                      <div key={k.transaction.id} onClick={()=>setUtkastMotpart(k.transaction)}
                        style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",
                          padding:"6px 8px",borderRadius:7,marginBottom:4,
                          background:P.hazelXL,border:"1px solid "+P.hazelL}}>
                        <div style={{flex:1}}>
                          <div style={{fontSize:12,fontWeight:500,color:P.ink}}>
                            {k.transaction.tekst} · {fmt(k.transaction.belop||0)}
                          </div>
                          <div style={{fontSize:10,color:P.dust}}>
                            {fmtD(k.transaction.dato)} · {normaliserKonto(k.transaction)}
                          </div>
                        </div>
                        <span style={{fontSize:10,color:P.hazel,fontWeight:600}}>Velg</span>
                      </div>
                    ))}
                  </div>
                )}

                {!utkastMotpart && (
                  <div>
                    <input value={sokTekst} onChange={e=>setSokTekst(e.target.value)}
                      placeholder="Søk blant andre hendelser…"
                      autoComplete="off"
                      style={{width:"100%",boxSizing:"border-box",fontSize:12,
                        background:P.mist,padding:"7px 10px",borderRadius:7,marginBottom:6}}/>
                    {overforingSokTreff.length>0 && (
                      <div style={{maxHeight:160,overflowY:"auto"}}>
                        {overforingSokTreff.slice(0,20).map(o=>(
                          <div key={o.id} onClick={()=>{setUtkastMotpart(o);setSokTekst("");}}
                            style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",
                              padding:"5px 8px",borderRadius:6,marginBottom:2,
                              background:P.linen,border:"1px solid "+P.border}}>
                            <div style={{flex:1}}>
                              <div style={{fontSize:11.5,color:P.ink}}>{o.tekst} · {fmt(o.belop||0)}</div>
                              <div style={{fontSize:9.5,color:P.dust}}>{fmtD(o.dato)} · {normaliserKonto(o)}</div>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                    {sokTekst.trim().length>0 && overforingSokTreff.length===0 && (
                      <div style={{fontSize:11,color:P.dust,padding:"6px 0"}}>Ingen treff.</div>
                    )}
                  </div>
                )}

                {utkastMotpart && (
                  <div style={{marginBottom:8}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,padding:"7px 10px",
                      background:"#F0FFF4",border:"1px solid "+P.oliveL,borderRadius:7}}>
                      <div style={{flex:1}}>
                        <div style={{fontSize:12,fontWeight:600,color:P.olive}}>
                          {utkastMotpart.tekst} · {fmt(utkastMotpart.belop||0)}
                        </div>
                        <div style={{fontSize:10,color:P.dust}}>
                          {fmtD(utkastMotpart.dato)} · {normaliserKonto(utkastMotpart)}
                        </div>
                      </div>
                      <button onClick={()=>setUtkastMotpart(null)}
                        style={{background:"none",border:"none",cursor:"pointer",color:P.dust,fontSize:11}}>
                        Endre
                      </button>
                    </div>
                    {/* §7: manuelt sok kan gi et bredere resultat enn de
                        automatiske forslagene — varsler, men blokkerer ikke,
                        dersom det valgte ikke oppfyller de vanlige kravene. */}
                    {!(retningMotsatt(t,utkastMotpart) && belopMatcherIOre(t.belop,utkastMotpart.belop) && kontoUlik(t,utkastMotpart)) && (
                      <div style={{fontSize:10.5,color:"#9A7A00",marginTop:4,padding:"4px 2px"}}>
                        ⚠️ Beløp, fortegn eller konto stemmer ikke med vanlige krav for en intern overføring — kontroller at dette er riktig før du lagrer.
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}

            {/* Paa vent — den eneste midlertidige tilstanden (4B), na naadd
                via lenken over i stedet for et typevalg blant flere. */}
            {utkastType==="uklar" && (
              <div style={{marginBottom:12}}>
                <button onClick={()=>setUtkastType(null)}
                  style={{marginBottom:8,background:"none",border:"none",cursor:"pointer",
                    color:P.hazel,fontSize:11,padding:0}}>
                  ← Tilbake til plassering
                </button>
                <div style={{fontSize:11,fontWeight:600,color:P.dust,
                  textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:6}}>
                  Hva mangler før denne kan plasseres?
                </div>
                <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                  <button onClick={()=>setUtkastUklar("venter_paa_kvittering")}
                    style={{flex:"1 1 45%",padding:"7px 8px",borderRadius:7,fontSize:11,cursor:"pointer",
                      background:utkastUklar==="venter_paa_kvittering"?"#FFFBE0":"transparent",
                      border:"1px solid "+(utkastUklar==="venter_paa_kvittering"?"#D4C060":P.border),
                      color:"#9A7A00"}}>
                    🧾 Venter på kvittering
                  </button>
                  <button onClick={()=>setUtkastUklar("maa_splittes")}
                    style={{flex:"1 1 45%",padding:"7px 8px",borderRadius:7,fontSize:11,cursor:"pointer",
                      background:utkastUklar==="maa_splittes"?"#FFFBE0":"transparent",
                      border:"1px solid "+(utkastUklar==="maa_splittes"?"#D4C060":P.border),
                      color:"#9A7A00"}}>
                    ✂️ Må splittes
                  </button>
                  <button onClick={()=>setUtkastUklar("maa_avklares")}
                    style={{flex:"1 1 45%",padding:"7px 8px",borderRadius:7,fontSize:11,cursor:"pointer",
                      background:utkastUklar==="maa_avklares"?"#FFFBE0":"transparent",
                      border:"1px solid "+(utkastUklar==="maa_avklares"?"#D4C060":P.border),
                      color:"#9A7A00"}}>
                    🤔 Må avklares
                  </button>
                  <button onClick={()=>setUtkastUklar("annet")}
                    style={{flex:"1 1 45%",padding:"7px 8px",borderRadius:7,fontSize:11,cursor:"pointer",
                      background:utkastUklar==="annet"?"#FFFBE0":"transparent",
                      border:"1px solid "+(utkastUklar==="annet"?"#D4C060":P.border),
                      color:"#9A7A00"}}>
                    💭 Annet
                  </button>
                </div>

                <label style={{display:"block",marginTop:8,padding:"8px 10px",
                  background:kvitteringLagret?"#F0FFF4":P.mist,
                  border:"1px solid "+(kvitteringLagret?P.oliveL:P.border),
                  borderRadius:7,cursor:"pointer",fontSize:11,
                  color:kvitteringLagret?P.olive:P.stone,textAlign:"center"}}>
                  {kvitteringLaster ? "⏳ Laster opp…" : kvitteringLagret ? "🧾 Kvittering lagt til — trykk for å bytte" : "📷 Legg til kvittering"}
                  <input type="file" accept="image/*" onChange={leggTilKvittering} style={{display:"none"}}/>
                </label>
              </div>
            )}

            {/* Flerbruk-merking hvis allerede lagret med laering */}
            {effektivStatus.harLaertRegel&&!effektivStatus.erFlerbruk && (
              <div style={{fontSize:10.5,color:"#9A7A00",marginBottom:8}}>
                <button onClick={()=>merkFlerbruk(normaliserTransaksjonstekst(t.tekst))}
                  style={{background:"none",border:"none",cursor:"pointer",color:"#9A7A00",fontSize:10.5}}>
                  Merk leverandor som flerbruk (stopper autolaering)
                </button>
              </div>
            )}

            {/* Lagre / Ignorer */}
            <div style={{display:"flex",gap:6,marginTop:4}}>
              <button onClick={lukkOgNullstill}
                style={{flex:1,padding:"8px",background:P.mist,border:"1px solid "+P.border,
                  borderRadius:8,fontSize:12,cursor:"pointer",color:P.stone}}>
                Avbryt
              </button>
              {t.status!=="ignorert" && (
                <button onClick={()=>{settStatus(t.id,"ignorert");lukkOgNullstill();}}
                  style={{flex:1,padding:"8px",background:P.mist,border:"1px solid "+P.border,
                    borderRadius:8,fontSize:12,cursor:"pointer",color:P.stone}}>
                  Ignorer
                </button>
              )}
              <button onClick={()=>{
                  if(utkastType==="intern_overforing" && utkastMotpart) {
                    setTransaksjoner(prev=>bekreftInternOverforing(prev, t.id, utkastMotpart.id));
                    setApenId(null);
                  } else {
                    lagreBehandling(t.id,{
                      type: utkastType==="uklar" ? "uklar" : "plassert",
                      fordelinger:utkastFordelinger, laer:utkastLaer, uklarValg:utkastUklar,
                    });
                  }
                }}
                disabled={!kanLagre}
                style={{flex:2,padding:"8px",borderRadius:8,fontSize:12,fontWeight:600,
                  cursor:kanLagre?"pointer":"default",
                  background:kanLagre?P.hazel:P.mist,
                  color:kanLagre?"white":P.dust,border:"none"}}>
                Lagre
              </button>
            </div>
          </div>
        )}
      </div>
    );
  };


  return (
    <div>
      {/* ── Topplinjen ── */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <div>
          <div style={{fontSize:15,fontWeight:600,color:P.ink}}>🏦 Bankimport</div>
          <div style={{fontSize:11,color:P.stone}}>{alle.length} transaksjoner totalt</div>
        </div>
        <button onClick={()=>{setVisImport(v=>!v);setPreview(null);}}
          style={{padding:"7px 14px",background:visImport?P.mist:P.hazel,
            border:"1px solid "+(visImport?P.border:P.hazel),borderRadius:8,
            fontSize:12,cursor:"pointer",color:visImport?P.stone:"white",fontWeight:500}}>
          {visImport?"✕ Lukk":"＋ Importer fil"}
        </button>
      </div>

      {/* ── Importpanel ── */}
      {visImport && (
        <Card style={{padding:"14px",marginBottom:14}}>
          <div style={{display:"flex",gap:6,marginBottom:10}}>
            {KILDER.map(k=>(
              <button key={k.id} onClick={()=>setKilde(k.id)}
                style={{padding:"5px 12px",borderRadius:8,fontSize:12,cursor:"pointer",
                  fontWeight:kilde===k.id?600:400,
                  background:kilde===k.id?P.hazelXL:"transparent",
                  color:kilde===k.id?P.hazel:P.stone,
                  border:"1px solid "+(kilde===k.id?P.hazel:P.border)}}>
                {k.label}
              </button>
            ))}
          </div>
          <label style={{display:"block",padding:"10px 14px",background:P.mist,
            border:"1.5px dashed "+P.border,borderRadius:8,cursor:"pointer",
            fontSize:13,color:P.stone,textAlign:"center",marginBottom:8}}>
            📂 Velg CSV- eller Excel-fil
            <input type="file" accept=".csv,.txt,.xlsx,.xls" onChange={lesFil} style={{display:"none"}}/>
          </label>
          <div style={{fontSize:10,color:P.dust,lineHeight:1.5}}>
            {kilde==="sparebank1"&&"SpareBank 1: Dato, Beskrivelse, Inn, Ut — semikolon-CSV. Konto leses fra filens egen Konto-kolonne når den finnes."}
            {kilde==="dnb"&&"DNB Mastercard: Excel (.xlsx). Konto settes til MC."}
            {kilde==="annet"&&"Prover vanlige kolonnenavn automatisk."}
          </div>

          {/* Forhandsvisning */}
          {preview && (
            <div style={{marginTop:10}}>
              <div style={{fontSize:11,color:P.stone,marginBottom:8}}>
                <span style={{color:P.olive,fontWeight:600}}>
                  {preview.filter(t=>!t.erDuplikat).length} nye
                </span>
                {" · "}
                <span style={{color:P.dust}}>
                  {preview.filter(t=>t.erDuplikat).length} duplikater hoppes over
                </span>
              </div>

              {/* Konto kunne ikke fastslas sikkert for én eller flere rader
                  — krev et manuelt valg for import kan fullfores. Aldri en
                  gjetning basert paa transaksjonstekst. */}
              {preview.some(t=>!t.konto) && (
                <div style={{marginBottom:10,padding:"10px 12px",background:"#FFFBE0",
                  border:"1px solid #D4C060",borderRadius:8}}>
                  <div style={{fontSize:11.5,fontWeight:600,color:"#9A7A00",marginBottom:6}}>
                    Konto kunne ikke fastslås automatisk for {preview.filter(t=>!t.konto).length} rad
                    {preview.filter(t=>!t.konto).length!==1?"er":""}. Velg hvilken konto denne importen gjelder:
                  </div>
                  <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                    {KONTOER.filter(k=>k.id!=="alle").map(k=>(
                      <button key={k.id} onClick={()=>velgManuellKonto(k.id)}
                        style={{padding:"5px 10px",borderRadius:7,fontSize:11,cursor:"pointer",
                          fontWeight:manuellKonto===k.id?600:400,
                          background:manuellKonto===k.id?"#FFF4C0":"transparent",
                          color:manuellKonto===k.id?"#9A7A00":P.stone,
                          border:"1px solid "+(manuellKonto===k.id?"#D4C060":P.border)}}>
                        {k.label}
                      </button>
                    ))}
                  </div>
                </div>
              )}

              <div style={{overflowX:"auto",marginBottom:10}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
                  <thead>
                    <tr style={{borderBottom:"2px solid "+P.border}}>
                      <th style={{padding:"4px 5px",color:P.dust,fontWeight:600,textAlign:"left"}}>Dato</th>
                      <th style={{padding:"4px 5px",color:P.dust,fontWeight:600,textAlign:"left"}}>Tekst</th>
                      <th style={{padding:"4px 5px",color:P.dust,fontWeight:600,textAlign:"left"}}>Konto</th>
                      <th style={{padding:"4px 5px",color:P.dust,fontWeight:600,textAlign:"right"}}>Belop</th>
                      <th style={{padding:"4px 5px",color:P.dust,fontWeight:600,textAlign:"center"}}>Status</th>
                    </tr>
                  </thead>
                  <tbody>
                    {preview.slice(0,40).map((t,i)=>{
                      const treff = finnRegelForTekst(t.tekst);
      const lk = (treff.rule&&treff.confidence>=60) ? {budgetItemId:treff.rule.targetId,navn:treff.rule.targetName,gruppe:treff.rule.targetGruppe,flerbruk:!!treff.rule.multiUse} : null;
                      return (
                        <tr key={i} style={{borderBottom:"1px solid "+P.border,
                          background:t.erDuplikat?"#FFF8F0":i%2===0?P.linen:"transparent",
                          opacity:t.erDuplikat?0.5:1}}>
                          <td style={{padding:"4px 5px",color:P.stone,whiteSpace:"nowrap"}}>{fmtD(t.dato)}</td>
                          <td style={{padding:"4px 5px",color:P.ink,maxWidth:140,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.tekst}</td>
                          <td style={{padding:"4px 5px",whiteSpace:"nowrap"}}>
                            {t.konto
                              ? <span style={{color:P.stone}}>{normaliserKonto(t)}</span>
                              : <span style={{fontSize:9,color:"#9A7A00",background:"#FFFBE0",borderRadius:4,padding:"1px 5px"}}>mangler</span>}
                          </td>
                          <td style={{padding:"4px 5px",color:t.retning==="inn"?P.olive:P.clay,textAlign:"right",fontWeight:600}}>
                            {t.retning==="inn"?"+":"-"}{fmtB(t.belop)}
                          </td>
                          <td style={{padding:"4px 5px",textAlign:"center"}}>
                            {t.erDuplikat&&<span style={{fontSize:9,color:"#C0602A",background:"#FFF8F0",borderRadius:4,padding:"1px 5px"}}>dup</span>}
                            {!t.erDuplikat&&lk&&!lk.flerbruk&&<span style={{fontSize:9,color:"#228B44",background:"#E8FFF0",borderRadius:4,padding:"1px 5px"}}>→{lk.navn.slice(0,10)}</span>}
                            {!t.erDuplikat&&lk&&lk.flerbruk&&<span style={{fontSize:9,color:"#9A7A00",background:"#FFFBE0",borderRadius:4,padding:"1px 5px"}}>flerbruk</span>}
                            {!t.erDuplikat&&!lk&&<span style={{fontSize:9,color:P.stone,background:P.mist,borderRadius:4,padding:"1px 5px"}}>ny</span>}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
              <button onClick={gjorImport}
                disabled={preview.filter(t=>!t.erDuplikat).length===0 || preview.some(t=>!t.erDuplikat&&!t.konto)}
                style={{width:"100%",padding:"9px",background:P.hazel,color:"white",
                  border:"none",borderRadius:8,fontSize:13,cursor:"pointer",fontWeight:600}}>
                Importer {preview.filter(t=>!t.erDuplikat).length} transaksjoner
              </button>
            </div>
          )}
        </Card>
      )}

      {/* ── v-post-rename: modusvelger ── */}
      {alle.length>0 && (
        <div style={{display:"flex",gap:6,marginBottom:12}}>
          <button onClick={()=>setModus("behandling")}
            style={{flex:1,padding:"8px",borderRadius:9,fontSize:12.5,fontWeight:600,cursor:"pointer",
              background:modus==="behandling"?P.hazel:P.mist,color:modus==="behandling"?"white":P.stone,
              border:"1px solid "+(modus==="behandling"?P.hazel:P.border)}}>
            Til behandling
          </button>
          <button onClick={()=>setModus("alle")}
            style={{flex:1,padding:"8px",borderRadius:9,fontSize:12.5,fontWeight:600,cursor:"pointer",
              background:modus==="alle"?P.hazel:P.mist,color:modus==="alle"?"white":P.stone,
              border:"1px solid "+(modus==="alle"?P.hazel:P.border)}}>
            Alle transaksjoner
          </button>
        </div>
      )}

      {/* ── v-post-rename: okonomiske hendelser uten bank ── */}
      <div style={{marginBottom:14}}>
        {!visManuellRegistrering && (
          <button onClick={()=>setVisManuellRegistrering(true)}
            style={{width:"100%",padding:"9px",borderRadius:9,fontSize:12.5,fontWeight:600,cursor:"pointer",
              background:"transparent",color:P.hazel,border:"1px dashed "+P.hazel}}>
            + Registrer manuelt
          </button>
        )}
        {visManuellRegistrering && (() => {
          const postAlternativer = allePoster.filter(p =>
            manuellType==="inntekt" ? p.retning==="inn"
            : manuellType==="sparing" ? p.plasseringType==="sparing"
            : (p.retning==="ut" && !p.plasseringType)
          );
          // v-post-rename: samme sokbare postvalg-monster som
          // KorrigerHendelseModal (input + filtrert treffliste), ikke
          // <select> — soker i baade gruppenavn og postnavn.
          const postTreff = manuellPostSok.trim().length>0
            ? postAlternativer.filter(p => {
                const sok = manuellPostSok.trim().toLowerCase();
                return p.name.toLowerCase().includes(sok) || p.gruppe.toLowerCase().includes(sok);
              })
            : [];
          const velgManuellPost = (p) => {
            setManuellPostId(p.id);
            setManuellPostNavn(p.gruppe+" / "+p.name);
            setManuellPostSok("");
          };
          const bytManuellType = (nyType) => {
            setManuellType(nyType);
            setManuellPostId(""); setManuellPostNavn(""); setManuellPostSok("");
          };
          const belopTall = parseFloat(manuellBelop);
          const kanLagre = !!manuellPostId && !!manuellDato && !isNaN(belopTall) && belopTall!==0;
          return (
            <div style={{padding:"12px 14px",background:P.linen,border:"1px solid "+P.border,borderRadius:10}}>
              <div style={{fontSize:13,fontWeight:600,color:P.ink,marginBottom:10}}>Registrer manuelt</div>
              <div style={{fontSize:11,color:P.dust,marginBottom:10,lineHeight:1.5}}>
                For okonomiske hendelser som ikke finnes i bankimporten, f.eks. gavekort.
              </div>

              <div style={{display:"flex",gap:6,marginBottom:8}}>
                <button onClick={()=>bytManuellType("kostnad")}
                  style={{flex:1,padding:"7px",borderRadius:8,fontSize:12,fontWeight:600,cursor:"pointer",
                    background:manuellType==="kostnad"?P.clay:P.mist,color:manuellType==="kostnad"?"white":P.stone,
                    border:"1px solid "+(manuellType==="kostnad"?P.clay:P.border)}}>
                  Kostnad
                </button>
                <button onClick={()=>bytManuellType("inntekt")}
                  style={{flex:1,padding:"7px",borderRadius:8,fontSize:12,fontWeight:600,cursor:"pointer",
                    background:manuellType==="inntekt"?P.olive:P.mist,color:manuellType==="inntekt"?"white":P.stone,
                    border:"1px solid "+(manuellType==="inntekt"?P.olive:P.border)}}>
                  Inntekt
                </button>
                <button onClick={()=>bytManuellType("sparing")}
                  style={{flex:1,padding:"7px",borderRadius:8,fontSize:12,fontWeight:600,cursor:"pointer",
                    background:manuellType==="sparing"?P.hazel:P.mist,color:manuellType==="sparing"?"white":P.stone,
                    border:"1px solid "+(manuellType==="sparing"?P.hazel:P.border)}}>
                  Sparing
                </button>
              </div>

              <input type="date" value={manuellDato} onChange={e=>setManuellDato(e.target.value)}
                style={{width:"100%",padding:"8px 10px",borderRadius:8,border:"1px solid "+P.border,
                  fontSize:12.5,marginBottom:8,boxSizing:"border-box"}}/>

              <input type="number" inputMode="decimal" value={manuellBelop} onChange={e=>setManuellBelop(e.target.value)}
                placeholder="Beløp (kr)"
                style={{width:"100%",padding:"8px 10px",borderRadius:8,border:"1px solid "+P.border,
                  fontSize:12.5,marginBottom:4,boxSizing:"border-box"}}/>
              <div style={{fontSize:10.5,color:P.dust,marginBottom:8}}>
                Bruk minus for å redusere faktisk beløp på posten.
              </div>

              {manuellPostId ? (
                <button onClick={()=>{setManuellPostId(""); setManuellPostNavn("");}}
                  style={{width:"100%",padding:"8px 10px",borderRadius:8,border:"1px solid "+P.border,
                    fontSize:12.5,marginBottom:8,background:"white",textAlign:"left",cursor:"pointer",
                    boxSizing:"border-box",color:P.ink,fontWeight:600}}>
                  {manuellPostNavn}
                </button>
              ) : (
                <div style={{marginBottom:8,position:"relative"}}>
                  <input value={manuellPostSok} onChange={e=>setManuellPostSok(e.target.value)}
                    placeholder={manuellType==="inntekt" ? "Søk etter inntektspost…" : manuellType==="sparing" ? "Søk etter sparepost…" : "Søk etter kostnadspost…"}
                    style={{width:"100%",padding:"8px 10px",borderRadius:8,border:"1px solid "+P.border,
                      fontSize:12.5,background:"white",boxSizing:"border-box"}}/>
                  {manuellPostSok.trim().length>0 && (
                    <div style={{marginTop:4,maxHeight:180,overflowY:"auto",border:"1px solid "+P.border,
                      borderRadius:8,background:"white"}}>
                      {postTreff.map(p=>(
                        <button key={p.id} onClick={()=>velgManuellPost(p)}
                          style={{display:"block",width:"100%",textAlign:"left",padding:"9px 10px",
                            borderRadius:0,border:"none",borderBottom:"1px solid "+P.border,
                            background:"transparent",cursor:"pointer",fontSize:12.5,boxSizing:"border-box"}}>
                          {p.name} <span style={{color:P.dust,fontSize:10.5}}>({p.gruppe})</span>
                        </button>
                      ))}
                      {postTreff.length===0 && (
                        <div style={{fontSize:11,color:P.dust,padding:"8px 10px"}}>Ingen treff.</div>
                      )}
                    </div>
                  )}
                </div>
              )}

              <div style={{fontSize:11,color:P.dust,marginBottom:2}}>Eier</div>
              <AnsvarChips eiere={manuellEiere} onChange={setManuellEiere}/>

              <input value={manuellKommentar} onChange={e=>setManuellKommentar(e.target.value)}
                placeholder="Kommentar (valgfritt)"
                style={{width:"100%",padding:"8px 10px",borderRadius:8,border:"1px solid "+P.border,
                  fontSize:12.5,marginTop:10,marginBottom:10,boxSizing:"border-box"}}/>

              <div style={{display:"flex",gap:8}}>
                <button onClick={()=>{
                    setVisManuellRegistrering(false); setManuellBelop(""); setManuellPostId("");
                    setManuellPostNavn(""); setManuellPostSok(""); setManuellKommentar("");
                    setManuellEiere([{person:"Felles",prosent:100}]);
                  }}
                  style={{flex:1,padding:"9px",background:"transparent",color:P.stone,
                    border:"1px solid "+P.border,borderRadius:9,fontSize:13,fontWeight:500,cursor:"pointer"}}>
                  Avbryt
                </button>
                <button onClick={lagreManuellRegistrering} disabled={!kanLagre}
                  style={{flex:2,padding:"9px",background:kanLagre?P.hazel:P.border,color:"white",
                    border:"none",borderRadius:9,fontSize:13,fontWeight:600,
                    cursor:kanLagre?"pointer":"default"}}>
                  Lagre
                </button>
              </div>
            </div>
          );
        })()}
      </div>

      {/* ── Kontovelger ── */}
      {modus==="behandling" && alle.length>0 && (
        <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:10}}>
          {KONTOER.map(k=>(
            <button key={k.id} onClick={()=>setValgtKonto(k.id)}
              style={{padding:"3px 9px",borderRadius:14,fontSize:11,cursor:"pointer",
                fontWeight:valgtKonto===k.id?600:400,
                background:valgtKonto===k.id?P.ink:P.mist,
                color:valgtKonto===k.id?"white":P.stone,
                border:"1px solid "+(valgtKonto===k.id?P.ink:P.border)}}>
              {k.label}
            </button>
          ))}
        </div>
      )}

      {/* ── Seksjonsvelger ── */}
      {modus==="behandling" && alle.length>0 && (
        <div style={{display:"flex",gap:0,marginBottom:14,borderBottom:"2px solid "+P.border}}>
          {SEKSJONER.map(s=>(
            <button key={s.id} onClick={()=>setSeksjon(s.id)}
              style={{flex:1,padding:"7px 4px",fontSize:10.5,cursor:"pointer",
                fontWeight:seksjon===s.id?600:400,background:"none",border:"none",
                borderBottom:seksjon===s.id?"2.5px solid "+s.farge:"2px solid transparent",
                marginBottom:-2,color:seksjon===s.id?s.farge:P.stone,textAlign:"center"}}>
              {s.label}
              {s.n>0&&<span style={{marginLeft:4,fontSize:9,color:s.farge,fontWeight:700}}>{s.n}</span>}
            </button>
          ))}
        </div>
      )}

      {/* ── Transaksjoner ── */}
      {modus==="behandling" && alle.length===0 && !visImport && (
        <div style={{textAlign:"center",padding:"32px 16px",color:P.dust,fontSize:13}}>
          Ingen hendelser ennå. Trykk «Importer fil» for å hente fra banken.
        </div>
      )}
      {modus==="behandling" && kontoFilter(grupper[seksjon]||[]).map(t=><VisRad key={t.id} t={t}/>)}
      {modus==="behandling" && alle.length>0 && kontoFilter(grupper[seksjon]||[]).length===0 && (
        <div style={{textAlign:"center",padding:"20px",color:P.dust,fontSize:12}}>
          Ingen hendelser i denne kategorien.
        </div>
      )}

      {/* ── v-post-rename: read-only kontrolloversikt ── */}
      {modus==="alle" && (
        <div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
            <select value={atMaaned} onChange={e=>setAtMaaned(e.target.value)}
              style={{flex:"1 1 140px",padding:"7px 8px",borderRadius:8,border:"1px solid "+P.border,fontSize:12,background:"white"}}>
              {atMaanedAlternativer.map(m=><option key={m.id} value={m.id}>{m.label}</option>)}
            </select>
            <select value={atKonto} onChange={e=>setAtKonto(e.target.value)}
              style={{flex:"1 1 120px",padding:"7px 8px",borderRadius:8,border:"1px solid "+P.border,fontSize:12,background:"white"}}>
              {KONTOER.map(k=><option key={k.id} value={k.id}>{k.label}</option>)}
            </select>
          </div>
          <input value={atSok} onChange={e=>setAtSok(e.target.value)} placeholder="Søk i tekst…"
            style={{width:"100%",padding:"8px 10px",borderRadius:8,border:"1px solid "+P.border,
              fontSize:12.5,marginBottom:10,boxSizing:"border-box"}}/>
          <div style={{fontSize:11.5,color:P.dust,marginBottom:8}}>
            {alleTransaksjonerFiltrert.length} av {(transaksjoner||[]).length} transaksjoner
          </div>

          {alleTransaksjonerFiltrert.length===0 && (
            <div style={{textAlign:"center",padding:"24px",color:P.dust,fontSize:12.5}}>
              Ingen transaksjoner matcher filtrene.
            </div>
          )}

          {alleTransaksjonerFiltrert.map(t=>{
            const tilstand = beskrivTilstand(t);
            // v-post-rename: en tidligere propagert match UTEN
            // hendelse har INGEN eksisterende hendelse aa korrigere —
            // "Korriger kobling" ville derfor vaere semantisk feil her.
            // Gjenbruker i stedet HELE den eksisterende forstegangs-
            // behandlingsmotoren (VisRad, samme sokbare postvalg, eier,
            // splitt og lagreBehandling som "Til behandling" allerede
            // bruker) — ingen ny mini-modal. Gammel matchetMot/
            // laertKobling forhaandsvelges der KUN som forslag (se
            // VisRad sin utkastFordelinger-init).
            if(tilstand.kategori==="matchet_uten_hendelse") {
              return <VisRad key={t.id} t={t}/>;
            }
            const FARGE_KAT = {
              ferdig:P.olive, pa_vent:"#9A7A00", matchet_uten_hendelse:P.clay,
              forslag:"#9A7A00", intern:P.stone, ignorert:P.dust,
              krever_vurdering:P.clay, uferdig:P.dust,
            };
            return (
              <div key={t.id} style={{padding:"9px 11px",borderRadius:9,border:"1px solid "+P.border,
                marginBottom:6,background:"white"}}>
                <div style={{display:"flex",justifyContent:"space-between",gap:8,marginBottom:3}}>
                  <div style={{fontSize:12.5,fontWeight:600,color:P.ink,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                    {t.tekst||"(uten tekst)"}
                  </div>
                  <div style={{fontSize:12.5,fontWeight:600,color:t.retning==="inn"?P.olive:P.ink,flexShrink:0}}>
                    {t.retning==="inn"?"+":"-"}{fmtB(t.belop)} kr
                  </div>
                </div>
                <div style={{fontSize:11,color:P.dust,marginBottom:4}}>
                  {fmtD(t.dato)} · {normaliserKonto(t)}
                </div>
                <div style={{fontSize:11.5,fontWeight:600,color:FARGE_KAT[tilstand.kategori]||P.stone}}>
                  {tilstand.tekst}
                </div>
                {tilstand.detaljer.map((d,i)=>(
                  <div key={i} style={{fontSize:11,color:P.stone,marginTop:1}}>{d}</div>
                ))}
                {(tilstand.kategori==="ferdig" || tilstand.kategori==="pa_vent") && (
                  <button onClick={()=>setKorrigerHendelseId(finnHendelseForTransaksjon(hendelser, t.id).id)}
                    style={{marginTop:5,padding:0,background:"none",border:"none",color:P.hazel,
                      fontSize:11,fontWeight:600,cursor:"pointer",textDecoration:"underline"}}>
                    Korriger kobling
