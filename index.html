// ── InntekterScreen ───────────────────────────────────────────────
function InntekterScreen({incomeGroups,setIncomeGroups,budgetGroups,sparingGroups,hendelser,setHendelser,rules,setRules,transaksjoner,receipts,setReceipts,month,setMonth}) {
  const monthKey = "2026-"+String(month+1).padStart(2,"0");
  // v-post-rename: gyldige observasjoner na begge slag (bank + kvittering),
  // siden en hendelse kan vaere dokumentert av enten. Faktiske tall
  // beregnes direkte fra hendelser — Actual er ikke lenger involvert her.
  const gyldigeObservasjonIder = new Set([
    ...(transaksjoner||[]).map(t=>t.id),
    ...(receipts||[]).map(r=>r.id),
  ]);
  const actualTotals = beregnFaktiskTotalerFraHendelser(hendelser, monthKey, gyldigeObservasjonIder);
  const [expanded,setExpanded]   = useState(null);
  const [metaModal,setMetaModal] = useState(null);
  // Etterbehandling, etappe 2: hvilken post er valgt for drill-down
  // (rent lesende — se HendelseDrillDownModal).
  const [drillDown,setDrillDown] = useState(null); // {postId, postName} | null
  // Etterbehandling, etappe 3: hvilken hendelse korrigeres na (id) | null.
  const [korrigerHendelseId,setKorrigerHendelseId] = useState(null);
  // Etterbehandling, etappe 4: hvilken kvittering redigeres na (id) | null,
  // og eventuell synkroniseringsfeil for den (rent lesende panel-tilstand).
  const [korrigerReceiptId,setKorrigerReceiptId] = useState(null);
  const [kvitteringSyncFeil,setKvitteringSyncFeil] = useState(null); // {id, melding} | null
  const alleMalPoster = byggAlleMalPoster(budgetGroups, incomeGroups);
  const oppdaterKvitteringFraDrillDown = (id, felter) => {
    const receipt = (receipts||[]).find(x=>x.id===id);
    if(!receipt) return;
    const {feil, nyReceipt, nyHendelse} = byggSynkronisertKvitteringOgHendelse(receipt, felter, hendelser);
    if(feil) { setKvitteringSyncFeil({id, melding:feil}); return; }
    setKvitteringSyncFeil(null);
    setReceipts(prev=>(prev||[]).map(x=>x.id!==id?x:nyReceipt));
    if(nyHendelse) {
      setHendelser(prev=>{
        const uten = (prev||[]).filter(h=>h.id!==nyHendelse.id);
        return [...uten, nyHendelse];
      });
    }
  };

  const gBudget = (g) => g.items.reduce((s,i)=>s+((i.months&&i.months[month]?i.months[month].budget:0)||0),0);
  const gSpent  = (g) => g.items.reduce((s,i)=>s+(hentFaktiskForPost(actualTotals,i)!==undefined?hentFaktiskForPost(actualTotals,i):((i.months&&i.months[month]?i.months[month].spent:0)||0)),0);

  const updItem = (gid,iid,f,v) => setIncomeGroups(p=>p.map(g=>g.id!==gid?g:{
    ...g, items:g.items.map(it=>it.id!==iid?it:{
      ...it, months:it.months.map((mo,mi)=>mi!==month?mo:{...mo,[f]:parseFloat(v)||0})
    })
  }));
  const addItem = (gid,n,b,s) => setIncomeGroups(p=>p.map(g=>g.id!==gid?g:{
    ...g, items:[...g.items,{id:uid(),name:n,months:Array.from({length:12},(_,mi)=>({
      budget:mi===month?parseFloat(b)||0:0,
      spent: mi===month?parseFloat(s)||0:0
    })),meta:null}]
  }));
  const delItem = (gid,iid) => setIncomeGroups(p=>p.map(g=>g.id!==gid?g:{
    ...g, items:g.items.filter(it=>it.id!==iid)
  }));
  // v-post-rename: navn er valgfritt fjerde argument.
  const saveMeta = (gid,iid,meta,navn) => setIncomeGroups(p=>p.map(g=>g.id!==gid?g:{
    ...g, items:g.items.map(it=>it.id!==iid?it:{...it,meta,...(navn!==undefined?{name:navn}:{})})
  }));

  const totalBudget = (incomeGroups||[]).reduce((s,g)=>s+gBudget(g),0);
  const totalSpent  = (incomeGroups||[]).reduce((s,g)=>s+gSpent(g),0);

  function GRow({g}) {
    const gb=gBudget(g), gs=gSpent(g), open=expanded===g.id;
    return (
      <div>
        <Card onClick={()=>setExpanded(open?null:g.id)} accent={g.color}
          style={{cursor:"pointer",borderRadius:open?"11px 11px 0 0":11,
            marginBottom:open?0:undefined,borderBottom:open?"none":undefined,padding:"10px 14px"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <IBox emoji={INCOME_GROUP_EMOJI[g.id]||"📋"} color={g.color} size={34}/>
            <div style={{flex:1}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:5}}>
                <span style={{fontSize:13,fontWeight:600,color:P.ink}}>{g.label}</span>
                <div>
                  <span style={{fontSize:12,fontWeight:500,color:P.olive}}>{fmt(gs)}</span>
                  <span style={{fontSize:10.5,color:P.dust}}> / {fmt(gb)}</span>
                </div>
              </div>
              <Bar value={gs} max={gb||1} color={g.color} h={3}/>
            </div>
            <Em e={open?"▴":"▾"} s={{color:P.dust,fontSize:13,marginLeft:6}}/>
          </div>
        </Card>
        {open && (
          <div style={{border:"1px solid "+P.border,borderTop:"none",borderRadius:"0 0 11px 11px",
            background:P.linen,padding:"6px 14px 12px",marginBottom:6}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 68px 68px 30px",gap:5,
              padding:"4px 0 7px",borderBottom:"1px solid "+P.border,marginBottom:4}}>
              <span style={{fontSize:10,color:P.dust}}>Post</span>
              <span style={{fontSize:10,color:P.dust,textAlign:"right"}}>Budsjett</span>
              <span style={{fontSize:10,color:P.dust,textAlign:"right"}}>Faktisk</span>
              <span/>
            </div>
            {g.items.map((it,idx) => {
              const mo = (it.months&&it.months[month]) ? it.months[month] : {budget:0,spent:0};
              return (
                <div key={it.id} style={{padding:"6px 0",borderBottom:idx<g.items.length-1?"1px solid "+P.border:"none"}}>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 68px 68px 30px",gap:5,alignItems:"center"}}>
                    <div style={{display:"flex",alignItems:"center",gap:4,minWidth:0}}>
                      <span style={{fontSize:12,color:P.ink,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1}}>{it.name}</span>
                      {it.meta&&it.meta.arkivert && (
                        <span title="Arkivert — vises ikke ved nye plasseringer" style={{fontSize:12,flexShrink:0}}>📂</span>
                      )}
                      {it.meta&&it.meta.automatisk && (
                        <span title="Automatisk til prognose" style={{fontSize:13,color:P.gold,flexShrink:0}}>⚡</span>
                      )}
                      <button onClick={()=>setMetaModal({item:it,groupId:g.id})}
                        style={{background:it.meta?P.hazelXL:P.mist,
                          border:"1px solid "+(it.meta?P.hazelL:P.border),
                          borderRadius:5,cursor:"pointer",fontSize:9,padding:"2px 5px",
                          color:it.meta?P.hazel:P.dust,whiteSpace:"nowrap",flexShrink:0}}>
                        {it.meta?"✓":"+"}
                      </button>
                    </div>
                    <InlineNum key={"ib-"+it.id+"-"+month}
                      value={mo.budget}
                      onChange={v=>updItem(g.id,it.id,"budget",v)}
                      colorStyle={{color:P.olive}}/>
                    <InlineNum key={"is-"+it.id+"-"+month}
                      value={hentFaktiskForPost(actualTotals,it)!==undefined ? Math.round(hentFaktiskForPost(actualTotals,it)) : mo.spent}
                      onChange={v=>updItem(g.id,it.id,"spent",v)}
                      colorStyle={{color:P.olive,fontWeight:600}}/>
                    <button onClick={()=>delItem(g.id,it.id)}
                      style={{background:"none",border:"none",cursor:"pointer",color:P.dust,fontSize:12,padding:2,opacity:.5}}>🗑️</button>
                  </div>
                  {hentFaktiskForPost(actualTotals,it)!==undefined && (
                    <button onClick={()=>setDrillDown({post:it, postName:it.name})}
                      style={{background:"none",border:"none",cursor:"pointer",color:P.hazel,
                        fontSize:10.5,padding:"3px 0 0",textAlign:"left",display:"block"}}>
                      🔍 Vis hendelser bak dette tallet
                    </button>
                  )}
                </div>
              );
            })}
            <AddItemRow onAdd={(n,b,s)=>addItem(g.id,n,b,s)} color={g.color}/>
          </div>
        )}
      </div>
    );
  }

  return (
    <div>
      <MaanedsHeader month={month} setMonth={setMonth}/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
        <Card style={{padding:"12px 14px"}}>
          <div style={{fontSize:10,color:P.dust,marginBottom:3}}>↑ Budsjettert</div>
          <div style={{fontSize:19,fontWeight:600,color:P.olive}}>{fmt(totalBudget)}</div>
        </Card>
        <Card style={{padding:"12px 14px"}}>
          <div style={{fontSize:10,color:P.dust,marginBottom:3}}>↑ Faktisk</div>
          <div style={{fontSize:19,fontWeight:600,color:totalSpent>0?P.olive:P.stone}}>{fmt(totalSpent)}</div>
        </Card>
      </div>
      {(incomeGroups||[]).map(g=><GRow key={g.id} g={g}/>)}
      {metaModal && (
        <InntekterMetaModal
          item={metaModal.item}
          groupId={metaModal.groupId}
          onSave={saveMeta}
          onClose={()=>setMetaModal(null)}/>
      )}
      {drillDown && (
        <HendelseDrillDownModal
          tittel={"Hendelser — "+drillDown.postName}
          rader={finnHendelserForPost(hendelser, transaksjoner, receipts, drillDown.post, monthKey, gyldigeObservasjonIder)}
          onClose={()=>setDrillDown(null)}
          onVelgHendelse={(hendelseId)=>setKorrigerHendelseId(hendelseId)}
          onVelgKvittering={(receiptId)=>setKorrigerReceiptId(receiptId)}
        />
      )}
      {korrigerReceiptId && (() => {
        const receiptSomRedigeres = (receipts||[]).find(r=>r.id===korrigerReceiptId);
        if(!receiptSomRedigeres) return null;
        return (
          <Modal title={"Rediger kvittering — "+(receiptSomRedigeres.merchant||"(ukjent)")}
            onClose={()=>setKorrigerReceiptId(null)}>
            <KvitteringDetalj
              r={receiptSomRedigeres}
              alleMalPoster={alleMalPoster}
              onOppdaterKvittering={oppdaterKvitteringFraDrillDown}
              onClose={()=>setKorrigerReceiptId(null)}
              syncFeil={kvitteringSyncFeil&&kvitteringSyncFeil.id===korrigerReceiptId?kvitteringSyncFeil.melding:null}
            />
          </Modal>
        );
      })()}
      {korrigerHendelseId && (() => {
        const hendelseSomKorrigeres = (hendelser||[]).find(h=>h.id===korrigerHendelseId);
        if(!hendelseSomKorrigeres) return null;
        // v-post-rename: en manuell hendelse har ingen ekte
        // transaksjon aa slaa opp (transaksjonId er bevisst null) —
        // uten en "transaksjon" faller KorrigerHendelseModal sin
        // transRetning tilbake til "ut", som ville gitt feil fortegn
        // ved korrigering av en manuell INNTEKT. Bygger derfor en
        // syntetisk, minimal transaksjon KUN med riktig retning,
        // avledet fra hendelsens egen opprinnelige fordeling — ingen
        // ny fortegnslogikk, kun riktig inndata til den eksisterende.
        const transaksjonForKorrigering = hendelseSomKorrigeres.transaksjonId
          ? (transaksjoner||[]).find(t=>t.id===hendelseSomKorrigeres.transaksjonId)
          : hendelseSomKorrigeres.kilde==="manuell"
            ? {retning: (hendelseSomKorrigeres.fordelinger&&hendelseSomKorrigeres.fordelinger[0]&&hendelseSomKorrigeres.fordelinger[0].plasseringType==="income") ? "inn" : "ut"}
            : null;
        return (
          <KorrigerHendelseModal
            hendelse={hendelseSomKorrigeres}
            transaksjon={transaksjonForKorrigering}
            budgetGroups={budgetGroups}
            incomeGroups={incomeGroups}
            sparingGroups={sparingGroups}
            rules={rules}
            onLagre={(oppdatertHendelse, laerData)=>{
              setHendelser(prev=>{
                const uten = (prev||[]).filter(h=>h.id!==oppdatertHendelse.id);
                return [...uten, oppdatertHendelse];
              });
              if(laerData) {
                setRules(prev=>oppdaterReglerVedLaering(prev, laerData.transaksjon, laerData.post, false));
              }
              setKorrigerHendelseId(null);
              setDrillDown(null);
            }}
            onClose={()=>setKorrigerHendelseId(null)}
          />
        );
      })()}
    </div>
  );
}

// ── SparingScreen ─────────────────────────────────────────────────
// Speiler BudsjettScreen/InntekterScreen sitt mønster fullstendig —
// samme delte komponenter (HendelseDrillDownModal, KorrigerHendelseModal,
// KvitteringDetalj, beregnFaktiskTotalerFraHendelser, finnHendelserForPost,
// byggSynkronisertKvitteringOgHendelse) gjenbrukes uendret. Ingen av de
// fem eksisterende sparepostene flyttes hit i denne etappen — gruppene
// er tomme til en egen, senere migreringsetappe.
function SparingScreen({sparingGroups,setSparingGroups,budgetGroups,incomeGroups,hendelser,setHendelser,rules,setRules,transaksjoner,receipts,setReceipts,month,setMonth}) {
  const monthKey = "2026-"+String(month+1).padStart(2,"0");
  const gyldigeObservasjonIder = new Set([
    ...(transaksjoner||[]).map(t=>t.id),
    ...(receipts||[]).map(r=>r.id),
  ]);
  const actualTotals = beregnFaktiskTotalerFraHendelser(hendelser, monthKey, gyldigeObservasjonIder);
  const [expanded,setExpanded]   = useState(null);
  const [metaModal,setMetaModal] = useState(null);
  const [drillDown,setDrillDown] = useState(null); // {postId, postName} | null
  const [korrigerHendelseId,setKorrigerHendelseId] = useState(null);
  const [korrigerReceiptId,setKorrigerReceiptId] = useState(null);
  const [kvitteringSyncFeil,setKvitteringSyncFeil] = useState(null); // {id, melding} | null
  const alleMalPoster = byggAlleMalPoster(budgetGroups, incomeGroups);
  const oppdaterKvitteringFraDrillDown = (id, felter) => {
    const receipt = (receipts||[]).find(x=>x.id===id);
    if(!receipt) return;
    const {feil, nyReceipt, nyHendelse} = byggSynkronisertKvitteringOgHendelse(receipt, felter, hendelser);
    if(feil) { setKvitteringSyncFeil({id, melding:feil}); return; }
    setKvitteringSyncFeil(null);
    setReceipts(prev=>(prev||[]).map(x=>x.id!==id?x:nyReceipt));
    if(nyHendelse) {
      setHendelser(prev=>{
        const uten = (prev||[]).filter(h=>h.id!==nyHendelse.id);
        return [...uten, nyHendelse];
      });
    }
  };

  const gBudget = (g,m) => g.items.reduce((s,i)=>s+((i.months&&i.months[m]?i.months[m].budget:0)||0),0);
  const gSpent  = (g,m) => g.items.reduce((s,i)=>s+(hentFaktiskForPost(actualTotals,i)!==undefined?hentFaktiskForPost(actualTotals,i):((i.months&&i.months[m]?i.months[m].spent:0)||0)),0);

  const updItem = (gid,iid,f,v) => setSparingGroups(p=>p.map(g=>g.id!==gid?g:{
    ...g, items:g.items.map(it=>it.id!==iid?it:{
      ...it, months:it.months.map((mo,mi)=>mi!==month?mo:{...mo,[f]:parseFloat(v)||0})
    })
  }));
  // Sparing, etappe 1: en NY post faar sin sparegruppes likviditet-
  // standard umiddelbart (defaultSparingMeta(gid)) — ikke lazily forst
  // naar meta-panelet apnes, slik Kostnader/Inntekter gjor det. Dette
  // gjor "riktig standard fra gruppen" testbart direkte pa den nye
  // posten, uten et mellomsteg.
  const addItem = (gid,n,b,s) => {
    setSparingGroups(p=>p.map(g=>g.id!==gid?g:{
    ...g, items:[...g.items,{id:uid(),name:n,meta:defaultSparingMeta(gid),months:Array.from({length:12},(_,mi)=>({
      budget:mi===month?parseFloat(b)||0:0,
      spent: mi===month?parseFloat(s)||0:0
    }))}]
  }));
  };

  const delItem = (gid,iid) => setSparingGroups(p=>p.map(g=>g.id!==gid?g:{
    ...g, items:g.items.filter(it=>it.id!==iid)
  }));
  // v-post-rename: navn er valgfritt fjerde argument.
  const saveMeta = (gid,iid,meta,navn) => setSparingGroups(p=>p.map(g=>g.id!==gid?g:{
    ...g, items:g.items.map(it=>it.id!==iid?it:{...it,meta,...(navn!==undefined?{name:navn}:{})})
  }));

  function GRow({g}) {
    const gb=gBudget(g,month), gs=gSpent(g,month), over=isOver(gs,gb), open=expanded===g.id;
    return (
      <div>
        <Card onClick={()=>setExpanded(open?null:g.id)} accent={g.color}
          style={{cursor:"pointer",borderRadius:open?"11px 11px 0 0":11,
            marginBottom:open?0:undefined,borderBottom:open?"none":undefined,padding:"10px 14px"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <IBox emoji={SPARING_GROUP_EMOJI[g.id]||"💰"} color={g.color} size={34}/>
            <div style={{flex:1}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:5}}>
                <span style={{fontSize:13,fontWeight:600,color:P.ink}}>{g.label}</span>
                <div>
                  <span style={{fontSize:12,fontWeight:500,color:P.ink}}>{fmt(gs)}</span>
                  <span style={{fontSize:10.5,color:P.dust}}> / {fmt(gb)}</span>
                  {over && <span style={{marginLeft:4,fontSize:10,color:P.clay,fontWeight:600}}>↑</span>}
                </div>
              </div>
              <Bar value={gs} max={gb||1} color={g.color} h={3} over={over}/>
            </div>
            <Em e={open?"▴":"▾"} s={{color:P.dust,fontSize:13,marginLeft:6}}/>
          </div>
        </Card>
        {open && (
          <div style={{border:`1px solid ${P.border}`,borderTop:"none",borderRadius:"0 0 11px 11px",
            background:P.linen,padding:"6px 14px 12px",marginBottom:6}}>
            {g.items.length===0 ? (
              // Sparing skal støtte tom tilstand rolig og forstaaelig —
              // ingen feilmelding, ingen tomt-utseende tabellhode.
              <div style={{textAlign:"center",padding:"18px 8px",color:P.dust,fontSize:12}}>
                Ingen poster i «{g.label}» ennå. Legg til under.
              </div>
            ) : (
              g.items.map((it,idx) => {
                const mo = it.months&&it.months[month] ? it.months[month] : {budget:0,spent:0};
                const faktiskBelop = hentFaktiskForPost(actualTotals,it)!==undefined ? Math.round(hentFaktiskForPost(actualTotals,it)) : mo.spent;
                const o = isOver(faktiskBelop, mo.budget);
                return (
                  <div key={it.id} style={{padding:"7px 0",borderTop:idx>0?"1px solid "+P.border:"none"}}>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 68px 68px 30px",gap:5,alignItems:"center"}}>
                      <div onClick={()=>setMetaModal({item:it,groupId:g.id})} style={{cursor:"pointer",minWidth:0}}>
                        <div style={{fontSize:12,color:P.ink,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{it.name}</div>
                      </div>
                      <InlineNum key={"sp-b-"+it.id+"-"+month} value={mo.budget}
                        onChange={(v)=>updItem(g.id,it.id,"budget",v)}/>
                      <InlineNum key={"sp-s-"+it.id+"-"+month}
                        value={faktiskBelop}
                        onChange={(v)=>updItem(g.id,it.id,"spent",v)}
                        colorStyle={{color:o?P.clay:"inherit"}}/>
                      <button onClick={()=>delItem(g.id,it.id)}
                        style={{background:"none",border:"none",cursor:"pointer",color:P.dust,fontSize:12,padding:2,opacity:.5}}>🗑️</button>
                    </div>
                    {hentFaktiskForPost(actualTotals,it)!==undefined && (
                      <button onClick={()=>setDrillDown({post:it, postName:it.name})}
                        style={{background:"none",border:"none",cursor:"pointer",color:P.hazel,
                          fontSize:10.5,padding:"3px 0 0",textAlign:"left",display:"block"}}>
                        🔍 Vis hendelser bak dette tallet
                      </button>
                    )}
                  </div>
                );
              })
            )}
            <AddItemRow onAdd={(n,b,s)=>addItem(g.id,n,b,s)} color={g.color}/>
          </div>
        )}
      </div>
    );
  }

  return (
    <div style={{padding:"14px 14px 90px"}}>
      <SL>Sparing</SL>
      <MaanedsHeader month={month} setMonth={setMonth}/>
      {(sparingGroups||[]).map(g=><GRow key={g.id} g={g}/>)}
      {metaModal && (
        <SparingMetaModal
          item={metaModal.item}
          groupId={metaModal.groupId}
          onSave={saveMeta}
          onClose={()=>setMetaModal(null)}/>
      )}
      {drillDown && (
        <HendelseDrillDownModal
          tittel={"Hendelser — "+drillDown.postName}
          rader={finnHendelserForPost(hendelser, transaksjoner, receipts, drillDown.post, monthKey, gyldigeObservasjonIder)}
          onClose={()=>setDrillDown(null)}
          onVelgHendelse={(hendelseId)=>setKorrigerHendelseId(hendelseId)}
          onVelgKvittering={(receiptId)=>setKorrigerReceiptId(receiptId)}
        />
      )}
      {korrigerReceiptId && (() => {
        const receiptSomRedigeres = (receipts||[]).find(r=>r.id===korrigerReceiptId);
        if(!receiptSomRedigeres) return null;
        return (
          <Modal title={"Rediger kvittering — "+(receiptSomRedigeres.merchant||"(ukjent)")}
            onClose={()=>setKorrigerReceiptId(null)}>
            <KvitteringDetalj
              r={receiptSomRedigeres}
              alleMalPoster={alleMalPoster}
              onOppdaterKvittering={oppdaterKvitteringFraDrillDown}
              onClose={()=>setKorrigerReceiptId(null)}
              syncFeil={kvitteringSyncFeil&&kvitteringSyncFeil.id===korrigerReceiptId?kvitteringSyncFeil.melding:null}
            />
          </Modal>
        );
      })()}
      {korrigerHendelseId && (() => {
        const hendelseSomKorrigeres = (hendelser||[]).find(h=>h.id===korrigerHendelseId);
        if(!hendelseSomKorrigeres) return null;
        // v-post-rename: en manuell hendelse har ingen ekte
        // transaksjon aa slaa opp (transaksjonId er bevisst null) —
        // uten en "transaksjon" faller KorrigerHendelseModal sin
        // transRetning tilbake til "ut", som ville gitt feil fortegn
        // ved korrigering av en manuell INNTEKT. Bygger derfor en
        // syntetisk, minimal transaksjon KUN med riktig retning,
        // avledet fra hendelsens egen opprinnelige fordeling — ingen
        // ny fortegnslogikk, kun riktig inndata til den eksisterende.
        const transaksjonForKorrigering = hendelseSomKorrigeres.transaksjonId
          ? (transaksjoner||[]).find(t=>t.id===hendelseSomKorrigeres.transaksjonId)
          : hendelseSomKorrigeres.kilde==="manuell"
            ? {retning: (hendelseSomKorrigeres.fordelinger&&hendelseSomKorrigeres.fordelinger[0]&&hendelseSomKorrigeres.fordelinger[0].plasseringType==="income") ? "inn" : "ut"}
            : null;
        return (
          <KorrigerHendelseModal
            hendelse={hendelseSomKorrigeres}
            transaksjon={transaksjonForKorrigering}
            budgetGroups={budgetGroups}
            incomeGroups={incomeGroups}
            sparingGroups={sparingGroups}
            rules={rules}
            onLagre={(oppdatertHendelse, laerData)=>{
              setHendelser(prev=>{
                const uten = (prev||[]).filter(h=>h.id!==oppdatertHendelse.id);
                return [...uten, oppdatertHendelse];
              });
              if(laerData) {
                setRules(prev=>oppdaterReglerVedLaering(prev, laerData.transaksjon, laerData.post, false));
              }
              setKorrigerHendelseId(null);
              setDrillDown(null);
            }}
            onClose={()=>setKorrigerHendelseId(null)}
          />
        );
      })()}
    </div>
  );
}
