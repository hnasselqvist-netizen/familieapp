// DOMENESPRAAK — Fra transaksjoner til hendelser (v-post-rename)
// ══════════════════════════════════════════════════════════════════
//
// Dette er dokumentasjon, ikke logikk. Ingen av begrepene under
// eksisterer som egne kodeobjekter ennaa — "hendelse" er i dag et
// SPRAAKLIG konsept i brukergrensesnittet, ikke en datamodell.
// Selve koden bruker fortsatt "transaksjon"/"t"/"transaksjoner" som
// variabelnavn og Firebase-felt, uendret. Se etappe 1-4-leveransene
// og forvaltning-arkitekturanalyse.md for hvorfor dette er bevisst
// utsatt (§ laeringslogg).
//
//   BANK
//     ↓
//   Observasjon        (banken sin rapport: dato, belop, tekst, konto —
//                        det systemet MOTTAR, for noen har tolket det)
//     ↓
//   Hendelse           (det som faktisk skjedde i familiens liv:
//                        "jeg betalte strom", "lonnen kom", "jeg
//                        overforte penger" — det brukeren FORHOLDER SEG TIL)
//     ↓
//   Effekter
//     ├── Actual        (hva som faktisk ble brukt/tjent)
//     ├── Spillerom     (hva dette betyr for tilgjengelige penger)
//     ├── Budsjett      (hvordan dette stiller seg mot planen)
//     ├── Historikk     (at dette har skjedd, sporbart senere)
//     └── Læring        (at systemet blir bedre til aa kjenne dette igjen)
//
// ── Utviklerkommentar: Observasjon / Hendelse / Effekt ────────────
//
// Observasjon — det raa, upåvirkede innspillet fra en ekstern kilde
// (banken). En observasjon har ingen mening i seg selv utover "dette
// skjedde, med disse tallene". I dagens kode er dette i praksis raden
// slik den kommer fra CSV/Excel-importen, for noe er tolket.
//
// Hendelse — observasjonen etter at den har fatt en BETYDNING for
// familien. Samme observasjon kan noen ganger representere flere
// hendelser (splitt), og noen ganger er flere observasjoner samme
// hendelse (plan + kvittering + banktransaksjon). Hendelsen er det
// brukeren faktisk tar stilling til — ikke tallraden bak den.
//
// Effekt — det som skjer NAAR en hendelse er avklart: penger telles
// (Actual), tilgjengelig handlingsrom endres (Spillerom), budsjettet
// far et fasit-tall aa sammenligne mot, hendelsen blir sporbar
// (historikk), og systemet husker monsteret til neste gang (laering).
// En hendelse er ferdig nar effektene er reelle, ikke bare naar en
// knapp er trykket.
//

// Én tydelig konstant for OAuth Client ID — bytt her ved behov.
// Dette er offentlig klientkonfigurasjon (ikke en hemmelighet), men

const GOOGLE_DRIVE_CLIENT_ID = "1075494790067-p5v2co7p6u9gvo60sok7lffisvumn4j4.apps.googleusercontent.com";
const GOOGLE_DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";

// Token ligger KUN i minnet for denne modulen — aldri i Firebase eller
// localStorage. Forsvinner ved refresh; brukeren ma koble til pa nytt.
let _driveAccessToken = null;
let _driveTokenClient = null;
let _gapiClientLoaded = false;

// Laster gapi sin Drive-v3-klient. Kalles kun én gang (idempotent via
// _gapiClientLoaded-flagget). Bruker promise-mønster, ingen async/await.
function lastGapiDriveClient() {
  return new Promise(function(resolve, reject){
    if(_gapiClientLoaded) { resolve(); return; }
    if(typeof gapi === "undefined") { reject(new Error("gapi er ikke lastet")); return; }
    gapi.load("client", function(){
      gapi.client.init({}).then(function(){
        return gapi.client.load("https://www.googleapis.com/discovery/v1/apis/drive/v3/rest");
      }).then(function(){
        _gapiClientLoaded = true;
        resolve();
      }).catch(reject);
    });
  });
}

// Bygger (én gang) GIS sin token-klient. requestAccessToken() ma kalles
// fra en direkte brukerhandling (knappetrykk) — GIS krever dette, saerlig
// paa mobil der bakgrunns-popup/redirect ellers blokkeres.
function hentDriveTokenClient(paaToken, paaFeil) {
  if(_driveTokenClient) return _driveTokenClient;
  _driveTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_DRIVE_CLIENT_ID,
    scope: GOOGLE_DRIVE_SCOPE,
    callback: function(resp){
      if(resp && resp.access_token) {
        _driveAccessToken = resp.access_token;
        if(gapi && gapi.client) gapi.client.setToken({access_token: resp.access_token});
        paaToken(resp);
      } else {
        paaFeil(resp);
      }
    },
    error_callback: function(err){
      paaFeil(err);
    },
  });
  return _driveTokenClient;
}

// Fjerner tokenet fra appokten (kobler fra). Prover ogsaa aa be Google
// om aa revokere tokenet server-side, men appens egen "tilkoblet"-status
// avhenger kun av at _driveAccessToken settes til null lokalt.
function kobleFraDrive(callback) {
  if(_driveAccessToken && typeof google !== "undefined") {
    google.accounts.oauth2.revoke(_driveAccessToken, function(){
      _driveAccessToken = null;
      if(gapi && gapi.client) gapi.client.setToken(null);
      if(callback) callback();
    });
  } else {
    _driveAccessToken = null;
    if(gapi && gapi.client) gapi.client.setToken(null);
    if(callback) callback();
  }
}

// ── Finn eller opprett mappe i Google Drive ──────────────────────
// Ren hjelpefunksjon (kjenner Drive API, ikke UI eller Firebase direkte).
// Soker etter en mappe med gitt navn under gitt parent; oppretter den
// hvis den ikke finnes. Returnerer et Promise som gir mappe-id-en.
function finnEllerOpprettMappe(navn, parentId) {
  const q = "name='"+navn.replace(/'/g,"\\'")+"' and mimeType='application/vnd.google-apps.folder'"
    + (parentId ? " and '"+parentId+"' in parents" : " and 'root' in parents")
    + " and trashed=false";
  return gapi.client.drive.files.list({q: q, fields: "files(id, name)", pageSize: 1}).then(function(res){
    const treff = res.result.files;
    if(treff && treff.length>0) return treff[0].id;
    const metadata = {name: navn, mimeType: "application/vnd.google-apps.folder"};
    if(parentId) metadata.parents = [parentId];
    return gapi.client.drive.files.create({resource: metadata, fields: "id"}).then(function(res2){
      return res2.result.id;
    });
  });
}

// Bygger (finner/oppretter) hele stien Hverdagsflyt/Kvitteringer/{aar}/{maaned}
// og returnerer mappe-id-en for maaneden. Aar og maaned er strenger, f.eks.
// "2026" og "07".
function finnEllerOpprettKvitteringsmappe(aar, maaned) {
  return finnEllerOpprettMappe("Hverdagsflyt", null).then(function(hverdagsflytId){
    return finnEllerOpprettMappe("Kvitteringer", hverdagsflytId);
  }).then(function(kvitteringerId){
    return finnEllerOpprettMappe(aar, kvitteringerId);
  }).then(function(aarId){
    return finnEllerOpprettMappe(maaned, aarId);
  });
}

// Laster opp en bildefil (File/Blob) til riktig aar/maaned-mappe i Drive.
// Returnerer et Promise som gir {driveFileId, driveWebViewLink, driveFolderId}.
// Bruker kun promise-kjeder, ingen async/await.
function lastOppKvitteringsbilde(file, dato) {
  const d = dato ? new Date(dato) : new Date();
  const aar = String(d.getFullYear());
  const maaned = String(d.getMonth()+1).padStart(2,"0");
  return finnEllerOpprettKvitteringsmappe(aar, maaned).then(function(mappeId){
    const metadata = {name: file.name||("kvittering-"+Date.now()), parents:[mappeId]};
    const boundary = "-------familieapp"+Date.now();
    const reader = new FileReader();
    return new Promise(function(resolve, reject){
      reader.onload = function(){
        const base64Data = reader.result.split(",")[1];
        const body =
          "--"+boundary+"\r\n"+
          "Content-Type: application/json; charset=UTF-8\r\n\r\n"+
          JSON.stringify(metadata)+"\r\n"+
          "--"+boundary+"\r\n"+
          "Content-Type: "+(file.type||"image/jpeg")+"\r\n"+
          "Content-Transfer-Encoding: base64\r\n\r\n"+
          base64Data+"\r\n"+
          "--"+boundary+"--";
        gapi.client.request({
          path: "/upload/drive/v3/files",
          method: "POST",
          params: {uploadType: "multipart", fields: "id, webViewLink"},
          headers: {"Content-Type": "multipart/related; boundary="+boundary},
          body: body,
        }).then(function(res){
          resolve({
            driveFileId: res.result.id,
            driveWebViewLink: res.result.webViewLink,
            driveFolderId: mappeId,
          });
        }).catch(reject);
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  });
}


// ── Bredde-basert layout (Sprint 17a) ────────────────────────────
// Delt grunnmur for prinsippet "mobil utforer, web administrerer".
// Terskelen er bevisst breddebasert, ikke user-agent-basert — et smalt
// vindu paa en PC oppforer seg som "mobil", et bredt nettbrett oppforer
// seg som "web". Dette stemmer bedre med det egentlige prinsippet
// (arbeidsmodus/tilgjengelig plass) enn en fysisk enhetstype ville gjort.
// Ingen manuell overstyring i v1.
const LAYOUT_BREDDE_TERSKEL = 768;

function useErBred() {
  const [erBred, setErBred] = useState(
    typeof window!=="undefined" ? window.innerWidth>=LAYOUT_BREDDE_TERSKEL : true
  );
  React.useEffect(() => {
    const sjekk = () => setErBred(window.innerWidth>=LAYOUT_BREDDE_TERSKEL);
    window.addEventListener("resize", sjekk);
    return () => window.removeEventListener("resize", sjekk);
  }, []);
  return erBred;
}

// Utvidet versjon (Sprint 17-justering): tre soner i stedet for en enkel
// boolean, slik at administrasjonsflater kan gi et reelt mellomoppsett i
// tillegg til mobil/web, og faktisk utnytte bred skjerm i stedet for aa
// bare vise mobilinnholdet midt i et stort tomt vindu.
// "mobil" < 768, "mellom" 768–1199, "web" >= 1200.
const LAYOUT_SONER = {mobil:0, mellom:768, web:1200};

function useLayoutBredde() {
  const [bredde, setBredde] = useState(
    typeof window!=="undefined" ? window.innerWidth : 1024
  );
  React.useEffect(() => {
    const sjekk = () => setBredde(window.innerWidth);
    window.addEventListener("resize", sjekk);
    return () => window.removeEventListener("resize", sjekk);
  }, []);
  const sone = bredde>=LAYOUT_SONER.web ? "web" : bredde>=LAYOUT_SONER.mellom ? "mellom" : "mobil";
  return {bredde, sone, erMobil:sone==="mobil", erMellom:sone==="mellom", erWeb:sone==="web"};
}

};
const getMealType = (val) => {
  if(!val) return null;
  if(typeof val === "string") return "recipe";
  return val.type || "recipe";
};

// ── InlineNum — viser formatert tall, klikk for redigering ───────
function InlineNum({value, onChange, colorStyle, style}) {
  const [editing, setEditing] = React.useState(false);
  const [raw, setRaw] = React.useState(String(value||0));
  const fmtN = n => new Intl.NumberFormat("nb-NO",{maximumFractionDigits:0}).format(n||0);
  if(editing) {
    return (
      <input type="number" value={raw}
        autoFocus
        onFocus={e=>e.target.select()}
        onChange={e=>setRaw(e.target.value)}
        onBlur={()=>{onChange(raw);setEditing(false);}}
        onKeyDown={e=>{if(e.key==="Enter"){onChange(raw);setEditing(false);}}}
        enterKeyHint="done"
        style={{fontSize:11,textAlign:"right",background:P.sand,width:"100%",
          boxSizing:"border-box",...(style||{}),...(colorStyle||{})}}/>
    );
  }
  return (
    <span onClick={()=>{setRaw(String(value||0));setEditing(true);}}
      style={{fontSize:11,textAlign:"right",display:"block",cursor:"text",
        padding:"2px 4px",borderRadius:4,background:P.sand,
        fontVariantNumeric:"tabular-nums",...(style||{}),...(colorStyle||{})}}>
      {fmtN(value)}
    </span>
  );
}

// ── v-post-rename: summerBudgetDetails — REN FUNKSJON ────
// Eneste sted som summerer budgetDetails til en foreldrepost sine 12
// months. Ingen Firebase, ingen UI, ingen React-state. Alle steder
// som endrer en detalj (belop, kopier fremover, ny, slett) skal
// kalle DENNE for aa regne foreldrepostens months paa nytt — aldri
// duplisere summeringslogikken inline. Returnerer alltid en fersk
// 12-elements months-struktur ({budget}, ingen spent — budgetDetails
// er en ren planleggingsmekanisme, aldri en del av Actual).
function summerBudgetDetails(budgetDetails) {
  return Array.from({length:12}, (_,mi) =>
    ({budget: (budgetDetails||[]).reduce((s,d)=>s+((d.months&&d.months[mi]&&d.months[mi].budget)||0), 0)})
  );
}

// ── v-post-rename: aarsplan-modellen ─────────────────────
// FASIT: STRUKTUR (livsomraade/post-id/navn/meta/legacyIds) er
// aarsuavhengig og forblir eid av budgetGroups/incomeGroups/
// sparingGroups uendret. Kun PLANEN (months/budgetDetails) er
// aarsavhengig, lagret separat under annualBudgetPlans/{aar}/....
// CURRENT_BUDGET_YEAR er den ENESTE kontrakten resten av appen
// (Generator, Kostnader/Inntekter/Sparing driftsflater) trenger aa
// kjenne til — de skal ALDRI kobles til hvilket aar Helen tilfeldigvis
// har aapent i Aarsbudsjett sin UI-aarsvelger.
const CURRENT_BUDGET_YEAR = new Date().getFullYear();

// Ren funksjon. Konverterer RAA Firebase-data (samme raa-form som
// budget/incomeGroups/sparingGroups allerede lagres i, altsaa
// {groupId:{itemId:{months, meta, budgetDetails?, ...}}}) til den
// flate aarsplan-formen ({groupId:{itemId:{months, budgetDetails?}}})
// — plukker KUN ut de aarsavhengige planfeltene, aldri meta/navn/
// legacyIds. Ingen Firebase, ingen UI, ingen React-state.
function byggAarsplanFraEksisterende(raaFirebaseData) {
  const plan = {};
  Object.keys(raaFirebaseData||{}).forEach(gid=>{
    if(gid==="_gruppeplassholder") return;
    const gruppeData = raaFirebaseData[gid];
    if(!gruppeData) return;
    plan[gid] = {};
    Object.keys(gruppeData).forEach(iid=>{
      if(iid==="_gruppeplassholder") return;
      const fi = gruppeData[iid];
      if(!fi || !fi.months) return;
      const entry = {months: fi.months};
      if(fi.budgetDetails && fi.budgetDetails.length>0) entry.budgetDetails = fi.budgetDetails;
      plan[gid][iid] = entry;
    });
  });
  return plan;
}

// Ren funksjon. Bygger en TOM aarsplan (0 i alle 12 maaneder direkte
// paa postene) direkte fra dagens AKTIVE STRUKTUR — brukes naar et
// nytt aar aapnes forste gang og ingen plan finnes ennaa.
//
// v-post-rename: valgfri detaljkilde (samme flate
// aarsplan-form som ellers, {groupId:{itemId:{months,
// budgetDetails?}}}) — naar en post i kilden har budgetDetails,
// bygges TILSVARENDE detaljer i den nye, tomme planen med SAMME id og
// navn, men 0 i alle 12 maaneder. Ingen belop, ingen Actual, ingen
// andre felt kopieres — kun selve detalj-STRUKTUREN (id+navn+at
// posten bruker detaljniva). Post uten detaljer i kilden (eller uten
// kilde i det hele tatt, altsaa detaljkilde===undefined) faar en
// vanlig tom post, helt uendret fra tidligere.
function byggTomAarsplanFraStruktur(groups, detaljkilde) {
  const plan = {};
  (groups||[]).forEach(g=>{
    plan[g.id] = {};
    (g.items||[]).forEach(it=>{
      const entry = {months: Array.from({length:12},()=>({budget:0}))};
      const kildePost = detaljkilde && detaljkilde[g.id] && detaljkilde[g.id][it.id];
      if(kildePost && kildePost.budgetDetails && kildePost.budgetDetails.length>0) {
        entry.budgetDetails = kildePost.budgetDetails.map(d => ({
          id: d.id,
          name: d.name,
          months: Array.from({length:12},()=>({budget:0})),
        }));
      }
      plan[g.id][it.id] = entry;
    });
  });
  return plan;
}

// Ren funksjon. Konverterer "groups"-formen (samme form som
// budgetGroups/incomeGroups/sparingGroups selv) TILBAKE til den flate
// aarsplan-formen ({groupId:{itemId:{months,budgetDetails?}}}) —
// inversen av flettAarsplanMedStruktur. Brukes naar CURRENT_BUDGET_
// YEAR (som lever direkte i budgetGroups/incomeGroups, ikke i
// annualPlans) skal fungere som detaljkilde eller lagres som en
// aarsplan-skive.
function konverterGroupsTilFlatPlan(groups) {
  const plan = {};
  (groups||[]).forEach(g=>{
    plan[g.id] = {};
    (g.items||[]).forEach(it=>{
      const entry = {months: it.months};
      if(it.budgetDetails && it.budgetDetails.length>0) entry.budgetDetails = it.budgetDetails;
      plan[g.id][it.id] = entry;
    });
  });
  return plan;
}

// Ren funksjon. Finner AARET til den naermeste EKSISTERENDE, faktisk
// FOREGAAENDE aarsplanen for et maalaar — blant aarene som allerede
// finnes i annualPlans, PLUSS CURRENT_BUDGET_YEAR selv (siden dette
// aaret alltid regnes som tilgjengelig, levende kilde, sjoel om det
// ikke er lagret i annualPlans). Ikke hardkodet 2026->2027 — fungerer
// likt for 2028->2027, 2028->2026 (hvis 2027 mangler), osv. Returnerer
// null naar ingen tidligere aar finnes i det hele tatt.
function finnNaermesteForegaaendeAar(maalAar, annualPlans) {
  const kandidatAar = new Set([CURRENT_BUDGET_YEAR]);
  Object.keys(annualPlans||{}).forEach(k => {
    const aar = parseInt(k,10);
    if(!isNaN(aar)) kandidatAar.add(aar);
  });
  let naermeste = null;
  kandidatAar.forEach(aar => {
    if(aar < maalAar && (naermeste===null || aar>naermeste)) naermeste = aar;
  });
  return naermeste;
}

// Ren funksjon. Den guarderte "Hent manglende detaljer"-handlingen for
// en AARSPLAN SOM ALLEREDE FINNES: legger KUN til detalj-STRUKTUR
// (0x12, samme id/navn) paa poster som IKKE allerede har
// budgetDetails, men HAR det i kilden. Roerer ALDRI en post som
// allerede har budgetDetails (uansett innhold), og roerer ALDRI en
// eksisterende posts months. Poster uten detaljer noe sted forblir
// uendret (eksisterende eller ny tom post).
function hentManglendeDetaljerFraKilde(eksisterendePlan, groups, detaljkilde) {
  const nyPlan = {};
  (groups||[]).forEach(g=>{
    nyPlan[g.id] = {};
    (g.items||[]).forEach(it=>{
      const eksisterendePost = eksisterendePlan && eksisterendePlan[g.id] && eksisterendePlan[g.id][it.id];
      if(eksisterendePost && eksisterendePost.budgetDetails && eksisterendePost.budgetDetails.length>0) {
        nyPlan[g.id][it.id] = eksisterendePost; // har allerede detaljer -- ALDRI roert
        return;
      }
      const kildePost = detaljkilde && detaljkilde[g.id] && detaljkilde[g.id][it.id];
      if(kildePost && kildePost.budgetDetails && kildePost.budgetDetails.length>0) {
        nyPlan[g.id][it.id] = {
          months: (eksisterendePost && eksisterendePost.months) || Array.from({length:12},()=>({budget:0})),
          budgetDetails: kildePost.budgetDetails.map(d=>({id:d.id, name:d.name, months:Array.from({length:12},()=>({budget:0}))})),
        };
        return;
      }
      nyPlan[g.id][it.id] = eksisterendePost || {months: Array.from({length:12},()=>({budget:0}))};
    });
  });
  return nyPlan;
}

// Ren funksjon. Slaar sammen AARSUAVHENGIG struktur (id/name/meta/
// legacyIds fra groups) med en gitt aarsplan (months/budgetDetails) —
// returnerer SAMME form som groups selv, saa eksisterende UI-kode kan
// lese it.months/it.budgetDetails helt uendret uansett hvilket aar som
// faktisk vises. Post uten plan-data i aarsplanen faar 0x12 (ingen
// gjetting, aldri laant fra et annet aar).
function flettAarsplanMedStruktur(groups, arsplan) {
  const tomMaaneder = Array.from({length:12},()=>({budget:0}));
  return (groups||[]).map(g=>({
    ...g,
    items: (g.items||[]).map(it=>{
      const planPost = arsplan && arsplan[g.id] && arsplan[g.id][it.id];
      const oppdatert = {...it, months: planPost ? planPost.months : tomMaaneder};
      if(planPost && planPost.budgetDetails && planPost.budgetDetails.length>0) oppdatert.budgetDetails = planPost.budgetDetails;
      else delete oppdatert.budgetDetails;
      return oppdatert;
    }),
  }));
}

// ── Ukeberegning ──────────────────────────────────────────────────
function getWeekKey(date) {
  const d=new Date(date); d.setHours(0,0,0,0);
  d.setDate(d.getDate()+3-(d.getDay()+6)%7);
  const w1=new Date(d.getFullYear(),0,4);
  const wn=1+Math.round(((d-w1)/86400000-3+(w1.getDay()+6)%7)/7);
  return `${d.getFullYear()}-W${String(wn).padStart(2,"0")}`;
}
function getMondayOfWeek(wk) {
  const [yr,w]=wk.split("-W").map(Number);
  const j4=new Date(yr,0,4); const m=new Date(j4);
  m.setDate(j4.getDate()-(j4.getDay()+6)%7+(w-1)*7); return m;
}
function getDayDate(wk,di) { const m=getMondayOfWeek(wk); const d=new Date(m); d.setDate(m.getDate()+di); return d; }
function addWeeks(wk,n) { const m=getMondayOfWeek(wk); m.setDate(m.getDate()+n*7); return getWeekKey(m); }
function fmtShort(d) { return d.toLocaleDateString("nb-NO",{day:"numeric",month:"short"}); }

// Rent lesende. For hver post i planen: finn den i sin forventede
// kildegruppe i budgetGroups, OG hvor som helst i sparingGroups (ikke
// bare maalgruppen — fanger opp en tidligere, delvis/feilslaatt
// kjoring). Klassifiserer status per post og for hele operasjonen.
// post-id er den eneste koblingen dette bygger paa, som avtalt.
function diagnostiserSparePostFlytting(budgetGroups, sparingGroups) {
  const resultater = SPAREPOST_FLYTTEPLAN.map(plan => {
    const gammelGruppeObj = (budgetGroups||[]).find(g=>g.id===plan.gammelGruppe);
    const gammelPost = gammelGruppeObj ? (gammelGruppeObj.items||[]).find(it=>it.id===plan.id) : null;

    let nyPost = null, nyPostGruppeId = null;
    (sparingGroups||[]).forEach(g=>{
      const funnet = (g.items||[]).find(it=>it.id===plan.id);
      if(funnet) { nyPost = funnet; nyPostGruppeId = g.id; }
    });

    let status;
    if(gammelPost && nyPost) status = "konflikt";
    else if(gammelPost && !nyPost) status = "klar_til_flytting";
    else if(!gammelPost && nyPost) status = "allerede_flyttet";
    else status = "mangler_begge_steder";

    return {
      id: plan.id,
      navn: gammelPost ? gammelPost.name : (nyPost ? nyPost.name : plan.id),
      gammelGruppe: plan.gammelGruppe,
      nyGruppe: plan.nyGruppe,
      likviditet: plan.likviditet,
      eksisterendeEier: gammelPost ? ((gammelPost.meta&&gammelPost.meta.eier)||"Felles")
        : (nyPost ? ((nyPost.meta&&nyPost.meta.eier)||"Felles") : null),
      nyPostGruppeId,
      status,
    };
  });

  const konflikter = resultater.filter(r=>r.status==="konflikt");
  const manglende = resultater.filter(r=>r.status==="mangler_begge_steder");
  // Stopp hele operasjonen ved ETHVERT avvik — ingen delvis kjoring,
  // ingen gjetting. Bruker maa se og forsta situasjonen forst.
  const kanKjores = konflikter.length===0 && manglende.length===0;
  const alleredeFullfort = resultater.every(r=>r.status==="allerede_flyttet");

  return {resultater, konflikter, manglende, kanKjores, alleredeFullfort};
}

// Ren funksjon: bygger de OPPDATERTE budgetGroups/sparingGroups fra en
// bekreftet, kjorbar diagnose (kanKjores===true). Idempotent per
// konstruksjon — en post med status "allerede_flyttet" beroeres ikke
// i det hele tatt. Bevarer id/name/months uendret, og rekonstruerer
// meta eksplisitt fra det som fantes for, med likviditet satt til
// planens verdi — resten (eier/konto/automatisk/forfallsdag/kilde/
// paymentPattern) hentes fra den eksisterende posten, med samme
// standardverdier som defaultSparingMeta bruker der noe mangler.
function utforSparePostFlytting(budgetGroups, sparingGroups, diagnose) {
  let nyeBudgetGroups = (budgetGroups||[]).map(g=>({...g, items:[...g.items]}));
  let nyeSparingGroups = (sparingGroups||[]).map(g=>({...g, items:[...g.items]}));

  diagnose.resultater.forEach(r=>{
    if(r.status!=="klar_til_flytting") return; // allerede_flyttet -> idempotent no-op

    let flyttetPost = null;
    nyeBudgetGroups = nyeBudgetGroups.map(g=>{
      if(g.id!==r.gammelGruppe) return g;
      const post = g.items.find(it=>it.id===r.id);
      if(post) flyttetPost = post;
      return {...g, items: g.items.filter(it=>it.id!==r.id)};
    });
    if(!flyttetPost) return;

    const gammelMeta = flyttetPost.meta || {};
    const nyMeta = {
      eier: gammelMeta.eier || "Felles",
      likviditet: r.likviditet,
      konto: gammelMeta.konto || "Regninger",
      automatisk: !!gammelMeta.automatisk,
      forfallsdag: gammelMeta.forfallsdag || "",
      kilde: gammelMeta.kilde || "budsjett",
      paymentPattern: gammelMeta.paymentPattern || "monthly",
      arkivert: !!gammelMeta.arkivert,
    };

    nyeSparingGroups = nyeSparingGroups.map(g=>{
      if(g.id!==r.nyGruppe) return g;
      return {...g, items:[...g.items, {id:flyttetPost.id, name:flyttetPost.name, months:flyttetPost.months, meta:nyMeta}]};
    });
  });

  // Fjern "sparing"-gruppen fra budgetGroups naar den er tom.
  nyeBudgetGroups = nyeBudgetGroups.filter(g => !(g.id==="sparing" && g.items.length===0));

  return {nyeBudgetGroups, nyeSparingGroups};
}

// Rent lesende — bekrefter sluttilstanden mot de fem forste
// verifiseringspunktene (4,6,7,8 er strukturelle/testet ved bygging,
// ikke runtime-sjekkbare paa samme maate — se testrapporten).
function verifiserSparePostFlytting(budgetGroups, sparingGroups) {
  const idSet = new Set(SPAREPOST_FLYTTEPLAN.map(p=>p.id));

  const funnetISparingAntall = {};
  (sparingGroups||[]).forEach(g=>g.items.forEach(it=>{
    if(idSet.has(it.id)) funnetISparingAntall[it.id] = (funnetISparingAntall[it.id]||0)+1;
  }));
  const punkt1_noyaktigEnGangISparing = SPAREPOST_FLYTTEPLAN.every(p=>funnetISparingAntall[p.id]===1);

  const funnetIBudget = new Set();
  (budgetGroups||[]).forEach(g=>g.items.forEach(it=>{ if(idSet.has(it.id)) funnetIBudget.add(it.id); }));
  const punkt2_ingenIBudget = funnetIBudget.size===0;

  const punkt3_sparingGruppenBorte = !(budgetGroups||[]).some(g=>g.id==="sparing");

  const detaljer = SPAREPOST_FLYTTEPLAN.map(plan=>{
    let funnetGruppe = null, funnetPost = null;
    (sparingGroups||[]).forEach(g=>{
      const it = g.items.find(x=>x.id===plan.id);
      if(it) { funnetGruppe = g.id; funnetPost = it; }
    });
    return {
      id: plan.id,
      riktigGruppe: funnetGruppe===plan.nyGruppe,
      riktigLikviditet: !!(funnetPost && funnetPost.meta && funnetPost.meta.likviditet===plan.likviditet),
    };
  });
  const punkt5_riktigGruppeOgLikviditet = detaljer.every(d=>d.riktigGruppe && d.riktigLikviditet);

  return {
    punkt1_noyaktigEnGangISparing, punkt2_ingenIBudget, punkt3_sparingGruppenBorte,
    punkt5_riktigGruppeOgLikviditet, detaljer,
    alleOk: punkt1_noyaktigEnGangISparing && punkt2_ingenIBudget && punkt3_sparingGruppenBorte && punkt5_riktigGruppeOgLikviditet,
  };
}

// Rent lesende. For hvert planoppforsel: finn hvilke av de spesifiserte
// kildene som faktisk finnes (i sin forventede gamle gruppe), og om
// maalposten allerede finnes i sin nye gruppe MED SITT NYE NAVN. Navnet
// er det avgjorende signalet for "ferdig" — id+gruppe alene er IKKE
// nok, siden en overlevende kildepost bevisst gjenbruker samme id og
// ofte samme gruppe som maalet.
//
// v-post-rename: en post regnes na som "klar
// til flytting" (sammenslaaing) uavhengig av om maalet ALLEREDE har
// faatt sitt endelige navn fra tidligere — t.d. hvis brukeren manuelt
// har omdopt en post via den ordinaere redigerings-UI-en for noensinne
// aa kjore dette verktoyet. "Andre kilder" (alt funnet utenom selve
// maal-identiteten id+gruppe) beregnes derfor UAVHENGIG av om maalet
// allerede er ferdig navngitt — de representerer uansett bare
// gjenstaaende absorberingsarbeid, aldri en risiko. Dette er trygt
// FORDI funnetKilder/andreKilder utelukkende kan inneholde poster som
// er EKSPLISITT oppfort i akkurat denne planoppforselens plan.kilder —
// aldri en tilfeldig, urelatert post et sted i strukturen. Det finnes
// derfor strukturelt ingen "reell konflikt" igjen aa blokkere paa i
// denne modellen — enhver post som noensinne kan havne i andreKilder
// er per konstruksjon en identifisert, forventet kilde.
function diagnostiserKostnadFlytting(budgetGroups) {
  const resultater = KOSTNAD_FLYTTEPLAN.map(plan => {
    const nyGruppeObj = (budgetGroups||[]).find(g=>g.id===plan.nyGruppe);
    const nyPostFunnet = nyGruppeObj ? (nyGruppeObj.items||[]).find(it=>it.id===plan.nyId) : null;
    const navnErKorrekt = !!(nyPostFunnet && nyPostFunnet.name===plan.navn);

    const funnetKilder = plan.kilder.map(k => {
      const gruppeObj = (budgetGroups||[]).find(g=>g.id===k.gruppe);
      const post = gruppeObj ? (gruppeObj.items||[]).find(it=>it.id===k.id) : null;
      return post ? {...k, post} : null;
    }).filter(Boolean);
    // Hvis maalposten allerede finnes, men IKKE selv er oppfort som en
    // av sine egne kilder i planen (gjelder ALLE helt nye maalposter
    // uten gammel motpart, t.d. "service_vedlikehold", "kino_pub",
    // "avlastning" — de har aldri seg selv i kilder-lista siden de
    // ikke fantes fra for) — inkluder den likevel som en implisitt
    // kilde. Uten dette ville eventuelt eksisterende budsjett/meta paa
    // maalposten ALDRI bli tatt med i summeringen, og selve
    // sammenslaaingssteget i utforKostnadFlytting ville i tillegg
    // stille hoppe over aa oppdatere posten i det hele tatt (siden den
    // "allerede finnes") — reelt tap av data for akkurat denne typen
    // planoppforsel.
    if(nyPostFunnet && !funnetKilder.some(k=>k.id===plan.nyId && k.gruppe===plan.nyGruppe)) {
      funnetKilder.push({id:plan.nyId, gruppe:plan.nyGruppe, post:nyPostFunnet});
    }
    // Alt utenom selve maal-identiteten (id+gruppe lik maalets) — de
    // som fortsatt trenger aa absorberes. Uavhengig av om maalet selv
    // allerede har faatt sitt nye navn eller ikke.
    const andreKilder = funnetKilder.filter(k =>
      !(k.id===plan.nyId && k.gruppe===plan.nyGruppe)
    );
    const erFerdig = navnErKorrekt && andreKilder.length===0;

    let status;
    if(plan.kilder.length===0) {
      status = nyPostFunnet ? "allerede_flyttet" : "ny_post_opprettes";
    } else if(erFerdig) {
      status = "allerede_flyttet";
    } else if(funnetKilder.length>0) {
      // Daekker baade "helt uberort, ingenting flyttet ennaa" OG
      // "maalet er allerede korrekt navngitt, men en eller flere av de
      // eksplisitt planlagte kildene star fortsatt separat" — begge er
      // trygge, idempotente handlinger for utforKostnadFlytting.
      status = "klar_til_flytting";
    } else if(plan.opprettTomHvisMangler) {
      // v-post-rename: eksplisitt, per-planoppforsel
      // unntak — KUN de faa oppforslene som er LIVE-verifisert aa
      // mangle baade gammel kilde og maalpost faar dette flagget satt
      // i selve KOSTNAD_FLYTTEPLAN (se der). Dette er bevisst IKKE en
      // generell regel: uten flagget forblir "mangler_begge_steder"
      // eksakt som for — sikkerhetsnettet er uendret for alle andre
      // planoppforsler.
      status = "ny_post_opprettes";
    } else {
      status = "mangler_begge_steder";
    }

    return {
      nyId: plan.nyId, nyGruppe: plan.nyGruppe, navn: plan.navn,
      kilder: plan.kilder, funnetKilder, andreKilder, nyPostFunnet, status,
    };
  });

  // Ingen blokkerende "konflikt"-status finnes lenger strukturelt i
  // denne modellen (se begrunnelse i kommentaren over) — feltet
  // beholdes tomt, ikke fjernet, for UI-kompatibilitet.
  const konflikter = [];
  const uavklarte  = resultater.filter(r=>r.status==="mangler_begge_steder");
  const kanKjores = true;
  const alleredeFullfort = resultater.every(r=>r.status==="allerede_flyttet");

  // Uidentifiserte poster — eksisterende kostnadsposter som verken er
  // en kjent kilde i noen planoppforsel eller allerede en gyldig
  // maalpost. Rent informativt, absorberer/flytter ALDRI noe — surrer
  // kun opp poster (som Hårprodukter, Familieaktiviteter, Leiefilm,
  // NAF, osv.) med sin FAKTISKE id, saa de kan legges inn i planen med
  // riktig id i en fremtidig runde, i stedet for aa forsvinne stille.
  const kjenteKildeIder = new Set(KOSTNAD_FLYTTEPLAN.flatMap(p=>p.kilder.map(k=>k.id)));
  const gyldigeMaalIder = new Set(KOSTNAD_FLYTTEPLAN.map(p=>p.nyId));
  const uidentifiserte = [];
  (budgetGroups||[]).forEach(g=>{
    (g.items||[]).forEach(it=>{
      if(kjenteKildeIder.has(it.id) || gyldigeMaalIder.has(it.id)) return;
      uidentifiserte.push({id:it.id, navn:it.name, gruppe:g.id});
    });
  });

  return {resultater, konflikter, uavklarte, kanKjores, alleredeFullfort, uidentifiserte};
}

// Ren funksjon: bygger OPPDATERTE budgetGroups fra en diagnose. For
// sammenslaatte poster: summerer months (budget+budget, spent+spent)
// per maaned pa tvers av alle funnede kilder, og slaar sammen meta —
// basisen er kildeposten hvis id er lik r.nyId (den planlagt
// overlevende), med manglende felt fylt inn fra de ovrige kildenes
// meta. Idempotent: en post med status "allerede_flyttet" eller
// "mangler_begge_steder" roeres ikke i det hele tatt.
function utforKostnadFlytting(budgetGroups, diagnose) {
  let nyeGrupper = (budgetGroups||[]).map(g=>({...g, items:[...g.items]}));

  // Sikre at ALLE maalgrupper faktisk finnes, OG at de har korrekt
  // type/label/farge fra BUDGET_TEMPLATE — bade helt nye livsomraader
  // ("hverdagsgleder", "gaver", "ovrige", "hanggliding") som ikke
  // fantes fra for, OG eksisterende grupper som overlever under samme
  // id (t.d. "bolig", "helse") men som i sin gamle form ikke hadde et
  // "type"-felt i det hele tatt. Uten dette ville standard/familie-
  // egenskapen mangle paa alle videreforte grupper etter flytting.
  const alleMaalGruppeIder = [...new Set(KOSTNAD_FLYTTEPLAN.map(p=>p.nyGruppe))];
  alleMaalGruppeIder.forEach(gid => {
    const malGruppe = BUDGET_TEMPLATE.find(g=>g.id===gid);
    const eksisterende = nyeGrupper.find(g=>g.id===gid);
    if(!eksisterende) {
      nyeGrupper.push({
        id: gid,
        label: malGruppe ? malGruppe.label : gid,
        color: malGruppe ? malGruppe.color : P.stone,
        type: malGruppe ? malGruppe.type : "standard",
        items: [],
      });
    } else if(malGruppe) {
      nyeGrupper = nyeGrupper.map(g => g.id!==gid ? g : {
        ...g, label: malGruppe.label, color: malGruppe.color, type: malGruppe.type,
      });
    }
  });

  diagnose.resultater.forEach(r=>{
    if(r.status==="ny_post_opprettes") {
      nyeGrupper = nyeGrupper.map(g=>{
        if(g.id!==r.nyGruppe) return g;
        if(g.items.some(it=>it.id===r.nyId)) return g;
        const nyPost = {id:r.nyId, name:r.navn, months:Array.from({length:12},()=>({budget:0,spent:0})), meta:null};
        return {...g, items:[...g.items, nyPost]};
      });
      return;
    }
    if(r.status!=="klar_til_flytting") return;

    const summerteMoneder = Array.from({length:12}, (_,mi) => {
      let budget=0, spent=0;
      r.funnetKilder.forEach(k=>{
        const mo = k.post.months && k.post.months[mi];
        if(mo) { budget += (mo.budget||0); spent += (mo.spent||0); }
      });
      return {budget, spent};
    });

    const basis = r.funnetKilder.find(k=>k.id===r.nyId) || r.funnetKilder[0];
    let sammenslattMeta = basis.post.meta ? {...basis.post.meta} : null;
    r.funnetKilder.forEach(k=>{
      if(k.id===basis.id || !k.post.meta) return;
      if(!sammenslattMeta) sammenslattMeta = {};
      Object.keys(k.post.meta).forEach(felt=>{
        const mangler = sammenslattMeta[felt]===undefined || sammenslattMeta[felt]===null || sammenslattMeta[felt]==="";
        if(mangler) sammenslattMeta[felt] = k.post.meta[felt];
      });
    });

    // legacyIds: alle absorberte gamle id-er UNNTATT den aktive id-en
    // selv. Eksisterende legacyIds (fra en tidligere, delvis kjoring)
    // bevares og slaas sammen uten duplikater — aldri overskrevet.
    // Rene 1:1-flyttinger (ingen sammenslaaing) faar ingen legacyIds-
    // felt i det hele tatt.
    const absorberteIder = r.funnetKilder.map(k=>k.id).filter(id=>id!==r.nyId);
    const eksisterendeLegacyIds = basis.post.legacyIds || [];
    const nyeLegacyIds = [...new Set([...eksisterendeLegacyIds, ...absorberteIder])];

    const nyPost = {id:r.nyId, name:r.navn, months:summerteMoneder, meta:sammenslattMeta};
    if(nyeLegacyIds.length>0) nyPost.legacyIds = nyeLegacyIds;

    const kildeIder = new Set(r.funnetKilder.map(k=>k.id));
    nyeGrupper = nyeGrupper.map(g=>{
      const filtrert = g.items.filter(it=>!kildeIder.has(it.id));
      return filtrert.length!==g.items.length ? {...g, items:filtrert} : g;
    });
    nyeGrupper = nyeGrupper.map(g=>{
      if(g.id!==r.nyGruppe) return g;
      if(g.items.some(it=>it.id===r.nyId)) return g;
      return {...g, items:[...g.items, nyPost]};
    });
  });

  // Fjern gamle grupper som ikke lenger har noen rolle i den nye
  // strukturen, naar de er tomme.
  const nyeGruppeIder = new Set(KOSTNAD_FLYTTEPLAN.map(p=>p.nyGruppe));
  nyeGrupper = nyeGrupper.filter(g => nyeGruppeIder.has(g.id) || g.items.length>0);

  return nyeGrupper;
}

// Rent lesende — bekrefter sluttilstanden.
// v-post-rename-fiks: verifiseringen tar na imot diagnosen fra
// SELVE FLYTTINGEN (eller en fersk diagnose kjort forut for den) som
// andre, valgfritt argument. Diagnosen — ikke den statiske planen —
// er sannheten om hvilke kilder som FAKTISK fantes og ble absorbert.
// En planlagt kilde som aldri fantes i live-data (t.d. seks planlagte
// forsikringsselskaper, men kun fem faktisk i Firebase) skal aldri
// kunne gjore verifiseringen falskt negativ.
//
// Uten en diagnose (verifisering kjort helt frittstaaende, uten at
// "Forhaandsvis"/"Kjor flytting" er kjort i samme okt) kan vi ikke
// vite hvilke kilder som opprinnelig fantes — da faller sjekken
// bevisst tilbake til KUN egenkonsistens (ingen duplikater, aktiv id
// ikke i legacyIds), uten aa kreve fullstendighet mot noe vi ikke kan
// bekrefte. Dette svekker ikke kontrollen i normal bruk (verktoyet
// bevarer alltid diagnosen fra siste flytting), kun i det uunngaaelige
// tilfellet der ingen diagnose i det hele tatt er tilgjengelig.
function verifiserKostnadFlytting(budgetGroups, diagnose) {
  const alleNyeIder = new Set(KOSTNAD_FLYTTEPLAN.map(p=>p.nyId));
  const detaljer = KOSTNAD_FLYTTEPLAN.map(plan => {
    const gruppeObj = (budgetGroups||[]).find(g=>g.id===plan.nyGruppe);
    const post = gruppeObj ? (gruppeObj.items||[]).find(it=>it.id===plan.nyId) : null;

    const diagnoseEntry = diagnose
      ? diagnose.resultater.find(r=>r.nyId===plan.nyId && r.nyGruppe===plan.nyGruppe)
      : null;
    // Faktisk absorberte, ikke-overlevende kilder — fra DENNE
    // diagnosen naar tilgjengelig. NB: brukes na KUN til
    // "levninger"-sjekken under, IKKE lenger til aa avgjore om
    // legacyIds er komplett — se begrunnelse ved legacyIdsKorrekt.
    const faktiskAbsorberte = diagnoseEntry
      ? diagnoseEntry.funnetKilder.map(k=>k.id).filter(id=>id!==plan.nyId)
      : null;

    // "Gjenstaar noen absorberte kilder fortsatt et sted" sjekkes mot
    // det vi faktisk VET ble absorbert (denne diagnosen) naar
    // tilgjengelig, ellers mot hele den statiske planen som et
    // konservativt sikkerhetsnett.
    const idERaSomIkkeSkalGjenstaa = faktiskAbsorberte
      || plan.kilder.filter(k=>k.id!==plan.nyId).map(k=>k.id);
    const noenAbsorberteGjenstaar = (budgetGroups||[]).some(g=>
      g.items.some(it=>idERaSomIkkeSkalGjenstaa.includes(it.id))
    );

    // legacyIds — REDESIGNET (v-post-rename) for aa vaere
    // korrekt paa tvers av FLERE migreringskjoringer, ikke bare den
    // siste. Et eksakt-treff-krav mot KUN denne rundens diagnose ville
    // feilaktig underkjenne en post som allerede hadde legacyIds fra
    // en TIDLIGERE, delvis kjoring (t.d. "hypopressive" absorbert for
    // to runder siden, ikke lenger separat funnet NA, men fortsatt
    // korrekt liggende i legacyIds) — siden dagens diagnose ikke lenger
    // "finner" den kilden separat. Kontrollen er derfor na uavhengig av
    // om en diagnose i det hele tatt er gitt:
    // 1) ingen duplikater
    // 2) aktiv id aldri med i egen legacyIds
    // 3) INGEN legacyId kan vaere noe som ikke er en av planens EGNE
    //    deklarerte kilder (hindrer feilplasserte/tilfeldige id-er)
    // 4) enhver deklarert, ikke-overlevende kilde som IKKE lenger
    //    finnes separat noe sted i budgetGroups MA ligge i legacyIds —
    //    ellers er den stille tapt fra sporing, uansett hvilken runde
    //    den ble absorbert i.
    let legacyIdsKorrekt = true;
    if(post) {
      const faktiske = post.legacyIds || [];
      const ingenDuplikater = new Set(faktiske).size === faktiske.length;
      const aktivIdIkkeMed = !faktiske.includes(plan.nyId);
      const deklarerteIkkeOverlevende = plan.kilder.filter(k=>k.id!==plan.nyId).map(k=>k.id);
      const ingenUdeklarerte = faktiske.every(id=>deklarerteIkkeOverlevende.includes(id));
      // v-post-rename: en post opprettet TOM via
      // opprettTomHvisMangler har ALDRI absorbert noe i det hele tatt
      // (det var jo nettopp derfor den ble opprettet tom) — dens
      // deklarerte kilder fantes aldri, saa det finnes ingenting aa
      // "spore" i legacyIds. Uten dette unntaket ville verifiseringen
      // feilaktig kreve sporing av kilder som aldri eksisterte.
      // Unntaket er strengt smalt: krever BADE det eksplisitte
      // planflagget OG at legacyIds faktisk er tom — saa snart posten
      // en gang faktisk absorberer noe (en senere kjoring finner en av
      // kildene), gjelder den vanlige, fulle kontrollen igjen.
      const erTomOpprettetUtenAbsorbering = !!plan.opprettTomHvisMangler && faktiske.length===0;
      const alleTapteErSporet = erTomOpprettetUtenAbsorbering || deklarerteIkkeOverlevende.every(id => {
        const finnesFortsattSeparat = (budgetGroups||[]).some(g=>g.items.some(it=>it.id===id));
        return finnesFortsattSeparat || faktiske.includes(id);
      });
      legacyIdsKorrekt = ingenDuplikater && aktivIdIkkeMed && ingenUdeklarerte && alleTapteErSporet;
    }

    // months summert korrekt — kun sjekkbart naar diagnosen (med
    // FORUT-FOR-migrering months-data per kilde) faktisk er gitt.
    // Uten diagnose kan dette ikke uavhengig bekreftes — behandles da
    // som "ikke motbevist", ikke som en feil.
    let monthsKorrekt = true;
    if(post && diagnoseEntry && diagnoseEntry.funnetKilder.length>0) {
      const forventet = Array.from({length:12}, (_,mi) => {
        let budget=0, spent=0;
        diagnoseEntry.funnetKilder.forEach(k=>{
          const mo = k.post.months && k.post.months[mi];
          if(mo) { budget += (mo.budget||0); spent += (mo.spent||0); }
        });
        return {budget, spent};
      });
      monthsKorrekt = post.months && post.months.length===12 &&
        forventet.every((f,mi) => post.months[mi] &&
          post.months[mi].budget===f.budget && post.months[mi].spent===f.spent);
    }

    return {
      nyId: plan.nyId, navn: plan.navn,
      finnesIRiktigGruppe: !!post,
      ingenAbsorberteKilderGjenstaar: !noenAbsorberteGjenstaar,
      legacyIdsKorrekt,
      monthsKorrekt,
    };
  });
  const gamleGrupperBorte = ["klar","hjem","ferie","diverse"].every(gid => !(budgetGroups||[]).some(g=>g.id===gid));

  // A. Alle forventede livsomraader (avledet fra BUDGET_TEMPLATE) finnes.
  const forventedeGrupper = BUDGET_TEMPLATE.map(g=>({id:g.id, type:g.type}));
  const alleLivsomraaderFinnes = forventedeGrupper.every(fg => (budgetGroups||[]).some(g=>g.id===fg.id));

  // B. Standard/familie-type er korrekt. Antallene under er avledet av
  // BUDGET_TEMPLATE, aldri hardkodet — endres BUDGET_TEMPLATE (t.d.
  // et nytt livsomraade lagt til), folger disse automatisk med.
  const typeKorrekt = forventedeGrupper.every(fg => {
    const g = (budgetGroups||[]).find(x=>x.id===fg.id);
    return g && g.type===fg.type;
  });
  const antallStandard = forventedeGrupper.filter(fg=>fg.type==="standard").length;
  const antallFamilie  = forventedeGrupper.filter(fg=>fg.type==="familie").length;

  const alleOk = detaljer.every(d=>d.finnesIRiktigGruppe && d.ingenAbsorberteKilderGjenstaar && d.legacyIdsKorrekt && d.monthsKorrekt)
    && gamleGrupperBorte && alleLivsomraaderFinnes && typeKorrekt;
  return {detaljer, gamleGrupperBorte, alleLivsomraaderFinnes, typeKorrekt, antallStandard, antallFamilie, alleOk};
}

// ── Del 3, v-post-rename: legacyIds-recovery fra backup ──
// Ren funksjon. Bruker BACKUPEN (tatt for forste live-migrering) som
// eneste autoritative kilde til hvilke gamle kilder som faktisk
// eksisterte — IKKE en antakelse om at alt i KOSTNAD_FLYTTEPLAN noyaktig
// fantes. Ruerer ALDRI months/meta/budget/spent. Gjenoppretter ALDRI
// gamle poster. Bevarer og slaar sammen eksisterende legacyIds uten
// duplikater. Poster som ikke er en kjent maalpost i planen roeres ikke.
function rekonstruerLegacyIdsFraBackup(budgetGroups, backupBudgetGroups) {
  const backupGrupper = Array.isArray(backupBudgetGroups)
    ? backupBudgetGroups
    : Object.values(backupBudgetGroups||{});
  const fantesIBackup = (id, gruppeId) => {
    const g = backupGrupper.find(bg=>bg.id===gruppeId);
    if(!g) return false;
    const items = Array.isArray(g.items) ? g.items : Object.values(g.items||{});
    return items.some(it=>it && it.id===id);
  };

  return (budgetGroups||[]).map(g => ({
    ...g,
    items: (g.items||[]).map(it => {
      const plan = KOSTNAD_FLYTTEPLAN.find(p=>p.nyId===it.id && p.nyGruppe===g.id);
      if(!plan) return it; // ikke en kjent maalpost i planen -- urort

      const bekreftedeAbsorberte = plan.kilder
        .filter(k=>k.id!==plan.nyId)
        .filter(k=>fantesIBackup(k.id, k.gruppe))
        .map(k=>k.id);
      if(bekreftedeAbsorberte.length===0) return it; // ingenting nytt aa rekonstruere

      const eksisterende = it.legacyIds || [];
      const nyeLegacyIds = [...new Set([...eksisterende, ...bekreftedeAbsorberte])];
      if(nyeLegacyIds.length===eksisterende.length &&
         nyeLegacyIds.every(id=>eksisterende.includes(id))) return it; // uendret

      return {...it, legacyIds: nyeLegacyIds};
    }),
  }));
}

// ── v-personlig-flytting: guardet, backup-basert flytting av
// helen_klar/eivind_klar fra Diverse til nytt Personlig/Klær og sko.
// To rene funksjoner, samme preview-forst-prinsipp som resten av
// Kostnadsstruktur v2-verktoyet. ALDRI en generell regel — kun disse
// to kjente, navngitte gamle post-id-ene.
//
// diagnostiserPersonligFlytting: bekrefter guards, avgjor om months
// trygt kan splittes ut fra dagens div_felles (kun hvis dagens
// div_felles.months noyaktig kan forklares som summen av backupens
// opprinnelige kilder — inkludert helen_klar/eivind_klar — for HVER
// eneste maaned; ett eneste avvik blokkerer HELE months-splitten,
// men aldri selve id-/strukturflyttingen, som er trygg uavhengig av
// beloep).
function diagnostiserPersonligFlytting(budgetGroups, backupBudgetGroups) {
  const backupGrupper = Array.isArray(backupBudgetGroups)
    ? backupBudgetGroups : Object.values(backupBudgetGroups||{});
  const finnIBackup = (gruppeId, postId) => {
    const g = backupGrupper.find(bg=>bg.id===gruppeId);
    if(!g) return null;
    const items = Array.isArray(g.items) ? g.items : Object.values(g.items||{});
    return items.find(it=>it && it.id===postId) || null;
  };

  const backupHelenKlar  = finnIBackup("klar", "helen_klar");
  const backupEivindKlar = finnIBackup("klar", "eivind_klar");
  const backupFinnesBegge = !!backupHelenKlar && !!backupEivindKlar;

  const diverseGruppe  = (budgetGroups||[]).find(g=>g.id==="ovrige");
  const divFellesPost  = diverseGruppe ? (diverseGruppe.items||[]).find(it=>it.id==="div_felles") : null;
  const divFellesHarBeggeLegacyIds = !!divFellesPost
    && (divFellesPost.legacyIds||[]).includes("helen_klar")
    && (divFellesPost.legacyIds||[]).includes("eivind_klar");

  const personligGruppe    = (budgetGroups||[]).find(g=>g.id==="personlig");
  const klarVoksnePost     = personligGruppe ? (personligGruppe.items||[]).find(it=>it.id==="klar_voksne") : null;
  const personligUtstyrPost= personligGruppe ? (personligGruppe.items||[]).find(it=>it.id==="personlig_utstyr") : null;

  const alleredeUtfort = !!klarVoksnePost
    && (klarVoksnePost.legacyIds||[]).includes("helen_klar")
    && (klarVoksnePost.legacyIds||[]).includes("eivind_klar")
    && (!divFellesPost || !(divFellesPost.legacyIds||[]).includes("helen_klar"));

  // Months-splitt-guard: kun relevant naar begge gamle poster faktisk
  // finnes i backupen OG div_felles finnes i dagens struktur.
  let monthsSplitTrygt = false;
  let monthsAvvik = [];
  let forventedeKlarVoksneMonths = null;
  if(backupFinnesBegge && divFellesPost) {
    forventedeKlarVoksneMonths = Array.from({length:12}, (_,mi) => ({
      budget: ((backupHelenKlar.months&&backupHelenKlar.months[mi]?backupHelenKlar.months[mi].budget:0)||0)
            + ((backupEivindKlar.months&&backupEivindKlar.months[mi]?backupEivindKlar.months[mi].budget:0)||0),
      spent: ((backupHelenKlar.months&&backupHelenKlar.months[mi]?backupHelenKlar.months[mi].spent:0)||0)
           + ((backupEivindKlar.months&&backupEivindKlar.months[mi]?backupEivindKlar.months[mi].spent:0)||0),
    }));

    const diverseGammelGruppe = backupGrupper.find(bg=>bg.id==="diverse");
    const diverseItemsBackup = diverseGammelGruppe
      ? (Array.isArray(diverseGammelGruppe.items) ? diverseGammelGruppe.items : Object.values(diverseGammelGruppe.items||{}))
      : [];
    const KILDER_FOR_DIV_FELLES = ["div_eivind","div_helen","div_felles","gebyrer"];

    monthsSplitTrygt = true;
    for(let mi=0; mi<12; mi++) {
      let forventetBudget=0, forventetSpent=0;
      KILDER_FOR_DIV_FELLES.forEach(id=>{
        const item = diverseItemsBackup.find(it=>it && it.id===id);
        if(item && item.months && item.months[mi]) {
          forventetBudget += item.months[mi].budget||0;
          forventetSpent  += item.months[mi].spent||0;
        }
      });
      forventetBudget += forventedeKlarVoksneMonths[mi].budget;
      forventetSpent  += forventedeKlarVoksneMonths[mi].spent;
      const faktiskBudget = (divFellesPost.months&&divFellesPost.months[mi]?divFellesPost.months[mi].budget:0)||0;
      const faktiskSpent  = (divFellesPost.months&&divFellesPost.months[mi]?divFellesPost.months[mi].spent:0)||0;
      if(faktiskBudget!==forventetBudget || faktiskSpent!==forventetSpent) {
        monthsSplitTrygt = false;
        monthsAvvik.push({maaned:mi, forventetBudget, faktiskBudget, forventetSpent, faktiskSpent});
      }
    }
  }

  return {
    backupFinnesBegge, divFellesHarBeggeLegacyIds, alleredeUtfort,
    personligGruppeFinnes: !!personligGruppe,
    klarVoksnePostFinnes: !!klarVoksnePost,
    personligUtstyrPostFinnes: !!personligUtstyrPost,
    monthsSplitTrygt, monthsAvvik, forventedeKlarVoksneMonths,
    kanKjores: backupFinnesBegge && (alleredeUtfort || divFellesHarBeggeLegacyIds),
  };
}

// utforPersonligFlytting: utforer selve flyttingen basert paa en
// diagnose fra funksjonen over. Idempotent — allerede utfort-tilstand
// gir INGEN endring. Roerer ALDRI historiske hendelser eller
// plasseringId der. Splitter months KUN naar diagnosen bekrefter det
// er trygt; ellers opprettes klar_voksne med 0 i alle maaneder og
// div_felles sine belop star helt urort (kun legacyIds flyttes).
function utforPersonligFlytting(budgetGroups, diagnose) {
  if(diagnose.alleredeUtfort) {
    return {budgetGroups, endret:false, monthsSplittet:false, blokkert:false};
  }
  if(!diagnose.kanKjores) {
    return {budgetGroups, endret:false, monthsSplittet:false, blokkert:true};
  }

  const skalSplitteMonths = diagnose.monthsSplitTrygt;
  let nyeGrupper = (budgetGroups||[]).map(g=>({...g, items:(g.items||[]).map(it=>({...it}))}));

  if(!nyeGrupper.some(g=>g.id==="personlig")) {
    const mal = BUDGET_TEMPLATE.find(g=>g.id==="personlig");
    nyeGrupper.push({id:"personlig", label:mal.label, color:mal.color, type:mal.type, items:[]});
  }

  nyeGrupper = nyeGrupper.map(g => {
    if(g.id!=="personlig") return g;
    let items = [...g.items];
    let klarVoksne = items.find(it=>it.id==="klar_voksne");
    if(!klarVoksne) {
      klarVoksne = {
        id:"klar_voksne", name:"Klær og sko",
        months: skalSplitteMonths ? diagnose.forventedeKlarVoksneMonths.map(m=>({...m})) : Array.from({length:12},()=>({budget:0,spent:0})),
        meta:{eier:"Felles"}, legacyIds:[],
      };
      items.push(klarVoksne);
    }
    // Sikrer begge legacyIds er der, selv ved en tidligere ufullstendig kjoring — idempotent, ingen duplikater.
    items = items.map(it => {
      if(it.id!=="klar_voksne") return it;
      const eksisterende = it.legacyIds||[];
      const nye = [...new Set([...eksisterende, "helen_klar", "eivind_klar"])];
      return {...it, legacyIds:nye};
    });
    if(!items.some(it=>it.id==="personlig_utstyr")) {
      items.push({id:"personlig_utstyr", name:"Personlig utstyr", months:Array.from({length:12},()=>({budget:0,spent:0})), meta:null});
    }
    return {...g, items};
  });

  nyeGrupper = nyeGrupper.map(g => {
    if(g.id!=="ovrige") return g;
    return {
      ...g,
      items: g.items.map(it => {
        if(it.id!=="div_felles") return it;
        const nyeLegacyIds = (it.legacyIds||[]).filter(id=>id!=="helen_klar" && id!=="eivind_klar");
        const nyeMonths = skalSplitteMonths
          ? it.months.map((mo,mi)=>({
              budget: (mo.budget||0) - (diagnose.forventedeKlarVoksneMonths[mi].budget||0),
              spent: (mo.spent||0) - (diagnose.forventedeKlarVoksneMonths[mi].spent||0),
            }))
          : it.months;
        return {...it, legacyIds:nyeLegacyIds, months:nyeMonths};
      }),
    };
  });

  return {budgetGroups:nyeGrupper, endret:true, monthsSplittet:skalSplitteMonths, blokkert:false};
}

// ── v-post-rename: snever, id-basert, guardet recovery for de to
// kjente feil-signerte "Drivstoff og lading"-rabatt-hendelsene. IKKE en
// generell fortegnsrettelse — dagens produksjonskode er allerede
// bekreftet korrekt (se leveranserapport), saa dette retter KUN de to
// spesifikke, allerede identifiserte historiske dataene.
//
// Ren funksjon. For hver hendelse i MAAL: krever eksakt treff paa id,
// transaksjonId, regelId, noyaktig ÉN fordeling, plasseringId,
// plasseringType OG belop (enten fortsatt feilaktig positivt, eller
// allerede korrigert negativt — begge gir idempotens) for aa gjore
// noe som helst. Enhver avvikende verdi -> hendelsen roeres ikke, og
// blir rapportert som hoppet over. Ingen tekst-/monstermatching.
const FORTEGN_RECOVERY_MAAL = [
  {id:"msoknxe09eop", transaksjonId:"msoknxe01b83", forventetBelop:9.27},
  {id:"msoknxe0960s", transaksjonId:"msoknxe0v3nj", forventetBelop:1},
];
const FORTEGN_RECOVERY_REGEL_ID = "msok68ov1ag1";
const FORTEGN_RECOVERY_PLASSERING_ID = "drivstoff_helen";

function kjorFortegnsRecoveryDrivstoffRabatt(hendelser) {
  const resultat = [];
  const nyeHendelser = (hendelser||[]).map(h => {
    const maal = FORTEGN_RECOVERY_MAAL.find(m=>m.id===h.id);
    if(!maal) return h;

    if(h.transaksjonId!==maal.transaksjonId) {
      resultat.push({id:h.id, handling:"hoppet_over", grunn:"transaksjonId matcher ikke forventet"});
      return h;
    }
    if(h.regelId!==FORTEGN_RECOVERY_REGEL_ID) {
      resultat.push({id:h.id, handling:"hoppet_over", grunn:"regelId matcher ikke forventet"});
      return h;
    }
    if(!h.fordelinger || h.fordelinger.length!==1) {
      resultat.push({id:h.id, handling:"hoppet_over", grunn:"forventet noyaktig én fordeling, fant "+((h.fordelinger||[]).length)});
      return h;
    }
    const f = h.fordelinger[0];
    if(f.plasseringId!==FORTEGN_RECOVERY_PLASSERING_ID) {
      resultat.push({id:h.id, handling:"hoppet_over", grunn:"plasseringId matcher ikke forventet"});
      return h;
    }
    if(f.plasseringType!=="budget") {
      resultat.push({id:h.id, handling:"hoppet_over", grunn:"plasseringType matcher ikke forventet"});
      return h;
    }
    if(f.belop === -maal.forventetBelop) {
      resultat.push({id:h.id, handling:"allerede_korrekt", belop:f.belop});
      return h;
    }
    if(f.belop !== maal.forventetBelop) {
      resultat.push({id:h.id, handling:"hoppet_over", grunn:`belop (${f.belop}) matcher verken forventet feiltilstand (${maal.forventetBelop}) eller allerede korrigert (${-maal.forventetBelop})`});
      return h;
    }

    resultat.push({id:h.id, handling:"korrigert", fra:f.belop, til:-maal.forventetBelop});
    return {...h, fordelinger:[{...f, belop:-maal.forventetBelop}]};
  });
  return {nyeHendelser, resultat};
}

// ── Modal med drag-to-resize (pkt 3) ─────────────────────────────
function Modal({onClose,title,children}) {
  const [height,setHeight] = useState(70);
  const drag = React.useRef({active:false,startY:0,startH:0});
  const onDragStart = (e) => {
    drag.current = {active:true, startY:e.touches?e.touches[0].clientY:e.clientY, startH:height};
    const move = (ev) => {
      if(!drag.current.active) return;
      const y = ev.touches?ev.touches[0].clientY:ev.clientY;
      const newH = Math.min(95,Math.max(25,drag.current.startH+(drag.current.startY-y)/window.innerHeight*100));
      setHeight(newH);
    };
    const up = () => { drag.current.active=false; window.removeEventListener("mousemove",move); window.removeEventListener("mouseup",up); window.removeEventListener("touchmove",move); window.removeEventListener("touchend",up); };
    window.addEventListener("mousemove",move); window.addEventListener("mouseup",up);
    window.addEventListener("touchmove",move,{passive:false}); window.addEventListener("touchend",up);
  };
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(44,35,24,0.35)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:200,backdropFilter:"blur(2px)"}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={{background:P.linen,borderRadius:"20px 20px 0 0",width:"100%",maxWidth:460,height:`${height}vh`,display:"flex",flexDirection:"column",boxShadow:"0 -8px 32px rgba(44,35,24,0.12)"}}>
        <div onMouseDown={onDragStart} onTouchStart={onDragStart} style={{padding:"10px 0 6px",cursor:"row-resize",flexShrink:0,touchAction:"none"}}>
          <div style={{width:40,height:4,borderRadius:2,background:P.hazelL,margin:"0 auto"}}/>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"0 16px 12px",borderBottom:`1px solid ${P.border}`,flexShrink:0}}>
          <span style={{fontSize:15,fontWeight:600,color:P.ink}}>{title}</span>
          <button onClick={onClose} style={{background:P.mist,border:"none",cursor:"pointer",color:P.stone,width:28,height:28,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}><Em e="✕"/></button>
        </div>
        <div style={{overflowY:"auto",padding:"14px 16px 36px",flex:1}}>{children}</div>
      </div>
    </div>
  );
}

// ── AdminTabell (arkitektur-vurdering, steg C) ───────────────────
// Ekte webtabell for administrasjonsflater — IKKE en bredere versjon
// av mobilkortet/RadTabell. Faste kolonnebredder + ellipsis PER
// KOLONNE (ikke la nettleseren avgjore radhoyde ut fra innhold — det
// var arsaken til at forrige forsok brot sammen visuelt selv med
// riktig containerbredde). Kolonner defineres som prop, saa Regler,
// Aarsbudsjett, Metadata og Kontoer kan bruke samme komponent senere
// uten aa finne opp sin egen tabellstil.
//
// kolonner: [{key, label, bredde, align, render(rad)}]
// rader: liste med vilkaarlige objekter, hver med en unik "id"
function AdminTabell({kolonner, rader, onRadKlikk, uthevRad}) {
  return (
    <div style={{border:"1px solid "+P.border,borderRadius:10}}>
      {/* borderCollapse:"separate" (i stedet for "collapse") er trygt her —
          tabellen tegner kun horisontale radlinjer (borderBottom), ingen
          kolonne-til-kolonne- eller konkurrerende linjer aa kollapse.
          Byttet er nodvendig for at border-radius i det hele tatt skal
          rendres paa <th>/<td> — CSS ignorerer border-radius paa celler
          naar border-collapse:"collapse" er aktivt, uansett nettleser. */}
      <table style={{width:"100%",borderCollapse:"separate",borderSpacing:0,tableLayout:"fixed",fontSize:12.5}}>
        <colgroup>
          {kolonner.map(k=><col key={k.key} style={{width:k.bredde}}/>)}
        </colgroup>
        <thead>
          <tr style={{borderBottom:"2px solid "+P.border}}>
            {kolonner.map((k,ki)=>(
              // Steg 4: sticky per celle (ikke paa <tr>/<thead> — det
              // har inkonsistent nettleserstotte). Feiler mot den reelle
              // scrollende forelderen (AdminArbeidsomrade sin scrolleboks),
              // siden wrapperen over ikke lenger etablerer sin egen
              // overflow-kontekst. Egen bakgrunn her er nodvendig slik at
              // rader som scroller under ikke skinner gjennom.
              // borderTopLeft/Right-radius paa ytterste celler gjenoppretter
              // avrundingen som gikk tapt da overflow:hidden ble fjernet fra
              // wrapperen (nodvendig for at sticky skal fungere riktig).
              <th key={k.key} style={{position:"sticky",top:0,zIndex:2,
                padding:"9px 10px",color:P.dust,fontWeight:600,
                textAlign:k.align||"left",fontSize:11.5,whiteSpace:"nowrap",
                background:P.mist,
                borderTopLeftRadius:ki===0?10:0,
                borderTopRightRadius:ki===kolonner.length-1?10:0,
                borderBottomLeftRadius:(ki===0&&rader.length===0)?10:0,
                borderBottomRightRadius:(ki===kolonner.length-1&&rader.length===0)?10:0}}>
                {k.label}
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {rader.map((rad,idx)=>{
            const sisteRad = idx===rader.length-1;
            return (
              <tr key={rad.id||idx}
                onClick={onRadKlikk?()=>onRadKlikk(rad):undefined}
                style={{borderBottom:"1px solid "+P.border,
                  background:uthevRad&&uthevRad(rad)?"#FFF8F0":(idx%2===0?P.linen:"transparent"),
                  cursor:onRadKlikk?"pointer":"default"}}>
                {kolonner.map((k,ki)=>(
                  <td key={k.key} style={{padding:"9px 10px",textAlign:k.align||"left",
                    overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",
                    borderBottomLeftRadius:(ki===0&&sisteRad)?10:0,
                    borderBottomRightRadius:(ki===kolonner.length-1&&sisteRad)?10:0}}>
                    {k.render(rad)}
                  </td>
                ))}
              </tr>
            );
          })}
        </tbody>
      </table>
      {rader.length===0 && (
        <div style={{textAlign:"center",padding:"24px",color:P.dust,fontSize:13}}>
          Ingen rader å vise.
        </div>
      )}
    </div>
  );
}

// BUDGET_NIVA — har ikke lenger "bygge"-knappen). Nokkelen bevares
// HER, i selve grupperings-/etikett-listene, bevisst som et
// sikkerhetsnett: hvis en eksisterende kostnadspost skulle ha
// meta.niva==="bygge" liggende igjen fra for migreringen til Sparing,
// skal den fortsatt VISES et sted (i sin egen "🌳 Bygge"-gruppe i
// Generator/Regelsenter) i stedet for aa forsvinne sporlost eller bli
// automatisk omklassifisert. Gruppen skjules naturlig av seg selv naar
// den er tom (samme "hvis reglerHer.length===0 return null"-monster
// som de andre nivaa-gruppene allerede bruker). Dukker det opp noe
// her, er det en konkret post som trenger en produktbeslutning — ikke

// ── Login ─────────────────────────────────────────────────────────
function LoginScreen() {
  const [email,setEmail] = useState("");
  const [pw,setPw]       = useState("");
  const [err,setErr]     = useState("");
  const [loading,setLoading] = useState(false);
  const login = async () => {
    if(!email.trim()||!pw.trim()) return;
    setLoading(true); setErr("");
    try { await signInWithEmailAndPassword(_auth,email.trim(),pw); }
    catch(e) { setErr("Feil e-post eller passord."); }
    setLoading(false);
  };
  return (
    <div style={{minHeight:"100vh",background:P.sand,display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{width:"100%",maxWidth:360}}>
        <div style={{textAlign:"center",marginBottom:32}}>
          <div style={{fontSize:48,marginBottom:12}}>🏡</div>
          <div style={{fontSize:24,fontWeight:600,color:P.ink}}>Familieappen</div>
          <div style={{fontSize:13,color:P.stone,marginTop:6}}>Logg inn for å fortsette</div>
        </div>
        <Card style={{padding:"20px 20px 24px"}}>
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            <div>
              <div style={{fontSize:11.5,fontWeight:600,color:P.stone,marginBottom:5}}>E-post</div>
              <input type="email" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&login()} placeholder="din@epost.no" style={{width:"100%",boxSizing:"border-box",fontSize:14,padding:"10px 12px"}}/>
            </div>
            <div>
              <div style={{fontSize:11.5,fontWeight:600,color:P.stone,marginBottom:5}}>Passord</div>
              <input type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&login()} placeholder="••••••••" style={{width:"100%",boxSizing:"border-box",fontSize:14,padding:"10px 12px"}}/>
            </div>
            {err && <div style={{fontSize:12,color:P.clay,background:P.clayXL,border:`1px solid ${P.clayL}`,borderRadius:8,padding:"8px 12px"}}>⚠️ {err}</div>}
            <button onClick={login} disabled={loading} style={{padding:"11px",background:loading?P.hazelL:P.hazel,color:"white",border:"none",borderRadius:9,fontSize:14,cursor:loading?"default":"pointer",fontWeight:600,marginTop:4}}>
              {loading?"Logger inn…":"Logg inn"}
            </button>
          </div>
        </Card>
      </div>
    </div>
  );
}

// ── Gangen — ny hjemskjerm (Sprint 1.1) ───────────────────────────
// Erstatter HomeScreen som "home"-fanens innhold. HomeScreen selv er
// bevisst IKKE fjernet eller endret — kun byttet ut som aktiv rute,
// per eksplisitt instruks om aa ikke fjerne kode som ikke lenger
// brukes. Bruker KUN den laaste paletten (--g-*, se <style>), og KUN
// data/logikk som allerede finnes andre steder i appen — ingen ny
// datamodell, ingen nye motorer. "Trenger deg"/"i bevegelse"-
// signalene speiler eksakt de samme reglene som allerede styrer
// Bankimports "vurdering"-gruppe og kvitteringsinnboksens
// "aktiveKvitteringer"-filter (se BankimportScreen/
// KvitteringInnboksScreen) — gjenbrukt via de globale, delte
// oppslagsfunksjonene, ikke duplisert som ny logikk.
function GangenScreen({transaksjoner, hendelser, receipts, meals, shopping, setTab, user}) {
  // ── Datalogikk og tellere — uendret ────────────────────────────
  const trengerVurdering = (transaksjoner||[]).filter(t=>{
    if(t.status==="ignorert" || t.behandlingstype==="intern_overforing") return false;
    const h = finnHendelseForTransaksjon(hendelser, t.id);
    if(h) return false;
    return t.status!=="matchet"; // "matchet" = propagert treff, ikke uvurdert
  }).length;

  const kvitteringerApne = (receipts||[]).filter(r=>{
    if(r.forkastet) return false;
    const h = finnHendelseForKvittering(hendelser, r.id);
    return !h || h.status!=="ferdig";
  }).length;

  const idagIdx = (new Date().getDay()+6)%7; // JS sondag=0 -> Man=0..Son=6
  const dagKey = DAYS[idagIdx];
  const middagIDagPlanlagt = !!(meals && meals[dagKey]);

  const handlelisteRem = (shopping||[]).filter(i=>!i.done).length;
  const handlelisteHar = (shopping||[]).length>0;

  const time = new Date().getHours();
  const hilsen = (time>=5 && time<11) ? "God morgen" : (time>=11 && time<17) ? "God ettermiddag" : "God kveld";
  const navn = (user && user.displayName) ? user.displayName.split(" ")[0] : null;

  const viktigst = [];
  if(trengerVurdering>0) viktigst.push({
    linje1: trengerVurdering===1 ? "Én transaksjon" : `${trengerVurdering} transaksjoner`,
    linje2: "venter på vurdering", tab:"forvaltning", ikon:"clipboard-check",
  });
  if(kvitteringerApne>0) viktigst.push({
    linje1: kvitteringerApne===1 ? "Én kvittering" : `${kvitteringerApne} kvitteringer`,
    linje2: "venter på kobling", tab:"forvaltning", ikon:"receipt-text",
  });
  if(!middagIDagPlanlagt) viktigst.push({
    linje1: "Middagen i dag", linje2: "er ikke planlagt ennå", tab:"mat", ikon:"soup",
  });
  const viktigstVist = viktigst.slice(0,3);

  const viOrdner = [];
  if(middagIDagPlanlagt) viOrdner.push("Middagen er planlagt.");
  if(handlelisteHar && handlelisteRem===0) viOrdner.push("Handlelisten er klar.");
  if(trengerVurdering===0) viOrdner.push("Ingen nye vurderinger venter.");

  const dagIdag = new Date();
  const datoStr = dagIdag.toLocaleDateString("nb-NO",{weekday:"long",day:"numeric",month:"long"});

  return (
    <div style={{margin:"0 -16px",padding:"0 24px",position:"relative",background:"#ECDFC8"}}>

      {/* ── Dekorasjonslag for branch-top-left — EGET lag, uavhengig
           av innholdets 24px padding. Forholder seg til Gangens fulle
           bredde (posisjoneres mot den ytre, upolstrede flaten siden
           den ligger direkte i denne position:relative-forelderen —
           IKKE mot innholdsflaten under, som har egen padding og
           overflow:hidden). Ingen overflow:hidden her, saa ingen
           bladform kan klippes av et container-grensesnitt. Stammens
           inngangspunkt kan ga utenfor selve skjermen — det er tillatt
           — men ingen blad skal kuttes av noe container-grensesnitt.
           NB: selve kildefilen har allerede en liten, fysisk avkuttet
           bladtupp helt i toppkanten (uendret her, se leveranserapport). */}
      <div style={{position:"absolute",top:0,left:0,right:0,zIndex:1,pointerEvents:"none"}}>
        <img src="assets/illustrations/branch-top-left.webp" alt="" aria-hidden="true"
          width="705" height="666" decoding="async"
          style={{position:"absolute",top:-4,left:-4,width:118,height:"auto",
            objectFit:"contain",opacity:0.85}}/>
      </div>

      {/* ── Ovre inngangsparti. Profil fjernet — dato staar alene.
           Utlogging flyttet til Mer. */}
      <div style={{position:"relative",minHeight:180,paddingTop:12,overflow:"hidden"}}>

        <img src="assets/illustrations/shelf-vase-candle.webp" alt="" aria-hidden="true"
          width="1096" height="986" decoding="async"
          style={{position:"absolute",top:38,right:-18,width:150,height:"auto",
            objectFit:"contain",opacity:1,pointerEvents:"none",zIndex:1}}/>

        {/* Dato alene, oppe til hoyre — profilikon og -meny fjernet */}
        <div style={{position:"relative",zIndex:2,display:"flex",justifyContent:"flex-end",alignItems:"center"}}>
          <div style={{fontFamily:"var(--font-display)",fontStyle:"italic",fontWeight:400,
            fontSize:14,color:"#3B352F"}}>
            {datoStr.charAt(0).toUpperCase()+datoStr.slice(1)}
          </div>
        </div>

        {/* HJEM / hilsen / undertekst — flyttet ned slik at HJEM
            starter tydelig under grenens nederste synlige del (grenen
            selv er urort, kun denne blokkens marginTop er endret). */}
        <div style={{position:"relative",zIndex:2,marginTop:90}}>
          <div style={{fontFamily:"var(--font-ui)",fontSize:12,fontWeight:600,color:"#5E7457",
            letterSpacing:"0.16em",lineHeight:"16px"}}>HJEM</div>
          <div style={{fontFamily:"var(--font-display)",fontSize:37,fontWeight:400,lineHeight:1.06,
            letterSpacing:"-0.02em",color:"#3B352F",marginTop:6}}>
            {hilsen}{navn?", "+navn:""}
          </div>
          <div style={{fontFamily:"var(--font-display)",fontSize:17,fontWeight:400,lineHeight:1.4,
            color:"#7E7468",marginTop:11}}>
            Her kan du legge<br/>fra deg litt av vekten.
          </div>
        </div>
      </div>

      {/* ── Det viktigste for deg na — na integrert som selve
           mobelets header, INNE i samme kortbakgrunn som radene under.
           Ett samlet kort, én bakgrunn, én ytre radius. Innrykket
           skillelinje mellom header og forste rad, samme prinsipp som
           mellom radene. */}
      <div style={{marginTop:17,position:"relative",zIndex:3}}>
        <div style={{background:"#EEE0CD",border:"1px solid #DDD2BF",borderRadius:18,overflow:"hidden",
          boxShadow:"0 2px 8px rgba(59,53,47,0.05)"}}>

          {/* Header — hjertesirkel + overskrift. Egen, mindre
              horisontal padding (10px) enn radene (15px) — flytter
              headerinnholdet lenger mot venstre, saa den leses som
              mobelets overskrift og ikke som en likeverdig rad. Ingen
              skillelinje mot forste rad lenger. */}
          <div style={{display:"flex",alignItems:"center",gap:9,padding:"14px 10px 12px"}}>
            <div style={{width:38,height:38,borderRadius:"50%",background:"#D7A18B",flexShrink:0,
              display:"flex",alignItems:"center",justifyContent:"center"}}>
              <Ikon navn="heart" farge="#ECDFC8" storrelse={17}/>
            </div>
            <div style={{fontFamily:"var(--font-display)",fontSize:18,fontWeight:400,lineHeight:1.2,color:"#3B352F"}}>
              Det viktigste for deg nå
            </div>
          </div>

          {viktigstVist.length>0 ? (
            viktigstVist.map((p,i) => (
              <React.Fragment key={i}>
                <div onClick={()=>setTab(p.tab)}
                  style={{display:"flex",alignItems:"center",gap:12,cursor:"pointer",minHeight:56,
                    padding:"11px 15px"}}>
                  <div style={{width:42,height:42,borderRadius:"50%",flexShrink:0,
                    background:"#E8CDBD",
                    display:"flex",alignItems:"center",justifyContent:"center"}}>
                    <Ikon navn={p.ikon} farge="#3B352F" storrelse={19}/>
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontFamily:"var(--font-ui)",fontSize:15,fontWeight:600,lineHeight:1.3,color:"#3B352F"}}>
                      {p.linje1}
                    </div>
                    <div style={{fontFamily:"var(--font-ui)",fontSize:14,fontWeight:400,lineHeight:1.35,color:"#7E7468"}}>
                      {p.linje2}
                    </div>
                  </div>
                  <Ikon navn="chevron-right" farge="#3B352F" storrelse={18}/>
                </div>
                {i<viktigstVist.length-1 && (
                  <div style={{margin:"0 16px",borderBottom:"1px solid rgba(205,197,181,0.8)"}}/>
                )}
              </React.Fragment>
            ))
          ) : (
            <div style={{padding:"15px",minHeight:56,display:"flex",alignItems:"center",
              fontFamily:"var(--font-ui)",fontSize:15,color:"#3B352F"}}>
              Ingenting trenger deg akkurat nå.
            </div>
          )}
        </div>
      </div>

      {/* ── Vi ordner. check-ikon (ikke circle-check-big) i egen fylt
           sirkel — én gronn sirkel, én lys check, ingen dobbel kontur.

      {viOrdner.length>0 && (
