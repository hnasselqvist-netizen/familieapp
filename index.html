// ── RegelSenter ───────────────────────────────────────────────────
// Kontrollpanel for Regelmotoren. Oppretter ALDRI regler selv —
// regler oppstaar kun i Bankimport naar brukeren velger "Koble + laer".
function RegelSenter({rules,setRules,budgetGroups,incomeGroups,sparingGroups,transaksjoner,setTransaksjoner,hendelser,setHendelser}) {
  const {erMobil, erWeb} = useLayoutBredde();
  const [sok,setSok] = useState("");
  const [redigerId,setRedigerId] = useState(null);

  const MODE_LABEL = {auto:"Auto",suggest:"Foresla",disabled:"Deaktivert",review:"Vurder"};
  const MODE_COL = {auto:P.olive,suggest:P.hazel,disabled:P.dust,review:"#9A7A00"};

  // Sparing, etappe 3: soker na i budgetGroups/incomeGroups/
  // sparingGroups — i den rekkefolgen, men uansett hvilken av dem
  // som faktisk inneholder posten. Post-id er den eneste palitelige
  // koblingen: en historisk regel med targetType:"budget" som peker
  // paa en post som SIDEN er flyttet til Sparing, skal fortsatt finne
  // riktig post og riktig gruppe — targetType er kun en opprinnelig
  // hint, ikke en garanti, etter at spareflyttingen kan ha gjort den
  // utdatert. Regelen skrives ALDRI om her — kun oppslaget er utvidet.
  // v-post-rename: selve oppslaget er na lostet til den delte
  // finnMalpostForRegel, saa Kjor regler-evalueringen bruker NOYAKTIG
  // samme logikk — ingen egen, parallell mal-matcher.
  const finnMalpost = (r) => finnMalpostForRegel(r, budgetGroups, incomeGroups, sparingGroups);
  // Sparing-regler faar en egen returverdi ("sparing") som aldri
  // matcher noen NIVA_REKKEFOLGE-nokkel — de skal aldri havne under
  // "Uten nivå", men vises i sin egen seksjon (se render under).
  const nivaKeyForRegel = (r) => {
    const funnet = finnMalpost(r);
    if(funnet && funnet.kildeType==="sparing") return "sparing";
    return nivaKeyForMeta(funnet?funnet.item.meta:null);
  };

  const alle = rules||[];
  const filtrert = alle.filter(r=>{
    if(!sok.trim()) return true;
    const s = sok.trim().toLowerCase();
    return (r.pattern||"").toLowerCase().includes(s)
        || (r.normalizedPattern||"").toLowerCase().includes(s)
        || (r.targetName||"").toLowerCase().includes(s);
  });

  // Sortering: 1. aktiv  2. flest bruk  3. sist brukt
  const sortert = [...filtrert].sort((a,b)=>{
    const aAktiv = a.active!==false ? 1 : 0;
    const bAktiv = b.active!==false ? 1 : 0;
    if(aAktiv!==bAktiv) return bAktiv-aAktiv;
    const aBruk = a.timesUsed||0, bBruk = b.timesUsed||0;
    if(aBruk!==bBruk) return bBruk-aBruk;
    const aTid = a.lastMatched ? new Date(a.lastMatched).getTime() : 0;
    const bTid = b.lastMatched ? new Date(b.lastMatched).getTime() : 0;
    return bTid-aTid;
  });

  // Sparegruppert liste — samme rekkefolge som SPARING_GROUP_TEMPLATE,
  // bygget fra samme sok-/sorteringsfiltrerte liste (sortert) som resten
  // av Regelsenteret bruker, slik at soket virker likt for alle regler.
  const spareReglerGruppert = (sparingGroups||[]).map(g => ({
    gruppeId: g.id,
    label: g.label,
    regler: sortert.filter(r => {
      const f = finnMalpost(r);
      return f && f.kildeType==="sparing" && f.gruppeId===g.id;
    }),
  })).filter(gr => gr.regler.length>0);


  const oppdaterRegel = (id, felt) => {
    setRules(prev=>(prev||[]).map(r=>r.id!==id?r:{...r,...felt,updatedAt:new Date().toISOString()}));
  };
  const slettRegel = (id) => {
    setRules(prev=>(prev||[]).filter(r=>r.id!==id));
    setRedigerId(null);
  };

  // ── v-post-rename: forhaandsvisning viser na den FAKTISKE
  // endringsplanen (byggKjorReglerEndringsplan) — ikke bare summer.
  // Ved bekreftelse bygges en FERSK plan mot live state og
  // sammenlignes SEMANTISK (erEndringsplanUendret) mot den planen
  // brukeren faktisk godkjente. Kun ved eksakt match skrives noe —
  // brukeren skal aldri godkjenne én liste og fa en annen skrevet.
  const [kjorReglerEvaluering,setKjorReglerEvaluering] = useState(null);
  const [kjorReglerPlan,setKjorReglerPlan] = useState(null);
  const [kjorReglerStatus,setKjorReglerStatus] = useState("klar");
  const [kjorReglerResultat,setKjorReglerResultat] = useState(null);
  const [kjorReglerAdvarsel,setKjorReglerAdvarsel] = useState(null);

  const forhandsvisKjorRegler = () => {
    const evaluering = evaluerReglerMotUavklarteTransaksjoner(
      transaksjoner, hendelser, rules, budgetGroups, incomeGroups, sparingGroups
    );
    const plan = byggKjorReglerEndringsplan(evaluering, transaksjoner);
    setKjorReglerEvaluering(evaluering);
    setKjorReglerPlan(plan);
    setKjorReglerResultat(null);
    setKjorReglerAdvarsel(null);
    setKjorReglerStatus("forhandsvist");
  };

  const bekreftKjorRegler = async () => {
    setKjorReglerStatus("kjorer");
    try {
      // Bygger en FERSK plan mot naavaerende live state og
      // sammenligner den — SEMANTISK, uid()/tidsstempler ignorert —
      // mot planen brukeren faktisk saa og godkjente.
      const ferskEvaluering = evaluerReglerMotUavklarteTransaksjoner(
        transaksjoner, hendelser, rules, budgetGroups, incomeGroups, sparingGroups
      );
      const ferskPlan = byggKjorReglerEndringsplan(ferskEvaluering, transaksjoner);

      if(!erEndringsplanUendret(kjorReglerPlan||[], ferskPlan)) {
        setKjorReglerEvaluering(ferskEvaluering);
        setKjorReglerPlan(ferskPlan);
        setKjorReglerAdvarsel("Data eller regler har endret seg. Kontroller den oppdaterte forhåndsvisningen før du fortsetter.");
        setKjorReglerStatus("forhandsvist");
        return;
      }

      const {nyeTransaksjoner, nyeHendelser} = skrivEndringsplan(ferskPlan, transaksjoner);
      await setTransaksjoner(nyeTransaksjoner);
      if(nyeHendelser.length>0) await setHendelser(prev=>[...(prev||[]), ...nyeHendelser]);
      setKjorReglerResultat({
        auto: ferskPlan.filter(l=>l.handling==="auto" && l.skalSkrives).length,
        forslagSkrevet: ferskPlan.filter(l=>l.handling==="forslag" && l.skalSkrives).length,
        forslagPaaVent: ferskPlan.filter(l=>l.handling==="forslag_pa_vent").length,
        malMangler: ferskPlan.filter(l=>l.handling==="mal_mangler").length,
      });
      setKjorReglerEvaluering(null);
      setKjorReglerPlan(null);
      setKjorReglerAdvarsel(null);
      setKjorReglerStatus("ferdig");
    } catch(err) {
      console.error("[KjorRegler] Feilet:", err);
      setKjorReglerStatus("feilet");
    }
  };

  const avbrytKjorRegler = () => {
    setKjorReglerEvaluering(null);
    setKjorReglerPlan(null);
    setKjorReglerAdvarsel(null);
    setKjorReglerStatus("klar");
  };

  const fmtD = d => d ? new Date(d).toLocaleDateString("nb-NO",{day:"numeric",month:"short",year:"numeric"}) : "—";

  // Status avledet av eksisterende regel-felt — ingen ny datamodell.
  const antallAktive = alle.filter(r=>r.active!==false).length;
  const antallAuto   = alle.filter(r=>r.mode==="auto").length;
  const antallVurder = alle.filter(r=>r.mode==="review").length;

  // §7: slaa sammen regler som beskriver samme leverandor. Beholder
  // regelen med hoyest bruk (den systemet stoler mest paa), summerer
  // bruken, sletter resten. Overforer aldri en kobling til feil post —
  // brukeren velger selv hvilke regler som horer sammen.
  const [sammenslaModus,setSammenslaModus] = useState(false);
  const [valgteForSammenslaing,setValgteForSammenslaing] = useState([]);
  const toggleValgtForSammenslaing = (id) => {
    setValgteForSammenslaing(prev=>prev.includes(id)?prev.filter(x=>x!==id):[...prev,id].slice(-2));
  };
  const slaSammenRegler = () => {
    if(valgteForSammenslaing.length!==2) return;
    const [aId,bId] = valgteForSammenslaing;
    const a = alle.find(r=>r.id===aId), b = alle.find(r=>r.id===bId);
    if(!a||!b) return;
    const [behold,fjern] = (a.timesUsed||0)>=(b.timesUsed||0) ? [a,b] : [b,a];
    setRules(prev=>(prev||[])
      .filter(r=>r.id!==fjern.id)
      .map(r=>r.id!==behold.id?r:{...r, timesUsed:(behold.timesUsed||0)+(fjern.timesUsed||0),
        updatedAt:new Date().toISOString()}));
    setValgteForSammenslaing([]);
    setSammenslaModus(false);
  };

  const MATCHTYPE_LABEL = {er_lik:"Er lik", inneholder:"Inneholder", starter_med:"Starter med"};

  // §3: redigerbart matchmonster — samme etablerte fiks (lokal utkast-
  // state, lagre kun ved blur/Enter) som BelopFelt bruker andre steder
  // i appen, for aa unnga samme klasse skriveproblem.
  const RegelMonsterFelt = ({r, oppdaterRegel}) => {
    const [utkast,setUtkast] = useState(r.normalizedPattern||r.pattern||"");
    React.useEffect(()=>{ setUtkast(r.normalizedPattern||r.pattern||""); }, [r.normalizedPattern]);
    const lagre = () => oppdaterRegel(r.id, {pattern:utkast, normalizedPattern:utkast.toLowerCase()});
    return (
      <input value={utkast} onChange={e=>setUtkast(e.target.value)}
        onBlur={lagre}
        onKeyDown={e=>{ if(e.key==="Enter"){ lagre(); e.target.blur(); } }}
        style={{width:"100%",boxSizing:"border-box",fontSize:12,color:P.ink,
          padding:"6px 8px",background:P.sand,border:"1px solid "+P.border,borderRadius:6}}/>
    );
  };

  // §3: hvor mange EKSISTERENDE observasjoner treffer denne regelen med
  // gjeldende monster+matchtype — vises for lagring, ikke bare etterpa.
  const tellTreff = (r) => (transaksjoner||[]).filter(t=>regelMatcherTekst(r, normaliserTransaksjonstekst(t.tekst))).length;

  // Delt redigeringsinnhold — samme felt (mode/confidence/aktiv/
  // flerbruk/slett) brukes av BADE mobilens inline-utvidelse (uendret
  // fra i dag) OG web sin modal. Ingen duplisert redigeringslogikk.
  const RegelRedigeringsFelt = ({r, onLukk}) => (
    <div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
        <div>
          <div style={{fontSize:10,color:P.dust,marginBottom:3}}>Mønster (redigerbart)</div>
          <RegelMonsterFelt r={r} oppdaterRegel={oppdaterRegel}/>
        </div>
        <div>
          <div style={{fontSize:10,color:P.dust,marginBottom:3}}>Koblet mot</div>
          <div style={{fontSize:12,color:P.stone,padding:"6px 8px",background:P.linen,borderRadius:6}}>
            {r.targetName||"—"} <span style={{color:P.dust}}>({r.targetType||"?"})</span>
          </div>
        </div>
        <div>
          <div style={{fontSize:10,color:P.dust,marginBottom:3}}>Antall ganger brukt</div>
          <div style={{fontSize:12,color:P.stone,padding:"6px 8px",background:P.linen,borderRadius:6}}>
            {r.timesUsed||0}
          </div>
        </div>
        <div>
          <div style={{fontSize:10,color:P.dust,marginBottom:3}}>Treffer i dag</div>
          <div style={{fontSize:12,color:P.stone,padding:"6px 8px",background:P.linen,borderRadius:6}}>
            {tellTreff(r)} observasjon{tellTreff(r)!==1?"er":""}
          </div>
        </div>
      </div>

      <div style={{marginBottom:10}}>
        <div style={{fontSize:10,color:P.dust,marginBottom:5}}>Matchtype</div>
        <div style={{display:"flex",gap:6}}>
          {["er_lik","inneholder","starter_med"].map(mt=>(
            <button key={mt} onClick={()=>oppdaterRegel(r.id,{matchType:mt})}
              style={{flex:1,padding:"6px 4px",borderRadius:7,fontSize:11,cursor:"pointer",
                fontWeight:(r.matchType||"inneholder")===mt?600:400,
                background:(r.matchType||"inneholder")===mt?P.hazelXL:"transparent",
                color:(r.matchType||"inneholder")===mt?P.hazel:P.stone,
                border:"1px solid "+((r.matchType||"inneholder")===mt?P.hazel:P.border)}}>
              {MATCHTYPE_LABEL[mt]}
            </button>
          ))}
        </div>
      </div>

      <div style={{marginBottom:10}}>
        <div style={{fontSize:10,color:P.dust,marginBottom:5}}>Mode</div>
        <div style={{display:"flex",gap:6}}>
          {["auto","suggest","review","disabled"].map(m=>(
            <button key={m} onClick={()=>oppdaterRegel(r.id,{mode:m})}
              style={{flex:1,padding:"6px 4px",borderRadius:7,fontSize:11,cursor:"pointer",
                fontWeight:r.mode===m?600:400,
                background:r.mode===m?MODE_COL[m]+"22":"transparent",
                color:r.mode===m?MODE_COL[m]:P.stone,
                border:"1px solid "+(r.mode===m?MODE_COL[m]:P.border)}}>
              {MODE_LABEL[m]}
            </button>
          ))}
        </div>
      </div>

      <div style={{marginBottom:10}}>
        <div style={{fontSize:10,color:P.dust,marginBottom:5}}>
          Confidence: {r.confidence!==undefined?r.confidence:100}%
        </div>
        <input type="range" min="0" max="100" value={r.confidence!==undefined?r.confidence:100}
          onChange={e=>oppdaterRegel(r.id,{confidence:parseInt(e.target.value)})}
          style={{width:"100%"}}/>
      </div>

      <div style={{display:"flex",gap:8,marginBottom:10}}>
        <div onClick={()=>oppdaterRegel(r.id,{active:r.active===false})}
          style={{flex:1,display:"flex",alignItems:"center",gap:8,padding:"8px 10px",
            background:P.mist,borderRadius:8,border:"1px solid "+P.border,cursor:"pointer"}}>
          <div style={{width:18,height:18,borderRadius:5,flexShrink:0,
            background:r.active!==false?P.hazel:"transparent",
            border:"1.5px solid "+(r.active!==false?P.hazel:P.hazelL),
            display:"flex",alignItems:"center",justifyContent:"center"}}>
            {r.active!==false && <Em e="✓" s={{fontSize:10,color:"white"}}/>}
          </div>
          <span style={{fontSize:11.5,color:P.ink}}>Aktiv</span>
        </div>
        <div onClick={()=>oppdaterRegel(r.id,{multiUse:!r.multiUse})}
          style={{flex:1,display:"flex",alignItems:"center",gap:8,padding:"8px 10px",
            background:P.mist,borderRadius:8,border:"1px solid "+P.border,cursor:"pointer"}}>
          <div style={{width:18,height:18,borderRadius:5,flexShrink:0,
            background:r.multiUse?"#9A7A00":"transparent",
            border:"1.5px solid "+(r.multiUse?"#9A7A00":P.hazelL),
            display:"flex",alignItems:"center",justifyContent:"center"}}>
            {r.multiUse && <Em e="✓" s={{fontSize:10,color:"white"}}/>}
          </div>
          <span style={{fontSize:11.5,color:P.ink}}>Flerbruk</span>
        </div>
      </div>

      <div style={{display:"flex",gap:6}}>
        <button onClick={onLukk}
          style={{flex:1,padding:"8px",background:P.mist,border:"1px solid "+P.border,
            borderRadius:8,fontSize:12,cursor:"pointer",color:P.stone}}>
          Lukk
        </button>
        <button onClick={()=>slettRegel(r.id)}
          style={{flex:1,padding:"8px",background:"none",border:"1px solid #E8A0A0",
            borderRadius:8,fontSize:12,cursor:"pointer",color:P.clay}}>
          Slett regel
        </button>
      </div>
    </div>
  );

  // ── Web/mellom: AdminTabell-kolonner ─────────────────────────────
  // "Kilde" fra den opprinnelige kolonneskissen finnes ikke som eget
  // felt paa regel-modellen (kun paa budsjett-metadata) — droppet til
  // fordel for feltene som faktisk finnes, i stedet for aa dikte opp
  // et nytt datafelt for aa fylle en kolonne.
  const ADMIN_KOLONNER_REGLER = [
    {key:"pattern", label:"Leverandør / mønster", bredde:"19%", render:r=>(
      <span style={{fontWeight:500,color:P.ink}}>{r.pattern||"(uten mønster)"}</span>
    )},
    {key:"kobling", label:"Kobles til", bredde:"30%", render:r=>(
      <span style={{color:P.stone}}>{r.targetName||"—"} <span style={{color:P.dust,fontSize:10.5}}>({r.targetType||"?"})</span></span>
    )},
    {key:"bruk", label:"Antall bruk", bredde:"10%", align:"right", render:r=><span style={{color:P.stone}}>{r.timesUsed||0}</span>},
    {key:"sikkerhet", label:"Sikkerhet", bredde:"16%", render:r=>(
      <span>
        <span style={{fontWeight:600,color:MODE_COL[r.mode]||P.stone}}>{MODE_LABEL[r.mode]||r.mode}</span>
        <span style={{color:P.dust}}> · {r.confidence!==undefined?r.confidence:100}%</span>
      </span>
    )},
    {key:"sistbrukt", label:"Sist brukt", bredde:"10%", render:r=><span style={{color:P.stone}}>{fmtD(r.lastMatched)}</span>},
    {key:"status", label:"Status", bredde:"15%", render:r=>(
      <span style={{display:"inline-flex",gap:4,flexWrap:"wrap"}}>
        {r.active===false && <span style={{fontSize:9,color:P.dust,background:P.mist,borderRadius:4,padding:"1px 5px"}}>deaktivert</span>}
        {r.multiUse && <span style={{fontSize:9,color:"#9A7A00",background:"#FFFBE0",borderRadius:4,padding:"1px 5px"}}>flerbruk</span>}
        {r.active!==false && !r.multiUse && <span style={{fontSize:10,color:P.olive}}>✓</span>}
      </span>
    )},
  ];

  const redigerRegel = redigerId ? alle.find(r=>r.id===redigerId) : null;

  // ── Steg 3: fast beslutningsomraade vs. scrollende arbeidsomraade ──
  // Samme kontrakt som GeneratorSenter — beregnet en gang, mobil
  // rendrer delene rett etter hverandre (identisk med tidligere
  // rekkefolge), web/mellom bruker AdminArbeidsomrade.
  const fastInnhold = (
    <>
      <div style={{fontSize:15,fontWeight:600,color:P.ink,marginBottom:4}}>📐 Regelsenter</div>
      <div style={{fontSize:12,color:P.stone,marginBottom:14}}>
        Oversikt over det Regelmotoren har lært. Endringer paavirker kun fremtidige transaksjoner —
        historiske transaksjoner endres aldri.
      </div>

      <AdminStatusPanel erWeb={erWeb} tittel="Status" felter={[
        {label:"Totalt", verdi: alle.length},
        {label:"Aktive", verdi: antallAktive, farge: P.hazel},
        {label:"Automatiske", verdi: antallAuto, farge: P.olive},
        {label:"Krever vurdering", verdi: antallVurder, farge: antallVurder>0?"#9A7A00":P.stone},
      ]}/>

      {/* ── v-post-rename: detaljert Kjor regler-forhaandsvisning ── */}
      <div style={{marginTop:10,marginBottom:10,padding:"12px 14px",background:P.linen,
        border:"1px solid "+P.border,borderRadius:10}}>
        {!kjorReglerPlan && (
          <>
            <button onClick={forhandsvisKjorRegler}
              style={{width:"100%",padding:"10px",background:P.hazel,color:"white",
                border:"none",borderRadius:9,fontSize:13.5,fontWeight:600,cursor:"pointer"}}>
              ⚡ Kjør regler
            </button>
            <div style={{fontSize:11,color:P.dust,marginTop:6,lineHeight:1.5}}>
              Bruk dagens regler på transaksjoner som fortsatt venter.
            </div>
          </>
        )}

        {kjorReglerPlan && (() => {
          const fmtDR = d=>d?new Date(d).toLocaleDateString("nb-NO",{day:"2-digit",month:"2-digit"}):"";
          const fmtBR = n=>new Intl.NumberFormat("nb-NO",{maximumFractionDigits:0}).format(n||0);
          const TYPE_LABEL_R = {budget:"Kostnad", income:"Inntekt", sparing:"Sparing"};
          const gruppeLabelFor = (target) => {
            const grupper2 = target.kildeType==="income" ? incomeGroups : target.kildeType==="sparing" ? sparingGroups : budgetGroups;
            const g = (grupper2||[]).find(x=>x.id===target.gruppeId);
            return g ? g.label : target.gruppeId;
          };
          const autoLinjer = kjorReglerPlan.filter(l=>l.handling==="auto" && l.skalSkrives);
          const forslagLinjer = kjorReglerPlan.filter(l=>l.handling==="forslag" && l.skalSkrives);
          const paaVentLinjer = kjorReglerPlan.filter(l=>l.handling==="forslag_pa_vent");
          const malManglerLinjer = kjorReglerPlan.filter(l=>l.handling==="mal_mangler");
          const ingenTreffAntall = kjorReglerEvaluering ? kjorReglerEvaluering.ingenTreff.length : 0;
          const noeAaSkrive = autoLinjer.length>0 || forslagLinjer.length>0;

          return (
            <div>
              {kjorReglerAdvarsel && (
                <div style={{padding:"9px 11px",background:"#FFF4F0",border:"1px solid #F0C4B0",
                  borderRadius:8,fontSize:12,color:P.clay,marginBottom:10,fontWeight:500}}>
                  ⚠ {kjorReglerAdvarsel}
                </div>
              )}

              <div style={{fontSize:12.5,fontWeight:600,color:P.ink,marginBottom:8}}>
                Reglene fant {autoLinjer.length+forslagLinjer.length} treff
                {kjorReglerEvaluering && <> av {kjorReglerEvaluering.vurdert} vurderte transaksjoner</>}
              </div>

              {autoLinjer.length>0 && (
                <div style={{marginBottom:10}}>
                  <div style={{fontSize:11.5,fontWeight:600,color:P.olive,marginBottom:4}}>
                    Behandles automatisk ({autoLinjer.length})
                  </div>
                  {autoLinjer.map(l=>(
                    <div key={l.transaksjonId} style={{padding:"7px 9px",background:"white",border:"1px solid "+P.border,
                      borderRadius:7,marginBottom:4,fontSize:11.5,lineHeight:1.6}}>
                      <div style={{color:P.ink}}>
                        {fmtDR(l.transaksjon.dato)} · {l.transaksjon.tekst} · {l.transaksjon.konto||"?"} · {l.transaksjon.retning==="inn"?"+":"-"}{fmtBR(l.transaksjon.belop)} kr
                      </div>
                      <div style={{color:P.stone}}>
                        → {TYPE_LABEL_R[l.target.kildeType]||"Kostnad"} · {gruppeLabelFor(l.target)} / {l.regel.targetName} · faktisk {l.fordeling.belop>=0?"+":""}{fmtBR(l.fordeling.belop)} kr
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {forslagLinjer.length>0 && (
                <div style={{marginBottom:10}}>
                  <div style={{fontSize:11.5,fontWeight:600,color:"#9A7A00",marginBottom:4}}>
                    Til vurdering ({forslagLinjer.length})
                  </div>
                  {forslagLinjer.map(l=>(
                    <div key={l.transaksjonId} style={{padding:"7px 9px",background:"white",border:"1px solid "+P.border,
                      borderRadius:7,marginBottom:4,fontSize:11.5,lineHeight:1.6}}>
                      <div style={{color:P.ink}}>
                        {l.transaksjon?fmtDR(l.transaksjon.dato)+" · "+l.transaksjon.tekst+" · "+(l.transaksjon.konto||"?")+" · "+(l.transaksjon.retning==="inn"?"+":"-")+fmtBR(l.transaksjon.belop)+" kr":"(transaksjon)"}
                      </div>
                      <div style={{color:P.stone}}>
                        → Foreslått: {l.regel.targetName} · Krever vurdering
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {paaVentLinjer.length>0 && (
                <div style={{marginBottom:10}}>
                  <div style={{fontSize:11.5,fontWeight:600,color:P.stone,marginBottom:4}}>
                    Røres ikke — på vent ({paaVentLinjer.length})
                  </div>
                  {paaVentLinjer.map(l=>(
                    <div key={l.transaksjonId} style={{padding:"7px 9px",background:P.mist,border:"1px solid "+P.border,
                      borderRadius:7,marginBottom:4,fontSize:11.5,color:P.dust}}>
                      {l.transaksjon?l.transaksjon.tekst:"(transaksjon)"} — På vent, treff funnet men ikke skrevet
                    </div>
                  ))}
                </div>
              )}

              {malManglerLinjer.length>0 && (
                <div style={{marginBottom:10}}>
                  <div style={{fontSize:11.5,fontWeight:600,color:P.clay,marginBottom:4}}>
                    Mål mangler — kan ikke utføres ({malManglerLinjer.length})
                  </div>
                  {malManglerLinjer.map(l=>(
                    <div key={l.transaksjonId} style={{padding:"7px 9px",background:"white",border:"1px solid "+P.border,
                      borderRadius:7,marginBottom:4,fontSize:11.5,color:P.clay}}>
                      {l.transaksjon?l.transaksjon.tekst:"(transaksjon)"} — regel «{l.regel.pattern}» peker mot en post som ikke finnes
                    </div>
                  ))}
                </div>
              )}

              {ingenTreffAntall>0 && (
                <div style={{fontSize:11,color:P.dust,marginBottom:10}}>
                  {ingenTreffAntall} transaksjon(er) uten treff — uendret.
                </div>
              )}

              {!noeAaSkrive && malManglerLinjer.length===0 && (
                <div style={{fontSize:12,color:P.dust,marginBottom:10}}>Ingen nye treff akkurat nå.</div>
              )}

              <div style={{display:"flex",gap:8}}>
                <button onClick={avbrytKjorRegler}
                  style={{flex:1,padding:"10px",background:"transparent",color:P.stone,
                    border:"1px solid "+P.border,borderRadius:9,fontSize:13,fontWeight:500,cursor:"pointer"}}>
                  Avbryt
                </button>
                <button onClick={bekreftKjorRegler} disabled={kjorReglerStatus==="kjorer" || !noeAaSkrive}
                  style={{flex:2,padding:"10px",background:noeAaSkrive?P.hazel:P.border,color:"white",
                    border:"none",borderRadius:9,fontSize:13,fontWeight:600,
                    cursor:(kjorReglerStatus==="kjorer"||!noeAaSkrive)?"default":"pointer"}}>
                  {kjorReglerStatus==="kjorer" ? "Bruker resultatet…" : "Bruk resultatet"}
                </button>
              </div>
            </div>
          );
        })()}

        {kjorReglerStatus==="feilet" && (
          <div style={{marginTop:8,fontSize:12,color:P.clay}}>⚠ Noe gikk galt. Se konsollen for detaljer.</div>
        )}

        {kjorReglerResultat && (
          <div style={{marginTop:kjorReglerPlan?0:8,fontSize:12.5,color:P.olive,lineHeight:1.8}}>
            <div style={{fontWeight:600}}>✓ Reglene er kjørt</div>
            {kjorReglerResultat.auto>0 && <div>• {kjorReglerResultat.auto} behandlet</div>}
            {kjorReglerResultat.forslagSkrevet>0 && <div>• {kjorReglerResultat.forslagSkrevet} klare for vurdering</div>}
            {kjorReglerResultat.malMangler>0 && <div>• {kjorReglerResultat.malMangler} trenger ny plassering</div>}
            {kjorReglerResultat.forslagPaaVent>0 && <div>• {kjorReglerResultat.forslagPaaVent} på vent — urørt</div>}
          </div>
        )}
      </div>

      <AdminSokFelt verdi={sok} setVerdi={setSok} placeholder="Sok i mønster eller kobling…"/>

      <div style={{display:"flex",alignItems:"center",gap:8,marginTop:8,marginBottom:4}}>
        <button onClick={()=>{setSammenslaModus(v=>!v);setValgteForSammenslaing([]);}}
          style={{padding:"6px 12px",borderRadius:8,fontSize:11.5,cursor:"pointer",
            fontWeight:sammenslaModus?600:400,
            background:sammenslaModus?P.hazelXL:"transparent",
            color:sammenslaModus?P.hazel:P.stone,
            border:"1px solid "+(sammenslaModus?P.hazel:P.border)}}>
          🔗 Slå sammen regler
        </button>
        {sammenslaModus && (
          <span style={{fontSize:11,color:P.dust}}>
            {valgteForSammenslaing.length<2
              ? `Velg ${2-valgteForSammenslaing.length} regel${2-valgteForSammenslaing.length!==1?"er":""} til for samme leverandør`
              : ""}
          </span>
        )}
        {sammenslaModus && valgteForSammenslaing.length===2 && (
          <button onClick={slaSammenRegler}
            style={{padding:"6px 12px",borderRadius:8,fontSize:11.5,fontWeight:600,cursor:"pointer",
              background:P.hazel,color:"white",border:"none"}}>
            Slå sammen disse 2
          </button>
        )}
      </div>
    </>
  );

  const scrollendeInnhold = (
    <>
      {sortert.length===0 && (
        <div style={{textAlign:"center",padding:"28px",color:P.dust,fontSize:13}}>
          {alle.length===0
            ? "Ingen regler er laert ennaa. Regler oppstaar i Bankimport naar du velger «Koble + laer»."
            : "Ingen regler matcher soket."}
        </div>
      )}

      {erMobil ? (
        // Mobil: uendret — inline utvidelse per rad, akkurat som i dag.
        sortert.map(r=>{
          const apen = redigerId===r.id;
          const inaktiv = r.active===false;
          return (
            <div key={r.id} style={{marginBottom:6}}>
              <div onClick={()=>sammenslaModus ? toggleValgtForSammenslaing(r.id) : setRedigerId(apen?null:r.id)}
                style={{display:"flex",alignItems:"center",gap:8,padding:"9px 12px",
                  borderRadius:apen?"10px 10px 0 0":10,cursor:"pointer",
                  background:valgteForSammenslaing.includes(r.id)?P.hazelXL:inaktiv?P.mist:P.linen,
                  border:"1px solid "+(valgteForSammenslaing.includes(r.id)?P.hazel:P.border),opacity:inaktiv?0.6:1}}>
                {sammenslaModus && (
                  <div style={{width:18,height:18,borderRadius:5,flexShrink:0,
                    background:valgteForSammenslaing.includes(r.id)?P.hazel:"transparent",
                    border:"1.5px solid "+(valgteForSammenslaing.includes(r.id)?P.hazel:P.hazelL),
                    display:"flex",alignItems:"center",justifyContent:"center"}}>
                    {valgteForSammenslaing.includes(r.id) && <Em e="✓" s={{fontSize:10,color:"white"}}/>}
                  </div>
                )}
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <span style={{fontSize:13,fontWeight:500,color:P.ink,
                      overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                      {r.pattern||"(uten monster)"}
                    </span>
                    {r.multiUse && (
                      <span style={{fontSize:9,color:"#9A7A00",background:"#FFFBE0",
                        borderRadius:4,padding:"1px 5px",flexShrink:0}}>flerbruk</span>
                    )}
                    {inaktiv && (
                      <span style={{fontSize:9,color:P.dust,background:P.sand,
                        borderRadius:4,padding:"1px 5px",flexShrink:0}}>deaktivert</span>
                    )}
                  </div>
                  <div style={{fontSize:10,color:P.dust,marginTop:1}}>
                    → {r.targetName||"ukjent"} · {r.timesUsed||0}x brukt · sist {fmtD(r.lastMatched)}
                  </div>
                </div>
                <span style={{fontSize:10,fontWeight:600,color:MODE_COL[r.mode]||P.stone,flexShrink:0}}>
                  {MODE_LABEL[r.mode]||r.mode}
                </span>
                <span style={{fontSize:10,color:P.dust,flexShrink:0}}>{r.confidence!==undefined?r.confidence:100}%</span>
                <span style={{color:P.dust,fontSize:10}}>{apen?"▴":"▾"}</span>
              </div>

              {apen && (
                <div style={{border:"1px solid "+P.border,borderTop:"none",
                  borderRadius:"0 0 10px 10px",padding:"12px 14px",background:P.sand}}>
                  <RegelRedigeringsFelt r={r} onLukk={()=>setRedigerId(null)}/>
                </div>
              )}
            </div>
          );
        })
      ) : (
        // Web/mellom: nivaagruppert AdminTabell — samme okonomiske
        // mentale modell (Beskytte -> Velge) som Generator-senteret.
        // Regler uten noen klar maalpost/niva havner under "Uten nivå".
        // Sparing, etappe 3: egen hovedseksjon FOR niva-lista, gruppert
        // etter sparegruppe — havner ALDRI i niva-lista eller "Uten nivå".
        <>
          {spareReglerGruppert.length>0 && (
            <div style={{marginBottom:20}}>
              <div style={{fontSize:14,fontWeight:700,color:P.ink,marginBottom:10}}>
                💰 Sparing <span style={{color:P.dust,fontWeight:400}}>
                  ({spareReglerGruppert.reduce((s,gr)=>s+gr.regler.length,0)})
                </span>
              </div>
              {spareReglerGruppert.map(gr=>(
                <div key={gr.gruppeId} style={{marginBottom:16,marginLeft:16}}>
                  <div style={{fontSize:13,fontWeight:600,color:P.ink,marginBottom:8}}>
                    {SPARING_GROUP_EMOJI[gr.gruppeId]||"💰"} {gr.label}
                    <span style={{color:P.dust,fontWeight:400}}> ({gr.regler.length})</span>
                  </div>
                  <AdminTabell
                    kolonner={sammenslaModus ? [
                      {key:"valgt", label:"", bredde:"6%", render:r=>(
                        <div style={{width:16,height:16,borderRadius:4,
                          background:valgteForSammenslaing.includes(r.id)?P.hazel:"transparent",
                          border:"1.5px solid "+(valgteForSammenslaing.includes(r.id)?P.hazel:P.hazelL),
                          display:"flex",alignItems:"center",justifyContent:"center"}}>
                          {valgteForSammenslaing.includes(r.id) && <Em e="✓" s={{fontSize:9,color:"white"}}/>}
                        </div>
                      )},
                      ...ADMIN_KOLONNER_REGLER,
                    ] : ADMIN_KOLONNER_REGLER}
                    rader={gr.regler}
                    onRadKlikk={r=>sammenslaModus ? toggleValgtForSammenslaing(r.id) : setRedigerId(r.id)}
                    uthevRad={r=>r.mode==="review"}/>
                </div>
              ))}
            </div>
          )}
          {NIVA_REKKEFOLGE.map(niva=>{
          const reglerHer = sortert.filter(r=>nivaKeyForRegel(r)===niva.key);
          if(reglerHer.length===0) return null;
          return (
            <div key={niva.key} style={{marginBottom:20}}>
              <div style={{fontSize:13,fontWeight:600,color:P.ink,marginBottom:8}}>
                {niva.label} <span style={{color:P.dust,fontWeight:400}}>({reglerHer.length})</span>
              </div>
              <AdminTabell
                kolonner={sammenslaModus ? [
                  {key:"valgt", label:"", bredde:"6%", render:r=>(
                    <div style={{width:16,height:16,borderRadius:4,
                      background:valgteForSammenslaing.includes(r.id)?P.hazel:"transparent",
                      border:"1.5px solid "+(valgteForSammenslaing.includes(r.id)?P.hazel:P.hazelL),
                      display:"flex",alignItems:"center",justifyContent:"center"}}>
                      {valgteForSammenslaing.includes(r.id) && <Em e="✓" s={{fontSize:9,color:"white"}}/>}
                    </div>
                  )},
                  ...ADMIN_KOLONNER_REGLER,
                ] : ADMIN_KOLONNER_REGLER}
                rader={reglerHer}
                onRadKlikk={r=>sammenslaModus ? toggleValgtForSammenslaing(r.id) : setRedigerId(r.id)}
                uthevRad={r=>r.mode==="review"}/>
            </div>
          );
          })}
        </>
      )}
    </>
  );

  return (
    <div style={erMobil ? undefined : {flex:1,minHeight:0,display:"flex",flexDirection:"column",height:"100%"}}>
      {erMobil ? (
        <>{fastInnhold}{scrollendeInnhold}</>
      ) : (
        <AdminArbeidsomrade fast={fastInnhold}>{scrollendeInnhold}</AdminArbeidsomrade>
      )}

      {!erMobil && redigerRegel && (
        <Modal title={"Regel — "+(redigerRegel.pattern||"(uten mønster)")} onClose={()=>setRedigerId(null)}>
          <RegelRedigeringsFelt r={redigerRegel} onLukk={()=>setRedigerId(null)}/>
        </Modal>
      )}
    </div>
  );
}


// ── ArsbudsjettScreen ─────────────────────────────────────────────
// Planleggingsflate for budsjett gjennom hele aaret.
// Viser kun budsjettbeloep — ingen Faktisk, ingen analyse.
function ArsbudsjettScreen({budgetGroups,setBudgetGroups,incomeGroups,setIncomeGroups,sparingGroups,setSparingGroups,annualPlans,setAnnualPlan}) {
  const [visning,setVisning] = useState("kostnader"); // "kostnader" | "inntekter" | "sparing"
  const [ekspandert,setEkspandert] = useState(null);
  const [fordelModal,setFordelModal] = useState(null); // {gid,iid,name}
  const [varselModal,setVarselModal] = useState(null); // {gid,iid,mi,val,name,detaljId?}
  const origVerdiRef = React.useRef({}); // holder opprinnelig verdi per celle ved fokus
  // v-post-rename: hvilken KOSTNADSPOST sine budgetDetails er
  // ekspandert i visning — separat fra gruppe-ekspandering (ekspandert
  // over). Noekkel: gid+"|"+iid.
  const [detaljEkspandert,setDetaljEkspandert] = useState(new Set());
  // Bekreftelse ved forsok paa aa slette SISTE gjenvaerende detalj —
  // dette er en eksplisitt overgang tilbake til enkel post, ikke en
  // vanlig sletting.
  const [fjernDetaljModal,setFjernDetaljModal] = useState(null); // {gid,iid,name}
  // v-post-rename-presisering: bekreftelse FOR aktivering av
  // detaljniva — aktivering bygger budsjettet for posten paa nytt fra
  // bunnen (0), IKKE en tapsfri kopi av dagens verdier. Krever derfor
  // eksplisitt bekreftelse for noe skjer.
  const [aktiverDetaljModal,setAktiverDetaljModal] = useState(null); // {gid,iid,name}
  // v-post-rename: hvilket kalenderaar Aarsbudsjett viser/
  // redigerer. Standard er alltid innevaerende aar (samme kontrakt som
  // resten av appen — CURRENT_BUDGET_YEAR).
  const [valgtAar,setValgtAar] = useState(CURRENT_BUDGET_YEAR);
  // v-post-rename: bekreftelse FOR den guarderte
  // engangshandlingen "Hent manglende detaljer" for et aar som
  // ALLEREDE har en eksisterende plan.
  const [hentDetaljerModal,setHentDetaljerModal] = useState(null); // {kildeAar}

  // v-post-rename: adaptere som lar HELE den eksisterende
  // handler-/render-logikken under (uendret siden forrige runde)
  // fungere identisk uansett hvilket aar som er valgt.
  //
  // For CURRENT_BUDGET_YEAR: identisk atferd som for denne leveransen —
  // leser/skriver budgetGroups/incomeGroups/sparingGroups DIREKTE,
  // uendret. Dette er bevisst: Kostnader-fanen (BudsjettScreen) har sin
  // egen, direkte redigeringsmekanisme mot disse samme Firebase-stiene
  // for inneværende maaned, og kan ikke frakobles trygt her — CURRENT
  // year sin "aarsplan" ER derfor fortsatt budgetGroups selv.
  //
  // For andre aar (2027, ...): flettAarsplanMedStruktur bygger en
  // midlertidig "groups"-formet visning fra STRUKTUREN (budgetGroups
  // sine id/name/meta/legacyIds, aarsuavhengig) + den faktiske
  // aarsplanen (months/budgetDetails) for valgt aar. hentSetter
  // konverterer redigeringer TILBAKE til den flate aarsplan-formen og
  // skriver via setAnnualPlan — ALDRI til budgetGroups/incomeGroups/
  // sparingGroups for et annet aar enn current.
  const ANNUAL_TYPE = {kostnad:"costs", inntekt:"income", sparing:"savings"};
  const strukturForType = (type) => type==="inntekt" ? incomeGroups : type==="sparing" ? sparingGroups : budgetGroups;

  // v-post-rename: finner detalj-STRUKTUR-kilden for et
  // maalaar sin FORSTEGANGSOPPRETTELSE — den naermeste foregaaende
  // aarsplanen (eller CURRENT_BUDGET_YEAR sin levende struktur).
  // Sparing skal ALDRI faa en detaljkilde (ingen detaljstoette der,
  // uendret domenebeslutning).
  const hentDetaljkilde = (type, maalAar) => {
    if(type==="sparing") return undefined;
    const annualType = ANNUAL_TYPE[type];
    const kildeAar = finnNaermesteForegaaendeAar(maalAar, annualPlans);
    if(kildeAar===null) return undefined;
    if(kildeAar===CURRENT_BUDGET_YEAR) return konverterGroupsTilFlatPlan(strukturForType(type));
    return (annualPlans[kildeAar] && annualPlans[kildeAar][annualType]) || undefined;
  };

  const hentGroups = (type) => {
    const struktur = strukturForType(type);
    if(valgtAar===CURRENT_BUDGET_YEAR) return struktur;
    const annualType = ANNUAL_TYPE[type];
    const eksisterendePlan = annualPlans[valgtAar] && annualPlans[valgtAar][annualType];
    // v-post-rename: KUN naar INGEN plan finnes ennaa
    // for valgt aar (forstegangsopprettelse) bygges detaljkilden inn —
    // en allerede eksisterende plan (uansett hvor tom) roeres aldri.
    const plan = eksisterendePlan || byggTomAarsplanFraStruktur(struktur, hentDetaljkilde(type, valgtAar));
    return flettAarsplanMedStruktur(struktur, plan);
  };

  const hentSetter = (type) => {
    if(valgtAar===CURRENT_BUDGET_YEAR) {
      return type==="inntekt" ? setIncomeGroups : type==="sparing" ? setSparingGroups : setBudgetGroups;
    }
    const annualType = ANNUAL_TYPE[type];
    return (updater) => {
      const naavaerendeMerged = hentGroups(type);
      const nesteMerged = typeof updater==="function" ? updater(naavaerendeMerged) : updater;
      return setAnnualPlan(valgtAar, annualType, konverterGroupsTilFlatPlan(nesteMerged));
    };
  };

  // v-post-rename: den guarderte "Hent manglende
  // detaljer"-engangshandlingen for VALGT AAR, som allerede har en
  // eksisterende plan. Kjores KUN etter eksplisitt bekreftelse (se
  // hentDetaljerModal). Kostnad og inntekt hver for seg — Sparing har
  // ingen detaljstoette. Legger KUN til detalj-STRUKTUR paa poster som
  // IKKE allerede har budgetDetails; roerer aldri eksisterende
  // months/belop eller allerede eksisterende detaljer.
  const kjorHentManglendeDetaljer = () => {
    const kildeAar = finnNaermesteForegaaendeAar(valgtAar, annualPlans);
    if(kildeAar===null) { setHentDetaljerModal(null); return; }
    ["kostnad","inntekt"].forEach(type=>{
      const annualType = ANNUAL_TYPE[type];
      const struktur = strukturForType(type);
      const eksisterendePlan = (annualPlans[valgtAar] && annualPlans[valgtAar][annualType]) || {};
      const detaljkilde = kildeAar===CURRENT_BUDGET_YEAR
        ? konverterGroupsTilFlatPlan(struktur)
        : (annualPlans[kildeAar] && annualPlans[kildeAar][annualType]) || {};
      const nyPlan = hentManglendeDetaljerFraKilde(eksisterendePlan, struktur, detaljkilde);
      setAnnualPlan(valgtAar, annualType, nyPlan);
    });
    setHentDetaljerModal(null);
  };

  // Cellene refereres med data-cell="gid|iid|mi" for tastaturnavigasjon
  const cellRef = (gid,iid,mi) => gid+"|"+iid+"|"+mi;

  const flyttFokus = (gid, itemsIRekkefolge, iid, mi, retning) => {
    // retning: 1 = neste (Tab), -1 = forrige (Shift+Tab)
    let nyMi = mi + retning;
    let nyIid = iid;
    if(nyMi > 11) {
      const idx = itemsIRekkefolge.findIndex(x=>x.id===iid);
      const neste = itemsIRekkefolge[idx+1];
      if(!neste) return; // siste post, siste maaned — ingenting mer aa hoppe til
      nyIid = neste.id; nyMi = 0;
    } else if(nyMi < 0) {
      const idx = itemsIRekkefolge.findIndex(x=>x.id===iid);
      const forrige = itemsIRekkefolge[idx-1];
      if(!forrige) return; // forste post, forste maaned
      nyIid = forrige.id; nyMi = 11;
    }
    const el = document.querySelector('[data-cell="'+cellRef(gid,nyIid,nyMi)+'"]');
    if(el) el.focus();
  };

  const anvendResten = (type, gid, iid, fraMi, val, detaljId) => {
    // v-post-rename: samme "kopier fremover"-mekanisme
    // gjenbrukt for en detaljrad naar detaljId er oppgitt — oppdaterer
    // KUN den ene detaljen, deretter summerBudgetDetails paa nytt for
    // foreldreposten. Ingen egen kodevei/modal for dette.
    // v-post-rename: hentSetter(type) velger riktig maal for
    // BAADE type (kostnad/inntekt) OG valgt aar — retter samtidig en
    // eksisterende bug der detalj-grenen var hardkodet til
    // setBudgetGroups uansett type (ville skrevet inntektsdetalj-
    // kopiering til feil Firebase-sti).
    const setter = hentSetter(type);
    if(detaljId) {
      setter(prev=>prev.map(g=>g.id!==gid?g:{
        ...g, items:g.items.map(it=>{
          if(it.id!==iid) return it;
          const nyeDetaljer = (it.budgetDetails||[]).map(d=>d.id!==detaljId?d:{
            ...d, months:d.months.map((mo,m2)=>m2<fraMi?mo:{budget:parseFloat(val)||0})
          });
          return {...it, budgetDetails:nyeDetaljer, months:summerBudgetDetails(nyeDetaljer)};
        })
      }));
      return;
    }
    setter(prev=>prev.map(g=>g.id!==gid?g:{
      ...g, items:g.items.map(it=>it.id!==iid?it:{
        ...it, months:it.months.map((mo,m2)=>m2<fraMi?mo:{...mo,budget:parseFloat(val)||0})
      })
    }));
  };

  const updMonth = (gid,iid,mi,val,item,opprinneligVerdi) => {
    const nyVerdi = parseFloat(val)||0;
    hentSetter("kostnad")(prev=>prev.map(g=>g.id!==gid?g:{
      ...g, items:g.items.map(it=>it.id!==iid?it:{
        ...it, months:it.months.map((mo,m2)=>m2!==mi?mo:{...mo,budget:nyVerdi})
      })
    }));
    // Sporr om resten av aaret KUN naar verdien faktisk er endret,
    // og KUN for maanedlige, faste poster — ikke siste maaned
    const faktiskEndret = opprinneligVerdi===undefined || nyVerdi!==opprinneligVerdi;
    const erFast = !item.meta || item.meta.oppforsel==="fast" || !item.meta.oppforsel;
    if(faktiskEndret && erFast && mi<11) {
      setVarselModal({type:"kostnad",gid,iid,mi,val:nyVerdi,name:item.name});
    }
  };

  // ── v-post-rename: budgetDetails-handlere ────────────────
  // Fasit: item.months[].budget for en post MED detaljer er ALLTID
  // summerBudgetDetails(budgetDetails) — aldri redigert direkte, aldri
  // duplisert summeringslogikk. Kostnad OG inntekt (v-arsbudsjett-
  // detaljer-inntekt) — samme "type"-baserte setter-valg som
  // anvendResten/fordelArskostnad allerede bruker.

  // v-post-rename-presisering: aktivering bygger budsjettet
  // for posten paa NYTT fra bunnen — ikke lenger en tapsfri kopi.
  // Foerste detalj er tom ("Ny detalj", 0 i alle 12 maaneder), og
  // foreldrepostens months summeres derfor til 0 med det samme.
  // Kalles KUN etter eksplisitt bekreftelse (se aktiverDetaljModal) —
  // aldri direkte fra trigger-knappen, og aldri automatisk ved
  // deploy/refresh/oppstart.
  const aktiverDetaljer = (type, gid, iid) => {
    const setter = hentSetter(type);
    setter(prev=>prev.map(g=>g.id!==gid?g:{
      ...g, items:g.items.map(it=>{
        if(it.id!==iid || (it.budgetDetails&&it.budgetDetails.length>0)) return it;
        const nyeDetaljer = [{id:uid(), name:"Ny detalj", months:Array.from({length:12},()=>({budget:0}))}];
        return {...it, budgetDetails:nyeDetaljer, months:summerBudgetDetails(nyeDetaljer)};
      })
    }));
    setDetaljEkspandert(prev=>new Set(prev).add(gid+"|"+iid));
    setAktiverDetaljModal(null);
  };

  // Ny detalj starter paa 0 i alle 12 maaneder (§9) — foreldresummen
  // er derfor uendret ved tillegg.
  const leggTilDetalj = (type, gid, iid) => {
    const setter = hentSetter(type);
    setter(prev=>prev.map(g=>g.id!==gid?g:{
      ...g, items:g.items.map(it=>{
        if(it.id!==iid) return it;
        const nyDetalj = {id:uid(), name:"Ny detalj", months:Array.from({length:12},()=>({budget:0}))};
        const nyeDetaljer = [...(it.budgetDetails||[]), nyDetalj];
        return {...it, budgetDetails:nyeDetaljer, months:summerBudgetDetails(nyeDetaljer)};
      })
    }));
  };

  const updDetaljMonth = (type, gid,iid,detaljId,mi,val,detalj,opprinneligVerdi) => {
    const setter = hentSetter(type);
    const nyVerdi = parseFloat(val)||0;
    setter(prev=>prev.map(g=>g.id!==gid?g:{
      ...g, items:g.items.map(it=>{
        if(it.id!==iid) return it;
        const nyeDetaljer = (it.budgetDetails||[]).map(d=>d.id!==detaljId?d:{
          ...d, months:d.months.map((mo,m2)=>m2!==mi?mo:{budget:nyVerdi})
        });
        return {...it, budgetDetails:nyeDetaljer, months:summerBudgetDetails(nyeDetaljer)};
      })
    }));
    const faktiskEndret = opprinneligVerdi===undefined || nyVerdi!==opprinneligVerdi;
    if(faktiskEndret && mi<11) {
      setVarselModal({type,gid,iid,mi,val:nyVerdi,name:detalj.name,detaljId});
    }
  };

  // Navneendring paavirker aldri belop — ingen re-summering nodvendig.
  const endreDetaljNavn = (type, gid, iid, detaljId, navn) => {
    const setter = hentSetter(type);
    setter(prev=>prev.map(g=>g.id!==gid?g:{
      ...g, items:g.items.map(it=>{
        if(it.id!==iid) return it;
        return {...it, budgetDetails:(it.budgetDetails||[]).map(d=>d.id!==detaljId?d:{...d, name:navn})};
      })
    }));
  };

  // Vanlig sletting (ikke siste detalj) — summer paa nytt normalt.
  const slettDetalj = (type, gid, iid, detaljId) => {
    const setter = hentSetter(type);
    setter(prev=>prev.map(g=>g.id!==gid?g:{
      ...g, items:g.items.map(it=>{
        if(it.id!==iid) return it;
        const nyeDetaljer = (it.budgetDetails||[]).filter(d=>d.id!==detaljId);
        return {...it, budgetDetails:nyeDetaljer, months:summerBudgetDetails(nyeDetaljer)};
      })
    }));
  };

  // §10: sletting av SISTE gjenvaerende detalj er en eksplisitt
  // overgang tilbake til enkel post — dagens 12 summerte belop
  // BEHOLDES uendret, kun budgetDetails-feltet fjernes. Posten blir
  // igjen direkte redigerbar.
  const fjernDetaljniva = (type, gid, iid) => {
    const setter = hentSetter(type);
    setter(prev=>prev.map(g=>g.id!==gid?g:{
      ...g, items:g.items.map(it=>{
        if(it.id!==iid) return it;
        const {budgetDetails, ...utenDetaljer} = it;
        return utenDetaljer;
      })
    }));
    setDetaljEkspandert(prev=>{ const nytt=new Set(prev); nytt.delete(gid+"|"+iid); return nytt; });
    setFjernDetaljModal(null);
  };

  const toggleDetaljEkspandert = (gid, iid) => {
    setDetaljEkspandert(prev=>{
      const nytt = new Set(prev);
      const noekkel = gid+"|"+iid;
      if(nytt.has(noekkel)) nytt.delete(noekkel); else nytt.add(noekkel);
      return nytt;
    });
  };

  // Tastaturnavigasjon mellom detaljrader (analogt flyttFokus, men
  // innenfor SAMME foreldrepost sin detaljliste, egen data-cell-prefiks).
  const flyttFokusDetalj = (gid, iid, detaljerIRekkefolge, detaljId, mi, retning) => {
    let nyMi = mi + retning;
    let nyDetaljId = detaljId;
    if(nyMi > 11) {
      const idx = detaljerIRekkefolge.findIndex(x=>x.id===detaljId);
      const neste = detaljerIRekkefolge[idx+1];
      if(!neste) return;
      nyDetaljId = neste.id; nyMi = 0;
    } else if(nyMi < 0) {
      const idx = detaljerIRekkefolge.findIndex(x=>x.id===detaljId);
      const forrige = detaljerIRekkefolge[idx-1];
      if(!forrige) return;
      nyDetaljId = forrige.id; nyMi = 11;
    }
    const el = document.querySelector('[data-cell="detalj|'+gid+'|'+iid+'|'+nyDetaljId+'|'+nyMi+'"]');
    if(el) el.focus();
  };

  const updIncMonth = (gid,iid,mi,val,item,opprinneligVerdi) => {
    const nyVerdi = parseFloat(val)||0;
    hentSetter("inntekt")(prev=>prev.map(g=>g.id!==gid?g:{
      ...g, items:g.items.map(it=>it.id!==iid?it:{
        ...it, months:it.months.map((mo,m2)=>m2!==mi?mo:{...mo,budget:nyVerdi})
      })
    }));
    const faktiskEndret = opprinneligVerdi===undefined || nyVerdi!==opprinneligVerdi;
    const erFast = !item.meta || item.meta.oppforsel==="fast" || !item.meta.oppforsel;
    if(faktiskEndret && erFast && mi<11) {
      setVarselModal({type:"inntekt",gid,iid,mi,val:nyVerdi,name:item.name});
    }
  };

  // v-arsbudsjett-sparing: Sparing i Aarsbudsjett redigerer KUN
  // sparepost.months[mi].budget — ingen detaljer (§11), ingen paavirkning
  // paa Actual/likviditet/eier/konto/meta. Samme monster som updIncMonth.
  const updSparingMonth = (gid,iid,mi,val,item,opprinneligVerdi) => {
    const nyVerdi = parseFloat(val)||0;
    hentSetter("sparing")(prev=>prev.map(g=>g.id!==gid?g:{
      ...g, items:g.items.map(it=>it.id!==iid?it:{
        ...it, months:it.months.map((mo,m2)=>m2!==mi?mo:{...mo,budget:nyVerdi})
      })
    }));
    const faktiskEndret = opprinneligVerdi===undefined || nyVerdi!==opprinneligVerdi;
    const erFast = !item.meta || item.meta.oppforsel==="fast" || !item.meta.oppforsel;
    if(faktiskEndret && erFast && mi<11) {
      setVarselModal({type:"sparing",gid,iid,mi,val:nyVerdi,name:item.name});
    }
  };

  const fordelArskostnad = (type, gid,iid,totalBelop) => {
    const total = parseFloat(totalBelop)||0;
    const perManed = Math.floor(total/12);
    const diff = total - perManed*12; // avrundingsdifferanse -> desember
    const setter = hentSetter(type);
    setter(prev=>prev.map(g=>g.id!==gid?g:{
      ...g, items:g.items.map(it=>it.id!==iid?it:{
        ...it, months:it.months.map((mo,mi)=>({...mo, budget: mi===11 ? perManed+diff : perManed}))
      })
    }));
    setFordelModal(null);
  };

  const arsSum = (it) => it.months.reduce((s,mo)=>s+(mo.budget||0),0);

  const updPaymentPattern = (gid,iid,pattern) => setBudgetGroups(prev=>prev.map(g=>g.id!==gid?g:{
    ...g, items:g.items.map(it=>it.id!==iid?it:{
      ...it, meta: {...(it.meta||defaultMeta()), paymentPattern:pattern}
    })
  }));
  const gruppeArsSum = (g) => g.items.reduce((s,it)=>s+arsSum(it),0);

  return (
    <div>
      <div style={{fontSize:15,fontWeight:600,color:P.ink,marginBottom:4}}>📅 Årsbudsjett · {valgtAar}</div>
      <div style={{fontSize:12,color:P.stone,marginBottom:12}}>
        Planlegg budsjettet for hele året. Dette er en planleggingsflate — ikke en oversikt
        over faktisk forbruk. Trykk på et beløp for å redigere. Tab flytter til neste måned,
        Shift+Tab til forrige.
      </div>

      {/* v-post-rename: enkel aarsvelger. Valgt aar er synlig
          hele tiden (i overskriften over). Minst ett aar bakover, flere
          fremover — ingen kalender, ingen kompleksitet. */}
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
        <button onClick={()=>setValgtAar(a=>Math.max(a-1, CURRENT_BUDGET_YEAR-1))}
          disabled={valgtAar<=CURRENT_BUDGET_YEAR-1}
          style={{padding:"6px 14px",borderRadius:8,border:"1px solid "+P.border,
            background:P.mist,cursor:valgtAar<=CURRENT_BUDGET_YEAR-1?"default":"pointer",
            fontSize:14,color:valgtAar<=CURRENT_BUDGET_YEAR-1?P.border:P.stone,fontWeight:600}}>
          ‹
        </button>
        <div style={{fontSize:14,fontWeight:600,color:P.ink,minWidth:56,textAlign:"center"}}>
          {valgtAar}
        </div>
        <button onClick={()=>setValgtAar(a=>Math.min(a+1, CURRENT_BUDGET_YEAR+5))}
          disabled={valgtAar>=CURRENT_BUDGET_YEAR+5}
          style={{padding:"6px 14px",borderRadius:8,border:"1px solid "+P.border,
            background:P.mist,cursor:valgtAar>=CURRENT_BUDGET_YEAR+5?"default":"pointer",
            fontSize:14,color:valgtAar>=CURRENT_BUDGET_YEAR+5?P.border:P.stone,fontWeight:600}}>
          ›
        </button>
        {valgtAar!==CURRENT_BUDGET_YEAR && (
          <span style={{fontSize:11,color:P.dust}}>
            (innevaerende år er {CURRENT_BUDGET_YEAR})
          </span>
        )}
      </div>

      {/* v-post-rename: guardet engangshandling — vises
          KUN for et aar som IKKE er current year OG som allerede har
          en eksisterende plan (brukeren har begynt aa redigere det). */}
      {valgtAar!==CURRENT_BUDGET_YEAR && !!annualPlans[valgtAar] && (() => {
        const kildeAarForKnapp = finnNaermesteForegaaendeAar(valgtAar, annualPlans);
        return kildeAarForKnapp!==null && (
          <div style={{marginBottom:14}}>
            <button onClick={()=>setHentDetaljerModal({kildeAar:kildeAarForKnapp})}
              style={{padding:"6px 12px",borderRadius:8,border:"1px dashed "+P.hazel,
                background:"transparent",color:P.hazel,cursor:"pointer",fontSize:11.5,fontWeight:600}}>
              Hent manglende detaljer fra {kildeAarForKnapp}
            </button>
          </div>
        );
      })()}

      <div style={{display:"flex",gap:6,marginBottom:14}}>
        <button onClick={()=>{setVisning("kostnader");setEkspandert(null);}}
          style={{flex:1,padding:"8px",borderRadius:9,fontSize:12.5,cursor:"pointer",
            fontWeight:visning==="kostnader"?600:400,
            background:visning==="kostnader"?P.hazelXL:P.mist,
            color:visning==="kostnader"?P.hazel:P.stone,
            border:"1px solid "+(visning==="kostnader"?P.hazel:P.border)}}>
          💸 Kostnader
        </button>
        <button onClick={()=>{setVisning("inntekter");setEkspandert(null);}}
          style={{flex:1,padding:"8px",borderRadius:9,fontSize:12.5,cursor:"pointer",
            fontWeight:visning==="inntekter"?600:400,
            background:visning==="inntekter"?P.hazelXL:P.mist,
            color:visning==="inntekter"?P.hazel:P.stone,
            border:"1px solid "+(visning==="inntekter"?P.hazel:P.border)}}>
          📥 Inntekter
        </button>
        <button onClick={()=>{setVisning("sparing");setEkspandert(null);}}
          style={{flex:1,padding:"8px",borderRadius:9,fontSize:12.5,cursor:"pointer",
            fontWeight:visning==="sparing"?600:400,
            background:visning==="sparing"?P.hazelXL:P.mist,
            color:visning==="sparing"?P.hazel:P.stone,
            border:"1px solid "+(visning==="sparing"?P.hazel:P.border)}}>
          🐷 Sparing
        </button>
      </div>

      {visning==="kostnader" && (
      <div style={{overflowX:"auto"}}>
        {(hentGroups("kostnad")||[]).map(g=>{
          const apen = ekspandert===g.id;
          return (
            <div key={g.id} style={{marginBottom:6}}>
              <div onClick={()=>setEkspandert(apen?null:g.id)}
                style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",
                  borderRadius:apen?"11px 11px 0 0":11,cursor:"pointer",
                  background:P.linen,border:"1px solid "+P.border}}>
                <IBox emoji={GROUP_EMOJI[g.id]||"📁"} color={g.color} size={30}/>
                <div style={{flex:1}}>
                  <span style={{fontSize:13,fontWeight:600,color:P.ink}}>{g.label}</span>
                </div>
                <span style={{fontSize:12,fontWeight:500,color:P.stone}}>{fmt(gruppeArsSum(g))} / år</span>
                <span style={{color:P.dust,fontSize:13}}>{apen?"▴":"▾"}</span>
              </div>

              {apen && (
                <div style={{border:"1px solid "+P.border,borderTop:"none",
                  borderRadius:"0 0 11px 11px",background:P.sand,padding:"10px 14px"}}>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:11,minWidth:900}}>
                    <thead>
                      <tr style={{borderBottom:"2px solid "+P.border}}>
                        <th style={{padding:"4px 6px",textAlign:"left",color:P.dust,fontWeight:600,
                          position:"sticky",left:0,background:P.sand,minWidth:130}}>Post</th>
                        {MONTHS.map((m,mi)=>(
                          <th key={mi} style={{padding:"4px 6px",textAlign:"right",color:P.dust,fontWeight:600,minWidth:64}}>
                            {m.slice(0,3)}
                          </th>
                        ))}
                        <th style={{padding:"4px 6px",textAlign:"right",color:P.dust,fontWeight:600,minWidth:80}}>Sum år</th>
                        <th style={{minWidth:70}}></th>
                        <th style={{minWidth:90}}></th>
                      </tr>
                    </thead>
                    <tbody>
                      {g.items.map(it=>{
                        const pmnster = (it.meta&&it.meta.paymentPattern)||"monthly";
                        const harDetaljer = it.budgetDetails && it.budgetDetails.length>0;
                        const detaljNoekkel = g.id+"|"+it.id;
                        const erDetaljApen = detaljEkspandert.has(detaljNoekkel);
                        return (
                        <React.Fragment key={it.id}>
                        <tr style={{borderBottom:harDetaljer&&erDetaljApen?"none":"1px solid "+P.border}}>
                          <td style={{padding:"4px 6px",color:P.ink,whiteSpace:"nowrap",
                            position:"sticky",left:0,background:P.sand,fontWeight:500,
                            cursor:harDetaljer?"pointer":"default"}}
                            onClick={harDetaljer?()=>toggleDetaljEkspandert(g.id,it.id):undefined}>
                            {harDetaljer && <span style={{color:P.dust,marginRight:4,fontSize:10}}>{erDetaljApen?"▾":"▸"}</span>}
                            {it.name}
                          </td>
                          {it.months.map((mo,mi)=>(
                            <td key={mi} style={{padding:"2px 3px"}}>
                              {harDetaljer ? (
                                // v-post-rename: foreldrebeloepet er
                                // READ-ONLY saa lenge detaljer finnes — det
                                // ER summen av detaljene, aldri redigert direkte.
                                <div style={{width:"100%",boxSizing:"border-box",fontSize:11,
                                  textAlign:"right",background:P.linen,border:"1px solid "+P.border,
                                  borderRadius:4,padding:"3px 4px",color:P.stone,fontWeight:600}}>
                                  {mo.budget||0}
                                </div>
                              ) : (
                                <input type="number"
                                  key={"kb-"+it.id+"-"+mi+"-"+mo.budget}
                                  data-cell={cellRef(g.id,it.id,mi)}
                                  defaultValue={mo.budget}
                                  onFocus={e=>{e.target.select(); origVerdiRef.current[cellRef(g.id,it.id,mi)]=mo.budget;}}
                                  onBlur={e=>updMonth(g.id,it.id,mi,e.target.value,it,origVerdiRef.current[cellRef(g.id,it.id,mi)])}
                                  onKeyDown={e=>{
                                    if(e.key==="Tab") {
                                      e.preventDefault();
                                      e.target.blur();
                                      flyttFokus(g.id, g.items, it.id, mi, e.shiftKey?-1:1);
                                    } else if(e.key==="Enter") {
                                      e.target.blur();
                                    }
                                  }}
                                  style={{width:"100%",boxSizing:"border-box",fontSize:11,
                                    textAlign:"right",background:P.mist,border:"1px solid "+P.border,
                                    borderRadius:4,padding:"3px 4px"}}/>
                              )}
                            </td>
                          ))}
                          <td style={{padding:"4px 6px",textAlign:"right",color:P.stone,fontWeight:600}}>
                            {fmt(arsSum(it))}
                          </td>
                          <td style={{padding:"4px 6px",textAlign:"center"}}>
                            {!harDetaljer && (
                              <button onClick={()=>setFordelModal({type:"kostnad",gid:g.id,iid:it.id,name:it.name})}
                                style={{background:P.mist,border:"1px solid "+P.border,borderRadius:6,
                                  padding:"3px 8px",fontSize:10,cursor:"pointer",color:P.stone,whiteSpace:"nowrap"}}>
                                Fordel år
                              </button>
                            )}
                          </td>
                          <td style={{padding:"4px 6px"}}>
                            {!harDetaljer && (
                              <select value={pmnster}
                                onChange={e=>updPaymentPattern(g.id,it.id,e.target.value)}
                                style={{fontSize:10,background:P.mist,border:"1px solid "+P.border,
                                  borderRadius:6,padding:"3px 4px",color:P.stone,whiteSpace:"nowrap"}}>
                                <option value="monthly">Månedlig</option>
                                <option value="quarterly">Kvartalsvis</option>
                                <option value="yearly">Årlig</option>
                              </select>
                            )}
                          </td>
                        </tr>
                        {!harDetaljer && (
                          <tr style={{borderBottom:"1px solid "+P.border}}>
                            <td colSpan={16} style={{padding:"1px 6px 5px",position:"sticky",left:0,background:P.sand}}>
                              <button onClick={()=>setAktiverDetaljModal({type:"kostnad",gid:g.id,iid:it.id,name:it.name})}
                                style={{background:"transparent",border:"none",padding:0,
                                  fontSize:9.5,color:P.hazel,cursor:"pointer",textDecoration:"underline"}}>
                                Bruk detaljer
                              </button>
                            </td>
                          </tr>
                        )}
                        {harDetaljer && erDetaljApen && (it.budgetDetails||[]).map(d=>(
                          <tr key={d.id} style={{borderBottom:"1px solid "+P.border,background:P.linen}}>
                            <td style={{padding:"3px 6px 3px 22px",position:"sticky",left:0,background:P.linen}}>
                              <input value={d.name} onChange={e=>endreDetaljNavn("kostnad",g.id,it.id,d.id,e.target.value)}
                                style={{width:"100%",boxSizing:"border-box",fontSize:10.5,color:P.stone,
                                  background:"transparent",border:"none",padding:"2px 0"}}/>
                            </td>
                            {d.months.map((mo,mi)=>(
                              <td key={mi} style={{padding:"2px 3px"}}>
                                <input type="number"
                                  key={"db-"+d.id+"-"+mi+"-"+mo.budget}
                                  data-cell={"detalj|"+g.id+"|"+it.id+"|"+d.id+"|"+mi}
                                  defaultValue={mo.budget}
                                  onFocus={e=>{e.target.select(); origVerdiRef.current["detalj|"+g.id+"|"+it.id+"|"+d.id+"|"+mi]=mo.budget;}}
                                  onBlur={e=>updDetaljMonth("kostnad",g.id,it.id,d.id,mi,e.target.value,d,origVerdiRef.current["detalj|"+g.id+"|"+it.id+"|"+d.id+"|"+mi])}
                                  onKeyDown={e=>{
                                    if(e.key==="Tab") {
                                      e.preventDefault();
                                      e.target.blur();
                                      flyttFokusDetalj(g.id, it.id, it.budgetDetails, d.id, mi, e.shiftKey?-1:1);
                                    } else if(e.key==="Enter") {
                                      e.target.blur();
                                    }
                                  }}
                                  style={{width:"100%",boxSizing:"border-box",fontSize:10.5,
                                    textAlign:"right",background:"white",border:"1px solid "+P.border,
                                    borderRadius:4,padding:"3px 4px"}}/>
                              </td>
                            ))}
                            <td style={{padding:"3px 6px",textAlign:"right",color:P.dust,fontSize:10.5}}>
                              {fmt(d.months.reduce((s,mo)=>s+(mo.budget||0),0))}
                            </td>
                            <td style={{padding:"3px 6px",textAlign:"center"}}>
                              <button onClick={()=>{
                                  if((it.budgetDetails||[]).length===1) setFjernDetaljModal({type:"kostnad",gid:g.id,iid:it.id,name:it.name});
                                  else slettDetalj("kostnad",g.id,it.id,d.id);
                                }}
                                style={{background:"transparent",border:"none",padding:"2px 6px",
                                  fontSize:10.5,color:P.clay,cursor:"pointer"}}>
                                ✕
                              </button>
                            </td>
                            <td></td>
                          </tr>
                        ))}
                        {harDetaljer && erDetaljApen && (
                          <tr style={{borderBottom:"1px solid "+P.border,background:P.linen}}>
                            <td colSpan={16} style={{padding:"3px 6px 6px 22px",position:"sticky",left:0,background:P.linen}}>
                              <button onClick={()=>leggTilDetalj("kostnad",g.id,it.id)}
                                style={{background:"transparent",border:"none",padding:0,
                                  fontSize:9.5,color:P.hazel,cursor:"pointer",textDecoration:"underline"}}>
                                + Legg til detalj
                              </button>
                            </td>
                          </tr>
                        )}
                        </React.Fragment>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
