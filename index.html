                  </button>
                )}
              </div>
            );
          })}

          {korrigerHendelseId && (() => {
            const hendelseSomKorrigeres = (hendelser||[]).find(h=>h.id===korrigerHendelseId);
            const transaksjonForKorrigering = !hendelseSomKorrigeres ? null
              : hendelseSomKorrigeres.transaksjonId
                ? (transaksjoner||[]).find(t=>t.id===hendelseSomKorrigeres.transaksjonId)
                : hendelseSomKorrigeres.kilde==="manuell"
                  ? {retning: (hendelseSomKorrigeres.fordelinger&&hendelseSomKorrigeres.fordelinger[0]&&hendelseSomKorrigeres.fordelinger[0].plasseringType==="income") ? "inn" : "ut"}
                  : null;
            if(!hendelseSomKorrigeres) return null;
            return (
              <KorrigerHendelseModal
                hendelse={hendelseSomKorrigeres}
                transaksjon={transaksjonForKorrigering}
                budgetGroups={budgetGroups}
                incomeGroups={incomeGroups}
                sparingGroups={sparingGroups}
                rules={rules}
                onLagre={(oppdatertHendelse, laerData)=>{
                  setHendelser(prev=>{
                    const uten = (prev||[]).filter(h=>h.id!==oppdatertHendelse.id);
                    return [...uten, oppdatertHendelse];
                  });
                  if(laerData) {
                    setRules(prev=>oppdaterReglerVedLaering(prev, laerData.transaksjon, laerData.post, false));
                  }
                  setKorrigerHendelseId(null);
                }}
                onClose={()=>setKorrigerHendelseId(null)}
              />
            );
          })()}
        </div>
      )}
    </div>
  );
}


// ── GeneratorSenter ───────────────────────────────────────────────
function GeneratorSenter({budgetGroups,setBudgetGroups,incomeGroups,setIncomeGroups,liquidity,month}) {
  const {sone, erMobil, erWeb} = useLayoutBredde();
  const [fane,setFane] = useState("oppmerksomhet"); // "oppmerksomhet" | "oversikt"
  const [sok,setSok] = useState("");
  const [filter,setFilter] = useState("alle");
  const [editModal,setEditModal] = useState(null); // {type:"inn"|"ut",groupId,item}
  const [mobilIndeks,setMobilIndeks] = useState(0); // hvilken "krever oppmerksomhet"-post vises paa mobil

  // NIVA_LABEL og NIVA_REKKEFOLGE er na globale (delt med Regelsenter
  // og fremtidige administrasjonsflater) — se toppen av filen.

  // ── Delt datalogikk (samme uansett bredde) ───────────────────────
  const allePoster = [
    ...(incomeGroups||[]).flatMap(g=>g.items.map(it=>({
      type:"inn", gruppe:g.label, groupId:g.id, item:it,
      // Manglende maaned-data (strukturell mangel) -> null.
      // Eksisterende maaned med budget:0 (brukerens eksplisitte valg) -> 0, gyldig.
      budget: (it.months && it.months[month]) ? it.months[month].budget : null,
    }))),
    ...(budgetGroups||[]).flatMap(g=>g.items.map(it=>({
      type:"ut", gruppe:g.label, groupId:g.id, item:it,
      budget: (it.months && it.months[month]) ? it.months[month].budget : null,
    }))),
  ];

  // Strukturerte mangler per felt — én sann kilde. Returnerer hvilke
  // FELT som mangler, ikke bare en tekstliste, slik at bade tabellen og
  // redigeringskortet kan vise varsel direkte ved feltet som utloser det.
  // Null er data. Tomt er mangel. Et budsjettert belop pa eksplisitt 0
  // betyr at brukeren har tatt stilling og valgt null — det skal ALDRI
  // utlose varsel. Kun fravaer av verdi (null/undefined) er en mangel.
  const feilFelter = (p) => {
    const m = p.item.meta;
    if(!m) return {niva:true, konto:true, forfallsdag:true, belop:false, metadata:true};
    const belopMangler = m.automatisk && (p.budget===null || p.budget===undefined);
    return {
      niva: !m.niva,
      konto: !m.konto,
      forfallsdag: !m.forfallsdag,
      belop: !!belopMangler,
      metadata: false,
    };
  };
  // Bakoverkompatibel tekstliste, avledet av feilFelter — samme kilde,
  // kun en annen form. Brukes der en enkel oppsummeringstekst er nok.
  const feilTekster = (p) => {
    const f = feilFelter(p);
    const ut = [];
    if(f.metadata) ut.push("mangler all metadata");
    if(f.niva) ut.push("mangler nivå");
    if(f.konto) ut.push("mangler konto");
    if(f.forfallsdag) ut.push("mangler forfallsdag");
    if(f.belop) ut.push("mangler beløp");
    return ut;
  };
  const harFeil = (p) => Object.values(feilFelter(p)).some(Boolean);

  const posterMedFeil = allePoster.filter(p=>harFeil(p));

  // Nivaa-nokkel for gruppering i Oversikt — delt logikk (nivaKeyForMeta)
  const nivaKey = (p) => nivaKeyForMeta(p.item.meta);

  const saveMeta = (type,groupId,itemId,meta) => {
    if(type==="inn") {
      setIncomeGroups(p=>p.map(g=>g.id!==groupId?g:{
        ...g, items:g.items.map(it=>it.id!==itemId?it:{...it,meta})
      }));
    } else {
      setBudgetGroups(p=>p.map(g=>g.id!==groupId?g:{
        ...g, items:g.items.map(it=>it.id!==itemId?it:{...it,meta})
      }));
    }
  };

  const FILTERS = [
    {id:"alle",      label:"Alle"},
    {id:"mangler",   label:"⚠️ Mangler"},
    {id:"automatisk",label:"⚡ Automatisk"},
    {id:"inntekter", label:"↑ Inntekter"},
    {id:"kostnader", label:"↓ Kostnader"},
  ];

  const Pill = ({id,label}) => (
    <button onClick={()=>setFilter(id)}
      style={{padding:"5px 12px",borderRadius:20,fontSize:12,cursor:"pointer",fontWeight:filter===id?600:400,
        background:filter===id?P.hazel:P.mist,color:filter===id?"white":P.stone,
        border:"1px solid "+(filter===id?P.hazel:P.border)}}>
      {label}
    </button>
  );

  // Filter + sok — brukt i Oversikt, virker PAA TVERS av nivaagruppene
  // uten at selve grupperingen forsvinner (filtrerer innholdet i hver
  // gruppe, fjerner kun tomme grupper fra visningen).
  const matcherFilterOgSok = (p) => {
    if(filter==="inntekter" && p.type!=="inn") return false;
    if(filter==="kostnader" && p.type!=="ut") return false;
    if(filter==="automatisk" && !(p.item.meta&&p.item.meta.automatisk)) return false;
    if(filter==="mangler" && !harFeil(p)) return false;
    if(sok.trim()) {
      const s = sok.trim().toLowerCase();
      if(!p.item.name.toLowerCase().includes(s) && !p.gruppe.toLowerCase().includes(s)) return false;
    }
    return true;
  };

  // Status fra liquidity.posts (brukt i status-panelet)
  const allePoster2 = Object.values((liquidity&&liquidity.posts)||{});
  const genPoster    = allePoster2.filter(p=>p.kilde==="generator");
  const manPoster    = allePoster2.filter(p=>p.kilde!=="generator");
  const overstyrte   = allePoster2.filter(p=>p.manueltOverstyrt);
  const sistKjort    = genPoster.length>0 ? Math.max(...genPoster.map(p=>p.generatedAt||0)) : null;
  const fmtRelTid    = (ts) => {
    if(!ts) return "–";
    const sek = Math.round((Date.now()-ts)/1000);
    if(sek<60) return "for "+sek+" sekunder siden";
    const min = Math.round(sek/60);
    if(min<60) return "for "+min+" min siden";
    return new Date(ts).toLocaleTimeString("nb-NO",{hour:"2-digit",minute:"2-digit"});
  };

  const FANER = [
    {id:"oppmerksomhet", label:"Krever oppmerksomhet", n:posterMedFeil.length, farge:posterMedFeil.length>0?P.clay:P.stone},
    {id:"oversikt",       label:"Oversikt",             n:null, farge:P.hazel},
  ];

  // Nullstill mobil-indeks naar man kommer inn i "krever oppmerksomhet"
  // med en annen mengde poster enn sist (f.eks. etter en post er rettet)
  React.useEffect(()=>{
    if(mobilIndeks>=posterMedFeil.length) setMobilIndeks(0);
  }, [posterMedFeil.length]);

  // Web/mellom faar flere synlige kolonner enn mobil ville taalt —
  // dette er selve poenget med aa faktisk bruke tilgjengelig bredde
  // (punkt 3+4 i justeringsrunden) i stedet for smale, avkuttede kolonner.
  const RadTabell = ({poster}) => (
    <div style={{overflowX: erMobil ? "auto" : "visible"}}>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:erMobil?11:12.5}}>
        <thead>
          <tr style={{borderBottom:"2px solid "+P.border,textAlign:"left"}}>
            <th style={{padding:erMobil?"6px 4px":"8px 8px",color:P.dust,fontWeight:600,whiteSpace:"nowrap"}}>⇅</th>
            <th style={{padding:erMobil?"6px 4px":"8px 8px",color:P.dust,fontWeight:600}}>Gruppe</th>
            <th style={{padding:erMobil?"6px 4px":"8px 8px",color:P.dust,fontWeight:600}}>Post</th>
            <th style={{padding:erMobil?"6px 4px":"8px 8px",color:P.dust,fontWeight:600}}>Eier</th>
            <th style={{padding:erMobil?"6px 4px":"8px 8px",color:P.dust,fontWeight:600}}>Nivå{!erMobil?" / undertype":""}</th>
            <th style={{padding:erMobil?"6px 4px":"8px 8px",color:P.dust,fontWeight:600}}>Konto</th>
            <th style={{padding:erMobil?"6px 4px":"8px 8px",color:P.dust,fontWeight:600,textAlign:"center"}}>Forfallsdag</th>
            <th style={{padding:erMobil?"6px 4px":"8px 8px",color:P.dust,fontWeight:600,textAlign:"center"}}>{erMobil?"⚡":"Auto/manuell"}</th>
            <th style={{padding:erMobil?"6px 4px":"8px 8px",color:P.dust,fontWeight:600}}>Kilde</th>
            <th style={{padding:erMobil?"6px 4px":"8px 8px",color:P.dust,fontWeight:600,textAlign:"right"}}>Beløp</th>
            <th style={{padding:erMobil?"6px 4px":"8px 8px",color:P.dust,fontWeight:600,textAlign:"center"}}></th>
          </tr>
        </thead>
        <tbody>
          {poster.map((p,idx) => {
            const m = p.item.meta;
            const f = feilFelter(p);
            const rowBg = idx%2===0?P.linen:"transparent";
            const td = erMobil?"6px 4px":"8px 8px";
            const wrap = erMobil ? {maxWidth:120,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"} : {};
            return (
              <tr key={p.groupId+"-"+p.item.id}
                style={{background:harFeil(p)?"#FFF8F0":rowBg,
                  borderBottom:"1px solid "+P.border,cursor:"pointer"}}
                onClick={()=>setEditModal(p)}>
                <td style={{padding:td,color:p.type==="inn"?P.olive:P.clay,fontWeight:600}}>
                  {p.type==="inn"?"↑":"↓"}
                </td>
                <td style={{padding:td,color:P.stone,fontSize:erMobil?10:11.5,...wrap}}>{p.gruppe}</td>
                <td style={{padding:td,color:P.ink,fontWeight:500,...wrap}}>
                  {p.item.name}
                  {f.metadata && <span style={{marginLeft:4,color:"#C0602A",fontSize:9}} title="Mangler all metadata">⚠</span>}
                </td>
                <td style={{padding:td,color:m?P.stone:P.clay,fontSize:erMobil?10:11.5}}>{m?m.eier||"—":"—"}</td>
                <td style={{padding:td,color:f.niva?P.clay:P.stone,fontSize:erMobil?10:11.5,whiteSpace:"nowrap",fontWeight:f.niva?600:400}}>
                  {m?(NIVA_LABEL[m.niva]||m.niva||"—"):"—"}
                  {!erMobil && m && m.niva==="opprettholde" && <span style={{color:P.dust}}> ({m.opprettholdType==="valgfritt"?"valgfri":"nødvendig"})</span>}
                  {f.niva && <span style={{color:P.clay}}> ⚠</span>}
                </td>
                <td style={{padding:td,color:f.konto?P.clay:(m?P.stone:P.clay),fontSize:erMobil?10:11.5,fontWeight:f.konto?600:400}}>
                  {m?m.konto||"—":"—"}
                  {f.konto && <span style={{color:P.clay}}> ⚠</span>}
                </td>
                <td style={{padding:td,textAlign:"center",color:f.forfallsdag?P.clay:P.stone,fontWeight:f.forfallsdag?600:400}}>
                  {m?m.forfallsdag||"—":"—"}
                  {f.forfallsdag && <span style={{color:P.clay}}> ⚠</span>}
                </td>
                <td style={{padding:td,textAlign:"center",fontSize:erMobil?11:11.5}}>
                  {m&&m.automatisk
                    ? (erMobil ? <span style={{color:P.gold}}>⚡</span> : <span style={{color:P.gold}}>⚡ Automatisk</span>)
                    : (erMobil ? <span style={{color:P.border}}>·</span> : <span style={{color:P.stone}}>Manuell</span>)}
                  {f.belop && <span style={{color:P.clay}}> ⚠</span>}
                </td>
                <td style={{padding:td,color:P.stone,fontSize:erMobil?10:11.5}}>{m?m.kilde||"—":"—"}</td>
                <td style={{padding:td,textAlign:"right",color:f.belop?P.clay:(p.type==="inn"?P.olive:P.ink),fontWeight:f.belop?700:500}}>
                  {p.budget!==null&&p.budget!==undefined?fmt(p.budget):"—"}
                  {f.belop && <span style={{color:P.clay}}> ⚠</span>}
                </td>
                <td style={{padding:td,textAlign:"center"}}>
                  <button
                    style={{background:m?P.hazelXL:P.mist,border:"1px solid "+(m?P.hazelL:P.border),
                      borderRadius:5,cursor:"pointer",fontSize:9,padding:"2px 6px",
                      color:m?P.hazel:P.dust}}
                    onClick={e=>{e.stopPropagation();setEditModal(p);}}>
                    {m?"✓":"+"}
                  </button>
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>
      {poster.length===0 && (
        <div style={{textAlign:"center",padding:"24px",color:P.dust,fontSize:13}}>
          Ingen poster her.
        </div>
      )}
    </div>
  );

  // Delt visning: nivaagruppert tabellsett, brukt av BADE Krever
  // oppmerksomhet (web/mellom) og Oversikt — pa web skal ingen av
  // administrasjonsflatene vaere én lang flat tabell.
  const NivaGruppertTabeller = ({poster}) => (
    <div>
      {NIVA_REKKEFOLGE.map(niva=>{
        const posterHer = poster.filter(p=>nivaKey(p)===niva.key);
        if(posterHer.length===0) return null;
        return (

// ── Prognosemotor ─────────────────────────────────────────────────
// Ren funksjon: tar saldo + liste med poster + prognosedato
// Returnerer tre tall. Ingen annet ansvar.
// Ren funksjon — INGEN Firebase/UI/global state leses. prognosisDate
// og fraDato gis begge eksplisitt inn (fraDato er valgfri og faller
// tilbake til "na" hvis ikke gitt, for bakoverkompatibilitet).
//
// Nedre grense lagt til (v-post-rename) som et EKSPLISITT
// sikkerhetsnett i selve motoren — ikke redundant: en manuelt
// overstyrt generert post med historisk dato blir ALDRI fjernet fra
// liquidity.posts (overstyringer bevares uansett alder, med vilje —
// se generateForecastPosts), saa uten denne nedre grensen ville en
// slik post fortsatt telle med i dagens spillerom for alltid. Motoren
// er derfor det eneste stedet som garantert utelukker den fra selve
// BEREGNINGEN, uten aa slette noe fra lagringen.
// Delt, ren hjelpefunksjon — DEN ene definisjonen av hva som regnes
// som en "aktiv" prognosepost. Brukes overalt poster filtreres i
// Spillerom (calcSpillerom-input, gruppesummer, aktiv liste), slik at
// ingen av dem kan komme i utakt med hverandre. Eksisterende poster
// uten status-felt behandles bakoverkompatibelt som aktive — ingen
// migrering krevd.
const erAktivPrognosepost = (p) => p.status !== "oppfylt";

// Delt, ren periodefunksjon — DEN ene regelen for "ligger denne posten
// innenfor den aktive Spilleroms-perioden". Krever en gyldig p.date
// (ugyldig/manglende dato -> false, aldri inkludert). Brukes for aa
// bygge NOYAKTIG samme datasett tre steder: den ordinaere synlige
// listen, gruppesummene, og input til calcSpillerom — slik at disse
// aldri kan komme i utakt med hverandre igjen.
const erPrognosepostIPeriode = (post, fraDato, tilDato) => {
  if(!post || !post.date) return false;
  const d = new Date(post.date);
  if(isNaN(d.getTime())) return false;
  const fra = new Date(fraDato); fra.setHours(0,0,0,0);
  const til = new Date(tilDato); til.setHours(23,59,59,999);
  return d >= fra && d <= til;
};

function calcSpillerom(saldo, posts, prognosisDate, fraDato) {
  const d = prognosisDate ? new Date(prognosisDate) : new Date();
  d.setHours(23,59,59,999);
  const start = fraDato ? new Date(fraDato) : new Date();
  start.setHours(0,0,0,0);
  const relevant = posts.filter(p => {
    if(!p.date) return false;
    const pd = new Date(p.date);
    return pd >= start && pd <= d;
  });
  const innbetalinger = relevant.filter(p=>p.direction==="in").reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
  const utbetalinger  = relevant.filter(p=>p.direction==="out").reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
  const disponibelt = parseFloat(saldo)||0;
  const bundet      = utbetalinger - innbetalinger; // netto uttak
  const spillerom   = disponibelt + innbetalinger - utbetalinger;
  return { disponibelt, innbetalinger, utbetalinger, bundet, spillerom };
}


// ── Budsjettgenerator v1 ──────────────────────────────────────────
// Ren funksjon: tar budsjettgrupper + existing2 poster + maaned
// Returnerer oppdatert posts-objekt (ingen side-effekter)
function beregnStandardPrognosisDate(naa) {
  // Delt med SpilleromScreens egen destrukturering, saa "naar ingen
  // prognosisDate er lagret ennaa"-standarden aldri kan drifte fra
  // hverandre paa to steder.
  const lonnDay = 20;
  const candidate = new Date(naa.getFullYear(), naa.getMonth(), lonnDay);
  if(candidate <= naa) candidate.setMonth(candidate.getMonth()+1);
  return candidate.toISOString().slice(0,10);
}

// Bygger lista over {aar, maaned} som overlapper [fraDato, tilDato] —
// kan spenne over et maanedsskifte (t.d. resten av august + hele/deler
// av september).
function maanederIPeriode(fraDato, tilDato) {
  const liste = [];
  let cursor = new Date(fraDato.getFullYear(), fraDato.getMonth(), 1);
  const cursorSlutt = new Date(tilDato.getFullYear(), tilDato.getMonth(), 1);
  while(cursor <= cursorSlutt) {
    liste.push({aar: cursor.getFullYear(), maaned: cursor.getMonth()});
    cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);
  }
  return liste;
}

// Ren funksjon: tar budsjettgrupper/inntekt/sparing + eksisterende
// poster + en EKSPLISITT periode (fraDato -> tilDato, begge Date).
// Returnerer oppdatert posts-objekt (ingen side-effekter).
//
// v-post-rename: erstatter den tidligere `month`-baserte
// signaturen. Spillerom skal beskrive fremtidig likviditet fra naa og
// frem til prognosedatoen — IKKE hvilken maaned brukeren sist saa paa
// i Kostnader/Inntekter/Sparing. Genererer na for HVER maaned perioden
// spenner over (via maanederIPeriode), og filtrerer hver enkelt post
// paa sin egen dato mot [fraDato, tilDato] for post — en post med
// forfallsdag tidligere enn fraDato i INNEVAERENDE maaned (t.d. allerede
// forfalt denne maaneden) ekskluderes korrekt, ikke bare hele maaneder.
function generateForecastPosts(budgetGroups, existingPosts, fraDato, tilDato, incomeMonths, incomeGroups, sparingGroups) {
  // Start med kun manuelle poster — genererte slettes og regenereres
  const posts = {};
  Object.entries(existingPosts||{}).forEach(([id,p]) => {
    if(p.kilde !== "generator") {
      posts[id] = p; // behold manuelle
    }
    // Manuelt overstyrte genererte poster beholdes med sine verdier —
    // ogsaa hvis de har en historisk dato. calcSpilleroms egen nedre
    // grense (se der) er det som hindrer en slik historisk post fra aa
    // paavirke DAGENS beregning — de slettes bevisst ikke her.
    if(p.kilde === "generator" && p.manueltOverstyrt) {
      posts[id] = p;
    }
  });

  const fra = new Date(fraDato); fra.setHours(0,0,0,0);
  const til = new Date(tilDato); til.setHours(23,59,59,999);
  const genTs = Date.now();
  const innenforPeriode = (dato) => dato >= fra && dato <= til;
  const maanedsListe = maanederIPeriode(fra, til);

  // ── Kostnadsposter ─────────────────────────────────────────────
  budgetGroups.forEach(gruppe => {
    gruppe.items.forEach(item => {
      const meta = item.meta;
      if(!meta || !meta.automatisk) return;
      if(!meta.forfallsdag) return;
      const dag = parseInt(meta.forfallsdag);
      maanedsListe.forEach(({aar, maaned}) => {
        const monthData = item.months && item.months[maaned];
        if(!monthData) return;
        const budgetAmount = (monthData.spent && monthData.spent > 0)
          ? monthData.spent : monthData.budget;
        if(!budgetAmount || budgetAmount <= 0) return;
        const erFaktisk = !!(monthData.spent && monthData.spent > 0);
        const dato = new Date(aar, maaned, dag);
        if(!innenforPeriode(dato)) return;
        const datoStr = dato.toISOString().slice(0,10);
        const noekkel = item.id+"_"+aar+"_"+maaned+"_"+dag;

        // Sjekk om den finnes som manuelt overstyrt
        const overstyrt = Object.values(posts).find(p=>p._genKey===noekkel&&p.manueltOverstyrt);
        if(overstyrt) return; // behold overstyrt versjon

        const prognosePost = {
          name:                item.name,
          amount:              budgetAmount,
          direction:           "out",
          date:                datoStr,
          type:                meta.oppforsel || "fast",
          kilde:               "generator",
          sourceBudgetItemId:  item.id,
          sourceBudgetGroupId: gruppe.id,
          sourceType:          "kostnader",
          sourceGroup:         gruppe.label,
          owner:               meta.eier || "Felles",
          level:               meta.niva || "nodvendig",
          erEstimat:           meta.oppforsel === "variabel" && !erFaktisk,
          _genKey:             noekkel,
          generatedAt:         genTs,
        };

        const id = uid();
        posts[id] = {...prognosePost, id};
      });
    });
  });

  // ── Spareposter (Sparing, etappe 4) ─────────────────────────────
  // Egen prognosekilde: paavirker likviditetsprognosen (direction:"out",
  // samme mekanikk som kostnader), men telles ALDRI som Kostnader —
  // sourceType:"sparing" skiller dem tydelig, og ingen kostnadsvisning
  // leser posts fra Generator i det hele tatt (Kostnader beregner sine
  // egne tall fra hendelser, uavhengig av dette). Tillater EKSPLISITT
  // et negativt budsjettbelop (i motsetning til kostnadsgrenen, som
  // krever budgetAmount>0) — en negativ sparepost representerer et
  // planlagt uttak FRA sparing, og skal gi motsatt fortegn i
  // likviditetsregnestykket. calcSpillerom trenger ingen endring for
  // dette utover den generelle periodegrensen: den summerer "amount"
  // med sitt eget fortegn uansett kilde, saa et negativt "out"-belop
  // trekker fra utbetalinger og dermed OKER spillerom, nokyaktig som
  // et uttak skal.
  if(sparingGroups) {
    sparingGroups.forEach(gruppe => {
      gruppe.items.forEach(item => {
        const meta = item.meta;
        if(!meta || !meta.automatisk) return;
        if(!meta.forfallsdag) return;
        const dag3 = parseInt(meta.forfallsdag);
        maanedsListe.forEach(({aar, maaned}) => {
          const monthData = item.months && item.months[maaned];
          if(!monthData) return;
          const budgetAmount = (monthData.spent && monthData.spent !== 0)
            ? monthData.spent : monthData.budget;
          if(!budgetAmount) return; // kun 0/mangler ekskluderes -- negativt tillates bevisst
          const erFaktisk = !!(monthData.spent && monthData.spent !== 0);
          const dato3 = new Date(aar, maaned, dag3);
          if(!innenforPeriode(dato3)) return;
          const datoStr3 = dato3.toISOString().slice(0,10);
          const noekkel3 = "spar_"+item.id+"_"+aar+"_"+maaned+"_"+dag3;

          const overstyrt = Object.values(posts).find(p=>p._genKey===noekkel3&&p.manueltOverstyrt);
          if(overstyrt) return; // behold manuelt overstyrt versjon

          const sparepost = {
            name:                 item.name,
            amount:               budgetAmount,
            direction:            "out",
            date:                 datoStr3,
            type:                 meta.oppforsel || "fast",
            kilde:                "generator",
            sourceSparingItemId:  item.id,
            sourceSparingGroupId: gruppe.id,
            sourceId:             item.id,
            sourceType:           "sparing",
            sourceGroup:          gruppe.label,
            likviditet:           meta.likviditet || "avsatt",
            owner:                meta.eier || "Felles",
            konto:                meta.konto || "Regninger",
            forfallsdag:          meta.forfallsdag,
            erEstimat:            meta.oppforsel === "variabel" && !erFaktisk,
            _genKey:              noekkel3,
            generatedAt:          genTs,
          };
          const sparId = uid();
          posts[sparId] = {...sparepost, id:sparId};
        });
      });
    });
  }

  // ── Inntektsposter ─────────────────────────────────────────────
  if(incomeGroups) {
    incomeGroups.forEach(gruppe => {
      gruppe.items.forEach(inc => {
        const meta = inc.meta||{};
        if(!meta.automatisk) return;
        const dag2 = parseInt(meta.forfallsdag||"");
        if(!dag2) return;
        maanedsListe.forEach(({aar, maaned}) => {
          const mo2 = inc.months && inc.months[maaned];
          const amt = (meta.disponibelt && meta.disponibelt>0) ? meta.disponibelt
                    : (mo2&&mo2.spent>0) ? mo2.spent
                    : (mo2&&mo2.budget>0) ? mo2.budget : 0;
          if(!amt) return;
          const incDato = new Date(aar, maaned, dag2);
          if(!innenforPeriode(incDato)) return;
          const incDatoStr = incDato.toISOString().slice(0,10);
          const incNoekkel = "inc_"+inc.id+"_"+aar+"_"+maaned+"_"+dag2;

          const overstyrt = Object.values(posts).find(p=>p._genKey===incNoekkel&&p.manueltOverstyrt);
          if(overstyrt) return;

          const post = {
            name:        inc.name,
            amount:      amt,
            direction:   "in",
            date:        incDatoStr,
            type:        "inn",
            kilde:       "generator",
            sourceType:  "inntekter",
            sourceGroup: gruppe.label,
            sourceItemId:inc.id,
            owner:       meta.eier||"Felles",
            erEstimat:   !(mo2&&mo2.spent>0) && !meta.disponibelt,
            _genKey:     incNoekkel,
            generatedAt: genTs,
          };
          const incId = uid();
          posts[incId] = {...post, id:incId};
        });
      });
    });
  }
  return posts;
}


// ── Regelmotor (ren funksjon) ────────────────────────────────────
// Motoren kjenner ikke Firebase, UI eller Bankimport.
// Den mottar én transaksjon og en liste med regler, og returnerer beste match.
// Match-type-basert sammenligning — eksplisitt og brukerstyrt (v-
// behandlingsmotor-vnext §3), i stedet for den tidligere fuzzy
// ordoverlapp-heuristikken. "inneholder" er standard (bakoverkompatibelt
// med regler uten matchType satt) og tillater begge retninger, som
// tidligere oppforsel gjorde. Ren funksjon, gjenbrukbar for
// matchtelling for lagring (§3: "vis hvor mange observasjoner...").
// §3: felles prefiks mellom en regels eksisterende monster og en ny
// observasjons tekst — brukt til aa "utvide" en regel i stedet for aa
// lage en ny, naar de sannsynligvis beskriver samme leverandor
// (f.eks. "spotify ab" og "spotify*premium" -> "spotify"). Trimmer til
// siste hele ord, saa vi aldri kutter midt i et.
function fellesPrefiks(a, b) {
  const min = Math.min((a||"").length, (b||"").length);
  let i = 0;
  while(i<min && a[i]===b[i]) i++;
  let prefix = (a||"").slice(0,i);
  const sisteMellomrom = prefix.lastIndexOf(" ");
  if(sisteMellomrom>0 && i<(a||"").length) prefix = prefix.slice(0,sisteMellomrom);
  return prefix.trim();
}

function regelMatcherTekst(rule, tekst) {
  const rPattern = (rule.normalizedPattern||rule.pattern||"").toLowerCase();
  const t = (tekst||"").toLowerCase();
  if(!rPattern || !t) return false;
  const type = rule.matchType || "inneholder";
  if(type==="er_lik")      return t===rPattern;
  if(type==="starter_med") return t.startsWith(rPattern);
  return t.includes(rPattern) || rPattern.includes(t);
}

function findMatchingRule(transaction, rules) {
  if(!transaction || !rules || !rules.length) return {rule:null, confidence:0, begrunnelse:"Ingen regler tilgjengelig"};

  const aktiveRegler = rules.filter(r=>r.active!==false && r.mode!=="disabled");
  if(!aktiveRegler.length) return {rule:null, confidence:0, begrunnelse:"Ingen aktive regler"};

  const tTekst = (transaction.normalizedText||transaction.tekst||"").toLowerCase();

  const scored = aktiveRegler.map(r=>{
    if(!regelMatcherTekst(r, tTekst)) return {rule:r, score:0, begrunnelse:"Ingen tekstlikhet"};
    const type = r.matchType || "inneholder";
    const grunnscore = type==="er_lik" ? 100 : type==="starter_med" ? 85 : 70;
    const begrunnelse = type==="er_lik" ? "Eksakt treff pa normalisert tekst"
      : type==="starter_med" ? "Starter med monsteret"
      : "Monsteret inngar i teksten";
    const vektet = Math.round(grunnscore * ((r.confidence!==undefined?r.confidence:100)/100));
    return {rule:r, score:vektet, begrunnelse};
  }).filter(s=>s.score>0);

  if(!scored.length) return {rule:null, confidence:0, begrunnelse:"Ingen regel matcher denne transaksjonen"};

  scored.sort((a,b)=>b.score-a.score);
  const best = scored[0];
  return {rule:best.rule, confidence:best.score, begrunnelse:best.begrunnelse};
}

// ── v-post-rename: delt target-oppslag for en regel ──────────────
// Lostet ut av RegelSenter sin egen (identiske) lukkede finnMalpost,
// slik at BADE RegelSenter og den nye, rene evaluerReglerMot...
// bruker NOYAKTIG samme oppslagslogikk — ingen egen, parallell
// mal-matcher. Sok-rekkefolgen budget->income->sparing er uendret
// fra originalen (se Sparing, etappe 3).
function finnMalpostForRegel(regel, budgetGroups, incomeGroups, sparingGroups) {
  for(const g of (budgetGroups||[])) {
    const it = (g.items||[]).find(x=>x.id===regel.targetId);
    if(it) return {item:it, kildeType:"budget", gruppeId:g.id};
  }
  for(const g of (incomeGroups||[])) {
    const it = (g.items||[]).find(x=>x.id===regel.targetId);
    if(it) return {item:it, kildeType:"income", gruppeId:g.id};
  }
  for(const g of (sparingGroups||[])) {
    const it = (g.items||[]).find(x=>x.id===regel.targetId);
    if(it) return {item:it, kildeType:"sparing", gruppeId:g.id};
  }
  return null;
}

// ── v-post-rename: motor foerst, ren funksjon ─────────────────────
// Vurderer dagens AKTIVE regelsett paa nytt mot uavklarte
// transaksjoner. Skriver INGENTING selv — returnerer kun en plan.
// Gjenbruker eksisterende findMatchingRule (samme "beste regel"-
// logikk som import/manuell bruker) og finnHendelseForTransaksjon
// (den autoritative "er dette faktisk ferdig"-sjekken).
//
// Kandidat = transaksjon UTEN en reell FERDIG hendelse. Dette
// inkluderer bevisst den kjente legacy-tilstanden status:"matchet"
// UTEN hendelse (den gjor IKKE en transaksjon oekonomisk ferdig —
// se loesEffektivStatus/kommentaren der), OG paa-vent-hendelser
// (status:"pa_vent" er ALDRI "ferdig"). Ignorert og intern
// overforing ekskluderes, samme kriterium som "Vurdering"-koen
// allerede bruker.
//
// For hver kandidat:
// - ingen regel matcher -> "ingen_treff"
// - regel matcher, men target finnes ikke -> "mal_mangler" (ALDRI
//   fallback til en post med lignende navn)
// - regel matcher, hendelse er paa vent -> "forslag" (aarsak:
//   "pa_vent") — en eksplisitt brukerbeslutning overskrives aldri
//   stille, uansett regelens mode
// - regel matcher, mode==="auto" -> "auto"
// - regel matcher, mode==="suggest"|"review" -> "forslag" (begge
//   modes betyr i praksis "krev bekreftelse", behandlet likt her)
function evaluerReglerMotUavklarteTransaksjoner(transaksjoner, hendelser, rules, budgetGroups, incomeGroups, sparingGroups) {
  const kandidater = (transaksjoner||[]).filter(t => {
    if(t.status==="ignorert") return false;
    if(t.behandlingstype==="intern_overforing") return false;
    const h = finnHendelseForTransaksjon(hendelser, t.id);
    if(h && h.status==="ferdig") return false; // reelt ferdig -- den viktigste idempotensgrensen
    return true;
  });

  const resultater = kandidater.map(t => {
    const h = finnHendelseForTransaksjon(hendelser, t.id);
    const erPaaVent = !!(h && h.status==="pa_vent");

    const tTekst = t.normalizedText || normaliserTransaksjonstekst(t.tekst||"");
    const treff = findMatchingRule({normalizedText:tTekst}, rules||[]);

    if(!treff.rule) {
      return {transaksjonId:t.id, utfall:"ingen_treff", regel:null, target:null, aarsak:null};
    }

    const regel = treff.rule;
    const target = finnMalpostForRegel(regel, budgetGroups, incomeGroups, sparingGroups);

    if(!target) {
      return {transaksjonId:t.id, utfall:"mal_mangler", regel, target:null, aarsak:null};
    }

    if(erPaaVent) {
      return {transaksjonId:t.id, utfall:"forslag", regel, target, aarsak:"pa_vent"};
    }

    if(regel.mode==="auto") {
      return {transaksjonId:t.id, utfall:"auto", regel, target, aarsak:null};
    }

    return {transaksjonId:t.id, utfall:"forslag", regel, target, aarsak:regel.mode};
  });

  return {
    vurdert:    resultater.length,
    ingenTreff: resultater.filter(r=>r.utfall==="ingen_treff"),
    auto:       resultater.filter(r=>r.utfall==="auto"),
    forslag:    resultater.filter(r=>r.utfall==="forslag"),
    malMangler: resultater.filter(r=>r.utfall==="mal_mangler"),
    alle:       resultater,
  };
}

// ── v-post-rename: byggKjorReglerEndringsplan — ÉN sann,
// deterministisk plan, brukt til BADE forhaandsvisning OG selve
// skrivingen (skrivEndringsplan under). UI-et trenger dermed aldri
// gjette hva skrivingen faktisk vil gjore — planen ER svaret.
// Ren funksjon. For "auto" bygges fordelingen HER (via
// byggFordelingFraPost, samme fortegnslogikk som alltid), saa
// forhaandsvisningen viser noyaktig det belopet som faktisk skrives.
// hendelseId genereres ogsaa her (uid() er det eneste ikke-
// deterministiske elementet i hele planen — se
// erEndringsplanUendret under for hvorfor dette er trygt aa se bort
// fra ved sammenligning).
function byggKjorReglerEndringsplan(evaluering, transaksjoner) {
  const linjer = [];

  evaluering.auto.forEach(r => {
    const t = (transaksjoner||[]).find(x=>x.id===r.transaksjonId);
    if(!t) {
      linjer.push({transaksjonId:r.transaksjonId, handling:"auto", skalSkrives:false,
        regel:r.regel, target:r.target, transaksjon:null, fordeling:null, hendelseId:null});
      return;
    }
    const post = {
      id: r.regel.targetId, name: r.regel.targetName,
      retning: r.target.kildeType==="income" ? "inn" : "ut",
      plasseringType: r.target.kildeType==="sparing" ? "sparing" : undefined,
    };
    const fordeling = byggFordelingFraPost(post, t.belop, [{person:"Felles",prosent:100}], t.retning);
    linjer.push({transaksjonId:t.id, handling:"auto", skalSkrives:true,
      regel:r.regel, target:r.target, transaksjon:t, fordeling, hendelseId:uid()});
  });

  evaluering.forslag.forEach(r => {
    const t = (transaksjoner||[]).find(x=>x.id===r.transaksjonId) || null;
    if(r.aarsak==="pa_vent") {
      linjer.push({transaksjonId:r.transaksjonId, handling:"forslag_pa_vent", skalSkrives:false,
        regel:r.regel, target:r.target, transaksjon:t, fordeling:null, hendelseId:null});
      return;
    }
    linjer.push({transaksjonId:r.transaksjonId, handling:"forslag", skalSkrives:true,
      regel:r.regel, target:r.target, transaksjon:t, fordeling:null, hendelseId:null});
  });

  evaluering.malMangler.forEach(r => {
    const t = (transaksjoner||[]).find(x=>x.id===r.transaksjonId) || null;
    linjer.push({transaksjonId:r.transaksjonId, handling:"mal_mangler", skalSkrives:false,
      regel:r.regel, target:null, transaksjon:t, fordeling:null, hendelseId:null});
  });

  return linjer;
}

// Sammenligner to endringsplaner SEMANTISK — ignorerer bevisst
// hendelseId (uid(), alltid nytt for hver plan-bygging) og eventuelle
// tidsstempler. Brukes til aa avgjore om planen brukeren faktisk saa
// fortsatt stemmer med live state rett for skriving.
function erEndringsplanUendret(planA, planB) {
  if(planA.length!==planB.length) return false;
  const noekkel = (l) => JSON.stringify({
    transaksjonId:l.transaksjonId, handling:l.handling, skalSkrives:l.skalSkrives,
    regelId:l.regel?l.regel.id:null,
    targetId:l.target&&l.target.item?l.target.item.id:null,
    fordeling:l.fordeling?{plasseringId:l.fordeling.plasseringId,plasseringType:l.fordeling.plasseringType,belop:l.fordeling.belop}:null,
  });
  const a = planA.map(noekkel).sort();
  const b = planB.map(noekkel).sort();
  return JSON.stringify(a)===JSON.stringify(b);
}

// Skriver en endringsplan som allerede er godkjent — bruker planens
// EGNE fordeling/hendelseId direkte, bygger ALDRI noe paa nytt her.
// Dette er selve garantien: det brukeren godkjente er byte-for-byte
// det som skrives.
function skrivEndringsplan(plan, transaksjoner) {
  const naa = new Date().toISOString();
  const nyeHendelser = [];
  const oppdateringer = new Map();

  plan.forEach(l => {
    if(!l.skalSkrives) return;
    if(l.handling==="auto") {
      nyeHendelser.push({
        id:l.hendelseId, status:"ferdig", paaVentAarsak:null,
        transaksjonId:l.transaksjonId, receiptId:null,
        fordelinger:[l.fordeling],
        dato:l.transaksjon.dato, regelId:l.regel.id, opprettet:naa, oppdatert:naa,
      });
      oppdateringer.set(l.transaksjonId, {hendelseId:l.hendelseId});
    } else if(l.handling==="forslag") {
      oppdateringer.set(l.transaksjonId, {
        status:"krever_vurdering",
        matchetMot:l.target.item.id, matchetNavn:l.regel.targetName,
        laertKobling:{budgetItemId:l.target.item.id, navn:l.regel.targetName, gruppe:l.target.gruppeId, flerbruk:true},
      });
    }
  });

  const nyeTransaksjoner = (transaksjoner||[]).map(t => {
    const oppdatering = oppdateringer.get(t.id);
    return oppdatering ? {...t, ...oppdatering} : t;
  });

  return {nyeTransaksjoner, nyeHendelser};
}

// ── Etterbehandling, etappe 1 — lart regelskriving, lofted ut av
// BankimportScreen. Ren funksjon: mottar dagens regelliste + hva som
// skal laeres, returnerer den NYE regellisten. Orkestreringen
// (setRules(prev=>...)) gjores av kalleren — samme mønster som
// byggFordelingFraPost/beregnFaktiskTotalerFraHendelser allerede
// bruker. Gjor det mulig aa laere en regel fra et hvilket som helst
// sted i appen (Bankimport i dag, korrigeringspanelet i etappe 3),
// uten aa duplisere logikken. Atferd uendret — kun flyttet.
function oppdaterReglerVedLaering(rules, transaksjon, post, multiUse) {
  const normPattern = normaliserTransaksjonstekst(transaksjon.tekst);
  const eksisterende = (rules||[]).find(r=>r.targetId===post.id && regelMatcherTekst(r, normPattern));
  const naa = new Date().toISOString();
  if(eksisterende) {
    return (rules||[]).map(r=>r.id!==eksisterende.id?r:{
      ...r,
      timesUsed:(r.timesUsed||0)+1,
      lastMatched:naa,
      updatedAt:naa,
      multiUse: multiUse!==undefined ? !!multiUse : r.multiUse,
      mode: (multiUse!==undefined?!!multiUse:r.multiUse) ? "review" : "auto",
    });
  }
  const nyRegel = {
    id: uid(),
    pattern: transaksjon.tekst,
    normalizedPattern: normPattern,
    matchType: "inneholder", // §3: eksplisitt, brukerstyrt — se regelMatcherTekst
    targetType: post.plasseringType || (post.retning==="inn" ? "income" : "budget"),
    targetId: post.id,
    targetName: post.name,
    targetGruppe: post.gruppe,
    mode: multiUse ? "review" : "auto",
    confidence: 100,
    timesUsed: 1,
    lastMatched: naa,
    multiUse: !!multiUse,
    active: true,
    createdAt: naa,
    updatedAt: naa,
  };
  return [...(rules||[]), nyRegel];
}

// (createActualFromTransaction er fjernet. Den var
// kun brukt av gjorImport sin automatisk-lart-match-ved-import-vei,
// som na oppretter en hendelse i stedet. Ingen gjenvaerende kallere.)

// ── Fordeling som grunnstruktur (v-post-rename) ────────────────
// En observasjon kan plasseres pa én eller flere plasseringer samtidig
// — splitt er ikke en egen arbeidsflyt, bare et mer presist svar pa
// "hvor horer denne hjemme". Bygger én Actual-post PER fordelingslinje,
// samme monster som byggActualFraKvitteringSplitter allerede beviser
// (deterministisk id, ett-linje-fordeling er strukturelt identisk med
// "ingen splitt" — ingen egen kodevei for det enkle tilfellet).
// Hver linjes EGEN retning (fra dens plassering) avgjor fortegn —
// samme refusjon-mekanisme som createActualFromTransaction, na anvendt
// per linje i stedet for kun pa hele transaksjonen.
// (byggActualFraFordelinger er fjernet. Ingen
// gjenvaerende kallere etter at kobleKvitteringTilTransaksjon og
// migrerHistoriskKobling ble skrevet om til aa bygge hendelser direkte,
// uten aa ga via Actual i det hele tatt.)

// Bygger fordelinger-formatet direkte fra en kvitterings splitter — den
// bro som lar kvitteringens plassering og ansvar overfores direkte til
// en hendelse. Kvitteringen "eier" plasseringen og ansvaret; dette gjor
// bare formatet forstaelig for hendelsesmodellen, uten aa duplisere
// selve byggelogikken (§1/§2/§4 i oppdraget — én felles modell).
function fordelingerFraKvitteringSplits(splits) {
  return (splits||[]).map(sp => ({
    post: {
      id: sp.targetId, name: sp.targetName,
      retning: sp.targetType==="income" ? "inn" : "ut",
    },
    belop: sp.amount||0,
    eiere: (sp.eiere && sp.eiere.length>0) ? sp.eiere : [{person:"Felles",prosent:100}],
  }));
}

// ── Etterbehandling, etappe 4 — synkroniseringsgapet (ren funksjon) ──
// Naar en ALLEREDE koblet kvittering redigeres (total/splits/
// allocationMode/ansvar), skal den tilknyttede hendelsen ALLTID
// oppdateres til aa reflektere kvitteringens NAVAERENDE innhold —
// hendelsen kan ikke vaere sannhetskilde for budsjettberegningen
// samtidig som en redigering av kvitteringen lar den bli utdatert.
// Kobling verifiseres BEGGE veier for hver skriving; finnes ingen
// gyldig kobling, returneres en feil og INGENTING skal skrives —
// ingen automatisk reparasjon, ingen ny hendelse, ingen fallback.
// Ikke koblet i det hele tatt (hendelseId mangler) -> ingen synk
// nodvendig, ingen feil (dette er den normale, ikke-koblede tilstanden).
function byggSynkronisertKvitteringOgHendelse(receipt, felter, hendelser) {
  const oppdatertReceipt = {...receipt, ...felter, updatedAt:new Date().toISOString()};

  if(!receipt.hendelseId) {
    return {feil:null, nyReceipt:oppdatertReceipt, nyHendelse:null};
  }

  const hendelse = (hendelser||[]).find(h=>h.id===receipt.hendelseId);
  if(!hendelse) {
    return {feil:"Fant ikke hendelsen denne kvitteringen skal være koblet til. Endringen ble ikke lagret.", nyReceipt:null, nyHendelse:null};
  }
  if(hendelse.receiptId !== receipt.id) {
    return {feil:"Hendelsen peker ikke tilbake på denne kvitteringen (asymmetrisk kobling). Endringen ble ikke lagret.", nyReceipt:null, nyHendelse:null};
  }

  const fordelinger = fordelingerFraKvitteringSplits(oppdatertReceipt.splits).map(f=>({
    plasseringId: f.post.id, plasseringType: f.post.retning==="inn" ? "income" : "budget",
    plasseringNavn: f.post.name, belop: f.belop, eiere: f.eiere,
  }));
  const oppdatertHendelse = {
    ...hendelse, status:"ferdig", paaVentAarsak:null, fordelinger, oppdatert:new Date().toISOString(),
  };
  return {feil:null, nyReceipt:oppdatertReceipt, nyHendelse:oppdatertHendelse};
}

// (migrerHistoriskKobling er fjernet. Migreringen
// av historiske kvittering-koblinger er bekreftet fullfort. Ingen
// gjenvaerende kallere.)


// Jevn ansvarsfordeling mellom valgte personer — 100% ved én person,
// jevnt delt (med rest lagt pa de forste) ved flere. Utvides automatisk
// naar BUDGET_EIER faar flere navn — ingen kode her forutsetter nokyaktig
// to personer.
function jevnFordelEiere(personer) {
  if(!personer||personer.length===0) return [];
  const grunn = Math.floor(100/personer.length);
  const rest = 100 - grunn*personer.length;
  return personer.map((p,i)=>({person:p, prosent: grunn + (i<rest?1:0)}));
}

// ── BelopFelt (delt komponent) ────────────────────────────────────
// Konsoliderer tre nesten identiske belopfelt (kvitteringens totalbelop,
// kvitteringens splittbelop, transaksjonens fordelingsbelop) til én.
// Lokal utkast-state, lagres kun ved blur/Enter — ALDRI per tastetrykk
// (§8 i oppdraget: roten til "kan bare skrive ett siffer om gangen").
// Synkroniserer fra utsiden naar verdi endres UTEN at brukeren skriver
// her selv — nodvendig for restbelop-linjen (§1), som oppdateres naar en
// annen linje endres, ikke via egen inntasting.
function BelopFelt({verdi, onSave, redigerbar, style}) {
  const [utkast,setUtkast] = useState(String(verdi!=null?verdi:0));
  React.useEffect(()=>{ setUtkast(String(verdi!=null?verdi:0)); }, [verdi]);
  if(redigerbar===false) {
    return <div style={style}>{new Intl.NumberFormat("nb-NO",{maximumFractionDigits:0}).format(verdi||0)}</div>;
  }
  const lagre = () => onSave(parseFloat(String(utkast).replace(",","."))||0);
  return (
    <input type="text" inputMode="decimal" value={utkast}
      onFocus={e=>e.target.select()}
      onChange={e=>setUtkast(e.target.value)}
      onBlur={lagre}
      onKeyDown={e=>{ if(e.key==="Enter"){ lagre(); e.target.blur(); } }}
      style={style}/>
  );
}

// ── Restbelop ved splitt (delt mellom banktransaksjoner og kvitteringer) ──
// Siste linje i en fordelings-/splittliste er ALDRI brukerredigerbar —
// den er alltid totalbelopet minus summen av de andre linjene. Brukeren
// skal aldri regne ut restbelopet selv. Feltnavnet ("belop" for
// transaksjon-fordelinger, "amount" for kvitteringssplitter) er
// parametrisert, slik at samme rene funksjon dekker begge —
// konsolidering fremfor to parallelle implementasjoner.
function beregnRestPaaSisteLinje(linjer, totalBelop, felt) {
  if(!linjer || linjer.length===0) return linjer||[];
  const sumUtenSiste = linjer.slice(0,-1).reduce((s,l)=>s+(l[felt]||0),0);
  const rest = (totalBelop||0) - sumUtenSiste;
  return linjer.map((l,i)=> i===linjer.length-1 ? {...l, [felt]:rest} : l);
}

// ── AnsvarChips (delt komponent) ──────────────────────────────────
// Ansvarsfordeling for ÉN fordelingslinje — brukt identisk av VisRad
// (banktransaksjonens fordelinger) OG KvitteringDetalj (kvitteringens
// splitter). Én kilde til denne UI-en, ikke to parallelle
// implementasjoner (kvittering og banktransaksjon skal bruke samme
// fordelingsmodell). Kjenner ikke til hvor eiere-listen faktisk
// lagres — kalleren avgjor det via onChange.
function AnsvarChips({eiere, onChange}) {
  return (
    <div style={{display:"flex",gap:4,flexWrap:"wrap",marginTop:6}}>
      {BUDGET_EIER.map(person=>{
        const valgt = (eiere||[]).find(e=>e.person===person);
        return (
          <button key={person} onClick={()=>{
              const naa = (eiere||[]).map(e=>e.person);
              const erValgt = naa.includes(person);
              if(erValgt && naa.length===1) return; // ma ha minst én
              const nye = erValgt ? naa.filter(p=>p!==person) : [...naa, person];
              onChange(jevnFordelEiere(nye));
            }}
            style={{padding:"3px 8px",borderRadius:6,fontSize:10,cursor:"pointer",
              fontWeight:valgt?600:400,
              background:valgt?P.hazelXL:"transparent",
              color:valgt?P.hazel:P.dust,
              border:"1px solid "+(valgt?P.hazel:P.border)}}>
            {person}{valgt&&eiere.length>1?` ${valgt.prosent}%`:""}
          </button>
        );
      })}
    </div>
  );
}

// ── Actual-totals-motor (ren funksjon) ───────────────────────────
// Motoren kjenner ikke Firebase, UI eller Budsjett.
// Mottar Actual-poster, returnerer summer per targetId.
// Motoren er fortsatt ren: mottar Actual-poster (og valgfritt en liste over
// gyldige transactionId-er), returnerer summer per targetId. Den kjenner
// ikke Firebase eller UI — kallende kode er ansvarlig for aa sende inn
// riktig data.
// ── Hendelsesmodell (Fase 4, etappe 1) — rene funksjoner ─────────
// Additivt: ingenting kaller disse ennaa. calculateActualTotals under
// er ikke rort, og har fortsatt sine eksisterende kallere frem til
// etappe 2 tar dem over.
//
// En hendelse: {id, status:"uplassert"|"pa_vent"|"ferdig", paaVentAarsak,
//   transaksjonId, receiptId, fordelinger:[{plasseringId,plasseringType,
//   plasseringNavn,belop,eiere}], dato, regelId, opprettet, oppdatert}.
// dato er denormalisert fra den primaere observasjonen ved opprettelse —
// unngaar et oppslag mot transaksjoner/receipts for hver eneste
// budsjettvisning. Fordelingens belop er allerede korrekt signert
// (samme fortegn-logikk som byggActualFraFordelinger brukte) — ingen
// signering skjer ved lesing.

// Erstatter calculateActualTotals: summerer direkte fra hendelser i
// stedet for en separat, lagret Actual-projeksjon. Kun ferdige
// hendelser telles. gyldigeObservasjonIder er valgfri, som i den gamle
// funksjonen — en hendelse uten NOEN gyldig observasjon (verken
// transaksjon eller kvittering finnes lenger) telles ikke med.
// Delt, ren hjelpefunksjon — DEN ene regelen for om en historisk
// targetId/plasseringId horer til en gitt, gjeldende budsjettpost.
// Matcher enten mot postens egen aktive id, ELLER mot en av postens
// legacyIds (satt av Kostnadsstruktur v2-flyttingen ved sammenslaaing
// av flere gamle poster til en). Brukes overalt en gammel id skal
// resolve til dagens aktive post — se hentFaktiskForPost og
// finnHendelserForPost.
const budsjettpostMatcherId = (post, id) =>
  post.id === id || (post.legacyIds||[]).includes(id);

// Summerer actualTotals (en {id: belop}-map fra
// beregnFaktiskTotalerFraHendelser, nokler er raa, historiske
// plasseringId-er) for EN post, paa tvers av dens id og eventuelle
// legacyIds. Returnerer undefined naar ingenting matcher i det hele
// tatt — samme "ingen faktisk-data funnet"-signal som den direkte
// hentFaktiskForPost(actualTotals,it)-oppslaget hadde for, saa eksisterende fallback-
// til-budsjettert-belop-logikk (`!==undefined ? ... : mo.spent`)
// fortsetter aa virke uendret paa kallestedene.
const hentFaktiskForPost = (actualTotals, post) => {
  if(!actualTotals) return undefined;
  let sum = 0, funnet = false;
  Object.keys(actualTotals).forEach(id => {
    if(budsjettpostMatcherId(post, id)) { sum += actualTotals[id]; funnet = true; }
  });
  return funnet ? sum : undefined;
};

function beregnFaktiskTotalerFraHendelser(hendelser, monthKey, gyldigeObservasjonIder) {
  const totals = {};
  (hendelser||[]).forEach(h=>{
    if(!h || h.status!=="ferdig") return;
    if(gyldigeObservasjonIder!==undefined) {
      // v-post-rename: en manuelt registrert hendelse har
      // bevisst verken transaksjonId eller receiptId (det finnes ingen
      // observasjon aa bekrefte mot) — den er sin egen, selvstendige
      // kilde til sannhet, og skal derfor ALDRI holdes utenfor bare
      // fordi ingen bankobservasjon/kvittering finnes for den.
      const harGyldigObservasjon = h.kilde==="manuell" ||
        (h.transaksjonId && gyldigeObservasjonIder.has(h.transaksjonId)) ||
        (h.receiptId && gyldigeObservasjonIder.has(h.receiptId));
      if(!harGyldigObservasjon) return;
    }
    if(monthKey!==undefined && monthKey!==null) {
      if(!h.dato) return;
      if(h.dato.slice(0,7)!==monthKey) return;
    }
    (h.fordelinger||[]).forEach(f=>{
      if(!f.plasseringId) return;
      if(!totals[f.plasseringId]) totals[f.plasseringId] = 0;
      totals[f.plasseringId] += (f.belop||0);
    });
  });
  return totals;
}

// ── Etterbehandling, etappe 2 — drill-down (rent lesende) ────────
// ── Etterbehandling, etappe 5 — opprydding ───────────────────────
// Delt, ren funksjon for "alle budsjett-/inntektsposter, ekskludert
// arkiverte" i {id, name, gruppe, targetType, eier}-formen brukt til
// kvittering-splitt-sok. Konsoliderer tre tidligere byte-identiske
// forekomster (KvitteringInnboksScreen, BudsjettScreen, InntekterScreen)
// — ingen atferdsendring, kun én kilde til denne logikken na.
// Bankimports EGEN allePoster (retning+belop) og KorrigerHendelseModals
// allePoster (retning, uten belop) har en annen form for et annet
// formal og er bevisst IKKE slatt sammen med denne. GeneratorSenters
// allePoster viser bevisst ogsa arkiverte poster (adminoversikt) og
// er av samme grunn heller ikke beroert.
function byggAlleMalPoster(budgetGroups, incomeGroups) {
  return [
    ...(budgetGroups||[]).flatMap(g=>g.items.filter(it=>!(it.meta&&it.meta.arkivert)).map(it=>({
      id:it.id,name:it.name,gruppe:g.label,targetType:"budget",eier:(it.meta&&it.meta.eier)||"Felles",
    }))),
    ...(incomeGroups||[]).flatMap(g=>g.items.filter(it=>!(it.meta&&it.meta.arkivert)).map(it=>({
      id:it.id,name:it.name,gruppe:g.label,targetType:"income",eier:(it.meta&&it.meta.eier)||"Felles",
    }))),
  ];
}

// Sparing, etappe 1: samme mønster som byggAlleMalPoster, men for
// sparegruppene. Postobjektene faar et eksplisitt plasseringType:
// "sparing" — dette er kroken byggFordelingFraPost sin nye
// plasseringType-overstyring leser, slik at en fordeling mot en
// sparepost korrekt merkes "sparing" og ikke faller tilbake til den
// retningsbaserte "budget"-avledningen (en sparepost har retning:"ut",
// akkurat som en kostnadspost, saa retning alene kan ikke skille dem).
function byggAlleSparingPoster(sparingGroups) {
  return (sparingGroups||[]).flatMap(g=>g.items.filter(it=>!(it.meta&&it.meta.arkivert)).map(it=>({
    id:it.id, name:it.name, gruppe:g.label, retning:"ut", plasseringType:"sparing",
    eier:(it.meta&&it.meta.eier)||"Felles",
  })));
}

// Finner hendelsene som faktisk bidrar til én bestemt post for én
// bestemt maaned — samme filterkriterier som
// beregnFaktiskTotalerFraHendelser (status/maaned/gyldig-observasjon),
// slik at drill-downens rader alltid summerer til nokyaktig det
// budsjettvisningen viser. For en splittet hendelse vises KUN den
// fordelingslinjen som horer til denne posten — ikke hele hendelsens
// sum. plasseringNavn hentes fra selve fordelingen (denormalisert ved
// plassering), ikke fra dagens budgetGroups/incomeGroups — derfor
// vises historisk navn korrekt selv om posten senere er omdopt eller
// arkivert.
function finnHendelserForPost(hendelser, transaksjoner, receipts, post, monthKey, gyldigeObservasjonIder) {
  const rader = [];
  (hendelser||[]).forEach(h=>{
    if(!h || h.status!=="ferdig") return;
    if(gyldigeObservasjonIder!==undefined) {
      // v-post-rename: samme unntak som beregnFaktiskTotalerFraHendelser.
      const harGyldigObservasjon = h.kilde==="manuell" ||
        (h.transaksjonId && gyldigeObservasjonIder.has(h.transaksjonId)) ||
        (h.receiptId && gyldigeObservasjonIder.has(h.receiptId));
      if(!harGyldigObservasjon) return;
    }
    if(monthKey!==undefined && monthKey!==null) {
      if(!h.dato || h.dato.slice(0,7)!==monthKey) return;
    }
    (h.fordelinger||[]).forEach(f=>{
      if(!budsjettpostMatcherId(post, f.plasseringId)) return;
      const transaksjon = h.transaksjonId ? (transaksjoner||[]).find(t=>t.id===h.transaksjonId) : null;
      const receipt = h.receiptId ? (receipts||[]).find(r=>r.id===h.receiptId) : null;
      const tekst = transaksjon ? (transaksjon.tekst||"(ukjent)")
        : receipt ? (receipt.merchant||"(ukjent)")
        : h.kilde==="manuell" ? (h.kommentar||"Manuelt registrert")
        : "(observasjon mangler)";
      rader.push({
        hendelseId: h.id,
        dato: h.dato,
        tekst,
        belop: f.belop||0,
        plasseringNavn: f.plasseringNavn||null,
        eiere: f.eiere||[],
        erKvittering: !!h.receiptId,
        erManuell: h.kilde==="manuell",
        receiptId: h.receiptId||null,
      });
    });
  });
  rader.sort((a,b)=>new Date(b.dato||0)-new Date(a.dato||0));
  return rader;
}

// ── v-post-rename: ren, global variant av samme legacyIds-
// bevisste oppslag som BankimportScreen sin lokale
// finnAktivPostFraGammelId allerede bruker (budsjettpostMatcherId) —
// her eksplisitt parametrisert (ingen closure), siden
// byggHistorikkEksport skal vaere en fullstendig ren funksjon uten
// avhengighet til noen bestemt skjermkomponent. Returnerer null uten
// aa gjette naar ingen aktiv post matcher.
// v-post-rename-krysstype: en historisk plassering kan ha blitt
// FLYTTET til en annen hovedtype siden hendelsen ble lagret (t.d.
// gamle spareposter som lå under "budget" for Sparing fantes som eget
// livsomraade) — historiske hendelser migreres ALDRI, saa
// f.plasseringType forblir det den historisk var. Oppslaget maa
// derfor kunne finne dagens post PAA TVERS av hovedtypene, ikke bare
// i den ene typen hendelsen historisk pekte paa.
//
// A. Forsoker FORST i gruppen historisk plasseringType peker paa —
//    finnes posten der fortsatt, brukes DEN direkte (dette er den
//    opprinnelige, fortsatt gyldige plasseringen — ingen grunn til aa
//    lete videre eller vurdere tvetydighet mot andre typer).
// B+C. Finnes den IKKE der, soekes de andre aktive hovedstrukturene,
//    legacyIds-bevisst (budsjettpostMatcherId). Noyaktig ett treff
//    der -> dette er dagens post, og dens type blir dagens Type.
// E. Mer enn ett treff paa tvers -> IKKE gjett; kalleren merker raden
//    eksplisitt tvetydig.
// D. Ingen treff noe sted -> null (uavklart, som for).
function finnAktivPostForPlassering(plasseringId, plasseringType, budgetGroups, incomeGroups, sparingGroups) {
  if(!plasseringId) return null;

  const typeStrukturer = [
    {type:"budget", grupper:budgetGroups},
    {type:"income", grupper:incomeGroups},
    {type:"sparing", grupper:sparingGroups},
  ];
  const historiskType = plasseringType==="income" ? "income" : plasseringType==="sparing" ? "sparing" : "budget";

  const historiskStruktur = typeStrukturer.find(s=>s.type===historiskType);
  for(const g of (historiskStruktur.grupper||[])) {
    const item = (g.items||[]).find(it=>budsjettpostMatcherId(it, plasseringId));
    if(item) return {navn:item.name, gruppe:g.label, plasseringType:historiskType};
  }

  const treff = [];
  typeStrukturer.filter(s=>s.type!==historiskType).forEach(s=>{
    (s.grupper||[]).forEach(g=>{
      const item = (g.items||[]).find(it=>budsjettpostMatcherId(it, plasseringId));
      if(item) treff.push({navn:item.name, gruppe:g.label, plasseringType:s.type});
    });
  });

  if(treff.length===1) return treff[0];
  if(treff.length>1) return {tvetydig:true};
  return null;
}

const HISTORIKK_TYPE_LABEL = {budget:"Kostnad", income:"Inntekt", sparing:"Sparing"};

// Lesbar eiertekst — "Felles" (én eier, 100%), "Helen" (én eier),
// eller "Helen 50 % | Eivind 50 %" (flere). "Felles" ved manglende
// eiere, samme fallback som resten av appen allerede bruker.
function formaterEierTekst(eiere) {
  if(!eiere || eiere.length===0) return "Felles";
  if(eiere.length===1) return eiere[0].person;
  return eiere.map(e=>e.person+" "+e.prosent+" %").join(" | ");
}
// Maskinvennlig, stabil eierdata — "Helen:50|Eivind:50".
function formaterEierdata(eiere) {
  if(!eiere || eiere.length===0) return "Felles:100";
  return eiere.map(e=>e.person+":"+e.prosent).join("|");
}

// ── v-post-rename: byggHistorikkEksport — REN FUNKSJON ────────
// Ingen DOM, ingen Firebase, ingen React-state. Kun data inn, flat
// radliste ut. ÉN fordeling = ÉN rad (splitt gir flere rader fra
// samme hendelse, aldri summert/slaatt sammen). fordeling.belop
// eksporteres DIREKTE — allerede den ferdige signerte effekten,
// ALDRI fortegnstolket paa nytt her (samme prinsipp som
// beregnFaktiskTotalerFraHendelser: hendelsen er fasit,
// banktransaksjonen er kun kontekst som beriker raden).
// Kun status:"ferdig"-hendelser med minst én fordeling tas med —
// noyaktig samme kriterium som Actual-beregningen bruker, saa
// eksporten alltid representerer samme okonomiske sannhet.
function byggHistorikkEksport(hendelser, transaksjoner, receipts, budgetGroups, incomeGroups, sparingGroups) {
  const rader = [];
  (hendelser||[]).forEach(h=>{
    if(!h || h.status!=="ferdig") return;
    if(!h.fordelinger || h.fordelinger.length===0) return;

    const transaksjon = h.transaksjonId ? (transaksjoner||[]).find(t=>t.id===h.transaksjonId) : null;
    // Kilde avledes fra faktisk EKSISTERENDE felt paa hendelsen — dikter
    // aldri opp en verdi. Bankbaserte hendelser har i dag intet eget
    // kilde-felt i det hele tatt (bekreftet ved kodelesing), saa
    // "bank"/"kvittering" avledes her fra transaksjonId/receiptId.
    const kilde = h.kilde==="manuell" ? "manuell"
      : h.receiptId ? "kvittering"
      : h.transaksjonId ? "bank"
      : "ukjent";

    h.fordelinger.forEach(f=>{
      const aktivPost = finnAktivPostForPlassering(f.plasseringId, f.plasseringType, budgetGroups, incomeGroups, sparingGroups);
      const erTvetydig = !!(aktivPost && aktivPost.tvetydig);
      const oppslagOk = !!aktivPost && !erTvetydig;
      const dato = h.dato || "";

      rader.push({
        "Dato": dato,
        "År": dato ? dato.slice(0,4) : "",
        "Måned": dato ? dato.slice(0,7) : "",
        // v-post-rename-krysstype: Type bygges na fra den
        // RESOLVEREDE, aktive plasseringen naar oppslaget lykkes —
        // ikke lenger blindt fra historisk f.plasseringType. En
        // historisk "budget"-post som i dag ligger under Sparing skal
        // eksporteres som Sparing. Historisk type brukes kun som
        // teknisk fallback naar oppslaget IKKE lykkes.
        "Type": oppslagOk
          ? (HISTORIKK_TYPE_LABEL[aktivPost.plasseringType] || "Kostnad")
          : (HISTORIKK_TYPE_LABEL[f.plasseringType] || "Kostnad"),
        "Livsområde / gruppe": oppslagOk ? aktivPost.gruppe : "Uavklart",
        "Post": oppslagOk ? aktivPost.navn : (f.plasseringNavn||""),
        "Beløp effekt": f.belop||0,
        "Eier": formaterEierTekst(f.eiere),
        "Eierdata": formaterEierdata(f.eiere),
        "Kilde": kilde,
        "Kommentar": h.kommentar||"",
        "Transaksjonstekst": transaksjon ? (transaksjon.tekst||"") : "",
        "Normalisert tekst": transaksjon && transaksjon.normalizedText ? transaksjon.normalizedText : "",
        "Bankbeløp": transaksjon ? transaksjon.belop : "",
        "Bankretning": transaksjon ? (transaksjon.retning||"") : "",
        "Konto": transaksjon ? (transaksjon.konto||"") : "",
        // Transaksjonsmodellen har i dag intet eget importkilde-felt
        // (bekreftet ved kodelesing — mapRad sin "kilde"-parameter
        // brukes kun under selve importen, persisteres aldri paa
        // transaksjonsobjektet) — forblir derfor bevisst tom, per
        // eksplisitt fallback-instruks, aldri gjettet.
        "Importkilde": "",
        "Kvittering": h.receiptId ? "Ja" : "Nei",
        "Hendelse-ID": h.id,
        "Transaksjon-ID": h.transaksjonId||"",
        "Kvittering-ID": h.receiptId||"",
        "Plassering-ID": f.plasseringId,
        // ALLTID original, historisk plasseringType — urort av
        // krysstype-oppslaget, saa sporbarheten til hvordan hendelsen
        // faktisk ble lagret bevares fullt ut.
        "Plasseringstype": f.plasseringType,
        "Regel-ID": h.regelId||"",
        "Oppslag status": oppslagOk ? "OK" : erTvetydig ? "Tvetydig plassering" : "Uavklart plassering",
      });
    });
  });
  return rader;
}

const HISTORIKK_KOLONNER = [
  "Dato","År","Måned","Type","Livsområde / gruppe","Post","Beløp effekt","Eier","Eierdata",
  "Kilde","Kommentar","Transaksjonstekst","Normalisert tekst","Bankbeløp","Bankretning","Konto",
  "Importkilde","Kvittering","Hendelse-ID","Transaksjon-ID","Kvittering-ID","Plassering-ID",
  "Plasseringstype","Regel-ID","Oppslag status",
];

// Standard CSV-escaping (dobbeltsitat-regler): felt som inneholder
// separator, linjeskift eller anforselstegn pakkes i anforselstegn,
// med interne anforselstegn doblet.
function escapeCsvFelt(verdi) {
  const s = verdi===null || verdi===undefined ? "" : String(verdi);
  if(s.includes(";") || s.includes("\n") || s.includes("\r") || s.includes('"')) {
    return '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}

// Norsk Excel-lokalisering forventer komma som desimaltegn naar
// semikolon brukes som feltseparator (semikolon brukes NETTOPP fordi
// komma er opptatt som desimaltegn der) — konverterer derfor kun
// desimaltegnet, uten aa formatere tallet paa noen annen maate (ingen
// tusenskilletegn, ingen avrunding, fortegn og desimaler uendret).
function formaterTallForCsv(tall) {
  if(tall===null || tall===undefined || tall==="") return "";
  return String(tall).replace(".", ",");
}

const HISTORIKK_NUMERISKE_KOLONNER = new Set(["Beløp effekt","Bankbeløp"]);

// ── v-post-rename: byggHistorikkCsv — ogsaa en ren funksjon ──
// Tar den ferdige radlisten (fra byggHistorikkEksport) og returnerer
// en komplett CSV-streng, inkludert UTF-8 BOM og header. Ingen DOM.
function byggHistorikkCsv(rader) {
  const header = HISTORIKK_KOLONNER.map(escapeCsvFelt).join(";");
  const linjer = (rader||[]).map(r =>
    HISTORIKK_KOLONNER.map(k => {
      const verdi = r[k];
      return escapeCsvFelt(HISTORIKK_NUMERISKE_KOLONNER.has(k) ? formaterTallForCsv(verdi) : verdi);
    }).join(";")
  );
  return "\uFEFF" + [header, ...linjer].join("\r\n");
}

// Bygger én fordelingslinje fra en valgt plassering (post), med
// fortegnet allerede riktig utledet — samme refusjon-mekanisme som
// byggActualFraFordelinger: motsatt retning mellom plassering og
// observasjon reduserer i stedet for aa legge til.
// Sparing, etappe 1: post.plasseringType (naar eksplisitt satt av
// kalleren, f.eks. "sparing") overstyrer den retningsbaserte
// avledningen. Kostnader og Inntekter sender aldri dette feltet, saa
// de faller uendret tilbake til den opprinnelige logikken.
function byggFordelingFraPost(post, belop, eiere, observasjonRetning) {
  const motsattRetning = post.retning !== observasjonRetning;
  return {
    plasseringId: post.id,
    plasseringType: post.plasseringType || (post.retning==="inn" ? "income" : "budget"),
    plasseringNavn: post.name,
    belop: motsattRetning ? -(belop||0) : (belop||0),
    eiere: eiere||[],
  };
}

// ── v-post-rename: manuell okonomihendelse uten bank ────
// Ren funksjon. Ingen bankretning finnes aa tolke her — kaller derfor
// byggFordelingFraPost med observasjonRetning=post.retning (samme
// funksjon, ingen ny fortegnslogikk), som garantert gir
// motsattRetning=false og dermed et POSITIVT belop uansett type —
// nettopp semantikken en manuell registrering skal ha (Kostnad 200 kr
// -> +200 Actual, Inntekt 200 kr -> +200 Actual).
// kilde:"manuell" er den eneste markoren som skiller denne fra en
// bankbasert hendelse — transaksjonId/receiptId er bevisst null, IKKE
// en tekstet/tom streng, saa koden aldri later som en observasjon
// finnes. Se beregnFaktiskTotalerFraHendelser/finnHendelserForPost
// for hvordan dette gjenkjennes i Actual-kjeden.
function byggManuellHendelse(dato, post, belop, kommentar, eiere) {
  const naa = new Date().toISOString();
  return {
    id: uid(), status:"ferdig", paaVentAarsak:null,
    transaksjonId: null, receiptId: null,
    fordelinger: [byggFordelingFraPost(post, belop, (eiere&&eiere.length>0)?eiere:[{person:"Felles",prosent:100}], post.retning)],
    dato, regelId: null, kilde:"manuell", kommentar: kommentar||null,
    opprettet: naa, oppdatert: naa,
  };
}

// ── Etterbehandling, etappe 3 — korrigering av en eksisterende
// hendelse (ren funksjon). Brukes av korrigeringspanelet i Budsjett/
// Inntekter. Tar ALLTID utgangspunkt i en hendelse som allerede
// finnes — oppretter ALDRI en ny. id, transaksjonId, receiptId og
// opprettet-tidspunkt bevares uendret via spredningen av
// eksisterendeHendelse; kun status/fordelinger/regelId/oppdatert
// endres. Samme regelId-mekanikk (kun satt naar "laer" er eksplisitt
// valgt) som lagreBehandling allerede bruker i Bankimport.
//
// v-post-rename: KONTRAKT mellom raatt observasjonsbelop og
// lagret hendelseseffekt (fasit for hele modellen, ett sted):
//
// - f.postErEndret===true  -> f.belop er et RAATT observasjonsbelop
//   (ny linje, ELLER en linje der brukeren nettopp har byttet post).
//   Tolkes normalt via byggFordelingFraPost — samme fortegnslogikk
//   som alltid, uendret.
// - f.postErEndret er falsy -> f.belop er ALLEREDE den ferdige,
//   signerte effekten (uendret plassering siden hendelsen ble aapnet,
//   inkludert manuelle hendelser). Brukes DIREKTE, ALDRI fortegnstolket
//   paa nytt — dette var selve rotaarsaken til at et allerede korrekt
//   negativt belop kunne bli negert en gang til og ende motsatt vei.
//
// KorrigerHendelseModal er ansvarlig for aa sette postErEndret riktig
// PER LINJE (se velgPostForLinje/leggTilFordeling der) — denne
// funksjonen stoler blindt paa signalet, ingen egen gjetting her.
function byggKorrigertHendelse(eksisterendeHendelse, transaksjonRetning, utkast) {
  const naa = new Date().toISOString();
  const {type, fordelinger, uklarValg, regelId} = utkast;
  if(type==="uklar") {
    return {
      ...eksisterendeHendelse,
      status: "pa_vent",
      paaVentAarsak: uklarValg||null,
      fordelinger: [],
      oppdatert: naa,
    };
  }
  const fordelingerBygget = (fordelinger||[]).map(f =>
    f.postErEndret
      ? byggFordelingFraPost(f.post, f.belop, f.eiere, transaksjonRetning)
      : {
          plasseringId: f.post.id,
          plasseringType: f.post.plasseringType || (f.post.retning==="inn" ? "income" : "budget"),
          plasseringNavn: f.post.name,
          belop: f.belop||0,
          eiere: f.eiere||[],
        }
  );
  return {
    ...eksisterendeHendelse,
    status: "ferdig",
    paaVentAarsak: null,
    fordelinger: fordelingerBygget,
    regelId: regelId!==undefined ? regelId : (eksisterendeHendelse.regelId||null),
    oppdatert: naa,
  };
}

// Oppslag: finn hendelsen som hoerer til en gitt observasjon. Enkle,
// lineaere sok — datamengden (én families okonomi) gjor dette trivielt.
function finnHendelseForTransaksjon(hendelser, transaksjonId) {
  if(!transaksjonId) return null;
  return (hendelser||[]).find(h=>h.transaksjonId===transaksjonId) || null;
}
function finnHendelseForKvittering(hendelser, receiptId) {
  if(!receiptId) return null;
  return (hendelser||[]).find(h=>h.receiptId===receiptId) || null;
}

// (diagnostiserKvitteringHendelse og KVITTERING_DIAGNOSE_KATEGORI_LABEL
// er fjernet. Diagnosen bekreftet at
// alle koblede kvitteringer var korrekt ferdigbehandlet; ingen feil ble
// funnet, saa det midlertidige verktoyet er ikke lenger nodvendig.)

// (calculateActualTotals er fjernet — v-post-rename. Ingen
// gjenvaerende kallere etter at BudsjettScreen/InntekterScreen byttet
// til beregnFaktiskTotalerFraHendelser.)

// ── Kvittering-lukker-bankimport (etappe 1, rene motorer) ────────
// Motorene kjenner ikke Firebase eller UI. De mottar data, returnerer
// data. Selve skrivingen (setHendelser/setReceipts/setTransaksjoner) gjores
// av en tynn orkestreringsfunksjon i komponenten som har tilgang til
// setterne (i dag KvitteringInnboksScreen). Dette er bevisst holdt som
// et eget, samlet lag — ikke spredt i JSX — slik at et fremtidig
// hendelseslag (etappe 2+) kan kalle nokyaktig disse samme motorene.
const BELOPSTOLERANSE_KOBLING = 1; // kr — samme toleranse som ellers i appen (finnMatchForPreview)

// Sjekker om en kvittering er klar til aa lukke en banktransaksjon:
// har en fordeling, og splittsummen stemmer med kvitteringens eget totalbelop.
function erKvitteringKlarForLukking(receipt) {
  if(!receipt) return {klar:false, kode:"mangler_kvittering"};
  if(!receipt.allocationMode || !(receipt.splits&&receipt.splits.length>0)) {
    return {klar:false, kode:"ikke_fordelt"};
  }
  const splitSum = calculateSplitTotal(receipt);
  const total = receipt.total||0;
  if(Math.abs(splitSum-total) > BELOPSTOLERANSE_KOBLING) {
    return {klar:false, kode:"splitt_avvik", detaljer:{splitSum,total}};
  }
  return {klar:true};
}

// Full vurdering av om en kobling kan lukke transaksjonen automatisk,
// eller om det finnes en reell konflikt som krever brukervalg.
// Returnerer alltid {kanKobles, kanLukkes, kode?, detaljer?} — kanKobles
// skiller "lenken kan opprettes" fra "transaksjonen kan ferdigbehandles",
// siden disse to ikke alltid folger hverandre (§8D i oppdraget).
// v-post-rename: leser hendelser (ikke lenger actual, som er fjernet) — "eksisterende
// Actual fra en annen kilde" er na "eksisterende hendelse som ikke
// allerede tilhorer DENNE kvitteringen".
function vurderKvitteringKobling(receipt, transaction, alleHendelser, alleReceipts) {
  if(!receipt || !transaction) return {kanKobles:false, kanLukkes:false, kode:"mangler_data"};

  // Blokkerende: transaksjonen er arkivert/ignorert — ikke reaktiver stille.
  if(transaction.status==="ignorert") {
    return {kanKobles:false, kanLukkes:false, kode:"transaksjon_ignorert"};
  }

  const eksisterendeHendelse = finnHendelseForTransaksjon(alleHendelser, transaction.id);

  // Blokkerende: en ANNEN kvittering eier allerede denne hendelsen.
  if(eksisterendeHendelse && eksisterendeHendelse.receiptId && eksisterendeHendelse.receiptId!==receipt.id) {
    return {kanKobles:false, kanLukkes:false, kode:"transaksjon_koblet_annen_kvittering",
      detaljer:{annenKvitteringId:eksisterendeHendelse.receiptId}};
  }

  // Fra her kan lenken alltid opprettes — sporsmalet er om den ogsaa kan LUKKES.
  const fordelt = erKvitteringKlarForLukking(receipt);
  if(!fordelt.klar) {
    return {kanKobles:true, kanLukkes:false, kode:fordelt.kode, detaljer:fordelt.detaljer};
  }

  // Belopet ma stemme mot selve banktransaksjonen.
  if(Math.abs((receipt.total||0) - Math.abs(transaction.belop||0)) > BELOPSTOLERANSE_KOBLING) {
    return {kanKobles:true, kanLukkes:false, kode:"belop_avvik",
      detaljer:{kvitteringTotal:receipt.total, bankBelop:transaction.belop}};
  }

  // Finnes det allerede en FERDIG hendelse for denne transaksjonen fra
  // en ANNEN kilde (vanlig Bankimport-plassering, ikke denne kvitteringen)?
  if(eksisterendeHendelse && eksisterendeHendelse.status==="ferdig" && eksisterendeHendelse.receiptId!==receipt.id) {
    const eksisterendeSum = (eksisterendeHendelse.fordelinger||[]).reduce((s,f)=>s+(f.belop||0),0);
    if(Math.abs(eksisterendeSum-(receipt.total||0)) <= BELOPSTOLERANSE_KOBLING) {
      // Samsvarer -> kan lukkes uten aa duplisere (§8A "samsvar")
      return {kanKobles:true, kanLukkes:true, handling:"bekreft_eksisterende_hendelse"};
    }
    return {kanKobles:true, kanLukkes:false, kode:"transaksjon_har_avvikende_actual",
      detaljer:{eksisterendeSum, kvitteringTotal:receipt.total}};
  }

  return {kanKobles:true, kanLukkes:true, handling:"opprett_ny_hendelse"};
}

// (byggActualFraKvitteringSplitter og synkroniserActualForKobling er
// fjernet — v-post-rename. Kvitteringens splitter konverteres na
// via fordelingerFraKvitteringSplits og gjenbruker byggActualFraFordelinger
// direkte, samme motor som en direkte plassert banktransaksjon bruker.
// Synkroniseringen er forenklet til samme monster som lagreBehandling
// allerede bruker: fjern alt for denne transactionId, sett inn ferskt —
// receiptId trengtes ikke i filteret, siden én transaksjon uansett
// aldri kan vaere lenket til mer enn én kvittering samtidig.)

// ── Kontantflyt-motor (ren funksjon) ─────────────────────────────
// Motoren kjenner ikke Firebase, UI eller Faktisk.
// Budsjettpostenes months[] er alltid autoritative for forventet beloep
// den kalendermaaneden — paymentPattern beskriver kun HVORFOR belopet
// varierer (kvartalsvis/aarlig gir store belop konsentrert til enkelte
// maaneder, med 0 i de andre), det endrer ikke hvordan motoren leser data.
function calculateCommittedCashflow(budgetGroups, valgtMonth) {
  const alleItems = (budgetGroups||[]).flatMap(g=>g.items.map(it=>({...it, gruppe:g.label})));
  const fremtid = [];
  let kumulativ = 0;

  for(let mi = valgtMonth; mi < 12; mi++) {
    let planlagteKostnader = 0;
    const posterDenneManeden = [];

    alleItems.forEach(it=>{
      const mo = it.months && it.months[mi];
      const belop = mo ? (mo.budget||0) : 0;
      if(belop > 0) {
        planlagteKostnader += belop;
        posterDenneManeden.push({id:it.id, name:it.name, gruppe:it.gruppe, belop, paymentPattern:(it.meta&&it.meta.paymentPattern)||"monthly"});
      }
    });

    kumulativ += planlagteKostnader;

    fremtid.push({
      maanedIndex: mi,
      planlagteKostnader,
      planlagteInntekter: 0, // inntekter er ikke del av v1
      kumulativForpliktelse: kumulativ,
      poster: posterDenneManeden,
    });
  }

  return fremtid;
}

// ── Finn neste storre planlagte utbetaling fra en gitt maaned ────
// Hjelpefunksjon bygget paa samme rene data — "storre" defineres her
// som en post med belop > 0 i en fremtidig maaned (inkl. valgt maaned).
// Vurderer kun periodiske/sjeldne poster (quarterly, yearly, senere custom).
// Vanlige loepende maanedskostnader (monthly) er ikke "storre planlagte
// utbetalinger" i denne betydningen — de er allerede en fast, kjent del
// av hverdagsokonomien og skal ikke fremheves her.
function finnNesteStorreUtbetaling(budgetGroups, valgtMonth) {
  const flyt = calculateCommittedCashflow(budgetGroups, valgtMonth);
  for(const mnd of flyt) {
    const relevantePoster = mnd.poster.filter(p=>p.paymentPattern==="quarterly"||p.paymentPattern==="yearly"||p.paymentPattern==="custom");
    if(relevantePoster.length===0) continue;
    const storst = relevantePoster.reduce((a,b)=>b.belop>a.belop?b:a, relevantePoster[0]);
    return {maanedIndex:mnd.maanedIndex, navn:storst.name, belop:storst.belop};
  }
  return null;
}

// ── Kvitteringsmotor (ren funksjon) ──────────────────────────────
// Motoren kjenner ikke Firebase eller UI.
// Mottar en transactionId og en liste med kvitteringer, returnerer
// tilhorende kvittering eller null.
function findReceipt(transactionId, receipts) {
  if(!transactionId || !receipts) return null;
  return receipts.find(r=>r.transactionId===transactionId) || null;
}

// Ren funksjon: summerer splits[] pa en kvittering. Kjenner ikke
// Firebase eller UI.
function calculateSplitTotal(receipt) {
  if(!receipt || !receipt.splits) return 0;
  return receipt.splits.reduce((s,sp)=>s+(sp.amount||0), 0);
}

// Ren funksjon: summerer en liste med kvitteringslinjer (receiptLines).
// Kjenner ikke Firebase eller UI. netAmount = grossAmount - discountAmount
// er beloepet som teller i splitt og senere Faktisk.
function calculateReceiptLineTotals(receiptLines) {
  const linjer = receiptLines||[];
  const itemLinjer = linjer.filter(l=>l.lineType==="item"||!l.lineType);
  const grossTotal = itemLinjer.reduce((s,l)=>s+(l.grossAmount||0), 0);
  const discountTotal = linjer.reduce((s,l)=>s+(l.discountAmount||0), 0);
  const netTotal = itemLinjer.reduce((s,l)=>{
    const net = l.netAmount!==undefined ? l.netAmount : (l.grossAmount||0)-(l.discountAmount||0);
    return s+net;
  }, 0);
  const allocatedTotal = itemLinjer.filter(l=>l.targetId).reduce((s,l)=>{
    const net = l.netAmount!==undefined ? l.netAmount : (l.grossAmount||0)-(l.discountAmount||0);
    return s+net;
  }, 0);
  const remainingToAllocate = netTotal - allocatedTotal;
  return {grossTotal, discountTotal, netTotal, allocatedTotal, remainingToAllocate};
}

// ── Kvitteringsmatch-motor (ren funksjon) ────────────────────────
// Motoren kjenner ikke Firebase eller UI, og har ingen sideeffekter.
// Mottar én kvittering og listen med banktransaksjoner, returnerer
// en sortert liste med kandidater (hoyest score forst).
// Scoren er enkel og forklarbar — kun belop, dato og leverandor.

// Delt normalisering av leverandor-/handelsnavn. Brukes av bade
// kvitteringer (receipt.merchant) og banktransaksjoner (transaction.tekst)
// slik at "REMA1000", "REMA 1000" og "REMA-1000" blir like. Dette skal
// ogsaa vaere normaliseringen OCR og fremtidig bankmatching bruker —
// én felles sannhet, ikke en per-motor variant.
// Delt tekstnormalisering for banktransaksjoner — brukt av bade
// Bankimport (læringsnøkkel, kandidatmatching) og Regelsenteret
// (treff-telling). MAA vaere global: en tidligere versjon var kun
// lokalt definert inni BankimportScreen, som gjorde at Regelsenterets
// tellTreff kastet "normaliserTransaksjonstekst is not defined" —
