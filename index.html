// ── KontoerScreen ─────────────────────────────────────────────────
// Viser tilkoblingsstatus til eksterne kontoer/tjenester. I v1: kun
// Google Drive (for fremtidig kvitteringslagring). Token ligger kun
// i minnet (modul-scope-variabler i lastGapiDriveClient-blokken over)
// — ingen ting lagres i Firebase eller localStorage her.
function KontoerScreen() {
  const [status,setStatus]   = useState("ikke_tilkoblet"); // ikke_tilkoblet | kobler_til | tilkoblet | utlopt | feil
  const [feilmelding,setFeilmelding] = useState("");
  const [diagnostikk,setDiagnostikk] = useState([]);
  const [gapiKlar,setGapiKlar] = useState(false);
  // Merk: access_token fra drive.file-scopet alene gir ikke kontoinfo
  // (navn/e-post) — det ville kreve et ekstra scope (openid/email/profile).
  // Siden vi bevisst holder oss til minst mulig tilgang, vises derfor kun
  // tilkoblingsstatus, ikke hvilken konto som er tilkoblet.

  const logg = (linje) => {
    console.log("[Drive-diagnostikk]", linje);
    setDiagnostikk(prev=>[...prev, linje]);
  };

  // Last gapi-klienten paa forhand, IKKE inni klikk-handleren.
  // Rotarsak til at tilkobling feilet baade paa PC og mobil: naar
  // requestAccessToken() kalles fra en .then()-callback etter en
  // asynkron nettverksrundtur (gapi.load/init/discovery), regner
  // nettleseren det ikke lenger som en direkte konsekvens av
  // brukerens klikk ("user activation" er utlopt). Da blokkeres
  // popupen — konsekvent, uavhengig av plattform. Losningen er aa
  // sikre at gapi allerede er klar FOR klikket, slik at selve
  // requestAccessToken() kan kalles synkront inni onClick.
  React.useEffect(() => {
    lastGapiDriveClient().then(function(){
      setGapiKlar(true);
    }).catch(function(err){
      console.log("[Drive-diagnostikk] Forhaandslasting av gapi feilet:", err);
    });
  }, []);

  const koble = () => {
    setStatus("kobler_til");
    setFeilmelding("");
    setDiagnostikk([]);

    logg("GIS script lastet: "+(typeof google!=="undefined"&&!!google.accounts));
    logg("gapi script lastet: "+(typeof gapi!=="undefined"));
    logg("gapi Drive-klient forhaandslastet: "+gapiKlar);
    logg("OAuth Client ID: "+GOOGLE_DRIVE_CLIENT_ID);
    logg("Origin nettleseren rapporterer: "+window.location.origin);

    const startTokenForesporsel = () => {
      const client = hentDriveTokenClient(
        function(resp){
          logg("Token-callback: mottok access_token (OK)");
          // Token OK — bekreft med et ufarlig kall
          testDriveTilgang().then(function(){
            logg("testDriveTilgang: OK");
            setStatus("tilkoblet");
          }).catch(function(err){
            const kode = err && err.status;
            const body = err && err.result && err.result.error;
            logg("testDriveTilgang FEILET — HTTP status: "+kode);
            logg("testDriveTilgang feilrespons: "+JSON.stringify(body||err));
            if(kode===401) {
              setStatus("utlopt");
              setFeilmelding("Tilkoblingen er utløpt. Koble til på nytt.");
            } else if(kode===403) {
              setStatus("feil");
              setFeilmelding("Google avviste tilgangen (403). Vanligste årsak: Drive API er ikke aktivert i Google Cloud-prosjektet, eller kontoen er ikke lagt til som testbruker i OAuth consent screen.");
            } else {
              setStatus("feil");
              setFeilmelding("Kunne ikke bekrefte tilgang til Google Drive (HTTP "+kode+"). Se detaljer under.");
            }
          });
        },
        function(err){
          // err kommer enten fra GIS sin error_callback (har gjerne
          // .type og/eller .error) eller er selve token-responsen uten
          // access_token (kan ha .error / .error_description).
          const feilkode = (err&&err.type) || (err&&err.error) || "ukjent";
          const beskrivelse = (err&&err.error_description) || "";
          logg("Token-callback FEILET — kode: "+feilkode+(beskrivelse?" — "+beskrivelse:""));
          logg("Fullt feilobjekt: "+JSON.stringify(err));

          if(feilkode==="popup_closed"||feilkode==="popup_closed_by_user") {
            setStatus("feil");
            setFeilmelding("Google-vinduet ble lukket før innlogging var fullført. Prøv igjen og vent til vinduet lukkes automatisk.");
          } else if(feilkode==="access_denied") {
            setStatus("feil");
            setFeilmelding("Tilgangen ble avslått. Hvis appen fortsatt er i test-modus i Google Cloud, må kontoen din legges til som testbruker under OAuth consent screen.");
          } else if(feilkode==="invalid_client"||beskrivelse.indexOf("client")>=0) {
            setStatus("feil");
            setFeilmelding("Ugyldig OAuth Client ID. Sjekk at riktig Client ID er satt i koden og at den finnes i Google Cloud Console.");
          } else if(feilkode==="idpiframe_initialization_failed"||beskrivelse.toLowerCase().indexOf("origin")>=0) {
            setStatus("feil");
            setFeilmelding("Denne nettsiden ("+window.location.origin+") er ikke godkjent som opprinnelse for denne OAuth-klienten. Legg den til under «Autoriserte JavaScript-opprinnelser» i Google Cloud Console.");
          } else {
            setStatus("feil");
            setFeilmelding("Tilgang til Google Drive feilet ("+feilkode+"). Se diagnostikk under for detaljer.");
          }
        }
      );
      client.requestAccessToken();
    };

    if(gapiKlar) {
      // gapi er allerede klar — kall requestAccessToken synkront,
      // saa nettleseren fortsatt regner dette som et direkte resultat
      // av brukerens klikk.
      logg("Drive API (forhaandslastet): OK — starter token-foresporsel direkte");
      startTokenForesporsel();
    } else {
      // Fallback dersom forhaandslasting ikke rakk aa fullfores ennaa
      // (f.eks. treg forbindelse). Da kan popupen dessverre bli
      // blokkert av nettleseren siden vi ma vente pa lastingen forst.
      logg("gapi ikke ferdig forhaandslastet ennaa — proever aa laste na (kan feile pga popup-blokkering)");
      lastGapiDriveClient().then(function(){
        logg("Drive API (sen lasting): OK");
        setGapiKlar(true);
        startTokenForesporsel();
      }).catch(function(err){
        logg("lastGapiDriveClient FEILET: "+(err&&err.message?err.message:JSON.stringify(err)));
        setStatus("feil");
        setFeilmelding("Kunne ikke laste Google Drive-klienten (gapi). Sjekk nettforbindelsen og prøv igjen.");
      });
    }
  };

  const frakoble = () => {
    kobleFraDrive(function(){
      setStatus("ikke_tilkoblet");
      setFeilmelding("");
      setDiagnostikk([]);
    });
  };

  const STATUS_VISNING = {
    ikke_tilkoblet: {tekst:"Ikke tilkoblet", farge:P.dust},
    kobler_til:     {tekst:"Kobler til…",    farge:P.hazel},
    tilkoblet:      {tekst:"Tilkoblet",      farge:P.olive},
    utlopt:         {tekst:"Tilkobling utløpt", farge:P.clay},
    feil:           {tekst:"Feil",           farge:P.clay},
  };
  const sv = STATUS_VISNING[status];

  return (
    <div>
      <div style={{fontSize:15,fontWeight:600,color:P.ink,marginBottom:4}}>🏦 Kontoer</div>
      <div style={{fontSize:12,color:P.stone,marginBottom:16}}>
        Eksterne tjenester Familieappen kan kobles til.
      </div>

      <Card style={{padding:"14px"}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:10}}>
          <IBox emoji="📁" color={P.hazel} size={34}/>
          <div style={{flex:1}}>
            <div style={{fontSize:13,fontWeight:600,color:P.ink}}>Google Drive</div>
            <div style={{fontSize:11,color:sv.farge,fontWeight:500,marginTop:1}}>{sv.tekst}</div>
          </div>
        </div>

        <div style={{fontSize:11,color:P.stone,lineHeight:1.6,marginBottom:12}}>
          Brukes til å lagre kvitteringsbilder i din egen Google Drive-mappe.
          Familieappen får kun tilgang til filer den selv oppretter.
        </div>

        {feilmelding && (
          <div style={{fontSize:11,color:P.clay,background:"#FFF4F0",border:"1px solid #F0C4B0",
            borderRadius:7,padding:"8px 10px",marginBottom:10}}>
            {feilmelding}
          </div>
        )}

        {diagnostikk.length>0 && (
          <details style={{fontSize:10,color:P.dust,marginBottom:10,background:P.mist,
            borderRadius:7,padding:"8px 10px"}}>
            <summary style={{cursor:"pointer",fontWeight:500}}>Teknisk diagnostikk ({diagnostikk.length} linjer)</summary>
            <div style={{marginTop:6,fontFamily:"monospace",lineHeight:1.6,whiteSpace:"pre-wrap",wordBreak:"break-word"}}>
              {diagnostikk.map((linje,i)=><div key={i}>{linje}</div>)}
            </div>
          </details>
        )}

        {(status==="ikke_tilkoblet"||status==="feil"||status==="utlopt") && (
          <button onClick={koble}
            style={{width:"100%",padding:"10px",background:P.hazel,color:"white",border:"none",
              borderRadius:9,fontSize:13,cursor:"pointer",fontWeight:600}}>
            {status==="utlopt" ? "Koble til på nytt" : "Koble til Google Drive"}
          </button>
        )}
        {status==="kobler_til" && (
          <div style={{textAlign:"center",padding:"10px",fontSize:12,color:P.stone}}>
            Venter på Google…
          </div>
        )}
        {status==="tilkoblet" && (
          <button onClick={frakoble}
            style={{width:"100%",padding:"10px",background:P.mist,border:"1px solid "+P.border,
              borderRadius:9,fontSize:13,cursor:"pointer",color:P.stone,fontWeight:500}}>
            Koble fra
          </button>
        )}
      </Card>
    </div>
  );
}


// VerktoyScreen brukes na KUN inni AdminSkall. Navigasjon eies av
// AdminSidepanelNav (adminSub/setAdminSub kommer utenfra som props),
// saa "Tilbake til Verktoy"-knappene og den generiske oversikts-listen
// er ikke lenger nodvendig her — sidepanelet viser alltid alle
// administrasjonsflatene samtidig.
// ── Sparing, etappe 2 — midlertidig engangsverktoy ────────────────
// Forhaandsviser, kontrollerer konflikter/manglende poster, utforer
// den faktiske flyttingen (kun etter eksplisitt klikk), og verifiserer
// etterpaa. Tar en engangsbackup for aller forste faktiske kjoring.
// Fjernes fra Verktoy-menyen og filen naar flyttingen er kjort,
// bekreftet, og gjentatt uten endring i resultatet — samme monster
// som Fase 4s migreringsverktoy fulgte.
function SparePostFlyttingScreen({budgetGroups, setBudgetGroups, sparingGroups, setSparingGroups}) {
  const [diagnose,setDiagnose] = useState(null);
  const [status,setStatus] = useState("klar"); // klar | forhandsvist | blokkert | ferdig | kjorer | feilet
  const [resultat,setResultat] = useState(null);
  const [verifisering,setVerifisering] = useState(null);

  const kjorForhandsvisning = () => {
    const d = diagnostiserSparePostFlytting(budgetGroups, sparingGroups);
    setDiagnose(d);
    setVerifisering(null);
    setResultat(null);
    if(d.alleredeFullfort) setStatus("ferdig");
    else if(!d.kanKjores) setStatus("blokkert");
    else setStatus("forhandsvist");
  };

  const kjorFlytting = async () => {
    const d = diagnostiserSparePostFlytting(budgetGroups, sparingGroups);
    setDiagnose(d);
    if(d.alleredeFullfort) { setStatus("ferdig"); return; }
    if(!d.kanKjores) { setStatus("blokkert"); return; }
    setStatus("kjorer");
    try {
      const eksisterendeBackupTidspunkt = await dbGetOnce(`${FAM}/_spareflytting_backup/tidspunkt`);
      if(!eksisterendeBackupTidspunkt) {
        await dbSet(`${FAM}/_spareflytting_backup`, {
          tidspunkt: new Date().toISOString(),
          budgetGroups, sparingGroups,
        });
      }
      const {nyeBudgetGroups, nyeSparingGroups} = utforSparePostFlytting(budgetGroups, sparingGroups, d);
      await setBudgetGroups(nyeBudgetGroups);
      await setSparingGroups(nyeSparingGroups);
      setResultat({antallFlyttet: d.resultater.filter(r=>r.status==="klar_til_flytting").length});
      setDiagnose(diagnostiserSparePostFlytting(nyeBudgetGroups, nyeSparingGroups));
      setStatus("ferdig");
    } catch(err) {
      console.error("[SparePostFlytting] Feilet:", err);
      setStatus("feilet");
    }
  };

  const kjorVerifisering = () => {
    setVerifisering(verifiserSparePostFlytting(budgetGroups, sparingGroups));
  };

  const STATUS_LABEL = {
    klar_til_flytting: "Klar til flytting",
    allerede_flyttet: "Allerede flyttet",
    konflikt: "⚠ Konflikt",
    mangler_begge_steder: "⚠ Mangler",
  };

  return (
    <div style={{padding:"16px",maxWidth:600}}>
      <div style={{fontSize:18,fontWeight:600,color:P.ink,marginBottom:6}}>🐷 Sparing — flytt eksisterende poster</div>
      <div style={{fontSize:12.5,color:P.stone,marginBottom:16,lineHeight:1.6}}>
        Engangsverktøy. Flytter spar_helen, spar_eivind, pensjon, aksjer og
        aksjer_barn fra Kostnader til Sparing, i én samlet, idempotent operasjon.
        Ingen hendelser, regler eller transaksjoner røres.
      </div>

      <button onClick={kjorForhandsvisning}
        style={{width:"100%",padding:"12px",background:P.hazelXL,color:P.hazel,
          border:"1px solid "+P.hazel,borderRadius:9,fontSize:14,fontWeight:600,
          cursor:"pointer",marginBottom:14}}>
        🔍 Forhåndsvis
      </button>

      {diagnose && (
        <div style={{marginBottom:14}}>
          {diagnose.resultater.map(r=>(
            <div key={r.id} style={{padding:"10px 12px",background:P.linen,border:"1px solid "+P.border,
              borderRadius:9,marginBottom:6,fontSize:12.5,color:P.stone,lineHeight:1.7}}>
              <div style={{fontWeight:600,color:P.ink}}>{r.navn} <span style={{fontWeight:400,color:P.dust}}>({r.id})</span></div>
              <div>{r.gammelGruppe} → {r.nyGruppe} · eier: {r.eksisterendeEier||"—"} · ny likviditet: {SPARING_LIKVIDITET_LABEL[r.likviditet]}</div>
              <div style={{fontWeight:600,
                color:r.status==="konflikt"||r.status==="mangler_begge_steder"?P.clay:(r.status==="allerede_flyttet"?P.olive:P.hazel)}}>
                {STATUS_LABEL[r.status]}
              </div>
            </div>
          ))}
        </div>
      )}

      {status==="ferdig" && diagnose && diagnose.alleredeFullfort && !resultat && (
        <div style={{padding:"12px 14px",background:"#F0FFF4",border:"1px solid "+P.oliveL,borderRadius:9,
          marginBottom:14,fontSize:12.5,color:P.olive,fontWeight:600}}>
          ✓ Operasjonen er allerede fullført — alle fem poster finnes i Sparing.
        </div>
      )}

      {status==="blokkert" && diagnose && (
        <div style={{padding:"12px 14px",background:"#FFF4F0",border:"1px solid #F0C4B0",borderRadius:9,
          marginBottom:14,fontSize:12.5,color:P.clay,lineHeight:1.7}}>
          ⚠ Kan ikke kjøre flyttingen ennå.
          {diagnose.konflikter.length>0 && <div>{diagnose.konflikter.length} konflikt(er) — samme post finnes både i Kostnader og Sparing. Rydd opp manuelt før flytting.</div>}
          {diagnose.manglende.length>0 && <div>{diagnose.manglende.length} post(er) mangler helt, verken i Kostnader eller Sparing. Bekreft dette er forventet før du fortsetter.</div>}
        </div>
      )}

      {diagnose && diagnose.kanKjores && !diagnose.alleredeFullfort && (
        <button onClick={kjorFlytting} disabled={status==="kjorer"}
          style={{width:"100%",padding:"12px",background:P.hazel,color:"white",
            border:"none",borderRadius:9,fontSize:14,fontWeight:600,
            cursor:status==="kjorer"?"default":"pointer",marginBottom:14}}>
          {status==="kjorer" ? "Flytter…" : "Kjør flytting"}
        </button>
      )}

      {resultat && (
        <div style={{padding:"12px 14px",background:"#F0FFF4",border:"1px solid "+P.oliveL,borderRadius:9,
          marginBottom:14,fontSize:12.5,color:P.olive,fontWeight:600}}>
          ✓ Flytting fullført — {resultat.antallFlyttet} post(er) flyttet.
        </div>
      )}

      {status==="feilet" && (
        <div style={{padding:"12px 14px",background:"#FFF4F0",border:"1px solid #F0C4B0",borderRadius:9,
          marginBottom:14,fontSize:12.5,color:P.clay}}>
          ⚠ Noe gikk galt under flyttingen. Se konsollen for detaljer. Ingen ufullstendig tilstand skal være skrevet.
        </div>
      )}

      <button onClick={kjorVerifisering}
        style={{width:"100%",padding:"12px",background:P.mist,color:P.stone,
          border:"1px solid "+P.border,borderRadius:9,fontSize:14,fontWeight:600,cursor:"pointer"}}>
        ✓ Verifiser nå
      </button>

      {verifisering && (
        <div style={{marginTop:14,padding:"12px 14px",
          background:verifisering.alleOk?"#F0FFF4":"#FFF4F0",
          border:"1px solid "+(verifisering.alleOk?P.oliveL:"#F0C4B0"),
          borderRadius:9,fontSize:12.5,color:verifisering.alleOk?P.olive:P.clay,lineHeight:1.8}}>
          <div style={{fontWeight:600,marginBottom:4}}>{verifisering.alleOk?"✓ Alt stemmer":"⚠ Avvik funnet"}</div>
          <div>Alle fem nøyaktig én gang i Sparing: {verifisering.punkt1_noyaktigEnGangISparing?"✓":"✗"}</div>
          <div>Ingen av de fem i Kostnader: {verifisering.punkt2_ingenIBudget?"✓":"✗"}</div>
          <div>«Sparing»-gruppen borte fra Kostnader: {verifisering.punkt3_sparingGruppenBorte?"✓":"✗"}</div>
          <div>Riktig gruppe og likviditet for alle fem: {verifisering.punkt5_riktigGruppeOgLikviditet?"✓":"✗"}</div>
        </div>
      )}
    </div>
  );
}


// ── Kostnadsstruktur v2 — midlertidig engangsverktoy ──────────────
// Samme prinsipp som Sparing-flyttingsverktoyet: forhaandsvisning,
// backup for forste faktiske kjoring, idempotent utforelse,
// verifisering. Blokkerer ved reelle levninger/uoverensstemmelser —
// aldri ved manglende data (som rapporteres, men ikke stopper resten).
// ── v-personlig-flytting: engangsverktoy for aa flytte
// helen_klar/eivind_klar fra Diverse til Personlig/Klær og sko i
// LIVE-data. Bruker backupen fra forste kostnadsmigrering som eneste
// autoritative kilde. Preview-forst, samme mønster som
// KostnadFlyttingScreen.
function PersonligFlyttingScreen({budgetGroups, setBudgetGroups}) {
  const [diagnose,setDiagnose] = useState(null);
  const [status,setStatus]     = useState("klar");
  const [resultat,setResultat] = useState(null);

  const kjorForhandsvisning = async () => {
    setStatus("henter");
    try {
      const backup = await dbGetOnce(`${FAM}/_kostnadflytting_backup/budgetGroups`);
      if(!backup) { setStatus("ingen_backup"); return; }
      const d = diagnostiserPersonligFlytting(budgetGroups, backup);
      setDiagnose(d);
      setResultat(null);
      setStatus("forhandsvist");
    } catch(err) {
      console.error("[PersonligFlytting] Feilet ved henting av backup:", err);
      setStatus("feilet");
    }
  };

  const kjorFlytting = async () => {
    setStatus("kjorer");
    try {
      const backup = await dbGetOnce(`${FAM}/_kostnadflytting_backup/budgetGroups`);
      if(!backup) { setStatus("ingen_backup"); return; }
      const freskDiagnose = diagnostiserPersonligFlytting(budgetGroups, backup);
      const res = utforPersonligFlytting(budgetGroups, freskDiagnose);
      if(res.blokkert) {
        setDiagnose(freskDiagnose);
        setStatus("forhandsvist");
        return;
      }
      if(res.endret) {
        await setBudgetGroups(res.budgetGroups);
      }
      setResultat({endret:res.endret, monthsSplittet:res.monthsSplittet, alleredeUtfort:freskDiagnose.alleredeUtfort});
      setDiagnose(null);
      setStatus("ferdig");
    } catch(err) {
      console.error("[PersonligFlytting] Feilet:", err);
      setStatus("feilet");
    }
  };

  return (
    <div style={{padding:16,maxWidth:640}}>
      <div style={{fontSize:18,fontWeight:600,color:P.ink,marginBottom:6}}>👕 Personlig-flytting</div>
      <div style={{fontSize:12.5,color:P.stone,marginBottom:16,lineHeight:1.6}}>
        Midlertidig engangsverktøy. Flytter helen_klar/eivind_klar fra Øvrige
        kjøp/Diverse til nytt Personlig/Klær og sko, basert utelukkende på
        backupen fra første kostnadsmigrering. Rører aldri historiske
        hendelser eller plasseringId der.
      </div>

      <button onClick={kjorForhandsvisning} disabled={status==="henter"}
        style={{width:"100%",padding:"12px",background:P.hazelXL,color:P.hazel,
          border:"1px solid "+P.hazel,borderRadius:9,fontSize:14,fontWeight:600,
          cursor:status==="henter"?"default":"pointer",marginBottom:14}}>
        {status==="henter" ? "Henter backup…" : "🔍 Forhåndsvis"}
      </button>

      {status==="ingen_backup" && (
        <div style={{padding:"12px 14px",background:"#FFF4F0",border:"1px solid #F0C4B0",borderRadius:9,
          fontSize:12.5,color:P.clay,marginBottom:14}}>
          ⚠ Fant ingen backup under <code>_kostnadflytting_backup</code>. Kan ikke kjøres trygt uten den.
        </div>
      )}
      {status==="feilet" && (
        <div style={{padding:"12px 14px",background:"#FFF4F0",border:"1px solid #F0C4B0",borderRadius:9,
          fontSize:12.5,color:P.clay,marginBottom:14}}>
          ⚠ Noe gikk galt. Se konsollen for detaljer.
        </div>
      )}

      {diagnose && (
        <div style={{marginBottom:14}}>
          <div style={{padding:"12px 14px",background:P.linen,border:"1px solid "+P.border,borderRadius:9,
            fontSize:12.5,color:P.stone,lineHeight:1.9,marginBottom:10}}>
            <div>Backup inneholder begge gamle poster: {diagnose.backupFinnesBegge?"✓":"✗"}</div>
            <div>Diverse har begge legacyIds i dag: {diagnose.divFellesHarBeggeLegacyIds?"✓":diagnose.alleredeUtfort?"— (allerede flyttet)":"✗"}</div>
            <div>Personlig-gruppen finnes allerede: {diagnose.personligGruppeFinnes?"✓":"— (opprettes)"}</div>
            <div>Klær og sko finnes allerede: {diagnose.klarVoksnePostFinnes?"✓":"— (opprettes)"}</div>
            <div>Personlig utstyr finnes allerede: {diagnose.personligUtstyrPostFinnes?"✓":"— (opprettes tom)"}</div>
          </div>

          {diagnose.alleredeUtfort && (
            <div style={{padding:"12px 14px",background:"#F0FFF4",border:"1px solid "+P.oliveL,borderRadius:9,
              fontSize:12.5,color:P.olive,marginBottom:10}}>
              ✓ Allerede utført — ingenting å gjøre. Kjøring vil ikke endre noe.
            </div>
          )}

          {!diagnose.alleredeUtfort && !diagnose.backupFinnesBegge && (
            <div style={{padding:"12px 14px",background:"#FFF4F0",border:"1px solid #F0C4B0",borderRadius:9,
              fontSize:12.5,color:P.clay,marginBottom:10}}>
              ⚠ Backupen mangler helen_klar og/eller eivind_klar under gammel gruppe «klar». Flytting kan ikke kjøres trygt.
            </div>
          )}

          {!diagnose.alleredeUtfort && diagnose.backupFinnesBegge && !diagnose.divFellesHarBeggeLegacyIds && (
            <div style={{padding:"12px 14px",background:"#FFF4F0",border:"1px solid #F0C4B0",borderRadius:9,
              fontSize:12.5,color:P.clay,marginBottom:10}}>
              ⚠ Diverse i dagens struktur mangler forventede legacyIds for helen_klar/eivind_klar. Flytting kan ikke kjøres trygt.
            </div>
          )}

          {diagnose.backupFinnesBegge && !diagnose.alleredeUtfort && (
            <div style={{padding:"12px 14px",
              background:diagnose.monthsSplitTrygt?"#F0FFF4":"#FFF8F0",
              border:"1px solid "+(diagnose.monthsSplitTrygt?P.oliveL:"#E8C4A0"),
              borderRadius:9,fontSize:12.5,color:diagnose.monthsSplitTrygt?P.olive:"#9A5A1E",lineHeight:1.7,marginBottom:10}}>
              {diagnose.monthsSplitTrygt ? (
                <>✓ Months-splitt er verifisert trygt — opprinnelige beløp for Klær og sko flyttes ut av Diverse, sum uendret per måned.</>
              ) : (
                <>
                  ℹ️ Months-splitt kan IKKE verifiseres trygt mot backupen — dagens Diverse-beløp avviker fra det backupen tilsier
                  ({diagnose.monthsAvvik.length} måned(er) avviker). Klær og sko opprettes med 0 i alle måneder, og Diverse sine
                  beløp røres ikke. Kun legacyIds flyttes.
                </>
              )}
            </div>
          )}

          <button onClick={kjorFlytting} disabled={status==="kjorer" || !diagnose.kanKjores}
            style={{width:"100%",padding:"12px",
              background:diagnose.kanKjores?P.hazel:P.border,color:"white",
              border:"none",borderRadius:9,fontSize:14,fontWeight:600,
              cursor:(status==="kjorer"||!diagnose.kanKjores)?"default":"pointer"}}>
            {status==="kjorer" ? "Kjører…" : diagnose.alleredeUtfort ? "Kjør (ingen endring)" : "Kjør flytting"}
          </button>
        </div>
      )}

      {resultat && (
        <div style={{padding:"12px 14px",background:"#F0FFF4",border:"1px solid "+P.oliveL,borderRadius:9,
          fontSize:12.5,color:P.olive,lineHeight:1.8}}>
          <div style={{fontWeight:600,marginBottom:4}}>
            {resultat.alleredeUtfort ? "✓ Allerede utført — ingenting endret" : "✓ Flytting fullført"}
          </div>
          {resultat.endret && (
            <div>{resultat.monthsSplittet ? "Beløp flyttet fra Diverse til Klær og sko." : "Kun legacyIds flyttet — beløp urørt (months-splitt ikke verifisert trygt)."}</div>
          )}
        </div>
      )}
    </div>
  );
}

function KostnadFlyttingScreen({budgetGroups, setBudgetGroups}) {
  const [diagnose,setDiagnose] = useState(null);
  // Bevarer PRE-migrerings-diagnosen spesifikt for verifisering — den
  // eneste kilden som palitelig vet hvilke kilder som faktisk fantes
  // og ble absorbert. "diagnose" over overskrives bevisst med en ny,
  // POST-migrerings-diagnose etter kjoring (til visning) — den har
  // tomme funnetKilder for alt som na er "allerede_flyttet", og duger
  // derfor ikke til verifisering. Denne gjor.
  const [diagnoseVedFlytting,setDiagnoseVedFlytting] = useState(null);
  const [status,setStatus] = useState("klar");
  const [resultat,setResultat] = useState(null);
  const [verifisering,setVerifisering] = useState(null);

  const kjorForhandsvisning = () => {
    const d = diagnostiserKostnadFlytting(budgetGroups);
    setDiagnose(d);
    setDiagnoseVedFlytting(d);
    setVerifisering(null);
    setResultat(null);
    if(d.alleredeFullfort) setStatus("ferdig");
    else if(!d.kanKjores) setStatus("blokkert");
    else setStatus("forhandsvist");
  };

  const kjorFlytting = async () => {
    const d = diagnostiserKostnadFlytting(budgetGroups);
    setDiagnose(d);
    setDiagnoseVedFlytting(d);
    if(d.alleredeFullfort) { setStatus("ferdig"); return; }
    if(!d.kanKjores) { setStatus("blokkert"); return; }
    setStatus("kjorer");
    try {
      const eksisterendeBackupTidspunkt = await dbGetOnce(`${FAM}/_kostnadflytting_backup/tidspunkt`);
      if(!eksisterendeBackupTidspunkt) {
        await dbSet(`${FAM}/_kostnadflytting_backup`, {
          tidspunkt: new Date().toISOString(),
          budgetGroups,
        });
      }
      const nyeBudgetGroups = utforKostnadFlytting(budgetGroups, d);
      await setBudgetGroups(nyeBudgetGroups);
      setResultat({antallFlyttet: d.resultater.filter(r=>r.status==="klar_til_flytting"||r.status==="ny_post_opprettes").length});
      setDiagnose(diagnostiserKostnadFlytting(nyeBudgetGroups));
      setStatus("ferdig");
    } catch(err) {
      console.error("[KostnadFlytting] Feilet:", err);
      setStatus("feilet");
    }
  };

  const kjorVerifisering = () => {
    setVerifisering(verifiserKostnadFlytting(budgetGroups, diagnoseVedFlytting));
  };

  // ── Del 3+4, v-post-rename: eksplisitt, separat
  // recovery-handling. Leser BACKUPEN (tatt for forste live-migrering)
  // som eneste autoritative kilde til hvilke gamle poster som faktisk
  // eksisterte, reparerer legacyIds ut fra det, og gjenbruker deretter
  // den allerede eksisterende, testede diagnostiserKostnadFlytting/
  // utforKostnadFlytting-flyten (som allerede haandterer de seks
  // opprettTomHvisMangler-flaggede postene korrekt) — ingen ny
  // sammenslaaingslogikk. Roerer ALDRI months/meta paa allerede
  // migrerte poster, gjenoppretter ALDRI gamle poster. Kjores KUN naar
  // brukeren eksplisitt trykker knappen — aldri automatisk.
  const [recoveryStatus,setRecoveryStatus] = useState("klar");
  const [recoveryResultat,setRecoveryResultat] = useState(null);

  const kjorRecovery = async () => {
    setRecoveryStatus("kjorer");
    setRecoveryResultat(null);
    try {
      const backup = await dbGetOnce(`${FAM}/_kostnadflytting_backup/budgetGroups`);
      if(!backup) { setRecoveryStatus("ingen_backup"); return; }

      const reparert = rekonstruerLegacyIdsFraBackup(budgetGroups, backup);

      let antallLegacyIdsReparert = 0;
      reparert.forEach(g=>{
        const originalGruppe = budgetGroups.find(og=>og.id===g.id);
        g.items.forEach(it=>{
          const originalPost = originalGruppe && originalGruppe.items.find(oi=>oi.id===it.id);
          const forLen = (originalPost && originalPost.legacyIds) ? originalPost.legacyIds.length : 0;
          const etterLen = (it.legacyIds||[]).length;
          if(etterLen>forLen) antallLegacyIdsReparert++;
        });
      });

      const d = diagnostiserKostnadFlytting(reparert);
      const nyeBudgetGroups = utforKostnadFlytting(reparert, d);
      await setBudgetGroups(nyeBudgetGroups);
      setDiagnoseVedFlytting(d);
      setRecoveryResultat({
        legacyIdsReparert: antallLegacyIdsReparert,
        nyePosterOpprettet: d.resultater.filter(r=>r.status==="ny_post_opprettes").length,
      });
      setRecoveryStatus("ferdig");
    } catch(err) {
      console.error("[KostnadFlytting recovery] Feilet:", err);
      setRecoveryStatus("feilet");
    }
  };

  const STATUS_LABEL = {
    klar_til_flytting: "Klar til flytting",
    ny_post_opprettes: "Ny post opprettes",
    allerede_flyttet: "Allerede flyttet",
    delvis_fullfort_levninger: "⚠ Levning funnet",
    mangler_begge_steder: "⚠ Mangler helt",
  };

  return (
    <div style={{padding:"16px",maxWidth:600}}>
      <div style={{fontSize:18,fontWeight:600,color:P.ink,marginBottom:6}}>🧱 Kostnadsstruktur v2 — engangsflytting</div>
      <div style={{fontSize:12.5,color:P.stone,marginBottom:16,lineHeight:1.6}}>
        Engangsverktøy. Flytter/slår sammen eksisterende kostnadsposter til den
        låste strukturen med 11 livsområder. Ingen hendelser, regler eller
        transaksjoner røres. Sparing er ikke en del av denne flyttingen.
      </div>

      <button onClick={kjorForhandsvisning}
        style={{width:"100%",padding:"12px",background:P.hazelXL,color:P.hazel,
          border:"1px solid "+P.hazel,borderRadius:9,fontSize:14,fontWeight:600,
          cursor:"pointer",marginBottom:14}}>
        🔍 Forhåndsvis
      </button>

      {diagnose && (
        <div style={{marginBottom:14}}>
          {diagnose.resultater.map(r=>(
            <div key={r.nyId+"_"+r.nyGruppe} style={{padding:"10px 12px",background:P.linen,border:"1px solid "+P.border,
              borderRadius:9,marginBottom:6,fontSize:12.5,color:P.stone,lineHeight:1.7}}>
              <div style={{fontWeight:600,color:P.ink}}>{r.navn} <span style={{fontWeight:400,color:P.dust}}>({r.nyId} → {r.nyGruppe})</span></div>
              {r.kilder.length>0 && (
                <div>Kilder: {r.kilder.map(k=>`${k.id} (${k.gruppe})`).join(", ")}</div>
              )}
              <div style={{fontWeight:600,
                color:(r.status==="delvis_fullfort_levninger"||r.status==="mangler_begge_steder")?P.clay:(r.status==="allerede_flyttet"?P.olive:P.hazel)}}>
                {STATUS_LABEL[r.status]}
              </div>
            </div>
          ))}
        </div>
      )}

      {status==="ferdig" && diagnose && diagnose.alleredeFullfort && !resultat && (
        <div style={{padding:"12px 14px",background:"#F0FFF4",border:"1px solid "+P.oliveL,borderRadius:9,
          marginBottom:14,fontSize:12.5,color:P.olive,fontWeight:600}}>
          ✓ Operasjonen er allerede fullført — hele kostnadsstrukturen er på plass.
        </div>
      )}

      {status==="blokkert" && diagnose && (
        <div style={{padding:"12px 14px",background:"#FFF4F0",border:"1px solid #F0C4B0",borderRadius:9,
          marginBottom:14,fontSize:12.5,color:P.clay,lineHeight:1.7}}>
          ⚠ Kan ikke kjøre flyttingen ennå.
          {diagnose.konflikter.length>0 && <div>{diagnose.konflikter.length} post(er) med levninger — målet er allerede migrert, men en annen kilde finnes fortsatt separat. Rydd opp manuelt før flytting.</div>}
        </div>
      )}

      {diagnose && diagnose.uavklarte.length>0 && (
        <div style={{padding:"12px 14px",background:"#FFF8F0",border:"1px solid #E8C4A0",borderRadius:9,
          marginBottom:14,fontSize:12.5,color:"#9A5A1E",lineHeight:1.7}}>
          ℹ️ {diagnose.uavklarte.length} planoppføring(er) har ingen kilde i det hele tatt (verken gammel post eller allerede migrert mål) — blokkerer ikke, men er verdt å sjekke:
          <div style={{marginTop:4}}>{diagnose.uavklarte.map(r=>r.navn).join(", ")}</div>
        </div>
      )}

      {diagnose && diagnose.uidentifiserte && diagnose.uidentifiserte.length>0 && (
        <div style={{padding:"12px 14px",background:"#FFF8F0",border:"1px solid #E8C4A0",borderRadius:9,
          marginBottom:14,fontSize:12.5,color:"#9A5A1E",lineHeight:1.7}}>
          ℹ️ {diagnose.uidentifiserte.length} eksisterende post(er) matcher ingen planlagt kilde eller mål — de røres IKKE av flyttingen, men vises her med sin faktiske id slik at de kan legges inn i planen senere:
          {diagnose.uidentifiserte.map((u,i)=>(
            <div key={i} style={{marginTop:4}}>• <b>{u.navn}</b> — id: <code>{u.id}</code> ({u.gruppe})</div>
          ))}
        </div>
      )}

      {diagnose && diagnose.kanKjores && !diagnose.alleredeFullfort && (
        <button onClick={kjorFlytting} disabled={status==="kjorer"}
          style={{width:"100%",padding:"12px",background:P.hazel,color:"white",
            border:"none",borderRadius:9,fontSize:14,fontWeight:600,
            cursor:status==="kjorer"?"default":"pointer",marginBottom:14}}>
          {status==="kjorer" ? "Flytter…" : "Kjør flytting"}
        </button>
      )}

      {resultat && (
        <div style={{padding:"12px 14px",background:"#F0FFF4",border:"1px solid "+P.oliveL,borderRadius:9,
          marginBottom:14,fontSize:12.5,color:P.olive,fontWeight:600}}>
          ✓ Flytting fullført — {resultat.antallFlyttet} post(er) opprettet/flyttet.
        </div>
      )}

      {status==="feilet" && (
        <div style={{padding:"12px 14px",background:"#FFF4F0",border:"1px solid #F0C4B0",borderRadius:9,
          marginBottom:14,fontSize:12.5,color:P.clay}}>
          ⚠ Noe gikk galt under flyttingen. Se konsollen for detaljer. Ingen ufullstendig tilstand skal være skrevet.
        </div>
      )}

      <button onClick={kjorVerifisering}
        style={{width:"100%",padding:"12px",background:P.mist,color:P.stone,
          border:"1px solid "+P.border,borderRadius:9,fontSize:14,fontWeight:600,cursor:"pointer"}}>
        ✓ Verifiser nå
      </button>

      {verifisering && (
        <div style={{marginTop:14,padding:"12px 14px",
          background:verifisering.alleOk?"#F0FFF4":"#FFF4F0",
          border:"1px solid "+(verifisering.alleOk?P.oliveL:"#F0C4B0"),
          borderRadius:9,fontSize:12.5,color:verifisering.alleOk?P.olive:P.clay,lineHeight:1.8}}>
          <div style={{fontWeight:600,marginBottom:4}}>{verifisering.alleOk?"✓ Alt stemmer":"⚠ Avvik funnet"}</div>
          <div>Gamle grupper (Klær voksne, Hjem, Ferie, Diverse) borte: {verifisering.gamleGrupperBorte?"✓":"✗"}</div>
          <div>Alle {BUDGET_TEMPLATE.length} livsområder finnes: {verifisering.alleLivsomraaderFinnes?"✓":"✗"}</div>
          <div>Standard/familie-type korrekt ({verifisering.antallStandard} standard, {verifisering.antallFamilie} familie): {verifisering.typeKorrekt?"✓":"✗"}</div>
          {verifisering.detaljer.filter(d=>!d.finnesIRiktigGruppe || !d.ingenAbsorberteKilderGjenstaar || !d.legacyIdsKorrekt || !d.monthsKorrekt).map(d=>(
            <div key={d.nyId}>⚠ {d.navn}: {!d.finnesIRiktigGruppe?"mangler i riktig gruppe. ":""}{!d.ingenAbsorberteKilderGjenstaar?"absorberte kilder gjenstår. ":""}{!d.legacyIdsKorrekt?"legacyIds stemmer ikke. ":""}{!d.monthsKorrekt?"beløp/months stemmer ikke.":""}</div>
          ))}
        </div>
      )}

      {/* ── Del 3+4: separat, eksplisitt recovery-handling. Reparerer
           legacyIds fra backupen og oppretter de seks flaggede tomme
           postene, i én kontrollert kjøring. Rører aldri months/meta
           på allerede migrerte poster. Kjøres kun ved eksplisitt
           trykk — aldri automatisk ved appstart. ── */}
      <div style={{marginTop:20,paddingTop:16,borderTop:"1px solid "+P.border}}>
        <div style={{fontSize:14,fontWeight:600,color:P.ink,marginBottom:4}}>🩹 Recovery: legacyIds + manglende tomme poster</div>
        <div style={{fontSize:12,color:P.stone,marginBottom:10,lineHeight:1.6}}>
          Bruk denne kun hvis Verifiser nå viser «legacyIds stemmer ikke»
          eller manglende livsområder etter en reload. Leser backupen fra
          før første migrering for å avgjøre nøyaktig hvilke gamle kilder
          som faktisk fantes, reparerer legacyIds ut fra det, og oppretter
          samtidig de seks tomme målpostene som fortsatt mangler. Rører
          aldri beløp/meta på allerede migrerte poster.
        </div>
        <button onClick={kjorRecovery} disabled={recoveryStatus==="kjorer"}
          style={{width:"100%",padding:"12px",background:"#F5EEDC",color:"#8A6D2F",
            border:"1px solid #D9C48A",borderRadius:9,fontSize:14,fontWeight:600,
            cursor:recoveryStatus==="kjorer"?"default":"pointer"}}>
          {recoveryStatus==="kjorer" ? "Kjører recovery…" : "🩹 Kjør recovery"}
        </button>

        {recoveryStatus==="ingen_backup" && (
          <div style={{marginTop:10,padding:"12px 14px",background:"#FFF4F0",border:"1px solid #F0C4B0",
            borderRadius:9,fontSize:12.5,color:P.clay}}>
            ⚠ Fant ingen backup under <code>_kostnadflytting_backup</code>. Recovery kan ikke kjøres trygt uten den — den er eneste kilde til hvilke gamle poster som faktisk eksisterte.
          </div>
        )}
        {recoveryStatus==="feilet" && (
          <div style={{marginTop:10,padding:"12px 14px",background:"#FFF4F0",border:"1px solid #F0C4B0",
            borderRadius:9,fontSize:12.5,color:P.clay}}>
            ⚠ Recovery feilet. Se konsollen for detaljer. Ingen ufullstendig tilstand skal være skrevet.
          </div>
        )}
        {recoveryResultat && (
          <div style={{marginTop:10,padding:"12px 14px",background:"#F0FFF4",border:"1px solid "+P.oliveL,
            borderRadius:9,fontSize:12.5,color:P.olive,fontWeight:600}}>
            ✓ Recovery fullført — {recoveryResultat.legacyIdsReparert} post(er) fikk legacyIds reparert fra backup, {recoveryResultat.nyePosterOpprettet} tom(me) post(er) opprettet. Trykk «Verifiser nå» på nytt for å bekrefte.
          </div>
        )}
      </div>

      <div style={{marginTop:16,padding:"12px 14px",background:P.mist,borderRadius:9,fontSize:11.5,color:P.dust,lineHeight:1.7}}>
        <div style={{fontWeight:600,color:P.stone,marginBottom:4}}>Skjønnsmessige plasseringer (ikke skjult):</div>
        {KOSTNAD_SKJONNSMESSIGE_VALG.map((v,i)=>(
          <div key={i} style={{marginBottom:3}}>• {v.forklaring}</div>
        ))}
      </div>
    </div>
  );
}


// ── v-post-rename: enkel administrasjonsflate for aa laste ned
// den kvalitetssikrede okonomihistorikken som CSV. Rent lesende —
// skriver ALDRI til Firebase, endrer ALDRI hendelser/transaksjoner.
// Ingen filtre/datovelger/preview-tabell/grafer i v1 — hele den
// tilgjengelige, ferdige historikken eksporteres, bevisst den minste
// losningen.
function HistorikkEksportScreen({hendelser, transaksjoner, receipts, budgetGroups, incomeGroups, sparingGroups}) {
  const rader = byggHistorikkEksport(hendelser, transaksjoner, receipts, budgetGroups, incomeGroups, sparingGroups);
  const antallHendelser = (hendelser||[]).filter(h=>h && h.status==="ferdig" && h.fordelinger && h.fordelinger.length>0).length;
  const antallUavklart = rader.filter(r=>r["Oppslag status"]==="Uavklart plassering").length;
  const antallTvetydig = rader.filter(r=>r["Oppslag status"]==="Tvetydig plassering").length;
  const datoer = rader.map(r=>r["Dato"]).filter(Boolean).sort();
  const forsteDato = datoer.length>0 ? datoer[0] : "—";
  const sisteDato = datoer.length>0 ? datoer[datoer.length-1] : "—";

  const [status,setStatus] = useState("klar");

  const lastNedCsv = () => {
    setStatus("eksporterer");
    try {
      const csv = byggHistorikkCsv(rader);
      const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
      const url = URL.createObjectURL(blob);
      const idag = new Date().toISOString().slice(0,10);
      const a = document.createElement("a");
      a.href = url;
      a.download = `Hverdagsflyt_historikk_${idag}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      setStatus("ferdig");
    } catch(err) {
      console.error("[HistorikkEksport] Feilet:", err);
      setStatus("feilet");
    }
  };

  return (
    <div style={{padding:16,maxWidth:640}}>
      <div style={{fontSize:18,fontWeight:600,color:P.ink,marginBottom:6}}>📤 Historikkeksport</div>
      <div style={{fontSize:12.5,color:P.stone,marginBottom:16,lineHeight:1.6}}>
        Eksporter kvalitetssikret økonomihistorikk fra ferdige hendelser.
      </div>

      <div style={{padding:"12px 14px",background:P.linen,border:"1px solid "+P.border,borderRadius:9,
        marginBottom:14,fontSize:12.5,color:P.stone,lineHeight:1.9}}>
        <div>Antall ferdige økonomiske hendelser: <b>{antallHendelser}</b></div>
        <div>Antall fordelingsrader som vil eksporteres: <b>{rader.length}</b></div>
        <div>Første dato: <b>{forsteDato}</b></div>
        <div>Siste dato: <b>{sisteDato}</b></div>
        <div>Antall uavklarte plasseringer: <b style={{color:antallUavklart>0?P.clay:P.stone}}>{antallUavklart}</b></div>
        <div>Antall tvetydige plasseringer: <b style={{color:antallTvetydig>0?P.clay:P.stone}}>{antallTvetydig}</b></div>
      </div>

      {antallTvetydig>0 && (
        <div style={{padding:"12px 14px",background:"#FFF8F0",border:"1px solid #E8C4A0",borderRadius:9,
          marginBottom:14,fontSize:12,color:"#9A5A1E",lineHeight:1.6}}>
          ℹ️ {antallTvetydig} rad(er) har en historisk plassering som matcher flere aktive poster på tvers av
          Kostnad/Inntekt/Sparing. De eksporteres likevel, tydelig merket «Tvetydig plassering» — ingen gjetting.
        </div>
      )}

      {antallUavklart>0 && (
        <div style={{padding:"12px 14px",background:"#FFF8F0",border:"1px solid #E8C4A0",borderRadius:9,
          marginBottom:14,fontSize:12,color:"#9A5A1E",lineHeight:1.6}}>
          ℹ️ {antallUavklart} rad(er) har en historisk plassering som ikke kan resolves mot dagens struktur.
          De eksporteres likevel, tydelig merket «Uavklart plassering» — ingen data skjules.
        </div>
      )}

      <button onClick={lastNedCsv} disabled={rader.length===0}
        style={{width:"100%",padding:"12px",background:rader.length>0?P.hazel:P.border,color:"white",
          border:"none",borderRadius:9,fontSize:14,fontWeight:600,
          cursor:rader.length>0?"pointer":"default"}}>
        Eksporter historikk (.csv)
      </button>

      {status==="ferdig" && (
        <div style={{marginTop:10,fontSize:12.5,color:P.olive}}>✓ Filen er lastet ned.</div>
      )}
      {status==="feilet" && (
        <div style={{marginTop:10,fontSize:12.5,color:P.clay}}>⚠ Noe gikk galt. Se konsollen for detaljer.</div>
      )}
    </div>
  );
}

// ── v-post-rename: midlertidig, ekstremt snevert engangsverktoy ──
// Retter KUN de to kjente feil-signerte hendelsene (se
// kjorFortegnsRecoveryDrivstoffRabatt). Ingen automatisk kjoring —
// krever eksplisitt trykk. Viser alltid forhaandsvisning forst.
function FortegnRecoveryScreen({hendelser, setHendelser}) {
  const [forhandsvisning,setForhandsvisning] = useState(null);
  const [status,setStatus] = useState("klar");
  const [resultat,setResultat] = useState(null);

  const kjorForhandsvisning = () => {
    const {resultat} = kjorFortegnsRecoveryDrivstoffRabatt(hendelser);
    setForhandsvisning(resultat);
    setResultat(null);
    setStatus("forhandsvist");
  };

  const kjorRecovery = async () => {
    setStatus("kjorer");
    try {
      const {nyeHendelser, resultat} = kjorFortegnsRecoveryDrivstoffRabatt(hendelser);
      await setHendelser(nyeHendelser);
      setResultat(resultat);
      setStatus("ferdig");
    } catch(err) {
      console.error("[FortegnRecovery] Feilet:", err);
      setStatus("feilet");
    }
  };

  const HANDLING_LABEL = {
    korrigert: "✓ Korrigert",
    allerede_korrekt: "✓ Allerede korrekt",
    hoppet_over: "⚠ Hoppet over",
  };

  return (
    <div style={{padding:"16px",maxWidth:600}}>
      <div style={{fontSize:18,fontWeight:600,color:P.ink,marginBottom:6}}>🩹 Fortegnsrecovery — Drivstoff-rabatt</div>
      <div style={{fontSize:12.5,color:P.stone,marginBottom:16,lineHeight:1.6}}>

        (msoknxe09eop og msoknxe0960s) der en tidligere kodevei ga positivt
        fortegn på en varekjøpsrabatt som skulle redusert kostnaden. Dagens
        kode er bekreftet trygg og endres ikke av dette. Ingen andre
        hendelser, regler eller rå transaksjoner røres.
      </div>

      <button onClick={kjorForhandsvisning}
        style={{width:"100%",padding:"12px",background:P.hazelXL,color:P.hazel,
          border:"1px solid "+P.hazel,borderRadius:9,fontSize:14,fontWeight:600,
          cursor:"pointer",marginBottom:14}}>
        🔍 Forhåndsvis
      </button>

      {forhandsvisning && (
        <div style={{marginBottom:14}}>
          {forhandsvisning.map(r=>(
            <div key={r.id} style={{padding:"10px 12px",background:P.linen,border:"1px solid "+P.border,
              borderRadius:9,marginBottom:6,fontSize:12.5,color:P.stone,lineHeight:1.7}}>
              <div style={{fontWeight:600,color:P.ink}}>{r.id}</div>
              <div style={{fontWeight:600,
                color:r.handling==="hoppet_over"?P.clay:P.olive}}>
                {HANDLING_LABEL[r.handling]}
                {r.handling==="korrigert" && ` — ${r.fra} → ${r.til}`}
                {r.handling==="allerede_korrekt" && ` (${r.belop})`}
              </div>
              {r.grunn && <div style={{color:P.dust,fontSize:11.5}}>{r.grunn}</div>}
            </div>
          ))}
        </div>
      )}

      {forhandsvisning && forhandsvisning.some(r=>r.handling==="korrigert") && status!=="ferdig" && (
        <button onClick={kjorRecovery} disabled={status==="kjorer"}
          style={{width:"100%",padding:"12px",background:P.hazel,color:"white",
            border:"none",borderRadius:9,fontSize:14,fontWeight:600,
            cursor:status==="kjorer"?"default":"pointer",marginBottom:14}}>
          {status==="kjorer" ? "Kjører…" : "Kjør recovery"}
        </button>
      )}

      {status==="feilet" && (
        <div style={{padding:"12px 14px",background:"#FFF4F0",border:"1px solid #F0C4B0",borderRadius:9,
          fontSize:12.5,color:P.clay}}>
          ⚠ Recovery feilet. Se konsollen for detaljer.
        </div>
      )}

      {resultat && (
        <div style={{padding:"12px 14px",background:"#F0FFF4",border:"1px solid "+P.oliveL,
          borderRadius:9,fontSize:12.5,color:P.olive,lineHeight:1.8}}>

          {resultat.map(r=>(
            <div key={r.id}>{r.id}: {HANDLING_LABEL[r.handling]}{r.handling==="korrigert"?` (${r.fra} → ${r.til})`:""}</div>
          ))}
        </div>
      )}
    </div>
  );
}

function VerktoyScreen({budgetGroups,setBudgetGroups,incomeGroups,setIncomeGroups,sparingGroups,setSparingGroups,rules,setRules,liquidity,month,adminSub,transaksjoner,setTransaksjoner,hendelser,setHendelser,receipts,annualPlans,setAnnualPlan}) {
  const {erMobil} = useLayoutBredde();

  // Ikke-migrerte flater (Kontoer, Aarsbudsjett, Metadata) har ikke sin
  // egen interne fast/scrollende-splitt ennaa (kommer i senere sprinter).
  // Paa web/mellom faar de derfor en enkel reserve-wrapper som gir dem
  // nokyaktig samme "hele innholdet scroller som én enhet"-oppforsel som
  // AdminSkall sin content-div ga alle skjermer i steg 2 — kun flyttet
  // ett niva ned, siden AdminSkall selv na gir bundet hoyde videre i
  // stedet for aa eie scrollingen selv. Paa mobil er dette urort:
  // MobilSkall eier fortsatt hele scrollingen selv, som for.
  // Vanlig JS-funksjon (ikke en JSX-komponent) — unngar noestet
  // komponentdefinisjon inni en render-funksjon.
  const medIkkeMigrertScroll = (innhold) => (
    erMobil ? innhold : (
      <div style={{flex:1,minHeight:0,overflowY:"auto"}}>{innhold}</div>
    )
  );

  if(adminSub==="kontoer") return medIkkeMigrertScroll(<KontoerScreen/>);

  if(adminSub==="arsbudsjett") {
    return medIkkeMigrertScroll(
      <ArsbudsjettScreen
        budgetGroups={budgetGroups} setBudgetGroups={setBudgetGroups}
        incomeGroups={incomeGroups} setIncomeGroups={setIncomeGroups}
        sparingGroups={sparingGroups} setSparingGroups={setSparingGroups}
        annualPlans={annualPlans} setAnnualPlan={setAnnualPlan}/>
    );
  }

  if(adminSub==="generator") {
    return (
      <GeneratorSenter
        budgetGroups={budgetGroups} setBudgetGroups={setBudgetGroups}
        incomeGroups={incomeGroups} setIncomeGroups={setIncomeGroups}
        liquidity={liquidity} month={month}/>
    );
  }

  if(adminSub==="regler") {
    return <RegelSenter rules={rules} setRules={setRules} budgetGroups={budgetGroups} incomeGroups={incomeGroups} sparingGroups={sparingGroups} transaksjoner={transaksjoner} setTransaksjoner={setTransaksjoner} hendelser={hendelser} setHendelser={setHendelser}/>;
  }

  // Sparing, etappe 2 — midlertidig engangsverktoy. Fjernes naar
  // flyttingen er bekreftet fullfort og verifisert.
  if(adminSub==="spareflytting") {
    return medIkkeMigrertScroll(
      <SparePostFlyttingScreen
        budgetGroups={budgetGroups} setBudgetGroups={setBudgetGroups}
        sparingGroups={sparingGroups} setSparingGroups={setSparingGroups}/>
    );
  }

  // Kostnadsstruktur v2 — midlertidig engangsverktoy. Fjernes naar
  // flyttingen er bekreftet fullfort og verifisert.
  if(adminSub==="kostnadflytting") {
    return medIkkeMigrertScroll(
      <KostnadFlyttingScreen
        budgetGroups={budgetGroups} setBudgetGroups={setBudgetGroups}/>
    );
  }

  // v-personlig-flytting — midlertidig engangsverktoy for aa flytte
  // helen_klar/eivind_klar fra Diverse til Personlig. Fjernes naar
  // bekreftet fullfort og verifisert live.
  if(adminSub==="personligflytting") {
    return medIkkeMigrertScroll(
      <PersonligFlyttingScreen
        budgetGroups={budgetGroups} setBudgetGroups={setBudgetGroups}/>
    );
  }

  // v-post-rename — midlertidig, ekstremt snevert engangsverktoy
  // for de to kjente feil-signerte "Drivstoff og lading"-hendelsene.
  // Fjernes naar recoveryen er bekreftet kjort og verifisert live.
  if(adminSub==="fortegnrecovery") {
    return medIkkeMigrertScroll(
      <FortegnRecoveryScreen hendelser={hendelser} setHendelser={setHendelser}/>
    );
  }

  // v-post-rename — administrativ eksport av kvalitetssikret
  // okonomihistorikk. Rent lesende, ingen Firebase-skriving.
  if(adminSub==="historikkeksport") {
    return medIkkeMigrertScroll(
      <HistorikkEksportScreen
        hendelser={hendelser} transaksjoner={transaksjoner} receipts={receipts}
        budgetGroups={budgetGroups} incomeGroups={incomeGroups} sparingGroups={sparingGroups}/>
    );
  }

  // "metadata" og eventuelle fremtidige, ikke-ferdige flater
  return medIkkeMigrertScroll(
    <div style={{textAlign:"center",padding:"40px 20px",color:P.dust}}>
      <div style={{fontSize:32,marginBottom:10}}>🏷️</div>
      <div style={{fontSize:14,fontWeight:600,color:P.stone,marginBottom:6}}>Metadata</div>
      <div style={{fontSize:12,lineHeight:1.6}}>Kommer senere.</div>
    </div>
  );
}
