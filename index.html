                </td>
                <td style={{padding:td,textAlign:"center",color:f.forfallsdag?P.clay:P.stone,fontWeight:f.forfallsdag?600:400}}>
                  {m?m.forfallsdag||"—":"—"}
                  {f.forfallsdag && <span style={{color:P.clay}}> ⚠</span>}
                </td>
                <td style={{padding:td,textAlign:"center",fontSize:erMobil?11:11.5}}>
                  {m&&m.automatisk
                    ? (erMobil ? <span style={{color:P.gold}}>⚡</span> : <span style={{color:P.gold}}>⚡ Automatisk</span>)
                    : (erMobil ? <span style={{color:P.border}}>·</span> : <span style={{color:P.stone}}>Manuell</span>)}
                  {f.belop && <span style={{color:P.clay}}> ⚠</span>}
                </td>
                <td style={{padding:td,color:P.stone,fontSize:erMobil?10:11.5}}>{m?m.kilde||"—":"—"}</td>
                <td style={{padding:td,textAlign:"right",color:f.belop?P.clay:(p.type==="inn"?P.olive:P.ink),fontWeight:f.belop?700:500}}>
                  {p.budget!==null&&p.budget!==undefined?fmt(p.budget):"—"}
                  {f.belop && <span style={{color:P.clay}}> ⚠</span>}
                </td>
                <td style={{padding:td,textAlign:"center"}}>
                  <button
                    style={{background:m?P.hazelXL:P.mist,border:"1px solid "+(m?P.hazelL:P.border),
                      borderRadius:5,cursor:"pointer",fontSize:9,padding:"2px 6px",
                      color:m?P.hazel:P.dust}}
                    onClick={e=>{e.stopPropagation();setEditModal(p);}}>
                    {m?"✓":"+"}
                  </button>
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>
      {poster.length===0 && (
        <div style={{textAlign:"center",padding:"24px",color:P.dust,fontSize:13}}>
          Ingen poster her.
        </div>
      )}
    </div>
  );

  // Delt visning: nivaagruppert tabellsett, brukt av BADE Krever
  // oppmerksomhet (web/mellom) og Oversikt — pa web skal ingen av
  // administrasjonsflatene vaere én lang flat tabell.
  const NivaGruppertTabeller = ({poster}) => (
    <div>
      {NIVA_REKKEFOLGE.map(niva=>{
        const posterHer = poster.filter(p=>nivaKey(p)===niva.key);
        if(posterHer.length===0) return null;
        return (
          <div key={niva.key} style={{marginBottom:16}}>
            <div style={{fontSize:12.5,fontWeight:600,color:P.ink,marginBottom:6}}>
              {niva.label} <span style={{color:P.dust,fontWeight:400}}>({posterHer.length})</span>
            </div>
            <RadTabell poster={posterHer}/>
          </div>
        );
      })}
    </div>
  );

  // ── Web/mellom: ekte AdminTabell (steg C) ────────────────────────
  // Egen presentasjon for web — IKKE RadTabell gjort bredere. Faste
  // kolonnebredder, ellipsis per kolonne, ingen linjebrudd som sprenger
  // radhoyden. Samme underliggende data (feilFelter, harFeil, nivaKey)
  // som mobilkortet og RadTabell bruker — kun selve fremvisningen er ny.
  const ADMIN_KOLONNER = [
    {key:"retning",  label:"", bredde:28, render:p=>(
      <span style={{color:p.type==="inn"?P.olive:P.clay,fontWeight:700}}>{p.type==="inn"?"↑":"↓"}</span>
    )},
    {key:"gruppe", label:"Gruppe", bredde:"14%", render:p=><span style={{color:P.stone}}>{p.gruppe}</span>},
    {key:"post", label:"Post", bredde:"16%", render:p=>{
      const f = feilFelter(p);
      return (
        <span style={{color:P.ink,fontWeight:500}}>
          {p.item.name}
          {f.metadata && <span style={{marginLeft:4,color:"#C0602A",fontSize:10}} title="Mangler all metadata">⚠</span>}
        </span>
      );
    }},
    {key:"eier", label:"Eier", bredde:"9%", render:p=>{
      const m = p.item.meta;
      return <span style={{color:m?P.stone:P.clay}}>{m?m.eier||"—":"—"}</span>;
    }},
    {key:"niva", label:"Nivå / undertype", bredde:"16%", render:p=>{
      const m = p.item.meta; const f = feilFelter(p);
      return (
        <span style={{color:f.niva?P.clay:P.stone,fontWeight:f.niva?600:400}}>
          {m?(NIVA_LABEL[m.niva]||m.niva||"—"):"—"}
          {m && m.niva==="opprettholde" && <span style={{color:P.dust}}> ({m.opprettholdType==="valgfritt"?"valgfri":"nødvendig"})</span>}
          {f.niva && <span style={{color:P.clay}}> ⚠</span>}
        </span>
      );
    }},
    {key:"konto", label:"Konto", bredde:"9%", render:p=>{
      const m = p.item.meta; const f = feilFelter(p);
      return (
        <span style={{color:f.konto?P.clay:(m?P.stone:P.clay),fontWeight:f.konto?600:400}}>
          {m?m.konto||"—":"—"}{f.konto && " ⚠"}
        </span>
      );
    }},
    {key:"dag", label:"Forfallsdag", bredde:"8%", align:"center", render:p=>{
      const m = p.item.meta; const f = feilFelter(p);
      return (
        <span style={{color:f.forfallsdag?P.clay:P.stone,fontWeight:f.forfallsdag?600:400}}>
          {m?m.forfallsdag||"—":"—"}{f.forfallsdag && " ⚠"}
        </span>
      );
    }},
    {key:"auto", label:"Auto/manuell", bredde:"9%", align:"center", render:p=>{
      const m = p.item.meta; const f = feilFelter(p);
      return (
        <span>
          {m&&m.automatisk ? <span style={{color:P.gold}}>⚡ Automatisk</span> : <span style={{color:P.stone}}>Manuell</span>}
          {f.belop && <span style={{color:P.clay}}> ⚠</span>}
        </span>
      );
    }},
    {key:"kilde", label:"Kilde", bredde:"8%", render:p=>{
      const m = p.item.meta;
      return <span style={{color:P.stone}}>{m?m.kilde||"—":"—"}</span>;
    }},
    {key:"belop", label:"Beløp", bredde:"9%", align:"right", render:p=>{
      const f = feilFelter(p);
      return (
        <span style={{color:f.belop?P.clay:(p.type==="inn"?P.olive:P.ink),fontWeight:f.belop?700:500}}>
          {p.budget!==null&&p.budget!==undefined?fmt(p.budget):"—"}{f.belop && " ⚠"}
        </span>
      );
    }},
  ];

  const AdminGruppertTabell = ({poster}) => (
    <div>
      {NIVA_REKKEFOLGE.map(niva=>{
        const posterHer = poster.filter(p=>nivaKey(p)===niva.key);
        if(posterHer.length===0) return null;
        return (
          <div key={niva.key} style={{marginBottom:20}}>
            <div style={{fontSize:13,fontWeight:600,color:P.ink,marginBottom:8}}>
              {niva.label} <span style={{color:P.dust,fontWeight:400}}>({posterHer.length})</span>
            </div>
            <AdminTabell
              kolonner={ADMIN_KOLONNER}
              rader={posterHer.map(p=>({...p, id:p.groupId+"-"+p.item.id}))}
              onRadKlikk={p=>setEditModal(p)}
              uthevRad={p=>harFeil(p)}/>
          </div>
        );
      })}
    </div>
  );

  // ── Steg 3: fast beslutningsomraade vs. scrollende arbeidsomraade ──
  // Beregnet EN gang, i samme rekkefolge som for. Mobil rendrer de to
  // delene rett etter hverandre (identisk med tidligere output — MobilSkall
  // eier sin egen scroll uendret). Web/mellom pakker dem i AdminArbeidsomrade,
  // som gjor "fast" sticky mot AdminSkall sin allerede etablerte scroll-
  // container.
  const fastInnhold = (
    <>
      <div style={{fontSize:15,fontWeight:600,color:P.ink,marginBottom:8}}>⚡ Generator-senter</div>

      {/* Status-panel — vises alltid, uansett fane/bredde */}
      <AdminStatusPanel erWeb={erWeb} tittel="Status" felter={[
        {label:"Sist kjørt", verdi: fmtRelTid(sistKjort)},
        {label:"Genererte", verdi: genPoster.length, farge: P.hazel},
        {label:"Manuelle", verdi: manPoster.length},
        {label:"Overstyrte", verdi: overstyrte.length, farge: overstyrte.length>0?P.clay:P.stone},
      ]}/>

      {/* Fane-velger — kun to faner na: Krever oppmerksomhet / Oversikt */}
      <div style={{display:"flex",gap:0,marginBottom:14,borderBottom:"2px solid "+P.border}}>
        {FANER.map(f=>(
          <button key={f.id} onClick={()=>setFane(f.id)}
            style={{flex:1,padding:"8px 4px",fontSize:12,cursor:"pointer",
              fontWeight:fane===f.id?600:400,background:"none",border:"none",
              borderBottom:fane===f.id?"2.5px solid "+f.farge:"2px solid transparent",
              marginBottom:-2,color:fane===f.id?f.farge:P.stone,textAlign:"center"}}>
            {f.label}
            {f.n!==null && f.n>0 && <span style={{marginLeft:4,fontSize:9,color:f.farge,fontWeight:700}}>{f.n}</span>}
          </button>
        ))}
      </div>

      {/* Oversikt-fanens sok/filter horer til beslutningsomraadet */}
      {fane==="oversikt" && (
        <>
          <div style={{fontSize:12,color:P.stone,marginBottom:12}}>
            Kontroller at klassifiseringen er konsekvent innenfor hvert nivå. Søk og filtrer for å avgrense —
            grupperingen forblir synlig selv når du filtrerer.
          </div>

          <AdminSokFelt verdi={sok} setVerdi={setSok} placeholder="Søk etter post eller gruppe…"/>

          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:16}}>
            {FILTERS.map(f=><Pill key={f.id} id={f.id} label={f.label}/>)}
          </div>
        </>
      )}
    </>
  );

  const scrollendeInnhold = (
    <>
      {/* ── FANE: Krever oppmerksomhet (arbeidslisten) ── */}
      {fane==="oppmerksomhet" && (
        posterMedFeil.length===0 ? (
          <div style={{textAlign:"center",padding:"32px 16px",color:P.dust,fontSize:13}}>
            ✓ Ingen poster krever oppmerksomhet nå.
          </div>
        ) : !erMobil ? (
          // Web/mellom: nivaagruppert (ikke en enkelt flat tabell)
          <AdminGruppertTabell poster={posterMedFeil}/>
        ) : (
          // Mobil: én oppgave om gangen, med tydelig hvilke felt som mangler
          (() => {
            const p = posterMedFeil[Math.min(mobilIndeks, posterMedFeil.length-1)];
            const f = feilFelter(p);

                    style={{flex:1,padding:"9px",background:P.mist,border:"1px solid "+P.border,
                      borderRadius:8,fontSize:12,cursor:mobilIndeks===0?"default":"pointer",
                      color:mobilIndeks===0?P.border:P.stone}}>

                      borderRadius:8,fontSize:12,

      {/* ── FANE: Oversikt — selve tabellen er arbeidsinnholdet ── */}

        <>
          <AdminGruppertTabell poster={allePoster.filter(matcherFilterOgSok)}/>

          {allePoster.filter(matcherFilterOgSok).length===0 && (

  return (
    <div style={erMobil ? undefined : {flex:1,minHeight:0,display:"flex",flexDirection:"column",height:"100%"}}>

        <>{fastInnhold}{scrollendeInnhold}</>

        <AdminArbeidsomrade fast={fastInnhold}>{scrollendeInnhold}</AdminArbeidsomrade>

      {/* Rediger-modal — delt av begge faner, uavhengig av fast/scrollende */}

        editModal.type==="inn"
          ? <InntekterMetaModal

              groupId={editModal.groupId}
              feilFelter={feilFelter(editModal)}

          : <BudsjettMetaModal
              item={editModal.item}

              onSave={(gid,iid,meta)=>saveMeta("ut",gid,iid,meta)}
              onClose={()=>setEditModal(null)}/>
      )}
    </div>
  );
}


// ── Prognosemotor ─────────────────────────────────────────────────
// Ren funksjon: tar saldo + liste med poster + prognosedato
// Returnerer tre tall. Ingen annet ansvar.
function calcSpillerom(saldo, posts, prognosisDate) {
  const d = prognosisDate ? new Date(prognosisDate) : new Date();
  d.setHours(23,59,59,999);
  const relevant = posts.filter(p => {
    if(!p.date) return false;
    return new Date(p.date) <= d;
  });
  const innbetalinger = relevant.filter(p=>p.direction==="in").reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
  const utbetalinger  = relevant.filter(p=>p.direction==="out").reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
  const disponibelt = parseFloat(saldo)||0;
  const bundet      = utbetalinger - innbetalinger; // netto uttak
  const spillerom   = disponibelt + innbetalinger - utbetalinger;
  return { disponibelt, innbetalinger, utbetalinger, bundet, spillerom };
}


// ── Budsjettgenerator v1 ──────────────────────────────────────────
// Ren funksjon: tar budsjettgrupper + existing2 poster + maaned
// Returnerer oppdatert posts-objekt (ingen side-effekter)
function generateForecastPosts(budgetGroups, existingPosts, month, incomeMonths, incomeGroups, sparingGroups) {
  // Start med kun manuelle poster — genererte slettes og regenereres
  const posts = {};
  Object.entries(existingPosts||{}).forEach(([id,p]) => {
    if(p.kilde !== "generator") {
      posts[id] = p; // behold manuelle
    }
    // Manuelt overstyrte genererte poster beholdes med sine verdier
    if(p.kilde === "generator" && p.manueltOverstyrt) {
      posts[id] = p;
    }
  });

  const now    = new Date();
  const aar    = now.getFullYear();
  const maaned = month;
  const genTs  = Date.now();

  // ── Kostnadsposter ─────────────────────────────────────────────
  budgetGroups.forEach(gruppe => {
    gruppe.items.forEach(item => {
      const meta = item.meta;
      if(!meta || !meta.automatisk) return;
      if(!meta.forfallsdag) return;
      const monthData = item.months && item.months[maaned];
      if(!monthData) return;
      const budgetAmount = (monthData.spent && monthData.spent > 0)
        ? monthData.spent : monthData.budget;
      if(!budgetAmount || budgetAmount <= 0) return;
      const erFaktisk = !!(monthData.spent && monthData.spent > 0);
      const dag = parseInt(meta.forfallsdag);
      const dato = new Date(aar, maaned, dag);
      const datoStr = dato.toISOString().slice(0,10);
      const noekkel = item.id+"_"+aar+"_"+maaned+"_"+dag;

      // Sjekk om den finnes som manuelt overstyrt
      const overstyrt = Object.values(posts).find(p=>p._genKey===noekkel&&p.manueltOverstyrt);
      if(overstyrt) return; // behold overstyrt versjon

      const prognosePost = {
        name:                item.name,
        amount:              budgetAmount,
        direction:           "out",
        date:                datoStr,
        type:                meta.oppforsel || "fast",
        kilde:               "generator",
        sourceBudgetItemId:  item.id,
        sourceBudgetGroupId: gruppe.id,
        sourceType:          "kostnader",
        sourceGroup:         gruppe.label,
        owner:               meta.eier || "Felles",
        level:               meta.niva || "nodvendig",
        erEstimat:           meta.oppforsel === "variabel" && !erFaktisk,
        _genKey:             noekkel,
        generatedAt:         genTs,
      };

      const id = uid();
      posts[id] = {...prognosePost, id};
    });
  });

  // ── Spareposter (Sparing, etappe 4) ─────────────────────────────
  // Egen prognosekilde: paavirker likviditetsprognosen (direction:"out",
  // samme mekanikk som kostnader), men telles ALDRI som Kostnader —
  // sourceType:"sparing" skiller dem tydelig, og ingen kostnadsvisning
  // leser posts fra Generator i det hele tatt (Kostnader beregner sine
  // egne tall fra hendelser, uavhengig av dette). Tillater EKSPLISITT
  // et negativt budsjettbelop (i motsetning til kostnadsgrenen, som
  // krever budgetAmount>0) — en negativ sparepost representerer et
  // planlagt uttak FRA sparing, og skal gi motsatt fortegn i
  // likviditetsregnestykket. calcSpillerom trenger ingen endring for
  // dette: den summerer "amount" med sitt eget fortegn uansett kilde,
  // saa et negativt "out"-belop trekker fra utbetalinger og dermed
  // OKER spillerom, nokyaktig som et uttak skal.
  if(sparingGroups) {
    sparingGroups.forEach(gruppe => {
      gruppe.items.forEach(item => {
        const meta = item.meta;
        if(!meta || !meta.automatisk) return;
        if(!meta.forfallsdag) return;
        const monthData = item.months && item.months[maaned];
        if(!monthData) return;
        const budgetAmount = (monthData.spent && monthData.spent !== 0)
          ? monthData.spent : monthData.budget;
        if(!budgetAmount) return; // kun 0/mangler ekskluderes -- negativt tillates bevisst
        const erFaktisk = !!(monthData.spent && monthData.spent !== 0);
        const dag3 = parseInt(meta.forfallsdag);
        const dato3 = new Date(aar, maaned, dag3);
        const datoStr3 = dato3.toISOString().slice(0,10);
        const noekkel3 = "spar_"+item.id+"_"+aar+"_"+maaned+"_"+dag3;

        const overstyrt = Object.values(posts).find(p=>p._genKey===noekkel3&&p.manueltOverstyrt);
        if(overstyrt) return; // behold manuelt overstyrt versjon

        const sparepost = {
          name:                 item.name,
          amount:               budgetAmount,
          direction:            "out",
          date:                 datoStr3,
          type:                 meta.oppforsel || "fast",
          kilde:                "generator",
          sourceSparingItemId:  item.id,
          sourceSparingGroupId: gruppe.id,
          sourceId:             item.id,
          sourceType:           "sparing",
          sourceGroup:          gruppe.label,
          likviditet:           meta.likviditet || "avsatt",
          owner:                meta.eier || "Felles",
          konto:                meta.konto || "Regninger",
          forfallsdag:          meta.forfallsdag,
          erEstimat:            meta.oppforsel === "variabel" && !erFaktisk,
          _genKey:              noekkel3,
          generatedAt:          genTs,
        };
        const sparId = uid();
        posts[sparId] = {...sparepost, id:sparId};
      });
    });
  }

  // ── Inntektsposter ─────────────────────────────────────────────
  if(incomeGroups) {
    incomeGroups.forEach(gruppe => {
      gruppe.items.forEach(inc => {
        const meta = inc.meta||{};
        if(!meta.automatisk) return;
        const dag2 = parseInt(meta.forfallsdag||"");
        if(!dag2) return;
        const mo2 = inc.months && inc.months[maaned];
        const amt = (meta.disponibelt && meta.disponibelt>0) ? meta.disponibelt
                  : (mo2&&mo2.spent>0) ? mo2.spent
                  : (mo2&&mo2.budget>0) ? mo2.budget : 0;
        if(!amt) return;
        const incDato = new Date(aar, maaned, dag2);
        const incDatoStr = incDato.toISOString().slice(0,10);
        const incNoekkel = "inc_"+inc.id+"_"+aar+"_"+maaned+"_"+dag2;

        const overstyrt = Object.values(posts).find(p=>p._genKey===incNoekkel&&p.manueltOverstyrt);
        if(overstyrt) return;

        const post = {
          name:        inc.name,
          amount:      amt,
          direction:   "in",
          date:        incDatoStr,
          type:        "inn",
          kilde:       "generator",
          sourceType:  "inntekter",
          sourceGroup: gruppe.label,
          sourceItemId:inc.id,
          owner:       meta.eier||"Felles",
          erEstimat:   !(mo2&&mo2.spent>0) && !meta.disponibelt,
          _genKey:     incNoekkel,
          generatedAt: genTs,
        };
        const incId = uid();
        posts[incId] = {...post, id:incId};
      });
    });
  }
  return posts;
}


// ── Regelmotor (ren funksjon) ────────────────────────────────────
// Motoren kjenner ikke Firebase, UI eller Bankimport.
// Den mottar én transaksjon og en liste med regler, og returnerer beste match.
// Match-type-basert sammenligning — eksplisitt og brukerstyrt (v-
// behandlingsmotor-vnext §3), i stedet for den tidligere fuzzy
// ordoverlapp-heuristikken. "inneholder" er standard (bakoverkompatibelt
// med regler uten matchType satt) og tillater begge retninger, som
// tidligere oppforsel gjorde. Ren funksjon, gjenbrukbar for
// matchtelling for lagring (§3: "vis hvor mange observasjoner...").
// §3: felles prefiks mellom en regels eksisterende monster og en ny
// observasjons tekst — brukt til aa "utvide" en regel i stedet for aa
// lage en ny, naar de sannsynligvis beskriver samme leverandor
// (f.eks. "spotify ab" og "spotify*premium" -> "spotify"). Trimmer til
// siste hele ord, saa vi aldri kutter midt i et.
function fellesPrefiks(a, b) {
  const min = Math.min((a||"").length, (b||"").length);
  let i = 0;
  while(i<min && a[i]===b[i]) i++;
  let prefix = (a||"").slice(0,i);
  const sisteMellomrom = prefix.lastIndexOf(" ");
  if(sisteMellomrom>0 && i<(a||"").length) prefix = prefix.slice(0,sisteMellomrom);
  return prefix.trim();
}

function regelMatcherTekst(rule, tekst) {
  const rPattern = (rule.normalizedPattern||rule.pattern||"").toLowerCase();
  const t = (tekst||"").toLowerCase();
  if(!rPattern || !t) return false;
  const type = rule.matchType || "inneholder";
  if(type==="er_lik")      return t===rPattern;
  if(type==="starter_med") return t.startsWith(rPattern);
  return t.includes(rPattern) || rPattern.includes(t);
}

function findMatchingRule(transaction, rules) {
  if(!transaction || !rules || !rules.length) return {rule:null, confidence:0, begrunnelse:"Ingen regler tilgjengelig"};

  const aktiveRegler = rules.filter(r=>r.active!==false && r.mode!=="disabled");
  if(!aktiveRegler.length) return {rule:null, confidence:0, begrunnelse:"Ingen aktive regler"};

  const tTekst = (transaction.normalizedText||transaction.tekst||"").toLowerCase();

  const scored = aktiveRegler.map(r=>{
    if(!regelMatcherTekst(r, tTekst)) return {rule:r, score:0, begrunnelse:"Ingen tekstlikhet"};
    const type = r.matchType || "inneholder";
    const grunnscore = type==="er_lik" ? 100 : type==="starter_med" ? 85 : 70;
    const begrunnelse = type==="er_lik" ? "Eksakt treff pa normalisert tekst"
      : type==="starter_med" ? "Starter med monsteret"
      : "Monsteret inngar i teksten";
    const vektet = Math.round(grunnscore * ((r.confidence!==undefined?r.confidence:100)/100));
    return {rule:r, score:vektet, begrunnelse};
  }).filter(s=>s.score>0);

  if(!scored.length) return {rule:null, confidence:0, begrunnelse:"Ingen regel matcher denne transaksjonen"};

  scored.sort((a,b)=>b.score-a.score);
  const best = scored[0];
  return {rule:best.rule, confidence:best.score, begrunnelse:best.begrunnelse};
}

// ── Etterbehandling, etappe 1 — lart regelskriving, lofted ut av
// BankimportScreen. Ren funksjon: mottar dagens regelliste + hva som
// skal laeres, returnerer den NYE regellisten. Orkestreringen
// (setRules(prev=>...)) gjores av kalleren — samme mønster som
// byggFordelingFraPost/beregnFaktiskTotalerFraHendelser allerede
// bruker. Gjor det mulig aa laere en regel fra et hvilket som helst
// sted i appen (Bankimport i dag, korrigeringspanelet i etappe 3),
// uten aa duplisere logikken. Atferd uendret — kun flyttet.
function oppdaterReglerVedLaering(rules, transaksjon, post, multiUse) {
  const normPattern = normaliserTransaksjonstekst(transaksjon.tekst);
  const eksisterende = (rules||[]).find(r=>r.targetId===post.id && regelMatcherTekst(r, normPattern));
  const naa = new Date().toISOString();
  if(eksisterende) {
    return (rules||[]).map(r=>r.id!==eksisterende.id?r:{
      ...r,
      timesUsed:(r.timesUsed||0)+1,
      lastMatched:naa,
      updatedAt:naa,
      multiUse: multiUse!==undefined ? !!multiUse : r.multiUse,
      mode: (multiUse!==undefined?!!multiUse:r.multiUse) ? "review" : "auto",
    });
  }
  const nyRegel = {
    id: uid(),
    pattern: transaksjon.tekst,
    normalizedPattern: normPattern,
    matchType: "inneholder", // §3: eksplisitt, brukerstyrt — se regelMatcherTekst
    targetType: post.plasseringType || (post.retning==="inn" ? "income" : "budget"),
    targetId: post.id,
    targetName: post.name,
    targetGruppe: post.gruppe,
    mode: multiUse ? "review" : "auto",
    confidence: 100,
    timesUsed: 1,
    lastMatched: naa,
    multiUse: !!multiUse,
    active: true,
    createdAt: naa,
    updatedAt: naa,
  };
  return [...(rules||[]), nyRegel];
}

// ── Fordeling som grunnstruktur (v-gangen-komposisjon-4) ────────────────
// En observasjon kan plasseres pa én eller flere plasseringer samtidig
// — splitt er ikke en egen arbeidsflyt, bare et mer presist svar pa
// "hvor horer denne hjemme". Bygger én Actual-post PER fordelingslinje,
// samme monster som byggActualFraKvitteringSplitter allerede beviser
// (deterministisk id, ett-linje-fordeling er strukturelt identisk med
// "ingen splitt" — ingen egen kodevei for det enkle tilfellet).
// Hver linjes EGEN retning (fra dens plassering) avgjor fortegn —
// samme refusjon-mekanisme som createActualFromTransaction, na anvendt
// per linje i stedet for kun pa hele transaksjonen.
// (byggActualFraFordelinger er fjernet. Ingen
// gjenvaerende kallere etter at kobleKvitteringTilTransaksjon og
// migrerHistoriskKobling ble skrevet om til aa bygge hendelser direkte,
// uten aa ga via Actual i det hele tatt.)

// Bygger fordelinger-formatet direkte fra en kvitterings splitter — den
// bro som lar kvitteringens plassering og ansvar overfores direkte til
// en hendelse. Kvitteringen "eier" plasseringen og ansvaret; dette gjor
// bare formatet forstaelig for hendelsesmodellen, uten aa duplisere
// selve byggelogikken (§1/§2/§4 i oppdraget — én felles modell).
function fordelingerFraKvitteringSplits(splits) {
  return (splits||[]).map(sp => ({
    post: {
      id: sp.targetId, name: sp.targetName,
      retning: sp.targetType==="income" ? "inn" : "ut",
    },
    belop: sp.amount||0,
    eiere: (sp.eiere && sp.eiere.length>0) ? sp.eiere : [{person:"Felles",prosent:100}],
  }));
}

// ── Etterbehandling, etappe 4 — synkroniseringsgapet (ren funksjon) ──
// Naar en ALLEREDE koblet kvittering redigeres (total/splits/
// allocationMode/ansvar), skal den tilknyttede hendelsen ALLTID
// oppdateres til aa reflektere kvitteringens NAVAERENDE innhold —
// hendelsen kan ikke vaere sannhetskilde for budsjettberegningen
// samtidig som en redigering av kvitteringen lar den bli utdatert.
// Kobling verifiseres BEGGE veier for hver skriving; finnes ingen
// gyldig kobling, returneres en feil og INGENTING skal skrives —
// ingen automatisk reparasjon, ingen ny hendelse, ingen fallback.
// Ikke koblet i det hele tatt (hendelseId mangler) -> ingen synk
// nodvendig, ingen feil (dette er den normale, ikke-koblede tilstanden).
function byggSynkronisertKvitteringOgHendelse(receipt, felter, hendelser) {
  const oppdatertReceipt = {...receipt, ...felter, updatedAt:new Date().toISOString()};

  if(!receipt.hendelseId) {
    return {feil:null, nyReceipt:oppdatertReceipt, nyHendelse:null};
  }

  const hendelse = (hendelser||[]).find(h=>h.id===receipt.hendelseId);
  if(!hendelse) {
    return {feil:"Fant ikke hendelsen denne kvitteringen skal være koblet til. Endringen ble ikke lagret.", nyReceipt:null, nyHendelse:null};
  }
  if(hendelse.receiptId !== receipt.id) {
    return {feil:"Hendelsen peker ikke tilbake på denne kvitteringen (asymmetrisk kobling). Endringen ble ikke lagret.", nyReceipt:null, nyHendelse:null};
  }

  const fordelinger = fordelingerFraKvitteringSplits(oppdatertReceipt.splits).map(f=>({
    plasseringId: f.post.id, plasseringType: f.post.retning==="inn" ? "income" : "budget",
    plasseringNavn: f.post.name, belop: f.belop, eiere: f.eiere,
  }));
  const oppdatertHendelse = {
    ...hendelse, status:"ferdig", paaVentAarsak:null, fordelinger, oppdatert:new Date().toISOString(),
  };
  return {feil:null, nyReceipt:oppdatertReceipt, nyHendelse:oppdatertHendelse};
}

// Jevn ansvarsfordeling mellom valgte personer — 100% ved én person,
// jevnt delt (med rest lagt pa de forste) ved flere. Utvides automatisk
// naar BUDGET_EIER faar flere navn — ingen kode her forutsetter nokyaktig
// to personer.
function jevnFordelEiere(personer) {
  if(!personer||personer.length===0) return [];
  const grunn = Math.floor(100/personer.length);
  const rest = 100 - grunn*personer.length;
  return personer.map((p,i)=>({person:p, prosent: grunn + (i<rest?1:0)}));
}

// ── BelopFelt (delt komponent) ────────────────────────────────────
// Konsoliderer tre nesten identiske belopfelt (kvitteringens totalbelop,
// kvitteringens splittbelop, transaksjonens fordelingsbelop) til én.
// Lokal utkast-state, lagres kun ved blur/Enter — ALDRI per tastetrykk
// (§8 i oppdraget: roten til "kan bare skrive ett siffer om gangen").
// Synkroniserer fra utsiden naar verdi endres UTEN at brukeren skriver
// her selv — nodvendig for restbelop-linjen (§1), som oppdateres naar en
// annen linje endres, ikke via egen inntasting.
function BelopFelt({verdi, onSave, redigerbar, style}) {
  const [utkast,setUtkast] = useState(String(verdi!=null?verdi:0));
  React.useEffect(()=>{ setUtkast(String(verdi!=null?verdi:0)); }, [verdi]);
  if(redigerbar===false) {
    return <div style={style}>{new Intl.NumberFormat("nb-NO",{maximumFractionDigits:0}).format(verdi||0)}</div>;
  }
  const lagre = () => onSave(parseFloat(String(utkast).replace(",","."))||0);
  return (
    <input type="text" inputMode="decimal" value={utkast}
      onFocus={e=>e.target.select()}
      onChange={e=>setUtkast(e.target.value)}
      onBlur={lagre}
      onKeyDown={e=>{ if(e.key==="Enter"){ lagre(); e.target.blur(); } }}
      style={style}/>
  );
}

// ── Restbelop ved splitt (delt mellom banktransaksjoner og kvitteringer) ──
// Siste linje i en fordelings-/splittliste er ALDRI brukerredigerbar —
// den er alltid totalbelopet minus summen av de andre linjene. Brukeren
// skal aldri regne ut restbelopet selv. Feltnavnet ("belop" for
// transaksjon-fordelinger, "amount" for kvitteringssplitter) er
// parametrisert, slik at samme rene funksjon dekker begge —
// konsolidering fremfor to parallelle implementasjoner.
function beregnRestPaaSisteLinje(linjer, totalBelop, felt) {
  if(!linjer || linjer.length===0) return linjer||[];
  const sumUtenSiste = linjer.slice(0,-1).reduce((s,l)=>s+(l[felt]||0),0);
  const rest = (totalBelop||0) - sumUtenSiste;
  return linjer.map((l,i)=> i===linjer.length-1 ? {...l, [felt]:rest} : l);
}

// ── AnsvarChips (delt komponent) ──────────────────────────────────
// Ansvarsfordeling for ÉN fordelingslinje — brukt identisk av VisRad
// (banktransaksjonens fordelinger) OG KvitteringDetalj (kvitteringens
// splitter). Én kilde til denne UI-en, ikke to parallelle
// implementasjoner (kvittering og banktransaksjon skal bruke samme
// fordelingsmodell). Kjenner ikke til hvor eiere-listen faktisk
// lagres — kalleren avgjor det via onChange.
function AnsvarChips({eiere, onChange}) {
  return (
    <div style={{display:"flex",gap:4,flexWrap:"wrap",marginTop:6}}>
      {BUDGET_EIER.map(person=>{
        const valgt = (eiere||[]).find(e=>e.person===person);
        return (
          <button key={person} onClick={()=>{
              const naa = (eiere||[]).map(e=>e.person);
              const erValgt = naa.includes(person);
              if(erValgt && naa.length===1) return; // ma ha minst én
              const nye = erValgt ? naa.filter(p=>p!==person) : [...naa, person];
              onChange(jevnFordelEiere(nye));
            }}
            style={{padding:"3px 8px",borderRadius:6,fontSize:10,cursor:"pointer",
              fontWeight:valgt?600:400,
              background:valgt?P.hazelXL:"transparent",
              color:valgt?P.hazel:P.dust,
              border:"1px solid "+(valgt?P.hazel:P.border)}}>
            {person}{valgt&&eiere.length>1?` ${valgt.prosent}%`:""}
          </button>
        );
      })}
    </div>
  );
}

// ── Actual-totals-motor (ren funksjon) ───────────────────────────
// Motoren kjenner ikke Firebase, UI eller Budsjett.
// Mottar Actual-poster, returnerer summer per targetId.
// Motoren er fortsatt ren: mottar Actual-poster (og valgfritt en liste over
// gyldige transactionId-er), returnerer summer per targetId. Den kjenner
// ikke Firebase eller UI — kallende kode er ansvarlig for aa sende inn
// riktig data.
// ── Hendelsesmodell (Fase 4, etappe 1) — rene funksjoner ─────────
// Additivt: ingenting kaller disse ennaa. calculateActualTotals under
// er ikke rort, og har fortsatt sine eksisterende kallere frem til
// etappe 2 tar dem over.
//
// En hendelse: {id, status:"uplassert"|"pa_vent"|"ferdig", paaVentAarsak,
//   transaksjonId, receiptId, fordelinger:[{plasseringId,plasseringType,
//   plasseringNavn,belop,eiere}], dato, regelId, opprettet, oppdatert}.
// dato er denormalisert fra den primaere observasjonen ved opprettelse —
// unngaar et oppslag mot transaksjoner/receipts for hver eneste
// budsjettvisning. Fordelingens belop er allerede korrekt signert
// (samme fortegn-logikk som byggActualFraFordelinger brukte) — ingen
// signering skjer ved lesing.

// Erstatter calculateActualTotals: summerer direkte fra hendelser i
// stedet for en separat, lagret Actual-projeksjon. Kun ferdige
// hendelser telles. gyldigeObservasjonIder er valgfri, som i den gamle
// funksjonen — en hendelse uten NOEN gyldig observasjon (verken
// transaksjon eller kvittering finnes lenger) telles ikke med.
function beregnFaktiskTotalerFraHendelser(hendelser, monthKey, gyldigeObservasjonIder) {
  const totals = {};
  (hendelser||[]).forEach(h=>{
    if(!h || h.status!=="ferdig") return;
    if(gyldigeObservasjonIder!==undefined) {
      const harGyldigObservasjon =
        (h.transaksjonId && gyldigeObservasjonIder.has(h.transaksjonId)) ||
        (h.receiptId && gyldigeObservasjonIder.has(h.receiptId));
      if(!harGyldigObservasjon) return;
    }
    if(monthKey!==undefined && monthKey!==null) {
      if(!h.dato) return;
      if(h.dato.slice(0,7)!==monthKey) return;
    }
    (h.fordelinger||[]).forEach(f=>{
      if(!f.plasseringId) return;
      if(!totals[f.plasseringId]) totals[f.plasseringId] = 0;
      totals[f.plasseringId] += (f.belop||0);
    });
  });
  return totals;
}

// ── Etterbehandling, etappe 2 — drill-down (rent lesende) ────────
// ── Etterbehandling, etappe 5 — opprydding ───────────────────────
// Delt, ren funksjon for "alle budsjett-/inntektsposter, ekskludert
// arkiverte" i {id, name, gruppe, targetType, eier}-formen brukt til
// kvittering-splitt-sok. Konsoliderer tre tidligere byte-identiske
// forekomster (KvitteringInnboksScreen, BudsjettScreen, InntekterScreen)
// — ingen atferdsendring, kun én kilde til denne logikken na.
// Bankimports EGEN allePoster (retning+belop) og KorrigerHendelseModals
// allePoster (retning, uten belop) har en annen form for et annet
// formal og er bevisst IKKE slatt sammen med denne. GeneratorSenters
// allePoster viser bevisst ogsa arkiverte poster (adminoversikt) og
// er av samme grunn heller ikke beroert.
function byggAlleMalPoster(budgetGroups, incomeGroups) {
  return [
    ...(budgetGroups||[]).flatMap(g=>g.items.filter(it=>!(it.meta&&it.meta.arkivert)).map(it=>({
      id:it.id,name:it.name,gruppe:g.label,targetType:"budget",eier:(it.meta&&it.meta.eier)||"Felles",
    }))),
    ...(incomeGroups||[]).flatMap(g=>g.items.filter(it=>!(it.meta&&it.meta.arkivert)).map(it=>({
      id:it.id,name:it.name,gruppe:g.label,targetType:"income",eier:(it.meta&&it.meta.eier)||"Felles",
    }))),
  ];
}

// Sparing, etappe 1: samme mønster som byggAlleMalPoster, men for
// sparegruppene. Postobjektene faar et eksplisitt plasseringType:
// "sparing" — dette er kroken byggFordelingFraPost sin nye
// plasseringType-overstyring leser, slik at en fordeling mot en
// sparepost korrekt merkes "sparing" og ikke faller tilbake til den
// retningsbaserte "budget"-avledningen (en sparepost har retning:"ut",
// akkurat som en kostnadspost, saa retning alene kan ikke skille dem).
function byggAlleSparingPoster(sparingGroups) {
  return (sparingGroups||[]).flatMap(g=>g.items.filter(it=>!(it.meta&&it.meta.arkivert)).map(it=>({
    id:it.id, name:it.name, gruppe:g.label, retning:"ut", plasseringType:"sparing",
    eier:(it.meta&&it.meta.eier)||"Felles",
  })));
}

// Finner hendelsene som faktisk bidrar til én bestemt post for én
// bestemt maaned — samme filterkriterier som
// beregnFaktiskTotalerFraHendelser (status/maaned/gyldig-observasjon),
// slik at drill-downens rader alltid summerer til nokyaktig det
// budsjettvisningen viser. For en splittet hendelse vises KUN den
// fordelingslinjen som horer til denne posten — ikke hele hendelsens
// sum. plasseringNavn hentes fra selve fordelingen (denormalisert ved
// plassering), ikke fra dagens budgetGroups/incomeGroups — derfor
// vises historisk navn korrekt selv om posten senere er omdopt eller
// arkivert.
function finnHendelserForPost(hendelser, transaksjoner, receipts, plasseringId, monthKey, gyldigeObservasjonIder) {
  const rader = [];
  (hendelser||[]).forEach(h=>{
    if(!h || h.status!=="ferdig") return;
    if(gyldigeObservasjonIder!==undefined) {
      const harGyldigObservasjon =
        (h.transaksjonId && gyldigeObservasjonIder.has(h.transaksjonId)) ||
        (h.receiptId && gyldigeObservasjonIder.has(h.receiptId));
      if(!harGyldigObservasjon) return;
    }
    if(monthKey!==undefined && monthKey!==null) {
      if(!h.dato || h.dato.slice(0,7)!==monthKey) return;
    }
    (h.fordelinger||[]).forEach(f=>{
      if(f.plasseringId !== plasseringId) return;
      const transaksjon = h.transaksjonId ? (transaksjoner||[]).find(t=>t.id===h.transaksjonId) : null;
      const receipt = h.receiptId ? (receipts||[]).find(r=>r.id===h.receiptId) : null;
      const tekst = transaksjon ? (transaksjon.tekst||"(ukjent)") : (receipt ? (receipt.merchant||"(ukjent)") : "(observasjon mangler)");
      rader.push({
        hendelseId: h.id,
        dato: h.dato,
        tekst,
        belop: f.belop||0,
        plasseringNavn: f.plasseringNavn||null,
        eiere: f.eiere||[],
        erKvittering: !!h.receiptId,
        receiptId: h.receiptId||null,
      });
    });
  });
  rader.sort((a,b)=>new Date(b.dato||0)-new Date(a.dato||0));
  return rader;
}

// Bygger én fordelingslinje fra en valgt plassering (post), med
// fortegnet allerede riktig utledet — samme refusjon-mekanisme som
// byggActualFraFordelinger: motsatt retning mellom plassering og
// observasjon reduserer i stedet for aa legge til.
// Sparing, etappe 1: post.plasseringType (naar eksplisitt satt av
// kalleren, f.eks. "sparing") overstyrer den retningsbaserte
// avledningen. Kostnader og Inntekter sender aldri dette feltet, saa
// de faller uendret tilbake til den opprinnelige logikken.
function byggFordelingFraPost(post, belop, eiere, observasjonRetning) {
  const motsattRetning = post.retning !== observasjonRetning;
  return {
    plasseringId: post.id,
    plasseringType: post.plasseringType || (post.retning==="inn" ? "income" : "budget"),
    plasseringNavn: post.name,
    belop: motsattRetning ? -(belop||0) : (belop||0),
    eiere: eiere||[],
  };
}

// ── Etterbehandling, etappe 3 — korrigering av en eksisterende
// hendelse (ren funksjon). Brukes av korrigeringspanelet i Budsjett/
// Inntekter. Tar ALLTID utgangspunkt i en hendelse som allerede
// finnes — oppretter ALDRI en ny. id, transaksjonId, receiptId og
// opprettet-tidspunkt bevares uendret via spredningen av
// eksisterendeHendelse; kun status/fordelinger/regelId/oppdatert
// endres. Samme regelId-mekanikk (kun satt naar "laer" er eksplisitt
// valgt) som lagreBehandling allerede bruker i Bankimport.
function byggKorrigertHendelse(eksisterendeHendelse, transaksjonRetning, utkast) {
  const naa = new Date().toISOString();
  const {type, fordelinger, uklarValg, regelId} = utkast;
  if(type==="uklar") {
    return {
      ...eksisterendeHendelse,
      status: "pa_vent",
      paaVentAarsak: uklarValg||null,
      fordelinger: [],
      oppdatert: naa,
    };
  }
  const fordelingerBygget = (fordelinger||[]).map(f=>byggFordelingFraPost(f.post, f.belop, f.eiere, transaksjonRetning));
  return {
    ...eksisterendeHendelse,
    status: "ferdig",
    paaVentAarsak: null,
    fordelinger: fordelingerBygget,
    regelId: regelId!==undefined ? regelId : (eksisterendeHendelse.regelId||null),
    oppdatert: naa,
  };
}

// Oppslag: finn hendelsen som hoerer til en gitt observasjon. Enkle,
// lineaere sok — datamengden (én families okonomi) gjor dette trivielt.
function finnHendelseForTransaksjon(hendelser, transaksjonId) {
  if(!transaksjonId) return null;
  return (hendelser||[]).find(h=>h.transaksjonId===transaksjonId) || null;
}
function finnHendelseForKvittering(hendelser, receiptId) {
  if(!receiptId) return null;
  return (hendelser||[]).find(h=>h.receiptId===receiptId) || null;
}

// (diagnostiserKvitteringHendelse og KVITTERING_DIAGNOSE_KATEGORI_LABEL
// er fjernet. Diagnosen bekreftet at
// alle koblede kvitteringer var korrekt ferdigbehandlet; ingen feil ble
// funnet, saa det midlertidige verktoyet er ikke lenger nodvendig.)

// (calculateActualTotals er fjernet — v-gangen-komposisjon-4. Ingen
// gjenvaerende kallere etter at BudsjettScreen/InntekterScreen byttet
// til beregnFaktiskTotalerFraHendelser.)

// ── Kvittering-lukker-bankimport (etappe 1, rene motorer) ────────
// Motorene kjenner ikke Firebase eller UI. De mottar data, returnerer
// data. Selve skrivingen (setHendelser/setReceipts/setTransaksjoner) gjores
// av en tynn orkestreringsfunksjon i komponenten som har tilgang til
// setterne (i dag KvitteringInnboksScreen). Dette er bevisst holdt som
// et eget, samlet lag — ikke spredt i JSX — slik at et fremtidig
// hendelseslag (etappe 2+) kan kalle nokyaktig disse samme motorene.
const BELOPSTOLERANSE_KOBLING = 1; // kr — samme toleranse som ellers i appen (finnMatchForPreview)

// Sjekker om en kvittering er klar til aa lukke en banktransaksjon:
// har en fordeling, og splittsummen stemmer med kvitteringens eget totalbelop.
function erKvitteringKlarForLukking(receipt) {
  if(!receipt) return {klar:false, kode:"mangler_kvittering"};
  if(!receipt.allocationMode || !(receipt.splits&&receipt.splits.length>0)) {
    return {klar:false, kode:"ikke_fordelt"};
  }
  const splitSum = calculateSplitTotal(receipt);
  const total = receipt.total||0;
  if(Math.abs(splitSum-total) > BELOPSTOLERANSE_KOBLING) {
    return {klar:false, kode:"splitt_avvik", detaljer:{splitSum,total}};
  }
  return {klar:true};
}

// Full vurdering av om en kobling kan lukke transaksjonen automatisk,
// eller om det finnes en reell konflikt som krever brukervalg.
// Returnerer alltid {kanKobles, kanLukkes, kode?, detaljer?} — kanKobles
// skiller "lenken kan opprettes" fra "transaksjonen kan ferdigbehandles",
// siden disse to ikke alltid folger hverandre (§8D i oppdraget).
// v-gangen-komposisjon-4: leser hendelser (ikke lenger actual, som er fjernet) — "eksisterende
// Actual fra en annen kilde" er na "eksisterende hendelse som ikke
// allerede tilhorer DENNE kvitteringen".
function vurderKvitteringKobling(receipt, transaction, alleHendelser, alleReceipts) {
  if(!receipt || !transaction) return {kanKobles:false, kanLukkes:false, kode:"mangler_data"};

  // Blokkerende: transaksjonen er arkivert/ignorert — ikke reaktiver stille.
  if(transaction.status==="ignorert") {
    return {kanKobles:false, kanLukkes:false, kode:"transaksjon_ignorert"};
  }

  const eksisterendeHendelse = finnHendelseForTransaksjon(alleHendelser, transaction.id);

  // Blokkerende: en ANNEN kvittering eier allerede denne hendelsen.
  if(eksisterendeHendelse && eksisterendeHendelse.receiptId && eksisterendeHendelse.receiptId!==receipt.id) {
    return {kanKobles:false, kanLukkes:false, kode:"transaksjon_koblet_annen_kvittering",
      detaljer:{annenKvitteringId:eksisterendeHendelse.receiptId}};
  }

  // Fra her kan lenken alltid opprettes — sporsmalet er om den ogsaa kan LUKKES.
  const fordelt = erKvitteringKlarForLukking(receipt);
  if(!fordelt.klar) {
    return {kanKobles:true, kanLukkes:false, kode:fordelt.kode, detaljer:fordelt.detaljer};
  }

  // Belopet ma stemme mot selve banktransaksjonen.
  if(Math.abs((receipt.total||0) - Math.abs(transaction.belop||0)) > BELOPSTOLERANSE_KOBLING) {
    return {kanKobles:true, kanLukkes:false, kode:"belop_avvik",
      detaljer:{kvitteringTotal:receipt.total, bankBelop:transaction.belop}};
  }

  // Finnes det allerede en FERDIG hendelse for denne transaksjonen fra
  // en ANNEN kilde (vanlig Bankimport-plassering, ikke denne kvitteringen)?
  if(eksisterendeHendelse && eksisterendeHendelse.status==="ferdig" && eksisterendeHendelse.receiptId!==receipt.id) {
    const eksisterendeSum = (eksisterendeHendelse.fordelinger||[]).reduce((s,f)=>s+(f.belop||0),0);
    if(Math.abs(eksisterendeSum-(receipt.total||0)) <= BELOPSTOLERANSE_KOBLING) {
      // Samsvarer -> kan lukkes uten aa duplisere (§8A "samsvar")
      return {kanKobles:true, kanLukkes:true, handling:"bekreft_eksisterende_hendelse"};
    }
    return {kanKobles:true, kanLukkes:false, kode:"transaksjon_har_avvikende_actual",
      detaljer:{eksisterendeSum, kvitteringTotal:receipt.total}};
  }

  return {kanKobles:true, kanLukkes:true, handling:"opprett_ny_hendelse"};
}

// (byggActualFraKvitteringSplitter og synkroniserActualForKobling er
// fjernet — v-gangen-komposisjon-4. Kvitteringens splitter konverteres na
// via fordelingerFraKvitteringSplits og gjenbruker byggActualFraFordelinger
// direkte, samme motor som en direkte plassert banktransaksjon bruker.
// Synkroniseringen er forenklet til samme monster som lagreBehandling
// allerede bruker: fjern alt for denne transactionId, sett inn ferskt —
// receiptId trengtes ikke i filteret, siden én transaksjon uansett
// aldri kan vaere lenket til mer enn én kvittering samtidig.)

// ── Kontantflyt-motor (ren funksjon) ─────────────────────────────
// Motoren kjenner ikke Firebase, UI eller Faktisk.
// Budsjettpostenes months[] er alltid autoritative for forventet beloep
// den kalendermaaneden — paymentPattern beskriver kun HVORFOR belopet
// varierer (kvartalsvis/aarlig gir store belop konsentrert til enkelte
// maaneder, med 0 i de andre), det endrer ikke hvordan motoren leser data.
function calculateCommittedCashflow(budgetGroups, valgtMonth) {
  const alleItems = (budgetGroups||[]).flatMap(g=>g.items.map(it=>({...it, gruppe:g.label})));
  const fremtid = [];
  let kumulativ = 0;

  for(let mi = valgtMonth; mi < 12; mi++) {
    let planlagteKostnader = 0;
    const posterDenneManeden = [];

    alleItems.forEach(it=>{
      const mo = it.months && it.months[mi];
      const belop = mo ? (mo.budget||0) : 0;
      if(belop > 0) {
        planlagteKostnader += belop;
        posterDenneManeden.push({id:it.id, name:it.name, gruppe:it.gruppe, belop, paymentPattern:(it.meta&&it.meta.paymentPattern)||"monthly"});
      }
    });

    kumulativ += planlagteKostnader;

    fremtid.push({
      maanedIndex: mi,
      planlagteKostnader,
      planlagteInntekter: 0, // inntekter er ikke del av v1
      kumulativForpliktelse: kumulativ,
      poster: posterDenneManeden,
    });
  }

  return fremtid;
}

// ── Finn neste storre planlagte utbetaling fra en gitt maaned ────
// Hjelpefunksjon bygget paa samme rene data — "storre" defineres her
// som en post med belop > 0 i en fremtidig maaned (inkl. valgt maaned).
// Vurderer kun periodiske/sjeldne poster (quarterly, yearly, senere custom).
// Vanlige loepende maanedskostnader (monthly) er ikke "storre planlagte
// utbetalinger" i denne betydningen — de er allerede en fast, kjent del
// av hverdagsokonomien og skal ikke fremheves her.
function finnNesteStorreUtbetaling(budgetGroups, valgtMonth) {
  const flyt = calculateCommittedCashflow(budgetGroups, valgtMonth);
  for(const mnd of flyt) {
    const relevantePoster = mnd.poster.filter(p=>p.paymentPattern==="quarterly"||p.paymentPattern==="yearly"||p.paymentPattern==="custom");
    if(relevantePoster.length===0) continue;
    const storst = relevantePoster.reduce((a,b)=>b.belop>a.belop?b:a, relevantePoster[0]);
    return {maanedIndex:mnd.maanedIndex, navn:storst.name, belop:storst.belop};
  }
  return null;
}

// ── Kvitteringsmotor (ren funksjon) ──────────────────────────────
// Motoren kjenner ikke Firebase eller UI.
// Mottar en transactionId og en liste med kvitteringer, returnerer
// tilhorende kvittering eller null.
function findReceipt(transactionId, receipts) {
  if(!transactionId || !receipts) return null;
  return receipts.find(r=>r.transactionId===transactionId) || null;
}

// Ren funksjon: summerer splits[] pa en kvittering. Kjenner ikke
// Firebase eller UI.
function calculateSplitTotal(receipt) {
  if(!receipt || !receipt.splits) return 0;
  return receipt.splits.reduce((s,sp)=>s+(sp.amount||0), 0);
}

// Ren funksjon: summerer en liste med kvitteringslinjer (receiptLines).
// Kjenner ikke Firebase eller UI. netAmount = grossAmount - discountAmount
// er beloepet som teller i splitt og senere Faktisk.
function calculateReceiptLineTotals(receiptLines) {
  const linjer = receiptLines||[];
  const itemLinjer = linjer.filter(l=>l.lineType==="item"||!l.lineType);
  const grossTotal = itemLinjer.reduce((s,l)=>s+(l.grossAmount||0), 0);
  const discountTotal = linjer.reduce((s,l)=>s+(l.discountAmount||0), 0);
  const netTotal = itemLinjer.reduce((s,l)=>{
    const net = l.netAmount!==undefined ? l.netAmount : (l.grossAmount||0)-(l.discountAmount||0);
    return s+net;
  }, 0);
  const allocatedTotal = itemLinjer.filter(l=>l.targetId).reduce((s,l)=>{
    const net = l.netAmount!==undefined ? l.netAmount : (l.grossAmount||0)-(l.discountAmount||0);
    return s+net;
  }, 0);
  const remainingToAllocate = netTotal - allocatedTotal;
  return {grossTotal, discountTotal, netTotal, allocatedTotal, remainingToAllocate};
}

// ── Kvitteringsmatch-motor (ren funksjon) ────────────────────────
// Motoren kjenner ikke Firebase eller UI, og har ingen sideeffekter.
// Mottar én kvittering og listen med banktransaksjoner, returnerer
// en sortert liste med kandidater (hoyest score forst).
// Scoren er enkel og forklarbar — kun belop, dato og leverandor.

// Delt normalisering av leverandor-/handelsnavn. Brukes av bade
// kvitteringer (receipt.merchant) og banktransaksjoner (transaction.tekst)
// slik at "REMA1000", "REMA 1000" og "REMA-1000" blir like. Dette skal
// ogsaa vaere normaliseringen OCR og fremtidig bankmatching bruker —
// én felles sannhet, ikke en per-motor variant.
// Delt tekstnormalisering for banktransaksjoner — brukt av bade
// Bankimport (læringsnøkkel, kandidatmatching) og Regelsenteret
// (treff-telling). MAA vaere global: en tidligere versjon var kun
// lokalt definert inni BankimportScreen, som gjorde at Regelsenterets
// tellTreff kastet "normaliserTransaksjonstekst is not defined" —
// bekreftet regresjon, rettet her.
function normaliserTransaksjonstekst(tekst) {
  if(!tekst) return "";
  let t = tekst.toLowerCase();
  // Fjern maaneder (norsk, forkortet og fullt)
  t = t.replace(/\b(jan|feb|mar|apr|mai|jun|jul|aug|sep|okt|nov|des)\.?\s*\d{0,4}\b/g,"");
  t = t.replace(/\b(januar|februar|mars|april|mai|juni|juli|august|september|oktober|november|desember)\b/g,"");
  // Fjern aartall (2020-2099)
  t = t.replace(/\b20\d{2}\b/g,"");
  // Fjern datoer DD.MM.YYYY, DD.MM, DD/MM
  t = t.replace(/\b\d{1,2}[.\/]\d{1,2}([.\/]\d{2,4})?\b/g,"");
  // Fjern KID og referansenummer (lange tallsekvenser, 6+ siffer)
  t = t.replace(/\b\d{6,}\b/g,"");
  // Fjern loepenummer i parentes eller etter #
  t = t.replace(/#\d+/g,"");
  t = t.replace(/\(\d+\)/g,"");
  // Normaliser mellomrom
  t = t.replace(/\s+/g," ").trim();
  return t;
}

function normalizeMerchant(tekst) {
  if(!tekst) return "";
  return tekst.toLowerCase().replace(/[\s\-_]+/g,"");
}

// Finner de beste transaksjonskandidatene for én kvittering. Navnet
// reflekterer hva motoren faktisk gjor: den matcher transaksjoner MOT
// en gitt kvittering, ikke omvendt.
//
// Samme filosofi som intern overforing (v-hendelse-2.2): ikke gjett én
// riktig — obligatoriske krav er et hardt filter, ikke en poengsum.
// samme belop, riktig fortegn (banktransaksjonen er en utgift, siden
// en kvittering alltid dokumenterer et kjop), innenfor et tidsvindu, og
// ikke allerede koblet til en ANNEN kvittering. Gjenbruker
// belopMatcherIOre og dagerMellom direkte — samme motorer som intern
// overforing allerede bruker, ikke en kopi av dem.
const KVITTERING_TIDSVINDU_DAGER = 5;

function finnKvitteringTransaksjonKandidater(receipt, transactions, alleHendelser) {
  if(!receipt || !transactions) return [];
  return transactions
    .filter(t=>{
      if(t.retning!=="ut") return false;
      if(!belopMatcherIOre(receipt.total, t.belop)) return false;
      if(dagerMellom(receipt.purchaseDate, t.dato) > KVITTERING_TIDSVINDU_DAGER) return false;
      // Ikke allerede koblet til en ANNEN kvittering — hendelsen er na
      // den eneste kilden til dette (v-gangen-komposisjon-4).
      const h = finnHendelseForTransaksjon(alleHendelser, t.id);
      if(h && h.receiptId && h.receiptId!==receipt.id) return false;
      return true;
    })
    .map(t=>{
      const kvitteringLeverandor = normalizeMerchant(receipt.merchant);
      const tLeverandor = normalizeMerchant(t.tekst);
      const tekstlikhet = (kvitteringLeverandor && tLeverandor &&
        (tLeverandor.indexOf(kvitteringLeverandor)>=0 || kvitteringLeverandor.indexOf(tLeverandor)>=0)) ? 1 : 0;
      return {transaction:t, dagerAvvik:dagerMellom(receipt.purchaseDate, t.dato), tekstlikhet};
    })
    .sort((a,b)=>{
      if(a.dagerAvvik!==b.dagerAvvik) return a.dagerAvvik-b.dagerAvvik;
      return b.tekstlikhet-a.tekstlikhet;
    });
}

// ── Intern overforing-motor (etappe 3, presisert i v-hendelse-2.2) ──
// Kandidatlisten er na PRESIS: samme belop, motsatt retning og ulik
// konto er OBLIGATORISKE krav — en kandidat som mangler ett av dem
// vises ikke i det hele tatt, uansett hvor godt de andre stemmer.
// Dato brukes KUN til prioritering innenfor et fast vindu (0-2 dager)
// — kandidater utenfor vinduet utelates helt fra den automatiske
// listen. Det manuelle soket er sikkerhetsventilen for uvanlige
// tilfeller utenfor dette vinduet.
//
// Kjenner ALDRI til spesifikke kontonavn (ingen "hvis konto==MC" noe
// sted her) — kontonavn er data motoren leser, ikke en gren i
// logikken. En fremtidig konto fungerer uten at motoren skrives om.

// Stabil belopssammenligning i ore — unngar avrundingsfeil fra vanlig
// flyttallsrepresentasjon av kronebelop.
function belopMatcherIOre(a, b) {
  return Math.round(Math.abs(a||0)*100) === Math.round(Math.abs(b||0)*100);
}
function kontoUlik(transaksjon, kandidat) {
  return !!(transaksjon.konto && kandidat.konto && transaksjon.konto!==kandidat.konto);
}
function retningMotsatt(transaksjon, kandidat) {
  return !!(transaksjon.retning && kandidat.retning && transaksjon.retning!==kandidat.retning);
}
function dagerMellom(datoA, datoB) {
  if(!datoA||!datoB) return Infinity;
  return Math.round(Math.abs(new Date(datoA)-new Date(datoB))/(1000*60*60*24));
}

// Finner kandidater for EN transaksjon blant alle andre. Alle fem
// obligatoriske krav maa vaere oppfylt for aa vises i det hele tatt:
// annen observasjon, ikke allerede koblet, motsatt fortegn, likt
// belop, ulik konto. Datoavvik over 2 dager utelates helt.
function finnInterneOverforingsKandidater(transaksjon, alleTransaksjoner) {
  if(!transaksjon || !alleTransaksjoner) return [];
  return alleTransaksjoner
    .filter(o=>
      o.id!==transaksjon.id &&
      !o.motpartTransaksjonId &&
      retningMotsatt(transaksjon,o) &&
      belopMatcherIOre(transaksjon.belop,o.belop) &&
      kontoUlik(transaksjon,o)
    )
    .map(o=>({transaction:o, dagerAvvik:dagerMellom(transaksjon.dato,o.dato)}))
    .filter(k=>k.dagerAvvik<=2)
    .sort((a,b)=>{
      if(a.dagerAvvik!==b.dagerAvvik) return a.dagerAvvik-b.dagerAvvik;
      // Stabil sekundaerrekkefolge naar datoavviket er likt.
      return (a.transaction.dato||"").localeCompare(b.transaction.dato||"") ||
             String(a.transaction.id).localeCompare(String(b.transaction.id));
    });
}

// Ren funksjon: bekrefter en intern overforing mellom to transaksjoner.
// Symmetrisk — begge sider oppdateres likt, med gjensidig referanse
// (motpartTransaksjonId). Oppretter ALDRI Actual — interne overforinger
// skal aldri pavirke resultat, kostnad eller inntekt. Idempotent: aa
// kjore denne pa nytt med samme par gir samme sluttresultat, uansett
// hvor mange ganger.
function bekreftInternOverforing(prevTransaksjoner, transaksjonAId, transaksjonBId) {
  const naa = new Date().toISOString();
  return (prevTransaksjoner||[]).map(t=>{
    if(t.id===transaksjonAId) {
      return {...t, status:"behandlet", behandlingstype:"intern_overforing",
        motpartTransaksjonId:transaksjonBId, matchetMot:null, matchetNavn:null, updatedAt:naa};
    }
    if(t.id===transaksjonBId) {
      return {...t, status:"behandlet", behandlingstype:"intern_overforing",
        motpartTransaksjonId:transaksjonAId, matchetMot:null, matchetNavn:null, updatedAt:naa};
    }
    return t;
  });
}

// Ren funksjon: velger hvilken beskrivelse som skal vises for en
// kvitteringslinje/split. Brukerens egen beskrivelse vinner alltid over
// OCR-teksten. All visning i UI skal bruke denne — aldri description
// eller ocrDescription direkte.
function getDisplayDescription(line) {
  if(!line) return "";
  return line.description || line.ocrDescription || "";
}


function SpilleromScreen({liquidity, setLiquidity, budgetGroups, month, incomeMonths, incomeGroups, sparingGroups}) {
  const [genStatus,setGenStatus] = useState(null);
  const [lastRun,setLastRun]     = useState(null);
  const [editPost,setEditPost]   = useState(null); // {id, ...post} for redigering

  // Kjor generatoren — alltid med funksjonell setLiquidity for fersk state
  const runGenerator = React.useCallback(() => {
    setLiquidity(prev => {
      const freshPosts = (prev && prev.posts) ? prev.posts : {};
      const mon = month!==undefined ? month : new Date().getMonth();
      const updatedPosts = generateForecastPosts(
        budgetGroups||[], freshPosts, mon, incomeMonths, incomeGroups, sparingGroups||[]
      );
      setLastRun(Date.now());
      const antall = Object.values(updatedPosts).filter(p=>p.kilde==="generator").length;
      setGenStatus({count:antall, ts:Date.now()});
      return {...prev, posts:updatedPosts};
    });
  }, [budgetGroups, incomeGroups, sparingGroups, month, incomeMonths]);

  // Automatisk kjoring: kun naar budsjett/inntekter/metadata/maaned endres
  const budgetSig = JSON.stringify((budgetGroups||[]).map(g=>g.items.map(it=>({
    id:it.id, m:it.meta, b:it.months&&it.months[month]
  }))));
  const incomeSig = JSON.stringify((incomeGroups||[]).map(g=>g.items.map(it=>({
    id:it.id, m:it.meta, b:it.months&&it.months[month]
  }))));
  const sparingSig = JSON.stringify((sparingGroups||[]).map(g=>g.items.map(it=>({
    id:it.id, m:it.meta, b:it.months&&it.months[month]
  }))));
  useEffect(() => {
    if(!budgetGroups || !budgetGroups.length) return;
    runGenerator();
  }, [budgetSig, incomeSig, sparingSig, month]);

  const {
    saldo        = 0,
    saldoUpdated = null,
    prognosisDate = (() => {
      // Standard: neste paydayDate (dag 20 i maaneden)
      const now = new Date();
      const lonnDay = 20;
      const candidate = new Date(now.getFullYear(), now.getMonth(), lonnDay);
      if(candidate <= now) candidate.setMonth(candidate.getMonth()+1);
      return candidate.toISOString().slice(0,10);
    })(),
    lonnDay      = 20,
    posts        = {},
  } = liquidity||{};

  const postList = Object.values(posts||{}).sort((a,b)=>new Date(a.date)-new Date(b.date));
  const result   = calcSpillerom(saldo, postList, prognosisDate);

  // States
  const [editSaldo,setEditSaldo]         = useState(false);
  const [saldoInput,setSaldoInput]       = useState(String(saldo||""));
  const [editDate,setEditDate]           = useState(false);
  const [dateInput,setDateInput]         = useState(prognosisDate);
  const [showAddPost,setShowAddPost]     = useState(false);
  const [newPost,setNewPost]             = useState({name:"",amount:"",direction:"out",date:prognosisDate,type:"fast"});

  // Hjelpere
  const save = (patch) => setLiquidity(p=>({...p,...patch}));
  const fmt  = n => new Intl.NumberFormat("nb-NO",{style:"currency",currency:"NOK",maximumFractionDigits:0}).format(n);
  const fmtDate = d => d ? new Date(d).toLocaleDateString("nb-NO",{day:"numeric",month:"short"}) : "";
  const now = new Date();
  const saldoAge = saldoUpdated ? Math.round((Date.now()-saldoUpdated)/60000) : null;

  const saveSaldo = () => {
    const amt = parseFloat(saldoInput.replace(/\s/g,"").replace(",","."))||0;
    save({saldo:amt, saldoUpdated:Date.now()});
    setEditSaldo(false);
  };

  const saveDate = () => {
    save({prognosisDate:dateInput});
    setEditDate(false);
  };

  const addPost = () => {
    if(!newPost.name.trim()||!newPost.amount) return;
    const id = uid();
    const nyPost = {...newPost, id, amount:parseFloat(newPost.amount)||0, kilde:"manuell"};
    // Funksjonell update sikrer at vi ikke bruker stale posts
    setLiquidity(prev => ({...prev, posts:{...(prev.posts||{}), [id]:nyPost}}));
    setNewPost({name:"",amount:"",direction:"out",date:prognosisDate,type:"extra"});
    setShowAddPost(false);
  };

  const removePost = (id) => {
    setLiquidity(prev => {
      const next = {...(prev.posts||{})};
      delete next[id];
      return {...prev, posts:next};
    });
  };

  const saveEditPost = (id, felter) => {
    setLiquidity(prev => {
      const post = (prev.posts||{})[id];
      if(!post) return prev;
      const erGenerator = post.kilde === "generator";
      return {...prev, posts:{...prev.posts, [id]:{
        ...post, ...felter,
        // Marker som manuelt overstyrt hvis det er en generert post
        manueltOverstyrt: erGenerator ? true : post.manueltOverstyrt,
      }}};
    });
  };

  // UI-gruppering (kun for visning)
  const TYPE_LABELS = {inn:"Innbetalinger",fast:"Faste poster",variabel:"Budsjetterte variable",extra:"Ikke budsjettert",ukjent:"⚠️ Ukjent type (slett eller oppdater)"};
  const TYPE_COLORS = {inn:P.olive,fast:P.hazel,variabel:P.dusk,extra:P.clay,ukjent:P.clay};
  const groupedPosts = {};
  const KNOWN_TYPES = ["inn","fast","variabel","extra"];
  postList.forEach(p=>{
    const raw = p.direction==="in"?"inn":(p.type||"extra");
    const g = KNOWN_TYPES.includes(raw) ? raw : "ukjent";
    if(!groupedPosts[g]) groupedPosts[g]=[];
    groupedPosts[g].push(p);
  });

  const isPositive = result.spillerom>=0;
  const daysToDate = Math.ceil((new Date(prognosisDate)-now)/(1000*60*60*24));

  return (
    <div>
      <div style={{fontSize:20,fontWeight:600,color:P.ink,marginBottom:4}}>Spillerom</div>
      <div style={{fontSize:12,color:P.stone,marginBottom:16}}>Prognose frem til valgt dato</div>

      {/* ── Prognosedato ── */}
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14,
        padding:"8px 12px",background:P.mist,borderRadius:9,border:`1px solid ${P.border}`}}>
        <span style={{fontSize:12,color:P.stone}}>Frem til:</span>
        {editDate ? (
          <>
            <input type="date" value={dateInput} onChange={e=>setDateInput(e.target.value)}
              style={{flex:1,fontSize:14,background:P.sand,padding:"4px 8px"}}/>
            <button onClick={saveDate}
              style={{background:P.hazel,color:"white",border:"none",borderRadius:7,
                padding:"4px 12px",fontSize:12,cursor:"pointer",fontWeight:600}}>OK</button>
            <button onClick={()=>setEditDate(false)}
              style={{background:"none",border:"none",cursor:"pointer",color:P.dust,fontSize:13}}>✕</button>
          </>
        ) : (
          <>
            <span style={{flex:1,fontSize:14,fontWeight:600,color:P.ink}}>
              {fmtDate(prognosisDate)}
              <span style={{fontSize:11,fontWeight:400,color:P.dust,marginLeft:6}}>
                ({daysToDate>0?`om ${daysToDate} dager`:daysToDate===0?"i dag":"passert"})
              </span>
            </span>
            <button onClick={()=>setEditDate(true)}
              style={{background:"none",border:"none",cursor:"pointer",color:P.hazel,fontSize:12,fontWeight:500}}>
              Endre
            </button>
          </>
        )}
      </div>

      {/* ── Handlingsknapper ── */}
      <div style={{display:"flex",gap:8,marginBottom:12}}>
        <button onClick={()=>setShowAddPost(v=>!v)}
          style={{flex:1,padding:"9px 8px",
            background:showAddPost?P.hazelXL:P.mist,
            border:showAddPost?"1px solid "+P.hazelL:"1.5px dashed "+P.border,
            borderRadius:9,fontSize:12,cursor:"pointer",
            color:showAddPost?P.hazel:P.stone,fontWeight:500,textAlign:"center"}}>
          {showAddPost?"✕ Lukk":"＋ Legg til prognosepost"}
        </button>
        <div style={{flex:1,padding:"8px 10px",background:P.hazelXL,
          border:"1px solid "+P.hazelL,borderRadius:9,fontSize:11,
          color:P.hazel,textAlign:"center",display:"flex",alignItems:"center",justifyContent:"center",gap:5}}>
          <span>⚡</span>
          <span>{lastRun?"Oppdatert "+new Date(lastRun).toLocaleTimeString("nb-NO",{hour:"2-digit",minute:"2-digit"}):"Oppdaterer…"}</span>
        </div>
      </div>
      {genStatus && (
        <div style={{fontSize:11,color:P.olive,fontWeight:500,marginTop:-8,marginBottom:8,textAlign:"right"}}>
          ✓ {genStatus.count} poster oppdatert
        </div>
      )}

      {/* ── Legg til post — skjema ── */}
      {showAddPost && (
        <Card style={{padding:"12px 14px",marginBottom:8}}>
          <div style={{fontSize:11,fontWeight:600,color:P.dust,textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:10}}>
            Ny prognosepost
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            <input value={newPost.name} onChange={e=>setNewPost(p=>({...p,name:e.target.value}))}
              placeholder="Navn (f.eks. Lonn, Boliglan, Barnetrygd)" autoComplete="off"
              style={{fontSize:14,background:P.sand,padding:"8px 10px",width:"100%",boxSizing:"border-box",borderRadius:8}}/>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              <div>
                <div style={{fontSize:11,color:P.stone,marginBottom:3}}>Belop</div>
                <input type="number" value={newPost.amount}
                  onChange={e=>setNewPost(p=>({...p,amount:e.target.value}))}
                  onFocus={e=>e.target.select()}
                  placeholder="0" style={{width:"100%",boxSizing:"border-box",fontSize:14,background:P.sand,padding:"7px 10px",borderRadius:8}}/>
              </div>
              <div>
                <div style={{fontSize:11,color:P.stone,marginBottom:3}}>Dato</div>
                <input type="date" value={newPost.date}
                  onChange={e=>setNewPost(p=>({...p,date:e.target.value}))}
                  style={{width:"100%",boxSizing:"border-box",fontSize:13,background:P.sand,padding:"7px 6px",borderRadius:8}}/>
              </div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              <div>
                <div style={{fontSize:11,color:P.stone,marginBottom:3}}>Retning</div>
                <select value={newPost.direction} onChange={e=>setNewPost(p=>({...p,direction:e.target.value,type:e.target.value==="in"?"inn":"fast"}))}
                  style={{width:"100%",boxSizing:"border-box",fontSize:13,background:P.sand,padding:"7px 6px",borderRadius:8}}>
                  <option value="out">Utbetaling</option>
                  <option value="in">Innbetaling</option>
                </select>
              </div>
              <div>
                <div style={{fontSize:11,color:P.stone,marginBottom:3}}>Type</div>
                <select value={newPost.type} onChange={e=>setNewPost(p=>({...p,type:e.target.value}))}
                  style={{width:"100%",boxSizing:"border-box",fontSize:13,background:P.sand,padding:"7px 6px",borderRadius:8}}>
                  <option value="fast">Fast</option>
                  <option value="variabel">Variabel</option>
                  <option value="extra">Ekstra</option>
                  <option value="inn">Innbetaling</option>
                </select>
              </div>
            </div>
            <button onClick={addPost} disabled={!newPost.name.trim()||!newPost.amount}
              style={{padding:"9px",background:newPost.name.trim()&&newPost.amount?P.hazel:P.mist,
                color:newPost.name.trim()&&newPost.amount?"white":P.dust,border:"none",
                borderRadius:8,fontSize:13,cursor:"pointer",fontWeight:600}}>
              Legg til
            </button>
          </div>
        </Card>
      )}

      {/* ── Saldo ── */}
      <Card style={{marginBottom:10,padding:"12px 14px"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}>
          <div style={{fontSize:11,fontWeight:600,color:P.dust,textTransform:"uppercase",letterSpacing:"0.07em"}}>Saldo nå</div>
          {saldoAge!==null && (
            <span style={{fontSize:10,color:P.hazelL}}>
              oppdatert {saldoAge<60?`${saldoAge} min siden`:`${Math.round(saldoAge/60)} t siden`}
            </span>
          )}
        </div>
        {editSaldo ? (
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            <input type="number" value={saldoInput} onChange={e=>setSaldoInput(e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&saveSaldo()}
              onFocus={e=>e.target.select()}
              autoFocus placeholder="0" enterKeyHint="done"
              style={{flex:1,fontSize:20,fontWeight:600,background:P.sand,padding:"6px 10px",
                border:`1.5px solid ${P.hazel}`}}/>
            <button onClick={saveSaldo}
              style={{background:P.hazel,color:"white",border:"none",borderRadius:8,
                padding:"8px 14px",fontSize:13,cursor:"pointer",fontWeight:600}}>Lagre</button>
          </div>
        ) : (
          <div style={{display:"flex",alignItems:"baseline",gap:10,cursor:"pointer"}} onClick={()=>{setSaldoInput(String(saldo));setEditSaldo(true);}}>
            <span style={{fontSize:26,fontWeight:700,color:P.ink,letterSpacing:"-0.02em"}}>{fmt(saldo)}</span>
            <span style={{fontSize:12,color:P.hazel,fontWeight:500}}>Oppdater</span>
          </div>
        )}
      </Card>

      {/* ── Spillerom-resultat ── */}
      <div style={{padding:"16px",background:isPositive?`${P.olive}12`:P.clayXL,
        border:`1px solid ${isPositive?P.oliveL:P.clayL}`,borderRadius:12,marginBottom:14}}>
        <div style={{fontSize:11,fontWeight:600,color:isPositive?P.olive:P.clay,
          textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:8}}>
          {isPositive?"✓ Fritt spillerom":"⚠️ Underskudd"}
        </div>
        <div style={{fontSize:36,fontWeight:700,color:isPositive?P.olive:P.clay,
          letterSpacing:"-0.03em",marginBottom:12}}>
          {fmt(result.spillerom)}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          <div style={{background:"rgba(255,255,255,0.5)",borderRadius:8,padding:"8px 10px"}}>
            <div style={{fontSize:10,color:P.stone,marginBottom:2}}>Innbetalinger</div>
            <div style={{fontSize:14,fontWeight:600,color:P.olive}}>+{fmt(result.innbetalinger)}</div>
          </div>
          <div style={{background:"rgba(255,255,255,0.5)",borderRadius:8,padding:"8px 10px"}}>
            <div style={{fontSize:10,color:P.stone,marginBottom:2}}>Utbetalinger</div>
            <div style={{fontSize:14,fontWeight:600,color:P.clay}}>-{fmt(result.utbetalinger)}</div>
          </div>
        </div>
      </div>

      {/* ── Prognoseposter ── */}
      {["extra","variabel","fast","inn","ukjent"].map(group => {
        const gPosts = groupedPosts[group]||[];
        if(gPosts.length===0) return null;
        const col = TYPE_COLORS[group]||P.hazel;
        const total = gPosts.reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
        return (
          <div key={group} style={{marginBottom:12}}>
            <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}>
              <span style={{fontSize:10,fontWeight:600,color:col,textTransform:"uppercase",letterSpacing:"0.07em"}}>
                {TYPE_LABELS[group]}
              </span>
              <div style={{flex:1,height:"0.5px",background:P.border}}/>
              <span style={{fontSize:11,fontWeight:600,color:col}}>
                {group==="inn"?"+":"-"}{fmt(total)}
              </span>
            </div>
            {gPosts.map(p => {
              const inRange = new Date(p.date)<=new Date(prognosisDate);
              const fraGenerator = p.kilde==="generator";
              return (
                <div key={p.id}
                  onClick={()=>setEditPost({...p})}
                  style={{display:"flex",alignItems:"center",gap:10,
                  padding:"7px 10px",borderRadius:8,marginBottom:3,cursor:"pointer",
                  background:inRange?P.linen:P.mist,
                  border:"1px solid "+(fraGenerator?(inRange?P.hazelL:P.border):(inRange?P.border:"transparent")),
                  opacity:inRange?1:0.5}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:"flex",alignItems:"center",gap:5,flexWrap:"wrap"}}>
                      <span style={{fontSize:13,fontWeight:500,color:P.ink}}>{p.name}</span>
                      {fraGenerator && !p.manueltOverstyrt && (
                        <span style={{fontSize:9,background:P.hazelXL,color:P.hazel,
                          borderRadius:4,padding:"1px 5px",fontWeight:600}}>budsjett</span>
                      )}
                      {p.manueltOverstyrt && (
                        <span style={{fontSize:9,background:"#FFF0E0",color:"#C0602A",
                          borderRadius:4,padding:"1px 5px",fontWeight:600}}>✏️ overstyrt</span>
                      )}
                      {p.erEstimat && (
                        <span style={{fontSize:9,background:P.goldXL,color:P.gold,
                          borderRadius:4,padding:"1px 5px",fontWeight:600}}>estimat</span>
                      )}
                    </div>
                    <div style={{fontSize:10,color:P.dust,marginTop:1}}>
                      {fmtDate(p.date)}{!inRange?" · utenfor periode":""}
                      {fraGenerator&&p.owner&&p.owner!=="Felles"?` · ${p.owner}`:""}
                    </div>
                  </div>
                  <span style={{fontSize:13,fontWeight:600,color:p.direction==="in"?P.olive:P.clay,flexShrink:0}}>
                    {p.direction==="in"?"+":"-"}{fmt(p.amount)}
                  </span>
                  <button onClick={e=>{e.stopPropagation();removePost(p.id);}}
                    style={{background:"none",border:"none",cursor:"pointer",color:P.dust,fontSize:12,opacity:.5,padding:"0 2px"}}>
                    ✕
                  </button>
                </div>
              );
            })}
          </div>
        );
      })}





      {/* ── Rediger prognosepost ── */}
      {editPost && (
        <Modal title={editPost.kilde==="generator"?"Rediger generert post":"Rediger post"} onClose={()=>setEditPost(null)}>
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            {editPost.kilde==="generator" && (
              <div style={{fontSize:11,color:"#C0602A",background:"#FFF8F0",padding:"8px 12px",borderRadius:8,border:"1px solid #E8C4A0"}}>
                Generert post. Endringer merkes som manuelt overstyrt.
              </div>
            )}
            <div>
              <div style={{fontSize:11,color:P.dust,marginBottom:4}}>Navn</div>
              <input value={editPost.name} onChange={e=>setEditPost(p=>({...p,name:e.target.value}))}
                style={{width:"100%",boxSizing:"border-box",fontSize:15,background:P.sand,padding:"8px 10px",borderRadius:8}}/>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              <div>
                <div style={{fontSize:11,color:P.dust,marginBottom:4}}>Belop</div>
                <input type="number" value={editPost.amount} onFocus={e=>e.target.select()}
                  onChange={e=>setEditPost(p=>({...p,amount:e.target.value}))}
                  style={{width:"100%",boxSizing:"border-box",fontSize:15,background:P.sand,padding:"8px 10px",borderRadius:8}}/>
              </div>
              <div>
                <div style={{fontSize:11,color:P.dust,marginBottom:4}}>Dato</div>
                <input type="date" value={editPost.date}
                  onChange={e=>setEditPost(p=>({...p,date:e.target.value}))}
                  style={{width:"100%",boxSizing:"border-box",fontSize:13,background:P.sand,padding:"8px 6px",borderRadius:8}}/>
              </div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              <div>
                <div style={{fontSize:11,color:P.dust,marginBottom:4}}>Retning</div>
                <select value={editPost.direction} onChange={e=>setEditPost(p=>({...p,direction:e.target.value}))}
                  style={{width:"100%",boxSizing:"border-box",fontSize:13,background:P.sand,padding:"8px 6px",borderRadius:8}}>
                  <option value="out">Utbetaling</option>
                  <option value="in">Innbetaling</option>
                </select>
              </div>
              <div>
                <div style={{fontSize:11,color:P.dust,marginBottom:4}}>Type</div>
                <select value={editPost.type||"extra"} onChange={e=>setEditPost(p=>({...p,type:e.target.value}))}
                  style={{width:"100%",boxSizing:"border-box",fontSize:13,background:P.sand,padding:"8px 6px",borderRadius:8}}>
                  <option value="fast">Fast</option>
                  <option value="variabel">Variabel</option>
                  <option value="extra">Ekstra</option>
                  <option value="inn">Innbetaling</option>
                </select>
              </div>
            </div>
            <div style={{display:"flex",gap:8,marginTop:4}}>
              <button onClick={()=>setEditPost(null)}
                style={{flex:1,padding:"10px",background:P.mist,border:"1px solid "+P.border,
                  borderRadius:9,fontSize:13,cursor:"pointer",color:P.stone}}>Avbryt</button>
              <button onClick={()=>{
                saveEditPost(editPost.id,{name:editPost.name,
                  amount:parseFloat(String(editPost.amount))||0,
                  date:editPost.date,direction:editPost.direction,type:editPost.type});
                setEditPost(null);
              }} style={{flex:2,padding:"10px",background:P.hazel,color:"white",border:"none",
                borderRadius:9,fontSize:13,cursor:"pointer",fontWeight:600}}>Lagre</button>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ── Etterbehandling, etappe 2 — kontekstuell drill-down (rent lesende) ──
// Viser hendelsene bak én posts "Faktisk"-tall for valgt maaned.
// Kontekstuell og avvisbar (Modal) — ingen egen historikk-/arkivflate.
// Ingen redigering her; kun visning. Gjenbrukes av bade BudsjettScreen
// og InntekterScreen.
