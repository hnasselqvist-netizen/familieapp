// bekreftet regresjon, rettet her.
function normaliserTransaksjonstekst(tekst) {
  if(!tekst) return "";
  let t = tekst.toLowerCase();
  // Fjern maaneder (norsk, forkortet og fullt)
  t = t.replace(/\b(jan|feb|mar|apr|mai|jun|jul|aug|sep|okt|nov|des)\.?\s*\d{0,4}\b/g,"");
  t = t.replace(/\b(januar|februar|mars|april|mai|juni|juli|august|september|oktober|november|desember)\b/g,"");
  // Fjern aartall (2020-2099)
  t = t.replace(/\b20\d{2}\b/g,"");
  // Fjern datoer DD.MM.YYYY, DD.MM, DD/MM
  t = t.replace(/\b\d{1,2}[.\/]\d{1,2}([.\/]\d{2,4})?\b/g,"");
  // Fjern KID og referansenummer (lange tallsekvenser, 6+ siffer)
  t = t.replace(/\b\d{6,}\b/g,"");
  // Fjern loepenummer i parentes eller etter #
  t = t.replace(/#\d+/g,"");
  t = t.replace(/\(\d+\)/g,"");
  // Normaliser mellomrom
  t = t.replace(/\s+/g," ").trim();
  return t;
}

function normalizeMerchant(tekst) {
  if(!tekst) return "";
  return tekst.toLowerCase().replace(/[\s\-_]+/g,"");
}

// Finner de beste transaksjonskandidatene for én kvittering. Navnet
// reflekterer hva motoren faktisk gjor: den matcher transaksjoner MOT
// en gitt kvittering, ikke omvendt.
//
// Samme filosofi som intern overforing (v-hendelse-2.2): ikke gjett én
// riktig — obligatoriske krav er et hardt filter, ikke en poengsum.
// samme belop, riktig fortegn (banktransaksjonen er en utgift, siden
// en kvittering alltid dokumenterer et kjop), innenfor et tidsvindu, og
// ikke allerede koblet til en ANNEN kvittering. Gjenbruker
// belopMatcherIOre og dagerMellom direkte — samme motorer som intern
// overforing allerede bruker, ikke en kopi av dem.
const KVITTERING_TIDSVINDU_DAGER = 5;

function finnKvitteringTransaksjonKandidater(receipt, transactions, alleHendelser) {
  if(!receipt || !transactions) return [];
  return transactions
    .filter(t=>{
      if(t.retning!=="ut") return false;
      if(!belopMatcherIOre(receipt.total, t.belop)) return false;
      if(dagerMellom(receipt.purchaseDate, t.dato) > KVITTERING_TIDSVINDU_DAGER) return false;
      // Ikke allerede koblet til en ANNEN kvittering — hendelsen er na
      // den eneste kilden til dette (v-post-rename).
      const h = finnHendelseForTransaksjon(alleHendelser, t.id);
      if(h && h.receiptId && h.receiptId!==receipt.id) return false;
      return true;
    })
    .map(t=>{
      const kvitteringLeverandor = normalizeMerchant(receipt.merchant);
      const tLeverandor = normalizeMerchant(t.tekst);
      const tekstlikhet = (kvitteringLeverandor && tLeverandor &&
        (tLeverandor.indexOf(kvitteringLeverandor)>=0 || kvitteringLeverandor.indexOf(tLeverandor)>=0)) ? 1 : 0;
      return {transaction:t, dagerAvvik:dagerMellom(receipt.purchaseDate, t.dato), tekstlikhet};
    })
    .sort((a,b)=>{
      if(a.dagerAvvik!==b.dagerAvvik) return a.dagerAvvik-b.dagerAvvik;
      return b.tekstlikhet-a.tekstlikhet;
    });
}

// ── Intern overforing-motor (etappe 3, presisert i v-hendelse-2.2) ──
// Kandidatlisten er na PRESIS: samme belop, motsatt retning og ulik
// konto er OBLIGATORISKE krav — en kandidat som mangler ett av dem
// vises ikke i det hele tatt, uansett hvor godt de andre stemmer.
// Dato brukes KUN til prioritering innenfor et fast vindu (0-2 dager)
// — kandidater utenfor vinduet utelates helt fra den automatiske
// listen. Det manuelle soket er sikkerhetsventilen for uvanlige
// tilfeller utenfor dette vinduet.
//
// Kjenner ALDRI til spesifikke kontonavn (ingen "hvis konto==MC" noe
// sted her) — kontonavn er data motoren leser, ikke en gren i
// logikken. En fremtidig konto fungerer uten at motoren skrives om.

// Stabil belopssammenligning i ore — unngar avrundingsfeil fra vanlig
// flyttallsrepresentasjon av kronebelop.
function belopMatcherIOre(a, b) {
  return Math.round(Math.abs(a||0)*100) === Math.round(Math.abs(b||0)*100);
}
function kontoUlik(transaksjon, kandidat) {
  return !!(transaksjon.konto && kandidat.konto && transaksjon.konto!==kandidat.konto);
}
function retningMotsatt(transaksjon, kandidat) {
  return !!(transaksjon.retning && kandidat.retning && transaksjon.retning!==kandidat.retning);
}
function dagerMellom(datoA, datoB) {
  if(!datoA||!datoB) return Infinity;
  return Math.round(Math.abs(new Date(datoA)-new Date(datoB))/(1000*60*60*24));
}

// Finner kandidater for EN transaksjon blant alle andre. Alle fem
// obligatoriske krav maa vaere oppfylt for aa vises i det hele tatt:
// annen observasjon, ikke allerede koblet, motsatt fortegn, likt
// belop, ulik konto. Datoavvik over 2 dager utelates helt.
function finnInterneOverforingsKandidater(transaksjon, alleTransaksjoner) {
  if(!transaksjon || !alleTransaksjoner) return [];
  return alleTransaksjoner
    .filter(o=>
      o.id!==transaksjon.id &&
      !o.motpartTransaksjonId &&
      retningMotsatt(transaksjon,o) &&
      belopMatcherIOre(transaksjon.belop,o.belop) &&
      kontoUlik(transaksjon,o)
    )
    .map(o=>({transaction:o, dagerAvvik:dagerMellom(transaksjon.dato,o.dato)}))
    .filter(k=>k.dagerAvvik<=2)
    .sort((a,b)=>{
      if(a.dagerAvvik!==b.dagerAvvik) return a.dagerAvvik-b.dagerAvvik;
      // Stabil sekundaerrekkefolge naar datoavviket er likt.
      return (a.transaction.dato||"").localeCompare(b.transaction.dato||"") ||
             String(a.transaction.id).localeCompare(String(b.transaction.id));
    });
}

// Ren funksjon: bekrefter en intern overforing mellom to transaksjoner.
// Symmetrisk — begge sider oppdateres likt, med gjensidig referanse
// (motpartTransaksjonId). Oppretter ALDRI Actual — interne overforinger
// skal aldri pavirke resultat, kostnad eller inntekt. Idempotent: aa
// kjore denne pa nytt med samme par gir samme sluttresultat, uansett
// hvor mange ganger.
function bekreftInternOverforing(prevTransaksjoner, transaksjonAId, transaksjonBId) {
  const naa = new Date().toISOString();
  return (prevTransaksjoner||[]).map(t=>{
    if(t.id===transaksjonAId) {
      return {...t, status:"behandlet", behandlingstype:"intern_overforing",
        motpartTransaksjonId:transaksjonBId, matchetMot:null, matchetNavn:null, updatedAt:naa};
    }
    if(t.id===transaksjonBId) {
      return {...t, status:"behandlet", behandlingstype:"intern_overforing",
        motpartTransaksjonId:transaksjonAId, matchetMot:null, matchetNavn:null, updatedAt:naa};
    }
    return t;
  });
}

// Ren funksjon: velger hvilken beskrivelse som skal vises for en
// kvitteringslinje/split. Brukerens egen beskrivelse vinner alltid over
// OCR-teksten. All visning i UI skal bruke denne — aldri description
// eller ocrDescription direkte.
function getDisplayDescription(line) {
  if(!line) return "";
  return line.description || line.ocrDescription || "";
}


function SpilleromScreen({liquidity, setLiquidity, budgetGroups, month, incomeMonths, incomeGroups, sparingGroups}) {
  const [genStatus,setGenStatus] = useState(null);
  const [lastRun,setLastRun]     = useState(null);
  const [editPost,setEditPost]   = useState(null); // {id, ...post} for redigering

  // Lest tidlig (flyttet opp fra der den la for) fordi baade
  // runGenerator og signaturene under na trenger prognosisDate — den
  // skal IKKE laengre komme fra den delte "month"-fanevelgeren.
  const {
    saldo        = 0,
    saldoUpdated = null,
    prognosisDate = beregnStandardPrognosisDate(new Date()),
    lonnDay      = 20,
    posts        = {},
  } = liquidity||{};

  // Kjor generatoren — alltid med funksjonell setLiquidity for fersk
  // state. v-post-rename: perioden er na ALLTID "fra i dag
  // til og med prognosisDate" — den delte Kostnader/Inntekter/Sparing-
  // maanedsvelgeren ("month") paavirker ikke lenger dette i det hele
  // tatt. Bytte av maaned i de tre skjermene flytter derfor aldri
  // Spillerom bakover eller fremover i tid.
  const runGenerator = React.useCallback(() => {
    setLiquidity(prev => {
      const freshPosts = (prev && prev.posts) ? prev.posts : {};
      const fraDato = new Date();
      const tilDato = new Date((prev && prev.prognosisDate) || beregnStandardPrognosisDate(new Date()));
      const updatedPosts = generateForecastPosts(
        budgetGroups||[], freshPosts, fraDato, tilDato, incomeMonths, incomeGroups, sparingGroups||[]
      );
      setLastRun(Date.now());
      const antall = Object.values(updatedPosts).filter(p=>p.kilde==="generator").length;
      setGenStatus({count:antall, ts:Date.now()});
      return {...prev, posts:updatedPosts};
    });
  }, [budgetGroups, incomeGroups, sparingGroups, incomeMonths]);

  // Automatisk kjoring: naar budsjett/inntekter/sparing-metadata ELLER
  // prognosisDate endres. Signaturene sporer na HELE months-arrayen
  // per post (ikke bare ett maanedsindeks), siden generatoren kan
  // spenne over flere maaneder samtidig — en endring i en hvilken som
  // helst maaned som faktisk ligger innenfor den aktive perioden skal
  // fortsatt trigge ny generering, uavhengig av hvilken maaned som er
  // valgt i Kostnader/Inntekter/Sparing sin egen fane.
  const budgetSig = JSON.stringify((budgetGroups||[]).map(g=>g.items.map(it=>({
    id:it.id, m:it.meta, b:it.months
  }))));
  const incomeSig = JSON.stringify((incomeGroups||[]).map(g=>g.items.map(it=>({
    id:it.id, m:it.meta, b:it.months
  }))));
  const sparingSig = JSON.stringify((sparingGroups||[]).map(g=>g.items.map(it=>({
    id:it.id, m:it.meta, b:it.months
  }))));
  useEffect(() => {
    if(!budgetGroups || !budgetGroups.length) return;
    runGenerator();
  }, [budgetSig, incomeSig, sparingSig, prognosisDate]);

  const postList = Object.values(posts||{}).sort((a,b)=>new Date(a.date)-new Date(b.date));
  // Normalisert til start pa dagen ETT sted — gjenbrukt konsekvent
  // under, slik at "i dag" betyr eksakt samme grense uansett hvilket
  // klokkeslett brukeren faktisk ser paa Spillerom.
  const startIdag = new Date();
  startIdag.setHours(0,0,0,0);
  // DEN ene aktive-i-periode-listen — brukes for calcSpillerom,
  // gruppesummer OG den ordinaere synlige listen. Bygget fra de to
  // delte, rene hjelpefunksjonene (status + periode), saa disse tre
  // stedene aldri igjen kan bruke ulike datasett.
  const periodePostList = postList.filter(p =>
    erAktivPrognosepost(p) && erPrognosepostIPeriode(p, startIdag, prognosisDate)
  );
  // Tidligere manuelle poster som trenger avklaring: aktive (ikke
  // oppfylt), manuelt opprettet, med KALENDERDATO for i dag (sammen-
  // lignet mot startIdag, ikke naavaerende klokkeslett) — ekskludert
  // fra periodePostList (siden erPrognosepostIPeriode korrekt
  // returnerer false for dem), men fortsatt synlige i en egen seksjon
  // saa brukeren kan lukke den apne lokka. Gyldig-dato-sjekk (isNaN)
  // brukt her ogsaa, samme prinsipp som erPrognosepostIPeriode.
  const trengerAvklaringListe = postList.filter(p => {
    if(p.kilde !== "manuell" || !erAktivPrognosepost(p) || !p.date) return false;
    const d = new Date(p.date);
    if(isNaN(d.getTime())) return false;
    return d < startIdag;
  });
  const result   = calcSpillerom(saldo, periodePostList, prognosisDate, startIdag);

  // States
  const [editSaldo,setEditSaldo]         = useState(false);
  const [saldoInput,setSaldoInput]       = useState(String(saldo||""));
  const [editDate,setEditDate]           = useState(false);
  const [dateInput,setDateInput]         = useState(prognosisDate);
  const [showAddPost,setShowAddPost]     = useState(false);
  const [newPost,setNewPost]             = useState({name:"",amount:"",direction:"out",date:prognosisDate,type:"fast"});

  // Hjelpere
  const save = (patch) => setLiquidity(p=>({...p,...patch}));
  const fmt  = n => new Intl.NumberFormat("nb-NO",{style:"currency",currency:"NOK",maximumFractionDigits:0}).format(n);
  const fmtDate = d => d ? new Date(d).toLocaleDateString("nb-NO",{day:"numeric",month:"short"}) : "";
  const now = new Date();
  const saldoAge = saldoUpdated ? Math.round((Date.now()-saldoUpdated)/60000) : null;

  const saveSaldo = () => {
    const amt = parseFloat(saldoInput.replace(/\s/g,"").replace(",","."))||0;
    save({saldo:amt, saldoUpdated:Date.now()});
    setEditSaldo(false);
  };

  const saveDate = () => {
    save({prognosisDate:dateInput});
    setEditDate(false);
  };

  const addPost = () => {
    if(!newPost.name.trim()||!newPost.amount) return;
    const id = uid();
    const nyPost = {...newPost, id, amount:parseFloat(newPost.amount)||0, kilde:"manuell"};
    // Funksjonell update sikrer at vi ikke bruker stale posts
    setLiquidity(prev => ({...prev, posts:{...(prev.posts||{}), [id]:nyPost}}));
    setNewPost({name:"",amount:"",direction:"out",date:prognosisDate,type:"extra"});
    setShowAddPost(false);
  };

  const removePost = (id) => {
    setLiquidity(prev => {
      const next = {...(prev.posts||{})};
      delete next[id];
      return {...prev, posts:next};
    });
  };

  // ── Oppfylt-livssyklus for manuelle prognoseposter ────────────────
  // Ett trykk: markerer oppfylt, ingen modal/bekreftelse. Viser en
  // enkel, midlertidig angre-varsel (lokal state + effect-basert
  // auto-lukking) — enkleste robuste losning, ingen ny toast-
  // arkitektur bygget for dette alene.
  const [angreVarsel,setAngreVarsel] = useState(null); // {id, navn} | null

  const markerOppfylt = (id) => {
    const post = postList.find(p=>p.id===id);
    setLiquidity(prev => {
      const eksisterende = (prev.posts||{})[id];
      if(!eksisterende) return prev;
      return {...prev, posts:{...prev.posts, [id]:{...eksisterende, status:"oppfylt", oppfyltAt:Date.now()}}};
    });
    setAngreVarsel({id, navn: post?post.name:""});
  };

  const angreOppfylt = (id) => {
    setLiquidity(prev => {
      const eksisterende = (prev.posts||{})[id];
      if(!eksisterende) return prev;
      const oppdatert = {...eksisterende, status:"aktiv"};
      delete oppdatert.oppfyltAt;
      return {...prev, posts:{...prev.posts, [id]:oppdatert}};
    });
    setAngreVarsel(null);
  };

  useEffect(() => {
    if(!angreVarsel) return;
    const timer = setTimeout(()=>setAngreVarsel(null), 5000);
    return () => clearTimeout(timer);
  }, [angreVarsel]);

  const saveEditPost = (id, felter) => {
    setLiquidity(prev => {
      const post = (prev.posts||{})[id];
      if(!post) return prev;
      const erGenerator = post.kilde === "generator";
      return {...prev, posts:{...prev.posts, [id]:{
        ...post, ...felter,
        // Marker som manuelt overstyrt hvis det er en generert post
        manueltOverstyrt: erGenerator ? true : post.manueltOverstyrt,
      }}};
    });
  };

  // UI-gruppering (kun for visning)
  const TYPE_LABELS = {inn:"Innbetalinger",fast:"Faste poster",variabel:"Budsjetterte variable",extra:"Ikke budsjettert",ukjent:"⚠️ Ukjent type (slett eller oppdater)"};
  const TYPE_COLORS = {inn:P.olive,fast:P.hazel,variabel:P.dusk,extra:P.clay,ukjent:P.clay};
  const groupedPosts = {};
  const KNOWN_TYPES = ["inn","fast","variabel","extra"];
  periodePostList.forEach(p=>{
    const raw = p.direction==="in"?"inn":(p.type||"extra");
    const g = KNOWN_TYPES.includes(raw) ? raw : "ukjent";
    if(!groupedPosts[g]) groupedPosts[g]=[];
    groupedPosts[g].push(p);
  });

  const isPositive = result.spillerom>=0;
  const daysToDate = Math.ceil((new Date(prognosisDate)-now)/(1000*60*60*24));

  return (
    <div>
      <div style={{fontSize:20,fontWeight:600,color:P.ink,marginBottom:4}}>Spillerom</div>
      <div style={{fontSize:12,color:P.stone,marginBottom:16}}>Prognose frem til valgt dato</div>

      {/* ── Prognosedato ── */}
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14,
        padding:"8px 12px",background:P.mist,borderRadius:9,border:`1px solid ${P.border}`}}>
        <span style={{fontSize:12,color:P.stone}}>Frem til:</span>
        {editDate ? (
          <>
            <input type="date" value={dateInput} onChange={e=>setDateInput(e.target.value)}
              style={{flex:1,fontSize:14,background:P.sand,padding:"4px 8px"}}/>
            <button onClick={saveDate}
              style={{background:P.hazel,color:"white",border:"none",borderRadius:7,
                padding:"4px 12px",fontSize:12,cursor:"pointer",fontWeight:600}}>OK</button>
            <button onClick={()=>setEditDate(false)}
              style={{background:"none",border:"none",cursor:"pointer",color:P.dust,fontSize:13}}>✕</button>
          </>
        ) : (
          <>
            <span style={{flex:1,fontSize:14,fontWeight:600,color:P.ink}}>
              {fmtDate(prognosisDate)}
              <span style={{fontSize:11,fontWeight:400,color:P.dust,marginLeft:6}}>
                ({daysToDate>0?`om ${daysToDate} dager`:daysToDate===0?"i dag":"passert"})
              </span>
            </span>
            <button onClick={()=>setEditDate(true)}
              style={{background:"none",border:"none",cursor:"pointer",color:P.hazel,fontSize:12,fontWeight:500}}>
              Endre
            </button>
          </>
        )}
      </div>

      {/* ── Handlingsknapper ── */}
      <div style={{display:"flex",gap:8,marginBottom:12}}>
        <button onClick={()=>setShowAddPost(v=>!v)}
          style={{flex:1,padding:"9px 8px",
            background:showAddPost?P.hazelXL:P.mist,
            border:showAddPost?"1px solid "+P.hazelL:"1.5px dashed "+P.border,
            borderRadius:9,fontSize:12,cursor:"pointer",
            color:showAddPost?P.hazel:P.stone,fontWeight:500,textAlign:"center"}}>
          {showAddPost?"✕ Lukk":"＋ Legg til prognosepost"}
        </button>
        <div style={{flex:1,padding:"8px 10px",background:P.hazelXL,
          border:"1px solid "+P.hazelL,borderRadius:9,fontSize:11,
          color:P.hazel,textAlign:"center",display:"flex",alignItems:"center",justifyContent:"center",gap:5}}>
          <span>⚡</span>
          <span>{lastRun?"Oppdatert "+new Date(lastRun).toLocaleTimeString("nb-NO",{hour:"2-digit",minute:"2-digit"}):"Oppdaterer…"}</span>
        </div>
      </div>
      {genStatus && (
        <div style={{fontSize:11,color:P.olive,fontWeight:500,marginTop:-8,marginBottom:8,textAlign:"right"}}>
          ✓ {genStatus.count} poster oppdatert
        </div>
      )}

      {/* ── Legg til post — skjema ── */}
      {showAddPost && (
        <Card style={{padding:"12px 14px",marginBottom:8}}>
          <div style={{fontSize:11,fontWeight:600,color:P.dust,textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:10}}>
            Ny prognosepost
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            <input value={newPost.name} onChange={e=>setNewPost(p=>({...p,name:e.target.value}))}
              placeholder="Navn (f.eks. Lonn, Boliglan, Barnetrygd)" autoComplete="off"
              style={{fontSize:14,background:P.sand,padding:"8px 10px",width:"100%",boxSizing:"border-box",borderRadius:8}}/>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              <div>
                <div style={{fontSize:11,color:P.stone,marginBottom:3}}>Belop</div>
                <input type="number" value={newPost.amount}
                  onChange={e=>setNewPost(p=>({...p,amount:e.target.value}))}
                  onFocus={e=>e.target.select()}
                  placeholder="0" style={{width:"100%",boxSizing:"border-box",fontSize:14,background:P.sand,padding:"7px 10px",borderRadius:8}}/>
              </div>
              <div>
                <div style={{fontSize:11,color:P.stone,marginBottom:3}}>Dato</div>
                <input type="date" value={newPost.date}
                  onChange={e=>setNewPost(p=>({...p,date:e.target.value}))}
                  style={{width:"100%",boxSizing:"border-box",fontSize:13,background:P.sand,padding:"7px 6px",borderRadius:8}}/>
              </div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              <div>
                <div style={{fontSize:11,color:P.stone,marginBottom:3}}>Retning</div>
                <select value={newPost.direction} onChange={e=>setNewPost(p=>({...p,direction:e.target.value,type:e.target.value==="in"?"inn":"fast"}))}
                  style={{width:"100%",boxSizing:"border-box",fontSize:13,background:P.sand,padding:"7px 6px",borderRadius:8}}>
                  <option value="out">Utbetaling</option>
                  <option value="in">Innbetaling</option>
                </select>
              </div>
              <div>
                <div style={{fontSize:11,color:P.stone,marginBottom:3}}>Type</div>
                <select value={newPost.type} onChange={e=>setNewPost(p=>({...p,type:e.target.value}))}
                  style={{width:"100%",boxSizing:"border-box",fontSize:13,background:P.sand,padding:"7px 6px",borderRadius:8}}>
                  <option value="fast">Fast</option>
                  <option value="variabel">Variabel</option>
                  <option value="extra">Ekstra</option>
                  <option value="inn">Innbetaling</option>
                </select>
              </div>
            </div>
            <button onClick={addPost} disabled={!newPost.name.trim()||!newPost.amount}
              style={{padding:"9px",background:newPost.name.trim()&&newPost.amount?P.hazel:P.mist,
                color:newPost.name.trim()&&newPost.amount?"white":P.dust,border:"none",
                borderRadius:8,fontSize:13,cursor:"pointer",fontWeight:600}}>
              Legg til
            </button>
          </div>
        </Card>
      )}

      {/* ── Saldo ── */}
      <Card style={{marginBottom:10,padding:"12px 14px"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}>
          <div style={{fontSize:11,fontWeight:600,color:P.dust,textTransform:"uppercase",letterSpacing:"0.07em"}}>Saldo nå</div>
          {saldoAge!==null && (
            <span style={{fontSize:10,color:P.hazelL}}>
              oppdatert {saldoAge<60?`${saldoAge} min siden`:`${Math.round(saldoAge/60)} t siden`}
            </span>
          )}
        </div>
        {editSaldo ? (
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            <input type="number" value={saldoInput} onChange={e=>setSaldoInput(e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&saveSaldo()}
              onFocus={e=>e.target.select()}
              autoFocus placeholder="0" enterKeyHint="done"
              style={{flex:1,fontSize:20,fontWeight:600,background:P.sand,padding:"6px 10px",
                border:`1.5px solid ${P.hazel}`}}/>
            <button onClick={saveSaldo}
              style={{background:P.hazel,color:"white",border:"none",borderRadius:8,
                padding:"8px 14px",fontSize:13,cursor:"pointer",fontWeight:600}}>Lagre</button>
          </div>
        ) : (
          <div style={{display:"flex",alignItems:"baseline",gap:10,cursor:"pointer"}} onClick={()=>{setSaldoInput(String(saldo));setEditSaldo(true);}}>
            <span style={{fontSize:26,fontWeight:700,color:P.ink,letterSpacing:"-0.02em"}}>{fmt(saldo)}</span>
            <span style={{fontSize:12,color:P.hazel,fontWeight:500}}>Oppdater</span>
          </div>
        )}
      </Card>

      {/* ── Spillerom-resultat ── */}
      <div style={{padding:"16px",background:isPositive?`${P.olive}12`:P.clayXL,
        border:`1px solid ${isPositive?P.oliveL:P.clayL}`,borderRadius:12,marginBottom:14}}>
        <div style={{fontSize:11,fontWeight:600,color:isPositive?P.olive:P.clay,
          textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:8}}>
          {isPositive?"✓ Fritt spillerom":"⚠️ Underskudd"}
        </div>
        <div style={{fontSize:36,fontWeight:700,color:isPositive?P.olive:P.clay,
          letterSpacing:"-0.03em",marginBottom:12}}>
          {fmt(result.spillerom)}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          <div style={{background:"rgba(255,255,255,0.5)",borderRadius:8,padding:"8px 10px"}}>
            <div style={{fontSize:10,color:P.stone,marginBottom:2}}>Innbetalinger</div>
            <div style={{fontSize:14,fontWeight:600,color:P.olive}}>+{fmt(result.innbetalinger)}</div>
          </div>
          <div style={{background:"rgba(255,255,255,0.5)",borderRadius:8,padding:"8px 10px"}}>
            <div style={{fontSize:10,color:P.stone,marginBottom:2}}>Utbetalinger</div>
            <div style={{fontSize:14,fontWeight:600,color:P.clay}}>-{fmt(result.utbetalinger)}</div>
          </div>
        </div>
      </div>

      {/* ── Trenger avklaring — tidligere manuelle poster med passert
           dato som fortsatt er aktive. Vises KUN naar listen faktisk
           har innhold. Samme ett-trykks markerOppfylt/angreOppfylt som
           de ordinaere postene bruker — ingen ny arbeidsflyt. ── */}
      {trengerAvklaringListe.length>0 && (
        <div style={{marginBottom:14}}>
          <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}>
            <span style={{fontSize:10,fontWeight:600,color:P.clay,textTransform:"uppercase",letterSpacing:"0.07em"}}>
              Trenger avklaring
            </span>
            <div style={{flex:1,height:"0.5px",background:P.border}}/>
          </div>
          {trengerAvklaringListe.map(p=>(
            <div key={p.id}
              onClick={()=>setEditPost({...p})}
              style={{display:"flex",alignItems:"center",gap:10,
                padding:"7px 10px",borderRadius:8,marginBottom:3,cursor:"pointer",
                background:"#FFF8F0",border:"1px solid #E8C4A0"}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13,fontWeight:500,color:P.ink}}>{p.name}</div>
                <div style={{fontSize:10,color:P.dust,marginTop:1}}>{fmtDate(p.date)}</div>
              </div>
              <span style={{fontSize:13,fontWeight:600,color:p.direction==="in"?P.olive:P.clay,flexShrink:0}}>
                {p.direction==="in"?"+":"-"}{fmt(p.amount)}
              </span>
              <button onClick={e=>{e.stopPropagation();markerOppfylt(p.id);}}
                title="Marker som oppfylt"
                style={{background:"none",border:"none",cursor:"pointer",color:P.olive,fontSize:14,opacity:.7,padding:"0 2px"}}>
                ✓
              </button>
            </div>
          ))}
        </div>
      )}

      {/* ── Prognoseposter ── */}
      {["extra","variabel","fast","inn","ukjent"].map(group => {
        const gPosts = groupedPosts[group]||[];
        if(gPosts.length===0) return null;
        const col = TYPE_COLORS[group]||P.hazel;
        const total = gPosts.reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
        return (
          <div key={group} style={{marginBottom:12}}>
            <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}>
              <span style={{fontSize:10,fontWeight:600,color:col,textTransform:"uppercase",letterSpacing:"0.07em"}}>
                {TYPE_LABELS[group]}
              </span>
              <div style={{flex:1,height:"0.5px",background:P.border}}/>
              <span style={{fontSize:11,fontWeight:600,color:col}}>
                {group==="inn"?"+":"-"}{fmt(total)}
              </span>
            </div>
            {gPosts.map(p => {
              const inRange = new Date(p.date)<=new Date(prognosisDate);
              const fraGenerator = p.kilde==="generator";
              return (
                <div key={p.id}
                  onClick={()=>setEditPost({...p})}
                  style={{display:"flex",alignItems:"center",gap:10,
                  padding:"7px 10px",borderRadius:8,marginBottom:3,cursor:"pointer",
                  background:inRange?P.linen:P.mist,
                  border:"1px solid "+(fraGenerator?(inRange?P.hazelL:P.border):(inRange?P.border:"transparent")),
                  opacity:inRange?1:0.5}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:"flex",alignItems:"center",gap:5,flexWrap:"wrap"}}>
                      <span style={{fontSize:13,fontWeight:500,color:P.ink}}>{p.name}</span>
                      {fraGenerator && !p.manueltOverstyrt && (
                        <span style={{fontSize:9,background:P.hazelXL,color:P.hazel,
                          borderRadius:4,padding:"1px 5px",fontWeight:600}}>budsjett</span>
                      )}
                      {p.manueltOverstyrt && (
                        <span style={{fontSize:9,background:"#FFF0E0",color:"#C0602A",
                          borderRadius:4,padding:"1px 5px",fontWeight:600}}>✏️ overstyrt</span>
                      )}
                      {p.erEstimat && (
                        <span style={{fontSize:9,background:P.goldXL,color:P.gold,
                          borderRadius:4,padding:"1px 5px",fontWeight:600}}>estimat</span>
                      )}
                    </div>
                    <div style={{fontSize:10,color:P.dust,marginTop:1}}>
                      {fmtDate(p.date)}{!inRange?" · utenfor periode":""}
                      {fraGenerator&&p.owner&&p.owner!=="Felles"?` · ${p.owner}`:""}
                    </div>
                  </div>
                  <span style={{fontSize:13,fontWeight:600,color:p.direction==="in"?P.olive:P.clay,flexShrink:0}}>
                    {p.direction==="in"?"+":"-"}{fmt(p.amount)}
                  </span>
                  {p.kilde==="manuell" && (
                    <button onClick={e=>{e.stopPropagation();markerOppfylt(p.id);}}
                      title="Marker som oppfylt"
                      style={{background:"none",border:"none",cursor:"pointer",color:P.olive,fontSize:14,opacity:.7,padding:"0 2px"}}>
                      ✓
                    </button>
                  )}
                  <button onClick={e=>{e.stopPropagation();removePost(p.id);}}
                    style={{background:"none",border:"none",cursor:"pointer",color:P.dust,fontSize:12,opacity:.5,padding:"0 2px"}}>
                    ✕
                  </button>
                </div>
              );
            })}
          </div>
        );
      })}





      {/* ── Angre-varsel etter "marker oppfylt" — enkel, midlertidig,
           ingen ny toast-arkitektur ── */}
      {angreVarsel && (
        <div style={{position:"fixed",left:"50%",bottom:86,transform:"translateX(-50%)",
          zIndex:60,display:"flex",alignItems:"center",gap:10,
          background:P.ink,color:"white",borderRadius:10,padding:"10px 14px",
          boxShadow:"0 4px 14px rgba(0,0,0,0.18)",maxWidth:"90vw"}}>
          <span style={{fontSize:12.5}}>{angreVarsel.navn} er markert som oppfylt</span>
          <button onClick={()=>angreOppfylt(angreVarsel.id)}
            style={{background:"none",border:"none",cursor:"pointer",color:P.hazelL,
              fontSize:12.5,fontWeight:600,padding:0}}>
            Angre
          </button>
        </div>
      )}

      {/* ── Rediger prognosepost ── */}
      {editPost && (
        <Modal title={editPost.kilde==="generator"?"Rediger generert post":"Rediger post"} onClose={()=>setEditPost(null)}>
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            {editPost.kilde==="generator" && (
              <div style={{fontSize:11,color:"#C0602A",background:"#FFF8F0",padding:"8px 12px",borderRadius:8,border:"1px solid #E8C4A0"}}>
                Generert post. Endringer merkes som manuelt overstyrt.
              </div>
            )}
            <div>
              <div style={{fontSize:11,color:P.dust,marginBottom:4}}>Navn</div>
              <input value={editPost.name} onChange={e=>setEditPost(p=>({...p,name:e.target.value}))}
                style={{width:"100%",boxSizing:"border-box",fontSize:15,background:P.sand,padding:"8px 10px",borderRadius:8}}/>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              <div>
                <div style={{fontSize:11,color:P.dust,marginBottom:4}}>Belop</div>
                <input type="number" value={editPost.amount} onFocus={e=>e.target.select()}
                  onChange={e=>setEditPost(p=>({...p,amount:e.target.value}))}
                  style={{width:"100%",boxSizing:"border-box",fontSize:15,background:P.sand,padding:"8px 10px",borderRadius:8}}/>
              </div>
              <div>
                <div style={{fontSize:11,color:P.dust,marginBottom:4}}>Dato</div>
                <input type="date" value={editPost.date}
                  onChange={e=>setEditPost(p=>({...p,date:e.target.value}))}
                  style={{width:"100%",boxSizing:"border-box",fontSize:13,background:P.sand,padding:"8px 6px",borderRadius:8}}/>
              </div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              <div>
                <div style={{fontSize:11,color:P.dust,marginBottom:4}}>Retning</div>
                <select value={editPost.direction} onChange={e=>setEditPost(p=>({...p,direction:e.target.value}))}
                  style={{width:"100%",boxSizing:"border-box",fontSize:13,background:P.sand,padding:"8px 6px",borderRadius:8}}>
                  <option value="out">Utbetaling</option>
                  <option value="in">Innbetaling</option>
                </select>
              </div>
              <div>
                <div style={{fontSize:11,color:P.dust,marginBottom:4}}>Type</div>
                <select value={editPost.type||"extra"} onChange={e=>setEditPost(p=>({...p,type:e.target.value}))}
                  style={{width:"100%",boxSizing:"border-box",fontSize:13,background:P.sand,padding:"8px 6px",borderRadius:8}}>
                  <option value="fast">Fast</option>
                  <option value="variabel">Variabel</option>
                  <option value="extra">Ekstra</option>
                  <option value="inn">Innbetaling</option>
                </select>
              </div>
            </div>
            <div style={{display:"flex",gap:8,marginTop:4}}>
              <button onClick={()=>setEditPost(null)}
                style={{flex:1,padding:"10px",background:P.mist,border:"1px solid "+P.border,
                  borderRadius:9,fontSize:13,cursor:"pointer",color:P.stone}}>Avbryt</button>
              <button onClick={()=>{
                saveEditPost(editPost.id,{name:editPost.name,
                  amount:parseFloat(String(editPost.amount))||0,
                  date:editPost.date,direction:editPost.direction,type:editPost.type});
                setEditPost(null);
              }} style={{flex:2,padding:"10px",background:P.hazel,color:"white",border:"none",
                borderRadius:9,fontSize:13,cursor:"pointer",fontWeight:600}}>Lagre</button>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ── Etterbehandling, etappe 2 — kontekstuell drill-down (rent lesende) ──
// Viser hendelsene bak én posts "Faktisk"-tall for valgt maaned.
// Kontekstuell og avvisbar (Modal) — ingen egen historikk-/arkivflate.
// Ingen redigering her; kun visning. Gjenbrukes av bade BudsjettScreen
// og InntekterScreen.
function HendelseDrillDownModal({tittel, rader, onClose, onVelgHendelse, onVelgKvittering}) {
  return (
    <Modal title={tittel} onClose={onClose}>
      {rader.length===0 ? (
        <div style={{textAlign:"center",padding:"20px 10px",color:P.dust,fontSize:12.5}}>
          Ingen hendelser bidrar til dette tallet denne måneden.
        </div>
      ) : (
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {rader.map(r=>{
            const klikkbar = r.erKvittering ? !!(onVelgKvittering && r.receiptId) : !!onVelgHendelse;
            return (
            <div key={r.hendelseId}
              onClick={()=>{
                if(r.erKvittering) { if(onVelgKvittering && r.receiptId) onVelgKvittering(r.receiptId); }
                else if(onVelgHendelse) onVelgHendelse(r.hendelseId);
              }}
              style={{padding:"10px 12px",background:P.linen,
                borderRadius:9,border:"1px solid "+P.border,
                cursor:klikkbar?"pointer":"default"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:8}}>
                <span style={{fontSize:12.5,fontWeight:600,color:P.ink,overflow:"hidden",
                  textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.tekst}</span>
                <span style={{fontSize:13,fontWeight:600,color:r.belop<0?P.olive:P.ink,
                  whiteSpace:"nowrap"}}>{fmt(r.belop)}</span>
              </div>
              <div style={{fontSize:11,color:P.dust,marginTop:3}}>
                {fmtD(r.dato)}
                {r.eiere.length>0 && " · "+r.eiere.map(e=>
                  e.person+(e.prosent<100?" "+e.prosent+"%":"")).join(", ")}
              </div>
              <div style={{marginTop:5,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span style={{fontSize:9.5,borderRadius:4,padding:"1px 6px",fontWeight:600,
                  background:r.erKvittering?"#F0FFF4":r.erManuell?"#FFF8E8":P.mist,
                  color:r.erKvittering?P.olive:r.erManuell?"#9A7A00":P.stone}}>
                  {r.erKvittering ? "🧾 Kvittering" : r.erManuell ? "✍️ Manuelt registrert" : "🏦 Bankplassering"}
                </span>
                {klikkbar && (
                  <span style={{fontSize:10,color:r.erKvittering?P.olive:P.hazel}}>
                    {r.erKvittering ? "Trykk for å redigere kvitteringen ›" : "Trykk for å korrigere ›"}
                  </span>
                )}
              </div>
            </div>
            );
          })}
        </div>
      )}
    </Modal>
  );
}

// ── Etterbehandling, etappe 3 — korrigeringspanel ────────────────
// Aapnes fra en (ikke-kvitteringsbasert) rad i HendelseDrillDownModal.
// Forhaandsutfyller fra den EKSISTERENDE hendelsen — oppretter aldri
// en ny. Gjenbruker samme motorer/komponenter som Bankimport allerede
// bruker (BelopFelt, AnsvarChips, jevnFordelEiere,
// beregnRestPaaSisteLinje, byggKorrigertHendelse, oppdaterReglerVedLaering,
// regelMatcherTekst, normaliserTransaksjonstekst) — ingen ny
// beregningslogikk er skrevet for selve fordelingen. onLagre kalles
// med (oppdatertHendelse, laerData|null); kalleren (BudsjettScreen/
// InntekterScreen) star for selve setHendelser/setRules-skrivingen.
function KorrigerHendelseModal({hendelse, transaksjon, budgetGroups, incomeGroups, sparingGroups, rules, onLagre, onClose}) {
  // Bygger et "post"-objekt for en eksisterende fordelingslinje —
  // naavaerende navn/gruppe naar posten fortsatt finnes (ogsaa naar
  // den er arkivert — arkivering skjuler kun posten fra SOK etter NYE
  // maal, ikke fra visning av et allerede eksisterende maal). Faller
  // tilbake til fordelingens egen, historiske plasseringNavn hvis
  // posten er slettet helt.
  // v-post-rename: finnPost brukte tidligere en DIREKTE, eksakt
  // id-sammenligning (it.id===f.plasseringId) — det betydde at en
  // historisk fordeling som pekte paa en LEGACY plasseringId (t.d.
  // "helen_klar", na absorbert i "klar_voksne" sine legacyIds) ALDRI
  // ble gjenkjent som dagens aktive post, og falt stille til "(post
  // ikke lenger tilgjengelig)" — selv om posten faktisk finnes. Bruker
  // na budsjettpostMatcherId (samme legacyIds-bevisste oppslag som
  // Actual-beregningen og "Alle transaksjoner" allerede bruker
  // konsekvent), saa korrigeringsflaten forhaandsutfyller riktig
  // dagens aktive post ogsaa for gamle plasseringId-er.
  const finnPost = (f) => {
    const groups = f.plasseringType==="income" ? incomeGroups
      : f.plasseringType==="sparing" ? sparingGroups
      : budgetGroups;
    for(const g of (groups||[])) {
      const item = (g.items||[]).find(it=>budsjettpostMatcherId(it, f.plasseringId));
      if(item) return {
        id:item.id, name:item.name, retning: f.plasseringType==="income"?"inn":"ut",
        gruppe:g.label, eier:(item.meta&&item.meta.eier)||"Felles",
        plasseringType: f.plasseringType==="sparing" ? "sparing" : undefined,
      };
    }
    return {
      id:f.plasseringId, name:f.plasseringNavn||"(post ikke lenger tilgjengelig)",
      retning: f.plasseringType==="income"?"inn":"ut", gruppe:null, eier:"Felles",
      plasseringType: f.plasseringType==="sparing" ? "sparing" : undefined,
    };
  };

  const [utkastType,setUtkastType] = useState(hendelse.status==="pa_vent" ? "uklar" : null);
  const [utkastFordelinger,setUtkastFordelinger] = useState(
    (hendelse.fordelinger||[]).map(f=>({
      id:uid(), post:finnPost(f), belop:f.belop,
      eiere:(f.eiere&&f.eiere.length>0)?f.eiere:[{person:"Felles",prosent:100}],
      // v-post-rename: belop kommer her direkte fra en eksisterende
      // fordeling — allerede den ferdige, signerte effekten. Ingen
      // fortegnstolkning skal skje med mindre brukeren aktivt bytter
      // post for denne linjen (se velgPostForLinje).
      postErEndret: false,
    }))
  );
  const [utkastUklar,setUtkastUklar] = useState(hendelse.paaVentAarsak||null);
  // Laering er ALLTID av som standard, uansett hva som ble lart
  // tidligere — en historisk korrigering skal aldri stille endre
  // regler (§ eksplisitt krav i oppdraget).
  const [utkastLaer,setUtkastLaer] = useState(false);
  const [visLeggTilFordeling,setVisLeggTilFordeling] = useState(false);
  const [redigerLinjeIdx,setRedigerLinjeIdx] = useState(null);
  const [sokTekst,setSokTekst] = useState("");

  const transBelop = Math.abs(transaksjon ? (transaksjon.belop||0) : 0);
  const transRetning = transaksjon ? transaksjon.retning : "ut";

  // Samme "ekskluder arkivert fra sok etter NYE maal"-prinsipp som
  // Bankimport allerede bruker (v-fase4-etappe4).
  const allePoster = [
    ...(budgetGroups||[]).flatMap(g=>g.items.filter(it=>!(it.meta&&it.meta.arkivert)).map(it=>({
      id:it.id, name:it.name, gruppe:g.label, retning:"ut", eier:(it.meta&&it.meta.eier)||"Felles",
    }))),
    ...(incomeGroups||[]).flatMap(g=>g.items.filter(it=>!(it.meta&&it.meta.arkivert)).map(it=>({
      id:it.id, name:it.name, gruppe:g.label, retning:"inn", eier:(it.meta&&it.meta.eier)||"Felles",
    }))),
    // v-post-rename: gjor korrigering "Kostnad/Inntekt -> Sparing"
    // og "Sparing -> annen sparepost" mulig, samme prinsipp som over.
    ...byggAlleSparingPoster(sparingGroups),
  ];

  const alleredeValgtePostIder = new Set(utkastFordelinger.map(f=>f.post.id));
  const sokTreff = sokTekst.trim().length>0
    ? allePoster.filter(p=>p.name.toLowerCase().includes(sokTekst.trim().toLowerCase())
        && (redigerLinjeIdx!==null || !alleredeValgtePostIder.has(p.id)))
    : [];

  const avsluttSok = () => { setVisLeggTilFordeling(false); setRedigerLinjeIdx(null); setSokTekst(""); };

  const leggTilFordeling = (post) => {
    // v-post-rename: en helt NY linje har aldri en "allerede
    // signert effekt" aa bevare — belopet skal alltid tolkes normalt.
    const nye = [...utkastFordelinger, {id:uid(), post, belop:0, eiere:jevnFordelEiere([post.eier||"Felles"]), postErEndret:true}];
    setUtkastFordelinger(beregnRestPaaSisteLinje(nye, transBelop, "belop"));
    avsluttSok();
  };
  // "Flytt hele beløpet" er strukturelt det samme som å bytte post paa
  // den ENE eksisterende linjen — ingen egen kodevei nodvendig.
  const velgPostForLinje = (post) => {
    if(redigerLinjeIdx!==null) {
      setUtkastFordelinger(prev=>prev.map((f,i)=>{
        if(i!==redigerLinjeIdx) return f;
        // v-post-rename: naar posten faktisk byttes, konverter
        // det naavaerende belopet TILBAKE til det underliggende raa
        // observasjonsbelopet (samme funksjon, samme retning — negasjon
        // er sin egen invers, saa dette er noeyaktig aa reversere
        // byggFordelingFraPost sin egen tolkning) FOR posten byttes.
        // Slik faar den NYE posten riktig NYTT fortegn fra samme
        // underliggende belop ved lagring, i stedet for aa re-tolke en
        // allerede tolket verdi. Hvis linjen allerede er byttet en gang
        // i denne okten (postErEndret alt true), er belopet allerede
        // raatt — reverser IKKE en gang til.
        const raattBelop = f.postErEndret ? f.belop : byggFordelingFraPost(f.post, f.belop, f.eiere, transRetning).belop;
        return {...f, post, belop:raattBelop, postErEndret:true};
      }));
      avsluttSok();
    } else {
      leggTilFordeling(post);
    }
  };
  const oppdaterBelop = (idx, nyttBelop) => {
    const nye = utkastFordelinger.map((f,i)=>i!==idx?f:{...f,belop:nyttBelop});
    setUtkastFordelinger(beregnRestPaaSisteLinje(nye, transBelop, "belop"));
  };
  const oppdaterEiere = (idx, nyeEiere) => {
    setUtkastFordelinger(prev=>prev.map((f,i)=>i!==idx?f:{...f,eiere:nyeEiere}));
  };
  const fjernFordeling = (idx) => {
    const nye = utkastFordelinger.filter((_,i)=>i!==idx);
    setUtkastFordelinger(nye.length>0 ? beregnRestPaaSisteLinje(nye, transBelop, "belop") : nye);
  };

  const kanLagre = utkastType==="uklar" || utkastFordelinger.length>0;

  const lagre = () => {
    if(utkastType==="uklar") {
      onLagre(byggKorrigertHendelse(hendelse, transRetning, {type:"uklar", uklarValg:utkastUklar}), null);
      return;
    }
    let regelId = hendelse.regelId||null;
    let laerData = null;
    if(utkastLaer && utkastFordelinger.length===1 && transaksjon) {
      const forste = utkastFordelinger[0];
      const normPattern = normaliserTransaksjonstekst(transaksjon.tekst);
      const eksisterendeRegel = (rules||[]).find(r=>r.targetId===forste.post.id && regelMatcherTekst(r, normPattern));
      regelId = eksisterendeRegel ? eksisterendeRegel.id : null;
      laerData = {transaksjon, post:forste.post};
    }
    const oppdatertHendelse = byggKorrigertHendelse(hendelse, transRetning, {
      type:null, fordelinger:utkastFordelinger, regelId,
    });
    onLagre(oppdatertHendelse, laerData);
  };

  return (
    <Modal title={"Korriger — "+(transaksjon?(transaksjon.tekst||"(ukjent)"):"(observasjon mangler)")} onClose={onClose}>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        {transaksjon && (
          <div style={{fontSize:11,color:P.dust}}>
            {fmtD(transaksjon.dato)} · {transaksjon.konto||"?"} · {fmt(transaksjon.belop||0)}
          </div>
        )}

        <div style={{display:"flex",gap:6}}>
          <button onClick={()=>setUtkastType(null)}
            style={{flex:1,padding:"8px",borderRadius:8,fontSize:12,cursor:"pointer",
              background:utkastType!=="uklar"?P.hazelXL:"transparent",
              border:"1px solid "+(utkastType!=="uklar"?P.hazel:P.border),
              color:utkastType!=="uklar"?P.hazel:P.stone,fontWeight:utkastType!=="uklar"?600:400}}>
            Plassering
          </button>
          <button onClick={()=>setUtkastType("uklar")}
            style={{flex:1,padding:"8px",borderRadius:8,fontSize:12,cursor:"pointer",
              background:utkastType==="uklar"?"#FFFBE0":"transparent",
              border:"1px solid "+(utkastType==="uklar"?"#D4C060":P.border),
              color:utkastType==="uklar"?"#9A7A00":P.stone,fontWeight:utkastType==="uklar"?600:400}}>
            Sett på vent
          </button>
        </div>

        {utkastType==="uklar" ? (
          <div>
            <div style={{fontSize:11,color:P.dust,marginBottom:6}}>Årsak</div>
            <div style={{display:"flex",flexDirection:"column",gap:5}}>
              {Object.keys(UKLAR_AARSAK_LABEL).map(k=>(
                <button key={k} onClick={()=>setUtkastUklar(k)}
                  style={{padding:"8px 10px",borderRadius:8,fontSize:12,cursor:"pointer",textAlign:"left",
                    background:utkastUklar===k?"#FFFBE0":"transparent",
                    border:"1px solid "+(utkastUklar===k?"#D4C060":P.border),
                    color:utkastUklar===k?"#9A7A00":P.ink}}>
                  {UKLAR_AARSAK_LABEL[k]}
                </button>
              ))}
            </div>
          </div>
        ) : (
          <div>
            {utkastFordelinger.map((f,idx)=>{
              const erSiste = idx===utkastFordelinger.length-1;
              return (
                <div key={f.id} style={{padding:"8px 10px",background:P.linen,borderRadius:8,
                  border:"1px solid "+P.border,marginBottom:6}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:6}}>
                    <button onClick={()=>{setRedigerLinjeIdx(idx);setVisLeggTilFordeling(false);setSokTekst("");}}
                      style={{background:"none",border:"none",cursor:"pointer",fontSize:12.5,
                        fontWeight:600,color:P.ink,textAlign:"left",flex:1,padding:0,minWidth:0,
                        overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                      {f.post.name}{f.post.gruppe?" ("+f.post.gruppe+")":""}
                    </button>
                    <BelopFelt verdi={f.belop} redigerbar={!erSiste}
                      onSave={(v)=>oppdaterBelop(idx,v)}/>
                    {utkastFordelinger.length>1 && (
                      <button onClick={()=>fjernFordeling(idx)}
                        style={{background:"none",border:"none",cursor:"pointer",color:P.dust,fontSize:13,flexShrink:0}}>✕</button>
                    )}
                  </div>
                  <div style={{marginTop:6}}>
                    <AnsvarChips eiere={f.eiere} onChange={(nye)=>oppdaterEiere(idx,nye)}/>
                  </div>
                </div>
              );
            })}

            {(redigerLinjeIdx!==null || visLeggTilFordeling || utkastFordelinger.length===0) && (
              <div style={{marginTop:4,marginBottom:8}}>
                <input value={sokTekst} onChange={e=>setSokTekst(e.target.value)}
                  placeholder={redigerLinjeIdx!==null ? "Søk ny post…" : "Søk etter post…"}
                  style={{width:"100%",padding:"8px 10px",borderRadius:8,border:"1px solid "+P.border,
                    fontSize:12,boxSizing:"border-box"}}/>
                {sokTekst.trim().length>0 && (
                  <div style={{marginTop:4,maxHeight:160,overflowY:"auto"}}>
                    {sokTreff.map(p=>(
                      <button key={p.id} onClick={()=>velgPostForLinje(p)}
                        style={{display:"block",width:"100%",textAlign:"left",padding:"7px 9px",
                          borderRadius:6,border:"none",background:"transparent",cursor:"pointer",fontSize:12}}>
                        {p.name} <span style={{color:P.dust,fontSize:10.5}}>({p.gruppe})</span>
                      </button>
                    ))}
                    {sokTreff.length===0 && (
                      <div style={{fontSize:11,color:P.dust,padding:"6px 0"}}>Ingen treff.</div>
                    )}
                  </div>
                )}
                <button onClick={avsluttSok}
                  style={{marginTop:4,background:"none",border:"none",cursor:"pointer",color:P.dust,fontSize:11}}>
                  Avbryt søk
                </button>
              </div>
            )}

            {utkastFordelinger.length>0 && redigerLinjeIdx===null && !visLeggTilFordeling && (
              <button onClick={()=>setVisLeggTilFordeling(true)}
                style={{background:"none",border:"none",cursor:"pointer",color:P.hazel,fontSize:11.5,marginBottom:8}}>
                + Del opp i flere
              </button>
            )}

            {utkastFordelinger.length===1 && (
              <label style={{display:"flex",alignItems:"center",gap:6,fontSize:11.5,color:P.stone}}>
                <input type="checkbox" checked={utkastLaer} onChange={e=>setUtkastLaer(e.target.checked)}/>
                Lær denne koblingen
              </label>
            )}
          </div>
        )}

        <div style={{display:"flex",gap:8,marginTop:2}}>
          <button onClick={onClose}
            style={{flex:1,padding:"10px",background:P.mist,border:"1px solid "+P.border,
              borderRadius:9,fontSize:13,cursor:"pointer",color:P.stone}}>Avbryt</button>
          <button onClick={lagre} disabled={!kanLagre}
            style={{flex:2,padding:"10px",background:kanLagre?P.hazel:P.mist,color:"white",
              border:"none",borderRadius:9,fontSize:13,cursor:kanLagre?"pointer":"default",fontWeight:600}}>
            Lagre korrigering
          </button>
        </div>
      </div>
    </Modal>
  );
}

// ── Economy Screen ────────────────────────────────────────────────

// ── BudsjettMetaModal — rediger v2-metadata per budsjettpost ─────
function BudsjettMetaModal({item, groupId, onSave, onClose, feilFelter}) {
  const [meta,setMeta] = useState({...defaultMeta(), ...(item.meta||{})});
  // v-post-rename: navnredigering — samme trygge, eksisterende
  // redigeringsmodal som resten av postens metadata. Endrer KUN
  // it.name ved lagring, aldri id/gruppe/legacyIds/months/
  // budgetDetails/meta for øvrig.
  const [navn,setNavn] = useState(item.name);
  const navnUgyldig = !navn.trim();
  const set = (k,v) => setMeta(p=>({...p,[k]:v}));
  const ff = feilFelter||{};
  const Varsel = () => <span style={{color:P.clay,marginLeft:5,fontSize:11}}>⚠ mangler</span>;
  return (
    <Modal title={`Detaljer — ${item.name}`} onClose={onClose}>
      <div style={{display:"flex",flexDirection:"column",gap:14}}>

        {/* Navn — v-post-rename */}
        <div>
          <div style={{fontSize:11,fontWeight:600,color:P.dust,textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:6}}>Navn</div>
          <input value={navn} onChange={e=>setNavn(e.target.value)}
            style={{width:"100%",boxSizing:"border-box",padding:"9px 12px",borderRadius:8,
              border:"1px solid "+(navnUgyldig?P.clay:P.border),fontSize:13}}/>
          {navnUgyldig && <div style={{fontSize:11,color:P.clay,marginTop:4}}>Navnet kan ikke være tomt.</div>}
        </div>

        {/* Eier */}
        <div>
          <div style={{fontSize:11,fontWeight:600,color:P.dust,textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:6}}>Eier</div>
          <div style={{display:"flex",gap:6}}>
            {BUDGET_EIER.map(e=>(
              <button key={e} onClick={()=>set("eier",e)}
                style={{flex:1,padding:"8px 4px",borderRadius:8,border:`1px solid ${meta.eier===e?P.hazel:P.border}`,
                  background:meta.eier===e?P.hazelXL:"transparent",
                  color:meta.eier===e?P.hazel:P.stone,fontSize:13,cursor:"pointer",fontWeight:meta.eier===e?600:400}}>
                {e}
              </button>
            ))}
          </div>
        </div>

        {/* Nivå */}
        <div>
          <div style={{fontSize:11,fontWeight:600,color:P.dust,textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:6,display:"flex",alignItems:"center"}}>
            Nivå{ff.niva && <Varsel/>}
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:5}}>
            {BUDGET_NIVA.map(n=>(
              <button key={n.id} onClick={()=>set("niva",n.id)}
                style={{padding:"9px 12px",borderRadius:8,border:`1px solid ${meta.niva===n.id?P.hazel:(ff.niva?P.clay:P.border)}`,
                  background:meta.niva===n.id?P.hazelXL:"transparent",
                  color:meta.niva===n.id?P.hazel:P.stone,fontSize:13,cursor:"pointer",
                  fontWeight:meta.niva===n.id?600:400,textAlign:"left"}}>
                {n.label}
              </button>
            ))}
          </div>
          {meta.niva==="opprettholde" && (
            <div style={{marginTop:8,paddingLeft:12}}>
              <div style={{fontSize:11,color:P.stone,marginBottom:5}}>Undertype</div>
              <div style={{display:"flex",gap:6}}>
                {OPPRETTHOLDE_TYPE.map(t=>{
                  const valgt = (meta.opprettholdType||"nodvendig")===t.id;
                  return (
                    <button key={t.id} onClick={()=>set("opprettholdType",t.id)}
                      style={{flex:1,padding:"7px 8px",borderRadius:8,fontSize:12,cursor:"pointer",
                        border:valgt?"1px solid "+P.hazel:"1px solid "+P.border,
                        background:valgt?P.hazelXL:"transparent",
                        color:valgt?P.hazel:P.stone,
                        fontWeight:valgt?600:400}}>
                      {t.label}
                    </button>
                  );
                })}
              </div>
            </div>
          )}
        </div>

        {/* Oppførsel */}
        <div>
          <div style={{fontSize:11,fontWeight:600,color:P.dust,textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:6}}>Oppførsel</div>
          <div style={{display:"flex",gap:6}}>
            {BUDGET_OPPFORSEL.map(o=>(
              <button key={o.id} onClick={()=>set("oppforsel",o.id)}
                style={{flex:1,padding:"8px 4px",borderRadius:8,border:`1px solid ${meta.oppforsel===o.id?P.hazel:P.border}`,
                  background:meta.oppforsel===o.id?P.hazelXL:"transparent",
                  color:meta.oppforsel===o.id?P.hazel:P.stone,fontSize:12,cursor:"pointer",
                  fontWeight:meta.oppforsel===o.id?600:400}}>
                {o.label}
              </button>
            ))}
          </div>
          <div style={{fontSize:11,color:P.dust,marginTop:6,lineHeight:1.5}}>
            {meta.oppforsel==="fast" && "Beløpet er i praksis kjent på forhånd."}
            {meta.oppforsel==="variabel" && "Beløpet varierer. Budsjettert belop brukes frem til faktisk er kjent."}
            {meta.oppforsel==="fordele" && "Penger som flyttes til buffer, investering eller lignende."}
          </div>
        </div>

        {/* Konto + Forfallsdag */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <div>
            <div style={{fontSize:11,fontWeight:600,color:P.dust,textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:6,display:"flex",alignItems:"center"}}>
              Konto{ff.konto && <Varsel/>}
            </div>
            <select value={meta.konto} onChange={e=>set("konto",e.target.value)}
              style={{width:"100%",boxSizing:"border-box",fontSize:14,background:P.sand,padding:"8px 6px",borderRadius:8,
                border:ff.konto?"1px solid "+P.clay:"1px solid transparent"}}>
              {BUDGET_KONTOER.map(k=><option key={k} value={k}>{k}</option>)}
            </select>
          </div>
          <div>
            <div style={{fontSize:11,fontWeight:600,color:P.dust,textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:6,display:"flex",alignItems:"center"}}>
              Forfallsdag{ff.forfallsdag && <Varsel/>}
            </div>
            <input type="number" min="1" max="31" value={meta.forfallsdag}
              onChange={e=>set("forfallsdag",e.target.value)}
              placeholder="Dag i maaneden"
              style={{width:"100%",boxSizing:"border-box",fontSize:14,background:P.sand,padding:"8px 10px",borderRadius:8,
                border:ff.forfallsdag?"1px solid "+P.clay:"1px solid transparent"}}/>
          </div>
        </div>

        {/* Kilde */}
        <div>
          <div style={{fontSize:11,fontWeight:600,color:P.dust,textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:6}}>Kilde</div>
          <div style={{fontSize:11,color:P.stone,marginBottom:6,lineHeight:1.5}}>Hvor kommer dette tallet fra?</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {BUDGET_KILDE.map(k=>(
              <button key={k.id} onClick={()=>set("kilde",k.id)}
                style={{padding:"6px 12px",borderRadius:8,border:`1px solid ${meta.kilde===k.id?P.hazel:P.border}`,
                  background:meta.kilde===k.id?P.hazelXL:"transparent",
                  color:meta.kilde===k.id?P.hazel:P.stone,fontSize:12,cursor:"pointer",
                  fontWeight:meta.kilde===k.id?600:400}}>
                {k.label}
              </button>
            ))}
          </div>
        </div>

        {/* Automatisk */}
        <div style={{display:"flex",alignItems:"center",gap:12,padding:"10px 12px",
          background:P.mist,borderRadius:9,border:`1px solid ${P.border}`,cursor:"pointer"}}
          onClick={()=>set("automatisk",!meta.automatisk)}>
          <div style={{width:22,height:22,borderRadius:6,flexShrink:0,
            background:meta.automatisk?P.hazel:"transparent",
            border:`1.5px solid ${meta.automatisk?P.hazel:P.hazelL}`,
            display:"flex",alignItems:"center",justifyContent:"center"}}>
            {meta.automatisk&&<Em e="✓" s={{fontSize:12,color:"white"}}/>}
          </div>
          <div>
            <div style={{fontSize:13,fontWeight:500,color:P.ink}}>Automatisk til prognosen</div>
            <div style={{fontSize:11,color:P.dust,marginTop:1}}>Generatoren henter denne posten automatisk naar den er klar.</div>
          </div>
        </div>

        {ff.belop && (
          <div style={{fontSize:11.5,color:P.clay,background:"#FFF4F0",border:"1px solid #F0C4B0",
            borderRadius:8,padding:"8px 10px"}}>
            ⚠ Mangler beløp — posten er automatisk, men har 0 kr i inneværende måned. Fyll inn beløpet i Kostnader.
          </div>
        )}

        {/* Arkivering — plasseringens livssyklus (v-post-rename).
            En arkivert post foreslas ikke lenger ved nye plasseringer,
            men bevares fullt ut for hendelser som allerede peker paa den. */}
        <button onClick={()=>set("arkivert",!meta.arkivert)}
          style={{padding:"9px 12px",borderRadius:8,fontSize:12.5,cursor:"pointer",textAlign:"left",
            background:meta.arkivert?"#FFFBE0":"transparent",
            border:"1px dashed "+(meta.arkivert?"#D4C060":P.border),
            color:meta.arkivert?"#9A7A00":P.dust}}>
          {meta.arkivert
            ? "📂 Arkivert — trykk for å gjenåpne (vises igjen ved nye plasseringer)"
            : "🗄️ Arkiver denne posten (skjules fra nye plasseringer, historikk bevares)"}
        </button>

        <div style={{display:"flex",gap:8}}>
          <button onClick={onClose}
            style={{flex:1,padding:"10px",background:P.mist,border:`1px solid ${P.border}`,
              borderRadius:9,fontSize:13,cursor:"pointer",color:P.stone}}>Avbryt</button>
          <button onClick={()=>{if(navnUgyldig)return;onSave(groupId,item.id,meta,navn.trim());onClose();}} disabled={navnUgyldig}
            style={{flex:2,padding:"10px",background:P.hazel,color:"white",border:"none",
              borderRadius:9,fontSize:13,cursor:"pointer",fontWeight:600}}>Lagre</button>
        </div>
      </div>
    </Modal>
  );
}

function AddItemRow({onAdd,color}) {
  const [n,setN]=useState(""); const [b,setB]=useState(""); const [s,setS]=useState("");
  const go=()=>{if(!n.trim())return;onAdd(n,b,s);setN("");setB("");setS("");};
  return (
    <div style={{display:"grid",gridTemplateColumns:"1fr 68px 68px 30px",gap:5,marginTop:9,alignItems:"center"}}>
      <input value={n} onChange={e=>setN(e.target.value)} placeholder="Ny post…" style={{fontSize:11,background:P.sand}}/>
      <input type="number" value={b} onChange={e=>setB(e.target.value)} placeholder="Budsjett" style={{fontSize:11,textAlign:"right",background:P.sand}}/>
      <input type="number" value={s} onChange={e=>setS(e.target.value)} placeholder="Faktisk" style={{fontSize:11,textAlign:"right",background:P.sand}}/>
      <button onClick={go} style={{background:color||P.hazel,color:"white",border:"none",borderRadius:7,padding:"5px",cursor:"pointer",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center"}}>＋</button>
    </div>
  );
}

// ── BudsjettScreen ────────────────────────────────────────────────
function BudsjettScreen({budgetGroups,setBudgetGroups,incomeGroups,sparingGroups,hendelser,setHendelser,rules,setRules,transaksjoner,receipts,setReceipts,month,setMonth}) {
  const monthKey = "2026-"+String(month+1).padStart(2,"0");
  // v-post-rename: gyldige observasjoner na begge slag (bank + kvittering),
  // siden en hendelse kan vaere dokumentert av enten. Faktiske tall
  // beregnes direkte fra hendelser — Actual er ikke lenger involvert her.
  const gyldigeObservasjonIder = new Set([
    ...(transaksjoner||[]).map(t=>t.id),
    ...(receipts||[]).map(r=>r.id),
  ]);
  const actualTotals = beregnFaktiskTotalerFraHendelser(hendelser, monthKey, gyldigeObservasjonIder);
  const [expanded,setExpanded]   = useState(null);
  const [metaModal,setMetaModal] = useState(null);
  // Etterbehandling, etappe 2: hvilken post er valgt for drill-down
  // (rent lesende — se HendelseDrillDownModal).
  const [drillDown,setDrillDown] = useState(null); // {postId, postName} | null
  // Etterbehandling, etappe 3: hvilken hendelse korrigeres na (id) | null.
  const [korrigerHendelseId,setKorrigerHendelseId] = useState(null);
  // Etterbehandling, etappe 4: hvilken kvittering redigeres na (id) | null,
  // og eventuell synkroniseringsfeil for den (rent lesende panel-tilstand).
  const [korrigerReceiptId,setKorrigerReceiptId] = useState(null);
  const [kvitteringSyncFeil,setKvitteringSyncFeil] = useState(null); // {id, melding} | null
  const alleMalPoster = byggAlleMalPoster(budgetGroups, incomeGroups);
  const oppdaterKvitteringFraDrillDown = (id, felter) => {
    const receipt = (receipts||[]).find(x=>x.id===id);
    if(!receipt) return;
    const {feil, nyReceipt, nyHendelse} = byggSynkronisertKvitteringOgHendelse(receipt, felter, hendelser);
    if(feil) { setKvitteringSyncFeil({id, melding:feil}); return; }
    setKvitteringSyncFeil(null);
    setReceipts(prev=>(prev||[]).map(x=>x.id!==id?x:nyReceipt));
    if(nyHendelse) {
      setHendelser(prev=>{
        const uten = (prev||[]).filter(h=>h.id!==nyHendelse.id);
        return [...uten, nyHendelse];
      });
    }
  };

  const gBudget = (g,m) => g.items.reduce((s,i)=>s+((i.months&&i.months[m]?i.months[m].budget:0)||0),0);
  const gSpent  = (g,m) => g.items.reduce((s,i)=>s+(hentFaktiskForPost(actualTotals,i)!==undefined?hentFaktiskForPost(actualTotals,i):((i.months&&i.months[m]?i.months[m].spent:0)||0)),0);

  const updItem = (gid,iid,f,v) => setBudgetGroups(p=>p.map(g=>g.id!==gid?g:{
    ...g, items:g.items.map(it=>it.id!==iid?it:{
      ...it, months:it.months.map((mo,mi)=>mi!==month?mo:{...mo,[f]:parseFloat(v)||0})
    })
  }));
  const addItem = (gid,n,b,s) => {
    setBudgetGroups(p=>p.map(g=>g.id!==gid?g:{
    ...g, items:[...g.items,{id:uid(),name:n,months:Array.from({length:12},(_,mi)=>({
      budget:mi===month?parseFloat(b)||0:0,
      spent: mi===month?parseFloat(s)||0:0
    }))}]
  }));;
  };

  const delItem = (gid,iid) => setBudgetGroups(p=>p.map(g=>g.id!==gid?g:{
    ...g, items:g.items.filter(it=>it.id!==iid)
  }));
  // v-post-rename: navn er valgfritt fjerde argument — endrer KUN
  // it.name naar eksplisitt sendt inn, roerer aldri id/legacyIds/
  // months/budgetDetails/gruppe.
  const saveMeta = (gid,iid,meta,navn) => setBudgetGroups(p=>p.map(g=>g.id!==gid?g:{
    ...g, items:g.items.map(it=>it.id!==iid?it:{...it,meta,...(navn!==undefined?{name:navn}:{})})
  }));

  function GRow({g,edit}) {
    const gb=gBudget(g,month), gs=gSpent(g,month), over=isOver(gs,gb), open=expanded===g.id;
    return (
      <div>
        <Card onClick={()=>setExpanded(open?null:g.id)} accent={g.color}
          style={{cursor:"pointer",borderRadius:open?"11px 11px 0 0":11,
            marginBottom:open?0:undefined,borderBottom:open?"none":undefined,padding:"10px 14px"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <IBox emoji={GROUP_EMOJI[g.id]||"📁"} color={g.color} size={34}/>
            <div style={{flex:1}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:5}}>
                <span style={{fontSize:13,fontWeight:600,color:P.ink}}>{g.label}</span>
                <div>
                  <span style={{fontSize:12,fontWeight:500,color:over?P.clay:P.ink}}>{fmt(gs)}</span>
                  <span style={{fontSize:10.5,color:P.dust}}> / {fmt(gb)}</span>
                  {over && <span style={{marginLeft:4,fontSize:10,color:P.clay,fontWeight:600}}>↑</span>}
                </div>
              </div>
              <Bar value={gs} max={gb||1} color={g.color} h={3} over={over}/>
            </div>
            <Em e={open?"▴":"▾"} s={{color:P.dust,fontSize:13,marginLeft:6}}/>
          </div>
        </Card>
        {open && (
          <div style={{border:`1px solid ${P.border}`,borderTop:"none",borderRadius:"0 0 11px 11px",
            background:P.linen,padding:"6px 14px 12px",marginBottom:6}}>
            {edit && (
              <div style={{display:"grid",gridTemplateColumns:"1fr 68px 68px 30px",gap:5,
                padding:"4px 0 7px",borderBottom:`1px solid ${P.border}`,marginBottom:4}}>
                <span style={{fontSize:10,color:P.dust}}>Post</span>
                <span style={{fontSize:10,color:P.dust,textAlign:"right"}}>Budsjett</span>
                <span style={{fontSize:10,color:P.dust,textAlign:"right"}}>Faktisk</span>
                <span/>
              </div>
            )}
            {g.items.map((it,idx) => {
              const mo=it.months[month];
              const faktiskBelop = hentFaktiskForPost(actualTotals,it)!==undefined ? Math.round(hentFaktiskForPost(actualTotals,it)) : mo.spent;
              const o=isOver(faktiskBelop,mo.budget);
              return (
                <div key={it.id} style={{padding:"6px 0",borderBottom:idx<g.items.length-1?`1px solid ${P.border}`:"none"}}>
                  {edit ? (
                    <div style={{display:"grid",gridTemplateColumns:"1fr 68px 68px 30px",gap:5,alignItems:"center"}}>
                      <div style={{display:"flex",alignItems:"center",gap:4,minWidth:0}}>
                        <span style={{fontSize:12,color:o?P.clay:P.ink,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1}}>{it.name}</span>
                        {it.meta&&it.meta.arkivert && (
                          <span title="Arkivert — vises ikke ved nye plasseringer" style={{fontSize:12,flexShrink:0}}>📂</span>
                        )}
                        {it.meta&&it.meta.automatisk && (
                          <span title="Automatisk til prognose" style={{fontSize:13,color:P.gold,flexShrink:0}}>⚡</span>
                        )}
                        <button onClick={()=>setMetaModal({item:it,groupId:g.id})}
                          style={{background:it.meta?P.hazelXL:P.mist,border:it.meta?"1px solid "+P.hazelL:"1px solid "+P.border,
                            borderRadius:5,cursor:"pointer",fontSize:9,padding:"2px 5px",
                            color:it.meta?P.hazel:P.dust,whiteSpace:"nowrap",flexShrink:0}}>
                          {it.meta?"✓":"+"}
                        </button>
                      </div>
                      <InlineNum key={"b-"+it.id+"-"+month}
                        value={mo.budget}
                        onChange={v=>updItem(g.id,it.id,"budget",v)}/>
                      <InlineNum key={"s-"+it.id+"-"+month}
                        value={faktiskBelop}
                        onChange={v=>updItem(g.id,it.id,"spent",v)}
                        colorStyle={{color:o?P.clay:"inherit"}}/>
                      <button onClick={()=>delItem(g.id,it.id)} style={{background:"none",border:"none",cursor:"pointer",color:P.dust,fontSize:12,padding:2,opacity:.5}}>🗑️</button>
                    </div>
                  ) : (
                    <div onClick={()=>setMetaModal({item:it,groupId:g.id})} style={{cursor:"pointer"}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:2}}>
                        <div style={{flex:1,minWidth:0}}>
                          <span style={{fontSize:12,color:P.stone}}>{it.name}</span>
                          {it.meta&&it.meta.arkivert && (
                            <span title="Arkivert" style={{fontSize:12,marginLeft:2}}>📂</span>
                          )}
                          {it.meta&&it.meta.automatisk && (
                            <span title="Automatisk til prognose" style={{fontSize:12,color:P.gold,marginLeft:2}}>⚡</span>
                          )}
                          {it.meta&&it.meta.eier&&it.meta.eier!=="Felles" && (
                            <span style={{fontSize:9,color:P.hazelL,background:P.mist,borderRadius:3,padding:"0 3px",marginLeft:2}}>{it.meta.eier}</span>
                          )}
                        </div>
                        <div>
                          <span style={{fontSize:12,fontWeight:500,color:o?P.clay:P.ink}}>{fmt(faktiskBelop)}</span>
                          <span style={{fontSize:10.5,color:P.dust}}> / {fmt(mo.budget)}</span>
                        </div>
                      </div>
                      {mo.budget>0 && <Bar value={faktiskBelop} max={mo.budget} color={g.color} h={2.5} over={o}/>}
                    </div>
                  )}
                  {hentFaktiskForPost(actualTotals,it)!==undefined && (
                    <button onClick={()=>setDrillDown({post:it, postName:it.name})}
                      style={{background:"none",border:"none",cursor:"pointer",color:P.hazel,
                        fontSize:10.5,padding:"3px 0 0",textAlign:"left",display:"block"}}>
                      🔍 Vis hendelser bak dette tallet
                    </button>
                  )}
                </div>
              );
            })}
            {edit && <AddItemRow onAdd={(n,b,s)=>addItem(g.id,n,b,s)} color={g.color}/>}
          </div>
        )}
      </div>
    );
  }

  return (
    <div>
      <MaanedsHeader month={month} setMonth={setMonth}/>
      <div style={{fontSize:12,color:P.stone,marginBottom:8}}>ℹ️ Trykk for å redigere {MONTHS[month].toLowerCase()}-tallene. Trykk på et navn for å sette v2-metadata.</div>
      {budgetGroups.map(g=><GRow key={g.id} g={g} edit={true}/>)}
                        {metaModal && (
        <BudsjettMetaModal
          item={metaModal.item}
          groupId={metaModal.groupId}
          onSave={saveMeta}
          onClose={()=>setMetaModal(null)}
        />
      )}
      {drillDown && (
        <HendelseDrillDownModal
          tittel={"Hendelser — "+drillDown.postName}
          rader={finnHendelserForPost(hendelser, transaksjoner, receipts, drillDown.post, monthKey, gyldigeObservasjonIder)}
          onClose={()=>setDrillDown(null)}
          onVelgHendelse={(hendelseId)=>setKorrigerHendelseId(hendelseId)}
          onVelgKvittering={(receiptId)=>setKorrigerReceiptId(receiptId)}
        />
      )}
      {korrigerReceiptId && (() => {
        const receiptSomRedigeres = (receipts||[]).find(r=>r.id===korrigerReceiptId);
        if(!receiptSomRedigeres) return null;
        return (
          <Modal title={"Rediger kvittering — "+(receiptSomRedigeres.merchant||"(ukjent)")}
            onClose={()=>setKorrigerReceiptId(null)}>
            <KvitteringDetalj
              r={receiptSomRedigeres}
              alleMalPoster={alleMalPoster}
              onOppdaterKvittering={oppdaterKvitteringFraDrillDown}
              onClose={()=>setKorrigerReceiptId(null)}
              syncFeil={kvitteringSyncFeil&&kvitteringSyncFeil.id===korrigerReceiptId?kvitteringSyncFeil.melding:null}
            />
          </Modal>
        );
      })()}
      {korrigerHendelseId && (() => {
        const hendelseSomKorrigeres = (hendelser||[]).find(h=>h.id===korrigerHendelseId);
        if(!hendelseSomKorrigeres) return null;
        // v-post-rename: en manuell hendelse har ingen ekte
        // transaksjon aa slaa opp (transaksjonId er bevisst null) —
        // uten en "transaksjon" faller KorrigerHendelseModal sin
        // transRetning tilbake til "ut", som ville gitt feil fortegn
        // ved korrigering av en manuell INNTEKT. Bygger derfor en
        // syntetisk, minimal transaksjon KUN med riktig retning,
        // avledet fra hendelsens egen opprinnelige fordeling — ingen
        // ny fortegnslogikk, kun riktig inndata til den eksisterende.
        const transaksjonForKorrigering = hendelseSomKorrigeres.transaksjonId
          ? (transaksjoner||[]).find(t=>t.id===hendelseSomKorrigeres.transaksjonId)
          : hendelseSomKorrigeres.kilde==="manuell"
            ? {retning: (hendelseSomKorrigeres.fordelinger&&hendelseSomKorrigeres.fordelinger[0]&&hendelseSomKorrigeres.fordelinger[0].plasseringType==="income") ? "inn" : "ut"}
            : null;
        return (
          <KorrigerHendelseModal
            hendelse={hendelseSomKorrigeres}
            transaksjon={transaksjonForKorrigering}
            budgetGroups={budgetGroups}
            incomeGroups={incomeGroups}
            sparingGroups={sparingGroups}
            rules={rules}
            onLagre={(oppdatertHendelse, laerData)=>{
              setHendelser(prev=>{
                const uten = (prev||[]).filter(h=>h.id!==oppdatertHendelse.id);
                return [...uten, oppdatertHendelse];
              });
              if(laerData) {
                setRules(prev=>oppdaterReglerVedLaering(prev, laerData.transaksjon, laerData.post, false));
              }
              setKorrigerHendelseId(null);
              setDrillDown(null);
            }}
            onClose={()=>setKorrigerHendelseId(null)}
          />
        );
      })()}
    </div>
  );
}
