name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

defaults:
  run:
    working-directory: web

jobs:
  ci:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Firebase Realtime Database-emulatoren krever en JVM.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Installer avhengigheter
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formattering
        run: npm run format:check

      - name: Enhets- og domenetester
        run: npm test

      # Egen prosess med Firebase Emulator Suite rundt seg — se
      # package.json. Aldri mot produksjon eller en Hosting-forhåndsvisning.
      - name: Datalag-/integrasjonstester (Firebase Emulator)
        run: npm run test:integration

      - name: Installer Playwright sin nedlastede Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E-smoke (Firebase Emulator)
        run: npm run test:e2e

      - name: Bygg (produksjonskonfigurasjon)
        run: npm run build

      - name: Last opp Playwright-rapport ved feil
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  # Kontrolltårnets MCP-kontrollflate (Issue #27). Egen pakke, men deler de
  # rene Handleliste-reglene med web/ (web/src/domain/shopping) — kjøres
  # derfor på hver PR, ikke bare når mcp-server/ endres. Ingen deploy,
  # ingen skytilgang: kun lokale tester og RTDB-emulatoren.
  mcp-server:
    name: mcp-server (typecheck, lint, test, emulator, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: mcp-server/.nvmrc
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      # Firebase Realtime Database-emulatoren krever en JVM.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Installer avhengigheter
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formattering
        run: npm run format:check

      - name: Enhets-, kontrakt-, paritets- og HTTP-tester
        run: npm test

      # Aldri mot produksjon eller en Hosting-forhåndsvisning — kun emulatoren.
      - name: Admin-adapter mot RTDB-emulatoren
        run: npm run test:integration

      - name: Bygg (esbuild-bundle, ikke deployet)
        run: npm run build

  # Det deploybare artefaktet for MCP-serveren: bygg imaget fra repo-roten og
  # røyktest det lokalt på runneren. Ingen push, ingen registry, ingen
  # skytilgang — deploy er en egen, manuell workflow (deploy-mcp-cloudrun.yml).
  mcp-container:
    name: mcp-server (container build + smoke)
    runs-on: ubuntu-latest
    # Overstyrer toppnivåets `working-directory: web`: byggekonteksten er
    # repo-roten (Dockerfile-en henter delte regler fra web/src/domain).
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7

      - name: Bygg image (ingen push)
        run: docker build -f mcp-server/Dockerfile -t hverdagsflyt-mcp:ci .

      - name: Røyktest (health, metadata, 401, prod-sperre, skrivesperre, SIGTERM)
        run: mcp-server/scripts/smoke-container.sh hverdagsflyt-mcp:ci
