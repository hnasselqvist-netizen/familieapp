name: MCP-testflate (midlertidig) — deploy

# Manuelt utløst, ALDRI automatisk per push — samme prinsipp som
# production.yml/preview.yml. Denne workflowen deployer KUN den isolerte,
# midlertidige MCP-testfunksjonen (Issue #27, kommentar 5761279861) —
# ingen Hverdagsflyt-data, ingen Firebase-node, ingen produktkode.
#
# Slett denne filen sammen med `mcp-test-harness/`-mappen og
# `functions`-blokken i repo-rotens `firebase.json` når testen er ferdig.
on:
  workflow_dispatch:
    inputs:
      test_secret:
        description: "Delt hemmelighet for testendepunktets ?k=-sjekk. Generer et tilfeldig token og lim inn her ved hver kjøring — committes eller logges aldri."
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-mcp-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Samme mønster som production.yml: workflow_dispatch kan i
      # utgangspunktet startes fra en vilkårlig branch/tag. Feiler
      # høylytt dersom noen velger en annen ref enn main.
      - name: Krev at deploy kun kjøres fra main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Kan kun kjøres fra 'main' (fikk '${{ github.ref }}')."
            exit 1
          fi

      # Masker input-verdien i selve loggutskriften så tidlig som mulig —
      # committes eller printes aldri; skrives kun til en midlertidig
      # .env-fil som `firebase deploy` leser og som fjernes etterpå.
      - name: Masker delt hemmelighet
        run: echo "::add-mask::${{ inputs.test_secret }}"

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc

      - name: Installer avhengigheter for testflaten
        working-directory: mcp-test-harness
        run: npm install

      # `.env` leses automatisk av Firebase Functions 2nd gen ved deploy
      # og satt som prosessmiljøvariabel i selve funksjonen — filen er
      # aldri committet (gitignored) og finnes kun i denne CI-kjøringen.
      - name: Skriv midlertidig .env med delt hemmelighet
        working-directory: mcp-test-harness
        run: echo "MCP_TEST_SECRET=${{ inputs.test_secret }}" > .env

      - name: Sett opp Google-legitimasjon fra service account-secreten
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/mcp-test-sa.json"

      - name: Autentiser gcloud med samme legitimasjon
        run: gcloud auth activate-service-account --key-file="$RUNNER_TEMP/mcp-test-sa.json"

      # Forrige kjøring feilet fordi IAM API ikke var aktivert på prosjektet
      # (ikke et rollebindings-/scope-problem). Idempotent preflight: sjekk
      # først, aktiver KUN dersom nødvendig, med eksisterende deploy-identitet
      # — ingen nye IAM-roller tildeles noe sted i dette steget. Dersom
      # deploy-identiteten selv mangler rettighet til å aktivere APIer,
      # stopper vi høylytt med nøyaktig hvilken minste engangshandling som
      # kreves i Google Cloud Console, i stedet for å utvide rettigheter.
      - name: Aktiver IAM API dersom nødvendig (idempotent, ingen nye IAM-roller)
        run: |
          PROJECT="${{ secrets.FIREBASE_PROJECT_ID }}"
          if gcloud services list --enabled --project "$PROJECT" \
              --filter="config.name=iam.googleapis.com" \
              --format="value(config.name)" | grep -q "iam.googleapis.com"; then
            echo "iam.googleapis.com er allerede aktivert."
          else
            echo "iam.googleapis.com er ikke aktivert — forsøker å aktivere med eksisterende deploy-identitet."
            if ! gcloud services enable iam.googleapis.com --project "$PROJECT"; then
              echo "::error::Kunne ikke aktivere iam.googleapis.com automatisk med eksisterende deploy-identitet. Minste nødvendige engangshandling: aktiver 'Identity and Access Management (IAM) API' manuelt i Google Cloud Console for prosjektet $PROJECT (https://console.developers.google.com/apis/api/iam.googleapis.com/overview?project=$PROJECT). Alternativt: gi deploy-identiteten (firebase-adminsdk-fbsvc@$PROJECT.iam.gserviceaccount.com) rollen roles/serviceusage.serviceUsageAdmin. Ingen bredere rolle tildeles automatisk her."
              exit 1
            fi
            echo "iam.googleapis.com aktivert."
          fi

      # Dedikert, minst-privilegert kjøretidsidentitet for selve funksjonen
      # (Kontrolltårnets review-funn på PR #31) — IKKE prosjektets standard
      # compute service account, som kan ha brede prosjektroller uavhengig
      # av hva funksjonskoden importerer. Kontoen får bevisst INGEN
      # IAM-rollebindinger her — kun det Cloud Functions selv krever for å
      # kunne kjøre og svare på HTTP-forespørsler.
      - name: Opprett dedikert service account for testfunksjonen (idempotent)
        run: |
          SA_EMAIL="mcp-test-harness@${{ secrets.FIREBASE_PROJECT_ID }}.iam.gserviceaccount.com"
          if gcloud iam service-accounts describe "$SA_EMAIL" --project "${{ secrets.FIREBASE_PROJECT_ID }}" >/dev/null 2>&1; then
            echo "Service account finnes allerede: $SA_EMAIL"
          else
            gcloud iam service-accounts create mcp-test-harness \
              --project "${{ secrets.FIREBASE_PROJECT_ID }}" \
              --display-name "MCP-testflate (midlertidig, Issue #27)" \
              --description "Minst-privilegert kjøretidsidentitet for mcp-test-harness Cloud Function. Ingen IAM-roller tildelt med hensikt. Slett når testen er ferdig."
          fi

      - name: Deploy KUN mcp-test-harness-funksjonen
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/mcp-test-sa.json
        run: npx firebase-tools@latest deploy --only functions --project "${{ secrets.FIREBASE_PROJECT_ID }}" --non-interactive

      - name: Fjern midlertidige filer
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/mcp-test-sa.json"
          rm -f mcp-test-harness/.env
