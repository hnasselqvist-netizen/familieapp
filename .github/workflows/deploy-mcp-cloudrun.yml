name: MCP-server — deploy til Cloud Run (manuell)

# Issue #27: den deploybare MCP-serveren (mcp-server/). Manuelt utløst, ALDRI
# automatisk — samme prinsipp som production.yml. Virker først etter at
# prosjekteier har kjørt infra/gcp/mcp-bootstrap.sh (IAM-minimum, Workload
# Identity Federation og et ikke-nåbart tjenesteskall). Ingen nøkkelfil og
# ingen hemmeligheter: autentisering skjer med GitHubs kortlivede OIDC-token,
# og GCP godtar det KUN fra dette repoet, `main` og environment
# `mcp-production`.
#
# All konfigurasjon under er offentlig (prosjekt-id, URL-er, kontonavn) og
# står derfor i filen, ikke i GitHub-variabler: én kilde, reviewet i PR.
#
# Hva den IKKE gjør, med vilje:
#  - Endrer ingen IAM-policy. Verken `--allow-unauthenticated` eller
#    `--no-allow-unauthenticated` sendes, og deployidentiteten har ikke
#    rettigheten til det. At Invoker-IAM-sjekken er av (ChatGPT har ingen
#    Google-identitet; auth skjer i appen med OAuth), settes én gang av
#    bootstrap-skriptet. Denne workflowen åpner tjenesten for trafikk ved å
#    sette `--ingress=all` når MCP-imaget er på plass.
#  - Slår aldri på skriving: MCP_HANDLELISTE_SKRIVING settes eksplisitt til
#    «av». Aktivering krever legacy-cutover og en egen, reviewet endring av
#    denne filen (README §Cutover).
#  - Har ingen kobling til den gamle MCP-testflaten (deploy-mcp-test.yml og
#    mcp-test-harness/), som er fjernet fra repoet etter at denne deployen
#    ble bevist.
on:
  workflow_dispatch:
    inputs:
      bekreft_produksjonsdata:
        description: "Tjenesten leser ekte Hverdagsflyt-data (kun lesing). Skriv nøyaktig «les-ekte-data» for å bekrefte at det er besluttet."
        required: true
        type: string

permissions:
  contents: read
  id-token: write # Workload Identity Federation (kortlivet OIDC-token)

concurrency:
  group: deploy-mcp-cloudrun
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: mcp-production
    # Samme verdier som infra/gcp/mcp-bootstrap.sh og Auth0-API-et
    # (Identifier = MCP_RESOURCE_URL, bekreftet i Issue #27, 5956386685).
    env:
      GCP_PROJECT_ID: familieapp-a5d15
      GCP_REGION: europe-west1
      GCP_WIF_PROVIDER: projects/1075494790067/locations/global/workloadIdentityPools/github/providers/familieapp
      GCP_DEPLOY_SA: hverdagsflyt-mcp-deployer@familieapp-a5d15.iam.gserviceaccount.com
      MCP_RUNTIME_SA: hverdagsflyt-mcp@familieapp-a5d15.iam.gserviceaccount.com
      MCP_AR_REPOSITORY: hverdagsflyt
      MCP_SERVICE: hverdagsflyt-mcp
      MCP_BASE_URL: https://hverdagsflyt-mcp-1075494790067.europe-west1.run.app
      MCP_RESOURCE_URL: https://hverdagsflyt-mcp-1075494790067.europe-west1.run.app/mcp
      # Auth0-tenanten (EU), med avsluttende skråstrek slik Auth0 oppgir
      # `issuer`. Preflight sjekker verdien mot tenantens discovery-dokument.
      # JWKS utledes fra issuer ({issuer}.well-known/jwks.json, Auth0-standard),
      # så MCP_AUTH_JWKS_URL og MCP_AUTH_AUDIENCE står tomme med vilje.
      MCP_AUTH_ISSUER: https://hverdagsflyt.eu.auth0.com/
      MCP_AUTH_AUDIENCE: ""
      MCP_AUTH_JWKS_URL: ""
      MCP_FIREBASE_DATABASE_URL: https://familieapp-a5d15-default-rtdb.europe-west1.firebasedatabase.app
    steps:
      - name: Krev at deploy kun kjøres fra main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Kan kun kjøres fra 'main' (fikk '${{ github.ref }}')."
            exit 1
          fi

      - name: Krev eksplisitt bekreftelse
        env:
          BEKREFT: ${{ inputs.bekreft_produksjonsdata }}
        run: |
          if [ "$BEKREFT" != "les-ekte-data" ]; then
            echo "::error::Bekreftelsen må være nøyaktig «les-ekte-data»."
            exit 1
          fi

      # Feiler høylytt og samlet — ikke halvveis inne i en deploy.
      - name: Preflight — påkrevde variabler
        run: |
          missing=()
          for v in GCP_PROJECT_ID GCP_REGION GCP_WIF_PROVIDER GCP_DEPLOY_SA MCP_RUNTIME_SA \
                   MCP_AR_REPOSITORY MCP_RESOURCE_URL MCP_AUTH_ISSUER MCP_FIREBASE_DATABASE_URL; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Mangler verdier i workflowens env-blokk: ${missing[*]} (se mcp-server/README.md §Runbook)."
            exit 1
          fi
          case "$MCP_AUTH_ISSUER" in https://*.auth0.com/) ;; *)
            echo "::error::MCP_AUTH_ISSUER må være Auth0-tenantens https://….auth0.com/ med avsluttende skråstrek (fikk '$MCP_AUTH_ISSUER')."; exit 1;;
          esac
          case "$MCP_RESOURCE_URL" in https://*/mcp) ;; *)
            echo "::error::MCP_RESOURCE_URL må være https://…/mcp (fikk '$MCP_RESOURCE_URL')."; exit 1;;
          esac

      # Issueren er ikke gjettet, men bekreftes her: tenantens eget
      # discovery-dokument må oppgi nøyaktig samme `issuer`, og JWKS-en som
      # serveren vil validere tokens mot, må være nåbar og ha RS256-nøkler.
      - name: Preflight — bekreft Auth0-issuer og JWKS
        run: |
          disc=$(curl -fsS --max-time 15 "${MCP_AUTH_ISSUER}.well-known/openid-configuration")
          jwks=$(curl -fsS --max-time 15 "${MCP_AUTH_ISSUER}.well-known/jwks.json")
          python3 - "$disc" "$jwks" "$MCP_AUTH_ISSUER" <<'PY'
          import json, sys
          disc, jwks, issuer = json.loads(sys.argv[1]), json.loads(sys.argv[2]), sys.argv[3]
          assert disc.get("issuer") == issuer, f"discovery issuer={disc.get('issuer')!r}, workflow har {issuer!r}"
          assert disc.get("jwks_uri") == issuer + ".well-known/jwks.json", f"jwks_uri={disc.get('jwks_uri')!r}"
          assert "S256" in disc.get("code_challenge_methods_supported", []), "PKCE S256 mangler"
          keys = [k for k in jwks.get("keys", []) if k.get("kty") == "RSA"]
          assert keys, "JWKS har ingen RSA-nøkler"
          print(f"Auth0 OK: issuer={issuer}, {len(keys)} RSA-nøkkel/nøkler, PKCE S256")
          PY

      - uses: actions/checkout@v7

      - name: Bygg image
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${MCP_AR_REPOSITORY}/${MCP_SERVICE}:${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -f mcp-server/Dockerfile -t "$IMAGE" .

      # Samme røyktest som CI — imaget som pushes er imaget som er testet.
      - name: Røyktest imaget før push
        run: mcp-server/scripts/smoke-container.sh "$IMAGE"

      - name: Autentiser mot Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SA }}

      - name: Push til Artifact Registry
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker push "$IMAGE"

      # Env-variablene skrives til en fil (ingen verdier er hemmelige, men
      # filformen unngår kommaproblemer i --set-env-vars og gjør settet
      # komplett og eksplisitt: alt som ikke står her, er ikke satt).
      - name: Deploy til Cloud Run (uten IAM-endring, skriving av)
        run: |
          ENV_FILE="$RUNNER_TEMP/mcp-env.yaml"
          python3 - "$ENV_FILE" <<'PY'
          import json, os, sys
          env = {
              "MCP_RESOURCE_URL": os.environ["MCP_RESOURCE_URL"],
              "MCP_AUTH_ISSUER": os.environ["MCP_AUTH_ISSUER"],
              "FIREBASE_DATABASE_URL": os.environ["MCP_FIREBASE_DATABASE_URL"],
              "MCP_ALLOW_PRODUCTION_DATA": "true",
              "MCP_HANDLELISTE_SKRIVING": "av",
          }
          for optional in ("MCP_AUTH_AUDIENCE", "MCP_AUTH_JWKS_URL"):
              if os.environ.get(optional):
                  env[optional] = os.environ[optional]
          with open(sys.argv[1], "w") as f:
              json.dump(env, f)
          PY
          gcloud run deploy "$MCP_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="$IMAGE" \
            --service-account="$MCP_RUNTIME_SA" \
            --env-vars-file="$ENV_FILE" \
            --cpu=1 --memory=512Mi \
            --min-instances=0 --max-instances=2 \
            --concurrency=40 --timeout=60s \
            --ingress=all \
            --quiet
          gcloud run services describe "$MCP_SERVICE" --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" --format='value(metadata.annotations."run.googleapis.com/urls")'

      # Fra utsiden, mot den deterministiske URL-en ChatGPT og Auth0 bruker:
      # /health, RFC 9728-metadata og 401 uten token. Ingen data leses.
      - name: Verifiser den deployede tjenesten
        run: mcp-server/scripts/verify-deployed.sh "$MCP_BASE_URL" "$MCP_AUTH_ISSUER"
